name: backend-agent-regression-gate

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full local backend gate and Trace corpus regression
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

# New commits supersede automatic runs. Manual acceptance runs have their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

# Perfetto version + per-platform SHA256 are pinned in
# scripts/trace-processor-pin.env (single source of truth shared with
# scripts/start-dev.sh, Dockerfile, and backend/scripts/ensure-trace-processor.cjs).

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.scope.outputs.platform }}
      docker: ${{ steps.scope.outputs.docker }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - name: Checkout event diff
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Select environment checks
        id: scope
        run: node scripts/ci-change-scope.cjs

  quality:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch Perfetto source identity history
        shell: bash
        run: |
          if [ "$(git -C perfetto rev-parse --is-shallow-repository)" = "true" ]; then
            git -C perfetto fetch --unshallow --tags origin
          else
            git -C perfetto fetch --tags origin
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root and backend dependencies
        run: npm ci && npm --prefix backend ci

      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep

      - name: Run repository CI checks
        run: npm run verify:ci

      - name: Setup Rust
        if: needs.scope.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust analyzer checks
        if: needs.scope.outputs.rust == 'true'
        run: npm run rust:verify

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root and backend dependencies
        run: npm ci && npm --prefix backend ci

      - name: Install source-search test dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run backend CI gate
        if: ${{ !inputs.full }}
        run: npm --prefix backend run verify:ci

      - name: Run full local backend gate
        if: inputs.full
        run: npm --prefix backend run verify:pr

  cross-platform-contracts:
    needs: scope
    if: needs.scope.outputs.platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch Perfetto source identity history
        shell: bash
        run: |
          if [ "$(git -C perfetto rev-parse --is-shallow-repository)" = "true" ]; then
            git -C perfetto fetch --unshallow --tags origin
          else
            git -C perfetto fetch --tags origin
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Set up fixed Go 1.25 for the Windows gate helper
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.0"
          cache: false

      - name: Install root and backend dependencies
        run: npm ci && npm --prefix backend ci

      - name: Test the fixed Windows gate helper source
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          GO111MODULE: "off"
        run: go test ./scripts/portable-health-probe

      - name: Test the Windows portable launcher
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          GO111MODULE: "off"
        run: go test ./scripts/portable-launcher

      - name: Build the Windows portable launcher
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          GO111MODULE: "off"
        run: go build -trimpath -o "$env:RUNNER_TEMP/SmartPerfetto.exe" ./scripts/portable-launcher

      - name: Build the fixed Windows gate helper
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          GO111MODULE: "off"
          SMARTPERFETTO_WINDOWS_GATE_HELPER_PATH: ${{ runner.temp }}/smartperfetto-windows-gate-helper.exe
        run: >-
          go build -trimpath '-ldflags=-s -w'
          -o "$env:SMARTPERFETTO_WINDOWS_GATE_HELPER_PATH"
          ./scripts/portable-health-probe

      - name: Verify cross-platform runtime contracts
        if: ${{ matrix.os != 'windows-latest' }}
        run: npm run test:governance

      - name: Verify Windows cross-platform runtime contracts
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          SMARTPERFETTO_WINDOWS_GATE_HELPER_PATH: ${{ runner.temp }}/smartperfetto-windows-gate-helper.exe
        run: npm run test:governance

      - name: Test Windows Provider secret storage
        if: ${{ matrix.os == 'windows-latest' }}
        run: >-
          npm --prefix backend test -- --runInBand
          src/services/providerManager/__tests__/localSecretStore.test.ts

  trace-corpus:
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout with Perfetto schema sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root and backend dependencies
        run: npm ci && npm --prefix backend ci

      - name: Run trace corpus semantic regression
        run: npm run trace:regression

  docker-smoke:
    needs: scope
    if: needs.scope.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker runtime image
        run: docker build -t smartperfetto-runtime-smoke .

      - name: Smoke Docker runtime assets
        run: |
          docker run -d --name smartperfetto-runtime-smoke smartperfetto-runtime-smoke
          trap 'docker rm -f smartperfetto-runtime-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec smartperfetto-runtime-smoke curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs smartperfetto-runtime-smoke
              exit 1
            fi
            sleep 2
          done
          docker exec smartperfetto-runtime-smoke curl -fsS http://127.0.0.1:3000/assistant-shell | grep -qi '<html'
          docker exec smartperfetto-runtime-smoke curl -fsS http://127.0.0.1:3000/admin-control-plane | grep -qi '<html'
          docker exec smartperfetto-runtime-smoke /app/backend/node_modules/opencode-ai/bin/opencode.exe --version

  # Keep one stable required-check candidate. A skipped optional job is allowed;
  # failed/cancelled dependencies and skipped mandatory jobs must fail this gate.
  gate:
    needs: [scope, quality, backend, cross-platform-contracts, trace-corpus, docker-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.NEEDS_JSON);
          const required = new Set(['scope', 'quality', 'backend']);
          const failed = Object.entries(jobs).filter(([name, job]) =>
            job.result !== 'success' && (required.has(name) || job.result !== 'skipped'));
          if (failed.length) {
            console.error('CI did not pass:', failed.map(([name, job]) => `${name}: ${job.result}`).join(', '));
            process.exit(1);
          }
          NODE
