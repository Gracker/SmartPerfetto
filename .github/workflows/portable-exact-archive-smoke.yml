name: Portable Exact Archive Smoke

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric GitHub draft release ID
        required: true
        type: string
      selection:
        description: Target set to smoke
        required: true
        default: windows-linux
        type: choice
        options:
          - windows-linux
          - all
          - windows-x64
          - macos-arm64
          - linux-x64

permissions:
  contents: read

concurrency:
  group: portable-exact-archive-smoke-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve immutable release plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      gate_sha: ${{ steps.plan.outputs.gate_sha }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      release_id: ${{ steps.plan.outputs.release_id }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - name: Require dispatch from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          node -e '
            const expected = `refs/heads/${process.env.DEFAULT_BRANCH}`;
            if (process.env.DISPATCH_REF !== expected) {
              throw new Error(`dispatch must use ${expected}, got ${process.env.DISPATCH_REF}`);
            }
          '

      - name: Check out the immutable gate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: gate

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Fetch the draft by immutable release ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs fetch
          --repository "${{ github.repository }}"
          --release-id "${{ inputs.release_id }}"
          --output "${{ runner.temp }}/portable-release.json"

      - name: Build and validate the immutable smoke plan
        id: plan
        env:
          GATE_SHA: ${{ github.sha }}
          RELEASE_ID_INPUT: ${{ inputs.release_id }}
          SELECTION_INPUT: ${{ inputs.selection }}
        run: |
          node gate/scripts/portable-release-smoke-workflow.cjs prepare \
            --release-json "${RUNNER_TEMP}/portable-release.json" \
            --release-id "${RELEASE_ID_INPUT}" \
            --selection "${SELECTION_INPUT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --gate-sha "${GATE_SHA}" \
            --git-root gate \
            --plan-out "${RUNNER_TEMP}/portable-smoke-plan.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Preserve the immutable plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portable-smoke-plan-${{ steps.plan.outputs.release_id }}
          path: ${{ runner.temp }}/portable-smoke-plan.json
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the immutable gate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.gate_sha }}
          persist-credentials: false
          path: gate

      - name: Check out the immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
          path: release

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Restore the immutable plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portable-smoke-plan-${{ needs.prepare.outputs.release_id }}
          path: ${{ runner.temp }}/smartperfetto-plan

      - name: Assert native host, disk budget, and evidence context
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs runner
          --plan "${{ runner.temp }}/smartperfetto-plan/portable-smoke-plan.json"
          --target "${{ matrix.target }}"
          --runner-temp "${{ runner.temp }}"
          --minimum-free-bytes "6442450944"
          --evidence-root "${{ runner.temp }}/smartperfetto-evidence"
          --repository-id "${{ github.repository_id }}"
          --workflow "${{ github.workflow }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --workflow-sha "${{ github.workflow_sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"

      - name: Create the native asset directory
        env:
          ASSET_DIRECTORY: ${{ runner.temp }}/smartperfetto-asset
        run: node -e "require('fs').mkdirSync(process.env.ASSET_DIRECTORY, {recursive:true})"

      - name: Check GitHub CLI availability
        run: gh --version

      - name: Download exact release asset bytes by asset ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node gate/scripts/download-portable-release-asset.cjs
          --repository "${{ github.repository }}"
          --asset-id "${{ matrix.assetId }}"
          --asset-name "${{ matrix.assetName }}"
          --asset-size "${{ matrix.assetSize }}"
          --asset-digest "${{ matrix.assetDigest }}"
          --output "${{ runner.temp }}/smartperfetto-asset/${{ matrix.assetName }}"

      - name: Re-fetch release metadata after download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs fetch
          --repository "${{ github.repository }}"
          --release-id "${{ needs.prepare.outputs.release_id }}"
          --output "${{ runner.temp }}/portable-release-after-download.json"

      - name: Bind downloaded bytes to the unchanged draft
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs verify
          --plan "${{ runner.temp }}/smartperfetto-plan/portable-smoke-plan.json"
          --release-json "${{ runner.temp }}/portable-release-after-download.json"
          --target "${{ matrix.target }}"
          --asset "${{ runner.temp }}/smartperfetto-asset/${{ matrix.assetName }}"

      - name: Run the release contract against the exact archive
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs run
          --plan "${{ runner.temp }}/smartperfetto-plan/portable-smoke-plan.json"
          --release-root release
          --target "${{ matrix.target }}"
          --asset "${{ runner.temp }}/smartperfetto-asset/${{ matrix.assetName }}"
          --evidence-root "${{ runner.temp }}/smartperfetto-evidence"

      - name: Re-fetch release metadata after smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs fetch
          --repository "${{ github.repository }}"
          --release-id "${{ needs.prepare.outputs.release_id }}"
          --output "${{ runner.temp }}/portable-release-after-smoke.json"

      - name: Re-bind release and asset identity after smoke
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs verify
          --plan "${{ runner.temp }}/smartperfetto-plan/portable-smoke-plan.json"
          --release-json "${{ runner.temp }}/portable-release-after-smoke.json"
          --target "${{ matrix.target }}"
          --asset "${{ runner.temp }}/smartperfetto-asset/${{ matrix.assetName }}"

      - name: Verify evidence with both release and gate contracts
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs finalize
          --plan "${{ runner.temp }}/smartperfetto-plan/portable-smoke-plan.json"
          --release-root release
          --gate-root gate
          --release-json "${{ runner.temp }}/portable-release-after-smoke.json"
          --target "${{ matrix.target }}"
          --asset "${{ runner.temp }}/smartperfetto-asset/${{ matrix.assetName }}"
          --evidence-root "${{ runner.temp }}/smartperfetto-evidence"

      - name: Preserve target evidence and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portable-smoke-${{ needs.prepare.outputs.release_id }}-${{ matrix.target }}
          path: ${{ runner.temp }}/smartperfetto-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  collect:
    name: Collect immutable smoke evidence
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs:
      - prepare
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the immutable gate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.gate_sha }}
          persist-credentials: false
          path: gate

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Restore the immutable plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portable-smoke-plan-${{ needs.prepare.outputs.release_id }}
          path: ${{ runner.temp }}/smartperfetto-plan

      - name: Create the evidence collection root
        env:
          COLLECTION_ROOT: ${{ runner.temp }}/smartperfetto-collected
        run: node -e "require('fs').mkdirSync(process.env.COLLECTION_ROOT, {recursive:true})"

      - name: Restore target evidence without merging paths
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: portable-smoke-${{ needs.prepare.outputs.release_id }}-*
          path: ${{ runner.temp }}/smartperfetto-collected
          merge-multiple: false

      - name: Validate and attest collected evidence
        id: collect_evidence
        continue-on-error: true
        run: >-
          node gate/scripts/portable-release-smoke-workflow.cjs collect
          --plan "${{ runner.temp }}/smartperfetto-plan/portable-smoke-plan.json"
          --artifacts-root "${{ runner.temp }}/smartperfetto-collected"
          --repository-id "${{ github.repository_id }}"
          --workflow "${{ github.workflow }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --workflow-sha "${{ github.workflow_sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --attestation-out "${{ runner.temp }}/smartperfetto-collected/portable-smoke-attestation.json"

      - name: Preserve combined evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portable-smoke-evidence-release-${{ needs.prepare.outputs.release_id }}
          path: ${{ runner.temp }}/smartperfetto-collected
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Fail after preserving incomplete evidence
        if: ${{ steps.collect_evidence.outcome == 'failure' }}
        run: node -e "throw new Error('one or more exact-archive smoke targets failed')"
