version: '3.0'
description: Product rendering evidence catalog and concise teaching cards
rendering_types:
  S01_OVERVIEW:
    kind: overview
    teaching:
      title: 渲染路径与证据范围
      summary: 先定位内容生产者、接收方及输出目标，再判断所选时间窗中的路径。类型候选用于导航，实际交接依赖同一对象与时间证据。
      mermaidBlocks: []
      threadRoles:
      - thread: Producer
        responsibility: 生成内容并提交资源引用
      - thread: Consumer
        responsibility: 遵守输入依赖并使用资源
      keySlices:
      - queueBuffer
      - BLASTBufferQueue
      - setTransactionState
  S02_AOSP_STANDARD:
    kind: concrete
    teaching:
      title: 标准窗口与 HWUI
      summary: 主线程组织界面状态，RenderThread 执行绘制工作并提交窗口内容。CPU 切片、GPU 完成及显示反馈分别测量，不累加为同一个串行耗时。
      mermaidBlocks:
      - "flowchart LR\n UI[UI work] --> RT[Render work]\n RT --> W[Window update]\n W --> SF[Display composition]"
      threadRoles:
      - thread: main
        responsibility: 输入、布局及绘制状态更新
      - thread: RenderThread
        responsibility: 绘制执行与 GPU 提交
      - thread: surfaceflinger
        responsibility: 处理层更新并组织显示合成
      keySlices:
      - Choreographer#doFrame
      - DrawFrame
      - syncFrameState
      - queueBuffer
  S03_SURFACEVIEW:
    kind: concrete
    teaching:
      title: 独立 Surface 内容
      summary: 宿主界面与独立内容可以有不同生产节奏。区分容器属性和真正承载 buffer 的子层，沿活动 layer 关联提交及显示。
      mermaidBlocks:
      - "flowchart LR\n UI[Host UI] --> H[Host buffer]\n P[Content producer] --> C[Child buffer]\n H --> SF[Composition]\n\
        \ C --> SF"
      threadRoles:
      - thread: main
        responsibility: 管理宿主界面与 Surface 生命周期
      - thread: Producer thread
        responsibility: 向独立输出提交内容
      - thread: surfaceflinger
        responsibility: 组合宿主及独立内容层
      keySlices:
      - queueBuffer
      - BLASTBufferQueue
      - setTransactionState
  S04_TEXTUREVIEW:
    kind: concrete
    teaching:
      title: 纹理输入与宿主采样
      summary: 外部输入先由宿主取用，再写入宿主窗口输出。输入资源与窗口 buffer 各有完成和回收依赖；通知到达不等于已经采样或呈现。
      mermaidBlocks:
      - "flowchart LR\n P[Input producer] --> T[Texture input]\n T --> R[Host sampling]\n R --> W[Host window]"
      threadRoles:
      - thread: Producer thread
        responsibility: 生成外部纹理内容
      - thread: RenderThread
        responsibility: 获取输入并提交宿主采样工作
      keySlices:
      - ASurfaceTexture_dequeueBuffer
      - updateTexImage
      - queueBuffer
      - DrawFrame
  S05_MIXED_RENDERING:
    kind: concrete
    teaching:
      title: 多路内容与同步
      summary: 逐路说明哪些内容回流到宿主、哪些形成独立层。事务可同步已加入的状态，跨内容业务版本是否一致需要单独的身份映射。
      mermaidBlocks: []
      threadRoles:
      - thread: main
        responsibility: 协调宿主与参与同步的窗口状态
      - thread: Producer thread
        responsibility: 独立推进各路内容
      keySlices:
      - SurfaceSyncGroup
      - BLASTBufferQueue
      - setTransactionState
      - queueBuffer
  S06_MULTI_WINDOW:
    kind: concrete
    teaching:
      title: 多窗口的共享与隔离
      summary: 窗口可以共享执行线程，但输出队列及资源释放分别管理。保留窗口、进程实例与 layer 身份，短绘制仍可能因共享线程排队而迟到。
      mermaidBlocks: []
      threadRoles:
      - thread: main
        responsibility: 执行所在 Looper 的窗口回调
      - thread: RenderThread
        responsibility: 承载同进程窗口的绘制工作
      keySlices:
      - Choreographer#doFrame
      - DrawFrame
      - queueBuffer
  S07_SOFTWARE_OFFSCREEN:
    kind: concrete
    teaching:
      title: 软件生产与离屏结果
      summary: 区分 CPU Surface 生产、View 软件缓存、GPU 离屏和直接 buffer 提交。离屏结果以消费者可读为完成边界，不要求物理显示反馈。
      mermaidBlocks: []
      threadRoles:
      - thread: Producer thread
        responsibility: 执行 CPU 或离屏生产并交接结果
      - thread: RenderThread
        responsibility: 可能承载宿主绘制或离屏工作
      keySlices:
      - lock
      - unlock
      - buildDrawingCache/SW Layer
      - queueBuffer
  S08_NATIVE_GRAPHICS:
    kind: concrete
    teaching:
      title: 原生图形提交
      summary: 沿引擎的获取、提交及输出阶段定位等待。长 swap/acquire 可能是资源复用或主动节奏控制；缺少 Vulkan tracing 切片时保留可见性限制。
      mermaidBlocks: []
      threadRoles:
      - thread: Render thread
        responsibility: 录制并提交原生图形工作
      - thread: GPU
        responsibility: 执行已提交的图形命令
      keySlices:
      - eglSwapBuffers
      - vkQueuePresentKHR
      - queueBuffer
      - dequeueBuffer
  S09_WEBVIEW:
    kind: concrete
    teaching:
      title: WebView 宿主绘制
      summary: 分别观察网页内容生产与宿主 functor 执行。网页资源、functor 调用和宿主窗口帧不是同一计数；视频独立层可与宿主路径并存。
      mermaidBlocks: []
      threadRoles:
      - thread: CrRendererMain
        responsibility: 执行网页渲染及脚本工作
      - thread: RenderThread
        responsibility: 执行宿主 functor 与窗口绘制
      keySlices:
      - DrawFn_DrawGL
      - DrawFn_DrawVk
      - WebViewFunctor::drawVk
      - WebViewFunctor::drawGl
      - WebViewFunctor::sync
      - WebViewFunctor::postDrawVk
  S10_FLUTTER:
    kind: concrete
    teaching:
      title: Flutter 内容与 Android 输出
      summary: 分别确认引擎工作、根输出承载和嵌入内容。线程职责可能合并；raster 结束不代表 GPU 或显示完成，纹理输出还要追宿主采样。
      mermaidBlocks: []
      threadRoles:
      - thread: UI task runner
        responsibility: 推进框架及界面工作，线程名随版本变化
      - thread: Raster task runner
        responsibility: 执行场景绘制与输出提交
      keySlices:
      - Animator::BeginFrame
      - Rasterizer::Draw
      - queueBuffer
      - ASurfaceTexture_dequeueBuffer
  S11_CAMERA:
    kind: concrete
    teaching:
      title: 相机输入与多路消费
      summary: 请求、结果元数据和输出 buffer 分别关联。预览、分析及录像可能互相回压；需要资源持有和释放证据才能确认消费端阻塞。
      mermaidBlocks: []
      threadRoles:
      - thread: Camera request thread
        responsibility: 组织相机请求，名称可能截断
      - thread: Camera consumer
        responsibility: 使用并释放各路输出资源
      keySlices:
      - Camera
      - CaptureSession
      - queueBuffer
  S12_VIDEO_OVERLAY_HWC:
    kind: concrete
    teaching:
      title: 视频输出与显示合成
      summary: 媒体时间、buffer 提交及目标显示分别关联。低于面板频率的内容可以正常复用；是否采用 DEVICE 合成需要目标视频层的逐帧证据。
      mermaidBlocks: []
      threadRoles:
      - thread: Codec thread
        responsibility: 推进解码输出及资源交接
      - thread: surfaceflinger
        responsibility: 组织视频与其他层的显示合成
      keySlices:
      - releaseOutputBuffer
      - queueBuffer
      - present
  S13_GAME:
    kind: concrete
    teaching:
      title: 引擎流水与帧节奏
      summary: 保留逻辑帧、渲染帧、GPU 提交及输出图像的映射。流水重叠不能直接相加；空闲图像数或 pending 水位不能证明未来完整画面库存。
      mermaidBlocks: []
      threadRoles:
      - thread: Game thread
        responsibility: 推进游戏逻辑与场景状态
      - thread: Render thread
        responsibility: 准备并提交渲染工作
      keySlices:
      - eglSwapBuffers
      - vkQueuePresentKHR
      - queueBuffer
  S14_REACT_NATIVE:
    kind: concrete
    teaching:
      title: React Native 更新与宿主窗口
      summary: JS、Fabric/Paper 阶段和宿主绘制分别取证。线程别名不能单独证明架构，Commit/Mount 次数也不能替代实际窗口帧数。
      mermaidBlocks: []
      threadRoles:
      - thread: mqt_js / mqt_v_js
        responsibility: 执行 JS 工作，名字不决定架构
      - thread: main
        responsibility: 应用原生界面更新并推进宿主绘制
      keySlices:
      - FabricUIManager
      - FabricCommit
      - FabricMount
      - Choreographer#doFrame
      - DrawFrame
  S16_CHROMIUM_BROWSER:
    kind: concrete
    teaching:
      title: 浏览器多进程出图
      summary: 按 Browser、Renderer 与 Viz/GPU 的实际归属建链。内部 category 不可见时保留缺口；输出可能经 BQ/BLAST，也可能直接提交 SurfaceControl。
      mermaidBlocks: []
      threadRoles:
      - thread: CrBrowserMain
        responsibility: 浏览器控制与界面工作
      - thread: CrRendererMain
        responsibility: 网页渲染工作
      - thread: VizCompositorTh*
        responsibility: 浏览器合成与输出，线程名可能截断
      keySlices:
      - Graphics.Pipeline
      - queueBuffer
      - setTransactionState
