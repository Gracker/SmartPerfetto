# =============================================================================
# 启动事件详细分析（组合 Skill）v2.0
# =============================================================================
# 分析单个启动事件的详细信息，包括：
# - 主线程耗时操作
# - Binder 调用
# - 主线程同步 Binder 阻塞
# - 主线程文件 IO
# - CPU 大小核占比
# - 四大象限分析：Running/Runnable/Sleeping 分布
# - 调度延迟分析
#
# 四大象限说明：
# 1. Running on Big Core - 在大核上运行（性能最优）
# 2. Running on Little Core - 在小核上运行（可能性能不足）
# 3. Runnable - 等待 CPU 调度（CPU 资源争抢）
# 4. Sleeping/Blocked - 睡眠或阻塞（等待 IO/锁/Binder）
#
# 大小核判定复用 cpu_topology_view，并保留 topology_source；
# 无法分类的 Running 时间保持 unknown，不按 CPU 编号推断。

name: startup_detail
version: "2.0"
type: composite
category: app_lifecycle
tier: S

meta:
  display_name: "启动详情分析"
  description: "深入分析单个启动过程的性能瓶颈"
  icon: "search"
  tags: [startup, detail, composite]

prerequisites:
  required_tables:
    - android_startups
  modules:
    - android.startup.startups
    - android.binder
    - linux.cpu.frequency

inputs:
  - name: startup_id
    type: integer
    required: true
    description: "启动事件 ID"
  - name: start_ts
    type: timestamp
    required: true
    description: "启动开始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "启动结束时间戳(ns)"
  - name: dur_ms
    type: number
    required: true
    description: "启动耗时(ms)"
  - name: package
    type: string
    required: true
    description: "应用包名"
  - name: startup_type
    type: string
    required: true
    description: "启动类型 (cold/warm/hot)，已经过 bindApplication 存在性校验"
  - name: original_type
    type: string
    required: false
    description: "Perfetto 原始报告的启动类型（校验前）"
  - name: ttid_ms
    type: number
    required: false
    description: "TTID (ms)"
  - name: ttfd_ms
    type: number
    required: false
    description: "TTFD (ms)"
  # Perfetto 跳转参数
  - name: perfetto_start
    type: timestamp
    required: false
    description: "Perfetto 跳转开始时间"
  - name: perfetto_end
    type: timestamp
    required: false
    description: "Perfetto 跳转结束时间"

identity:
  policy: required
  scope: process
  aliases: [package, process_name]
  rewriteTo: recommended_process_name_param

steps:
  # ========== 初始化 CPU 拓扑 ==========
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # ========== 启动基本信息 ==========
  - id: startup_info
    type: atomic
    name: "启动基本信息"
    display:
      level: key
      layer: deep
      title: "启动 #${startup_id} 详情"
      columns:
        - name: startup_id
          label: "启动 ID"
          type: number
        - name: package
          label: "包名"
          type: string
        - name: startup_type
          label: "启动类型"
          type: string
        - name: type_display
          label: "类型展示"
          type: string
        - name: dur_ms
          label: "启动耗时(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: ttid_ms
          label: "TTID(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: ttfd_ms
          label: "TTFD(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: start_ts
          label: "开始时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
        - name: end_ts
          label: "结束时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: perfetto_start
          label: "Perfetto开始"
          type: timestamp
          unit: ns
          clickAction: navigate_range
        - name: perfetto_end
          label: "Perfetto结束"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: rating
          label: "评级"
          type: string
    sql: |
      SELECT
        ${startup_id} as startup_id,
        '${package}' as package,
        '${startup_type}' as startup_type,
        CASE '${startup_type}'
          WHEN 'cold' THEN '冷启动'
          WHEN 'warm' THEN '温启动'
          WHEN 'hot' THEN '热启动'
          ELSE '${startup_type}'
        END as type_display,
        ROUND(${dur_ms}, 2) as dur_ms,
        ROUND(${ttid_ms}, 2) as ttid_ms,
        ROUND(${ttfd_ms}, 2) as ttfd_ms,
        -- 时间戳
        printf('%d', ${start_ts}) as start_ts,
        printf('%d', ${end_ts}) as end_ts,
        -- Perfetto 跳转链接参数
        printf('%d', COALESCE(${perfetto_start}, ${start_ts})) as perfetto_start,
        printf('%d', COALESCE(${perfetto_end}, ${end_ts})) as perfetto_end,
        -- 评级
        CASE
          WHEN '${startup_type}' = 'cold' AND ${dur_ms} < 500 THEN '优秀'
          WHEN '${startup_type}' = 'cold' AND ${dur_ms} < 1000 THEN '良好'
          WHEN '${startup_type}' = 'cold' AND ${dur_ms} < 2000 THEN '需优化'
          WHEN '${startup_type}' = 'cold' THEN '严重'
          WHEN '${startup_type}' = 'warm' AND ${dur_ms} < 200 THEN '优秀'
          WHEN '${startup_type}' = 'warm' AND ${dur_ms} < 500 THEN '良好'
          WHEN '${startup_type}' = 'warm' AND ${dur_ms} < 1000 THEN '需优化'
          WHEN '${startup_type}' = 'warm' THEN '严重'
          WHEN '${startup_type}' = 'hot' AND ${dur_ms} < 100 THEN '优秀'
          WHEN '${startup_type}' = 'hot' AND ${dur_ms} < 200 THEN '良好'
          WHEN '${startup_type}' = 'hot' AND ${dur_ms} < 500 THEN '需优化'
          WHEN '${startup_type}' = 'hot' THEN '严重'
          ELSE '需优化'
        END as rating
    save_as: startup_basic

  # ========== 大小核占比分析 ==========
  - id: cpu_core_analysis
    type: atomic
    name: "大小核占比分析"
    display:
      level: key
      layer: deep
      title: "大小核占比"
      columns:
        - name: thread_type
          label: "线程类型"
          type: string
        - name: big_core_ms
          label: "大核运行(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: little_core_ms
          label: "小核运行(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: total_running_ms
          label: "总运行(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: big_core_pct
          label: "大核占比(%)"
          type: percentage
          format: percentage
        - name: little_core_pct
          label: "小核占比(%)"
          type: percentage
          format: percentage
        - name: used_cpus
          label: "使用CPU"
          type: string
        - name: classify_method
          label: "核判定来源"
          type: string
        - {name: unknown_core_ms, label: "未知核类型运行(ms)", type: duration, format: duration_ms, unit: ms}
        - {name: unknown_core_pct, label: "未知核类型占比", type: percentage}
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_sched_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}'='' OR p.name='${package}' OR p.name GLOB '${package}:*')
      ),
      clipped_sched AS (SELECT s.*,s.clipped_start_ts AS ts,s.dur_ns AS dur FROM system_sched_spans s),
      main_thread AS (
        SELECT t.utid, t.tid, t.name as thread_name, p.pid, p.name as process_name
        FROM thread t
        JOIN effective_target_processes p ON t.upid = p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}' = '' OR p.name = '${package}' OR p.name GLOB '${package}:*')
          AND t.tid = p.pid  -- 主线程
      ),
      cpu_time AS (
        SELECT
          ss.utid,
          ss.cpu,
          SUM(
            MIN(ss.ts + ss.dur, ${end_ts}) - MAX(ss.ts, ${start_ts})
          ) / 1e6 as dur_ms,
          COALESCE(ct.core_type, 'unknown') as core_type,
          COALESCE(ct.topology_source, 'unavailable') as topology_source
        FROM clipped_sched ss
        JOIN main_thread mt ON ss.utid = mt.utid
        LEFT JOIN system_cpu_topology ct ON ss.ucpu = ct.ucpu
        WHERE ss.ts < ${end_ts}
          AND ss.ts + ss.dur > ${start_ts}
        GROUP BY ss.utid, ss.cpu
      )
      SELECT
        'MainThread' as thread_type,
        -- medium 核（如 Cortex-A78）性能足够，归入性能核侧
        ROUND(SUM(CASE WHEN core_type IN ('prime', 'big', 'medium') THEN dur_ms ELSE 0 END), 2) as big_core_ms,
        ROUND(SUM(CASE WHEN core_type IN ('little') THEN dur_ms ELSE 0 END), 2) as little_core_ms,
        ROUND(SUM(dur_ms), 2) as total_running_ms,
        ROUND(100.0 * SUM(CASE WHEN core_type IN ('prime', 'big', 'medium') THEN dur_ms ELSE 0 END) /
              NULLIF(SUM(dur_ms), 0), 1) as big_core_pct,
        ROUND(100.0 * SUM(CASE WHEN core_type IN ('little') THEN dur_ms ELSE 0 END) /
              NULLIF(SUM(dur_ms), 0), 1) as little_core_pct,
        GROUP_CONCAT(DISTINCT cpu) as used_cpus,
        GROUP_CONCAT(DISTINCT topology_source) as classify_method,
        ROUND(SUM(CASE WHEN core_type NOT IN ('prime', 'big', 'medium', 'little') THEN dur_ms ELSE 0 END), 2) as unknown_core_ms,
        ROUND(100.0 * SUM(CASE WHEN core_type NOT IN ('prime', 'big', 'medium', 'little') THEN dur_ms ELSE 0 END) /
          NULLIF(SUM(dur_ms), 0), 1) as unknown_core_pct
      FROM cpu_time
      GROUP BY 1
    save_as: cpu_core

  # ========== CPU 频率分析 ==========
  - id: cpu_freq_analysis
    type: atomic
    name: "CPU 频率分析"
    display:
      level: detail
      layer: deep
      title: "CPU 频率"
      columns:
        - name: core_type
          label: "核心类型"
          type: string
        - name: avg_freq_mhz
          label: "平均频率(MHz)"
          type: number
        - name: max_freq_mhz
          label: "最高频率(MHz)"
          type: number
        - name: min_freq_mhz
          label: "最低频率(MHz)"
          type: number
        - name: classify_method
          label: "核判定来源"
          type: string
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_frequency_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}'='' OR p.name='${package}' OR p.name GLOB '${package}:*')
      ),
      clipped_sched AS (SELECT s.*,s.clipped_start_ts AS ts,s.dur_ns AS dur FROM system_sched_spans s),
      clipped_frequency AS (SELECT f.*,f.clipped_start_ts AS ts,f.dur_ns AS dur,f.freq_khz AS freq FROM system_cpu_frequency_spans f),
      main_thread AS (
        SELECT t.utid, t.tid, p.pid
        FROM thread t
        JOIN effective_target_processes p ON t.upid = p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}' = '' OR p.name = '${package}' OR p.name GLOB '${package}:*')
          AND t.tid = p.pid
      ),
      running_samples AS (
        SELECT
          ss.cpu, ss.ucpu,
          ss.ts,
          ss.dur,
          COALESCE(ct.core_type, 'unknown') as core_type
        FROM clipped_sched ss
        JOIN main_thread mt ON ss.utid = mt.utid
        LEFT JOIN system_cpu_topology ct ON ss.ucpu = ct.ucpu
        WHERE ss.ts < ${end_ts}
          AND ss.ts + ss.dur > ${start_ts}
      ),
      freq_samples AS (
        SELECT
          cf.cpu,
          cf.freq as freq_khz,
          rs.core_type,
          MIN(cf.ts + cf.dur, rs.ts + rs.dur, ${end_ts}) -
            MAX(cf.ts, rs.ts, ${start_ts}) as overlap_dur
        FROM clipped_frequency cf
        JOIN running_samples rs ON cf.ucpu = rs.ucpu
        WHERE cf.ts < ${end_ts}
          AND cf.ts + cf.dur > rs.ts
          AND cf.ts < rs.ts + rs.dur
          AND cf.dur > 0 AND cf.freq >= 0 AND rs.dur > 0
      )
      SELECT
        core_type,
        ROUND(SUM(1.0 * freq_khz * overlap_dur) / NULLIF(SUM(overlap_dur), 0) / 1000, 0) as avg_freq_mhz,
        ROUND(MAX(freq_khz) / 1000, 0) as max_freq_mhz,
        ROUND(MIN(freq_khz) / 1000, 0) as min_freq_mhz,
        'topology_view' as classify_method
      FROM freq_samples
      WHERE overlap_dur > 0
      GROUP BY core_type
      ORDER BY core_type DESC
    save_as: cpu_freq

  # 系统每核供给上下文；全局 busy/frequency 不等于目标启动的因果贡献。
  - id: per_cpu_system_context
    type: atomic
    name: "逐核频率与系统负载上下文"
    display:
      level: key
      layer: deep
      title: "逐核系统上下文（非目标因果归因）"
      columns:
        - {name: idle_ns, label: "Idle duration", type: duration, unit: ns, hidden: true}
        - {name: idle_identity_unknown_ns, label: "Unknown idle identity duration", type: duration, unit: ns, hidden: true}
        - {name: sched_evidence, label: "Scheduler coverage", type: string, hidden: true}
        - {name: ucpu, label: "ucpu", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: capacity, label: "capacity", type: number, hidden: true}
        - {name: cluster_id, label: "cluster_id", type: number, hidden: true}
        - {name: machine_id, label: "machine_id", type: number, hidden: true}
        - {name: frequency_evidence, label: "frequency_evidence", type: string, hidden: true}
        - {name: upid, label: "UPID", type: number}
        - {name: utid, label: "主线程 UTID", type: number}
        - {name: cpu, label: "CPU", type: number}
        - {name: core_type, label: "核类型", type: string}
        - {name: topology_source, label: "拓扑来源", type: string}
        - {name: avg_freq_mhz, label: "窗口加权均频(MHz)", type: number}
        - {name: min_freq_mhz, label: "最低频率(MHz)", type: number}
        - {name: max_freq_mhz, label: "最高频率(MHz)", type: number}
        - {name: freq_coverage_ms, label: "频率覆盖(ms)", type: duration, format: duration_ms, unit: ms}
        - {name: freq_coverage_pct, label: "频率覆盖比例", type: percentage}
        - {name: sched_coverage_ms, label: "调度记录覆盖(ms)", type: duration, format: duration_ms, unit: ms}
        - {name: system_busy_ms, label: "系统非 idle 运行(ms)", type: duration, format: duration_ms, unit: ms}
        - {name: system_busy_pct, label: "系统忙碌/窗口", type: percentage}
        - {name: target_main_running_ms, label: "目标主线程运行(ms)", type: duration, format: duration_ms, unit: ms}
        - {name: pid, label: "目标 PID", type: number, hidden: true}
        - {name: tid, label: "目标 TID", type: number, hidden: true}
        - {name: process_name, label: "目标进程", type: string, hidden: true}
        - {name: evidence_scope, label: "证据边界", type: string, hidden: true}
    process_scope:
      role: target
      binding: effective_target_processes
      context_fields:
        global_context: [cpu, ucpu, machine_id, capacity, cluster_id, core_type, topology_source, avg_freq_mhz, min_freq_mhz, max_freq_mhz, freq_coverage_ms, freq_coverage_pct, frequency_evidence, system_busy_ms, system_busy_pct, sched_coverage_ms, idle_ns, idle_identity_unknown_ns, sched_evidence]
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_frequency_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}'='' OR p.name='${package}' OR p.name GLOB '${package}:*')
      ),
      frequency AS (
       SELECT window_id,ucpu,SUM(dur_ns) AS coverage_ns,
       SUM(freq_khz*1.0*dur_ns)/SUM(dur_ns)/1000 AS avg_freq_mhz,
       MIN(freq_khz)/1000.0 AS min_freq_mhz,MAX(freq_khz)/1000.0 AS max_freq_mhz
       FROM system_cpu_frequency_spans GROUP BY window_id,ucpu
      ),
      system_running AS (
       SELECT window_id,ucpu,SUM(dur_ns) AS coverage_ns,SUM(CASE WHEN is_idle=0 THEN dur_ns ELSE 0 END) AS busy_ns,
       SUM(CASE WHEN is_idle=1 THEN dur_ns ELSE 0 END) AS idle_ns,
       SUM(CASE WHEN is_idle IS NULL THEN dur_ns ELSE 0 END) AS idle_identity_unknown_ns
       FROM system_sched_spans GROUP BY window_id,ucpu
      ),
      target_running AS (
       SELECT s.window_id,s.ucpu,s.utid,SUM(s.dur_ns) AS running_ns
       FROM system_sched_spans s JOIN system_target_threads tt ON tt.window_id=s.window_id AND tt.utid=s.utid AND tt.upid=s.upid
       GROUP BY s.window_id,s.ucpu,s.utid
      )
      SELECT tt.upid,p.pid,p.name AS process_name,tt.utid,t.tid,c.cpu,c.ucpu,w.window_start_ts,w.window_end_ts,
       c.core_type,c.topology_source,c.capacity,c.cluster_id,c.machine_id,
       ROUND(f.avg_freq_mhz,2) AS avg_freq_mhz,ROUND(f.min_freq_mhz,2) AS min_freq_mhz,ROUND(f.max_freq_mhz,2) AS max_freq_mhz,
       ROUND(COALESCE(f.coverage_ns,0)/1e6,2) AS freq_coverage_ms,
       ROUND(100.0*COALESCE(f.coverage_ns,0)/NULLIF(w.window_end_ts-w.window_start_ts,0),2) AS freq_coverage_pct,
       ROUND(COALESCE(s.coverage_ns,0)/1e6,2) AS sched_coverage_ms,
       ROUND(s.busy_ns/1e6,2) AS system_busy_ms,
       s.idle_ns,s.idle_identity_unknown_ns,
       CASE WHEN s.coverage_ns IS NULL THEN 'unavailable'
        WHEN s.coverage_ns>w.window_end_ts-w.window_start_ts THEN 'unsupported'
        WHEN s.idle_identity_unknown_ns>0 OR s.coverage_ns<w.window_end_ts-w.window_start_ts THEN 'partial' ELSE 'observed' END AS sched_evidence,
       ROUND(100.0*s.busy_ns/NULLIF(w.window_end_ts-w.window_start_ts,0),2) AS system_busy_pct,
       ROUND(CASE WHEN s.coverage_ns IS NULL THEN NULL ELSE COALESCE(r.running_ns,0)/1e6 END,2) AS target_main_running_ms,
       CASE WHEN m.mapping_count!=1 THEN 'unsupported' WHEN f.coverage_ns IS NULL THEN 'unavailable'
        WHEN f.coverage_ns<w.window_end_ts-w.window_start_ts THEN 'partial' ELSE 'observed' END AS frequency_evidence,
       'system_context_not_causal_attribution' AS evidence_scope
      FROM system_target_threads tt JOIN system_windows w ON w.window_id=tt.window_id
      JOIN thread t ON t.utid=tt.utid JOIN process p ON p.upid=tt.upid CROSS JOIN system_cpu_topology c
      LEFT JOIN system_frequency_cpu_mapping m ON m.ucpu=c.ucpu
      LEFT JOIN frequency f ON f.window_id=w.window_id AND f.ucpu=c.ucpu
      LEFT JOIN system_running s ON s.window_id=w.window_id AND s.ucpu=c.ucpu
      LEFT JOIN target_running r ON r.window_id=w.window_id AND r.ucpu=c.ucpu AND r.utid=tt.utid
      WHERE tt.role='main' ORDER BY tt.upid,tt.utid,c.ucpu
    save_as: per_cpu_context
    optional: true

  # R+ 只证明切出时报告了抢占；精确下一任务是 CPU 交接对象，
  # 不把其整个运行时间或其后的重叠任务都算作启动延迟根因。
  - id: preemption
    type: atomic
    name: "目标线程抢占切换证据"
    process_scope:
      role: target
      binding: effective_target_processes
      context_fields:
        peer_context: [next_sched_id, next_utid, next_tid, next_upid, next_pid, next_thread_name, next_process_name, next_priority, next_is_idle, next_role]
    sql_fragments:
      - fragments/effective_target_processes.sql
    display:
      level: key
      layer: deep
      title: "R+ 抢占切出与直接 CPU 交接"
      columns:
        - {name: next_is_idle, label: "Successor is idle", type: number, hidden: true}
        - {name: next_role, label: "Successor role", type: string}
        - {name: utid, label: "目标 UTID", type: number}
        - {name: thread_name, label: "目标线程", type: string}
        - {name: cpu, label: "CPU", type: number}
        - {name: switch_ts, label: "实际切出时间", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: priority, label: "切出片段 kernel priority", type: number}
        - {name: next_process_name, label: "交接进程", type: string}
        - {name: next_thread_name, label: "交接线程", type: string}
        - {name: next_priority, label: "交接片段 kernel priority", type: number}
        - {name: observed_wait_ms, label: "窗口内 R+ 等待(ms)", type: duration, format: duration_ms, unit: ms}
        - {name: wait_evidence, label: "等待证据", type: string}
        - {name: handoff_evidence, label: "交接证据", type: string}
        - {name: sched_id, label: "切出 sched ID", type: number, hidden: true}
        - {name: upid, label: "目标 UPID", type: number, hidden: true}
        - {name: pid, label: "目标 PID", type: number, hidden: true}
        - {name: tid, label: "目标 TID", type: number, hidden: true}
        - {name: process_name, label: "目标进程", type: string, hidden: true}
        - {name: ucpu, label: "唯一 CPU ID", type: number, hidden: true}
        - {name: next_sched_id, label: "交接 sched ID", type: number, hidden: true}
        - {name: next_utid, label: "交接 UTID", type: number, hidden: true}
        - {name: next_tid, label: "交接 TID", type: number, hidden: true}
        - {name: next_upid, label: "交接 UPID", type: number, hidden: true}
        - {name: next_pid, label: "交接 PID", type: number, hidden: true}
        - {name: wait_state_id, label: "R+ 状态 ID", type: number, hidden: true}
        - {name: scheduling_policy_evidence, label: "调度策略证据", type: string, hidden: true}
    sql: |
      WITH target_switches AS (
        SELECT s.id as sched_id, s.utid, s.ucpu, s.cpu, s.priority,
          s.ts + s.dur as switch_ts, t.tid, t.name as thread_name,
          p.upid, p.pid, p.name as process_name
        FROM sched_slice s
        JOIN thread t ON s.utid = t.utid
        JOIN effective_target_processes p ON t.upid = p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}' = '' OR p.name = '${package}' OR p.name GLOB '${package}:*')
          AND s.end_state = 'R+' AND s.dur > 0
          AND s.ts + s.dur >= ${start_ts} AND s.ts + s.dur < ${end_ts}
      )
      SELECT s.sched_id, s.upid, s.pid, s.process_name, s.utid, s.tid, s.thread_name,
        s.ucpu, s.cpu, printf('%d', s.switch_ts) as switch_ts, s.priority,
        n.id as next_sched_id, n.utid as next_utid, nt.tid as next_tid,
        np.upid as next_upid, np.pid as next_pid, nt.is_idle as next_is_idle,
        CASE WHEN n.id IS NULL THEN 'successor_unavailable' WHEN nt.is_idle=1 THEN 'idle_not_competing_task'
          WHEN nt.is_idle=0 THEN 'scheduled_task_not_proven_wait_cause' ELSE 'idle_identity_unknown' END as next_role,
        nt.name as next_thread_name, np.name as next_process_name, n.priority as next_priority,
        w.id as wait_state_id,
        CASE WHEN w.dur >= 0 THEN ROUND((MIN(w.ts + w.dur, ${end_ts}) - MAX(w.ts, ${start_ts})) / 1e6, 3) ELSE NULL END as observed_wait_ms,
        CASE WHEN w.id IS NULL THEN 'missing_runnable_state'
          WHEN w.dur < 0 THEN 'incomplete_runnable_state'
          ELSE 'observed_runnable_preempted' END as wait_evidence,
        CASE WHEN n.id IS NULL THEN 'next_task_not_observed'
          ELSE 'exact_same_cpu_handoff_not_causal_duration' END as handoff_evidence,
        'not_recorded_in_sched_slice' as scheduling_policy_evidence
      FROM target_switches s
      LEFT JOIN sched_slice n ON n.ucpu = s.ucpu AND n.ts = s.switch_ts AND n.utid != s.utid
      LEFT JOIN thread nt ON n.utid = nt.utid
      LEFT JOIN process np ON nt.upid = np.upid
      LEFT JOIN thread_state w ON w.utid = s.utid AND w.ts = s.switch_ts AND w.state = 'R+'
      ORDER BY s.switch_ts, s.sched_id
    save_as: preemption_handoffs
    optional: true

