name: state_timeline
version: "1.1"
type: composite
category: interaction
tier: S

meta:
  display_name: "连续状态时间线"
  description: "从 Trace 起始到结束，按泳道展示设备/用户/应用/系统的连续状态"
  icon: "view_timeline"
  tags: [state, timeline, continuous, swim_lane, scene]

prerequisites:
  modules:
    - android.screen_state
    - android.input
    - android.battery_stats

triggers:
  keywords:
    zh: [状态时间线, 连续状态, 泳道, 设备状态, 用户状态]
    en: [state timeline, continuous state, swim lane, device state]

inputs:
  - name: trace_id
    type: string
    required: true

  - name: scene_row_limit
    type: number
    required: false
    default: 4096

steps:
  - id: input_coverage
    type: atomic
    name: "输入事实覆盖范围"
    display:
      level: hidden
      layer: overview
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql]
    sql: |
      SELECT printf('%d', start_ts) AS start_ts, printf('%d', end_ts) AS end_ts,
        (SELECT COUNT(*) FROM scene_input_facts) AS observed_event_count,
        (SELECT COUNT(*) FROM scene_primary_input) AS physical_event_count,
        (SELECT COUNT(*) FROM scene_primary_input WHERE event_action = 'UNKNOWN') AS physical_missing_action_count,
        (SELECT COUNT(*) FROM scene_input_facts WHERE event_action = 'UNKNOWN') AS missing_action_count,
        (SELECT COUNT(*) FROM scene_raw_input WHERE ts IS NULL) AS missing_timestamp_count,
        (SELECT COUNT(*) FROM scene_gestures) AS gesture_count,
        (SELECT COUNT(*) FROM scene_input_gaps WHERE end_ts > ts) AS gap_count,
        MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096) AS output_row_limit,
        CASE WHEN (SELECT COUNT(*) FROM scene_gestures) +
          (SELECT COUNT(*) FROM scene_input_gaps WHERE end_ts > ts) > MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
          THEN 1 ELSE 0 END AS output_truncated,
        'partial' AS source_status, 'capture_completeness_unproven' AS reason,
        'inertial_boundary_unavailable' AS inertial_source_status,
        'scene_input_v1' AS normalization_version FROM trace_bounds
    save_as: input_coverage
    optional: true

  # ==========================================================================
  # Step 0: Trace 时间范围 + 可用表探测
  # ==========================================================================
  - id: timeline_bounds
    type: atomic
    name: "时间线范围与可用表"
    display:
      level: hidden
    sql: |
      SELECT
        printf('%d', start_ts) AS t_start,
        printf('%d', end_ts) AS t_end,
        printf('%d', start_ts) AS t_start_str,
        printf('%d', end_ts) AS t_end_str,
        ROUND((end_ts - start_ts) / 1e9, 2) AS duration_sec,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_screen_state') THEN 1
          ELSE 0
        END AS has_screen_state,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_battery_stats_event_slices') THEN 1
          ELSE 0
        END AS has_battery_top,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_input_events') THEN 1
          ELSE 0
        END AS has_input_events,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='actual_frame_timeline_slice') THEN 1
          ELSE 0
        END AS has_frame_timeline
      FROM trace_bounds
    save_as: timeline_bounds

  # ==========================================================================
  # Step 1: 设备状态泳道 (屏幕亮灭)
  # ==========================================================================
  - id: device_state_lane
    type: atomic
    name: "设备状态泳道"
    optional: true
    condition: timeline_bounds.data[0]?.has_screen_state === 1
    display:
      level: detail
      layer: list
      title: "设备状态时间线"
      columns:
        - { name: lane, label: "泳道", type: string, hidden: true }
        - { name: state, label: "状态", type: string }
        - { name: state_label, label: "状态描述", type: string }
        - { name: start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_range }
        - { name: end_ts, label: "结束", type: timestamp, unit: ns, hidden: true }
        - { name: dur_ns, label: "时长(ns)", type: duration, unit: ns, hidden: true }
        - { name: dur_ms, label: "时长(ms)", type: number }
        - { name: source_status, label: "数据源", type: string, hidden: true }
    sql_fragments: [fragments/scene_screen_facts.sql]
    sql: |
      SELECT 'device' AS lane, state,
        CASE state WHEN 'SCREEN_ON' THEN '屏幕点亮' WHEN 'SCREEN_OFF' THEN '屏幕熄灭'
          WHEN 'SCREEN_DOZE' THEN '屏幕低功耗显示（DOZE）' ELSE '未知' END AS state_label,
        printf('%d', ts) AS start_ts, printf('%d', end_ts) AS end_ts,
        printf('%d', end_ts - ts) AS dur_ns, (end_ts - ts) / 1000000 AS dur_ms,
        source_status, 'android_screen_state' AS source_table, source_ids, COUNT(*) OVER () AS total_rows
      FROM scene_screen_lane ORDER BY ts
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
  # -- Device fallback: table missing → single UNKNOWN covering entire trace
  - id: device_state_lane_fallback
    type: atomic
    name: "设备状态泳道（降级）"
    condition: timeline_bounds.data[0]?.has_screen_state !== 1
    optional: true
    display:
      level: detail
      layer: list
      title: "设备状态时间线"
      columns:
        - { name: lane, label: "泳道", type: string, hidden: true }
        - { name: state, label: "状态", type: string }
        - { name: state_label, label: "状态描述", type: string }
        - { name: start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_range }
        - { name: end_ts, label: "结束", type: timestamp, unit: ns, hidden: true }
        - { name: dur_ns, label: "时长(ns)", type: duration, unit: ns, hidden: true }
        - { name: dur_ms, label: "时长(ms)", type: number }
        - { name: source_status, label: "数据源", type: string, hidden: true }
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH lane_bounds AS (
        SELECT start_ts AS t_start, end_ts AS t_end FROM trace_bounds
      )
      SELECT
        'device' AS lane,
        'UNKNOWN' AS state,
        '未知' AS state_label,
        printf('%d', t_start) AS start_ts,
        printf('%d', t_end) AS end_ts,
        t_end - t_start AS dur_ns,
        CAST((t_end - t_start) / 1000000 AS INT) AS dur_ms,
        'table_missing' AS source_status
      FROM lane_bounds
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
  # ==========================================================================
  # Step 2a: 用户输入状态泳道 — 规范化输入事实
  # 兼容保留 step ID；两条路径使用相同事实，不以出帧推断 FLING
  # ==========================================================================
  - id: input_state_lane_frames
    type: atomic
    investigation_evidence:
      window: {start: start_ts, end: end_ts}
      metrics: []
    name: "用户输入状态泳道"
    optional: true
    condition: timeline_bounds.data[0]?.has_frame_timeline === 1 && timeline_bounds.data[0]?.has_input_events === 1
    display:
      level: detail
      layer: list
      title: "用户输入状态时间线"
      columns:
        - { name: lane, label: "泳道", type: string, hidden: true }
        - { name: state, label: "状态", type: string }
        - { name: state_label, label: "状态描述", type: string }
        - { name: start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_range }
        - { name: end_ts, label: "结束", type: timestamp, unit: ns, hidden: true }
        - { name: dur_ns, label: "时长(ns)", type: duration, unit: ns, hidden: true }
        - { name: dur_ms, label: "时长(ms)", type: number }
        - { name: source_status, label: "数据源", type: string, hidden: true }
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql]
    sql: |
      WITH segments AS (
        SELECT ts, end_ts, UPPER(gesture_type) AS state, CASE gesture_type WHEN 'touch_move' THEN '连续触摸移动' WHEN 'touch_hold' THEN '持续触摸（长按识别未确认）' WHEN 'tap' THEN '点击接触' WHEN 'cancelled' THEN '触摸取消' WHEN 'key' THEN '按键输入' WHEN 'scroll_input' THEN '滚动轴输入（ACTION_SCROLL）' WHEN 'wheel' THEN '滚轮输入' ELSE '输入活动（动作信息不完整）' END AS state_label,
          source_status, stream_key, source_table, source_id, source_ids,
          upid, device_id, display_id, input_source, event_count, missing_action_count
        FROM scene_gestures
        UNION ALL
        SELECT ts, end_ts, 'UNKNOWN', '未观测到输入（采集完整性未确认）', 'partial', NULL,
          'input_coverage_gap', NULL, NULL, NULL, NULL, NULL, NULL, 0, 0
        FROM scene_input_gaps WHERE end_ts > ts
      )
      SELECT 'input' AS lane, state, state_label, printf('%d', ts) AS start_ts,
        printf('%d', end_ts) AS end_ts, printf('%d', end_ts - ts) AS dur_ns,
        (end_ts - ts) / 1000000 AS dur_ms, source_status, stream_key,
        source_table, source_id, source_ids, upid, device_id, display_id, input_source,
        event_count, missing_action_count, 'MEDIUM' AS confidence, COUNT(*) OVER () AS total_rows
      FROM segments ORDER BY ts, stream_key
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
  # ==========================================================================
  # Step 2b: 用户输入状态泳道 — 无帧数据兼容入口
  # 帧数据不影响输入事实；保持与主路径同一规范化和未知边界
  # ==========================================================================
  - id: input_state_lane_fallback
    type: atomic
    investigation_evidence:
      window: {start: start_ts, end: end_ts}
      metrics: []
    name: "用户输入状态泳道"
    optional: true
    condition: timeline_bounds.data[0]?.has_frame_timeline !== 1 && timeline_bounds.data[0]?.has_input_events === 1
    display:
      level: detail
      layer: list
      title: "用户输入状态时间线"
      columns:
        - { name: lane, label: "泳道", type: string, hidden: true }
        - { name: state, label: "状态", type: string }
        - { name: state_label, label: "状态描述", type: string }
        - { name: start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_range }
        - { name: end_ts, label: "结束", type: timestamp, unit: ns, hidden: true }
        - { name: dur_ns, label: "时长(ns)", type: duration, unit: ns, hidden: true }
        - { name: dur_ms, label: "时长(ms)", type: number }
        - { name: source_status, label: "数据源", type: string, hidden: true }
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql]
    sql: |
      WITH segments AS (
        SELECT ts, end_ts, UPPER(gesture_type) AS state, CASE gesture_type WHEN 'touch_move' THEN '连续触摸移动' WHEN 'touch_hold' THEN '持续触摸（长按识别未确认）' WHEN 'tap' THEN '点击接触' WHEN 'cancelled' THEN '触摸取消' WHEN 'key' THEN '按键输入' WHEN 'scroll_input' THEN '滚动轴输入（ACTION_SCROLL）' WHEN 'wheel' THEN '滚轮输入' ELSE '输入活动（动作信息不完整）' END AS state_label,
          source_status, stream_key, source_table, source_id, source_ids,
          upid, device_id, display_id, input_source, event_count, missing_action_count
        FROM scene_gestures
        UNION ALL
        SELECT ts, end_ts, 'UNKNOWN', '未观测到输入（采集完整性未确认）', 'partial', NULL,
          'input_coverage_gap', NULL, NULL, NULL, NULL, NULL, NULL, 0, 0
        FROM scene_input_gaps WHERE end_ts > ts
      )
      SELECT 'input' AS lane, state, state_label, printf('%d', ts) AS start_ts,
        printf('%d', end_ts) AS end_ts, printf('%d', end_ts - ts) AS dur_ns,
        (end_ts - ts) / 1000000 AS dur_ms, source_status, stream_key,
        source_table, source_id, source_ids, upid, device_id, display_id, input_source,
        event_count, missing_action_count, 'MEDIUM' AS confidence, COUNT(*) OVER () AS total_rows
      FROM segments ORDER BY ts, stream_key
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
  # ==========================================================================
  # Step 3: 应用状态泳道 (前台应用)
  # ==========================================================================
  - id: app_state_lane
    type: atomic
    name: "应用状态泳道"
    optional: true
    condition: timeline_bounds.data[0]?.has_battery_top === 1
    display:
      level: detail
      layer: list
      title: "应用状态时间线"
      columns:
        - { name: lane, label: "泳道", type: string, hidden: true }
        - { name: state, label: "应用", type: string }
        - { name: state_label, label: "应用名称", type: string }
        - { name: start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_range }
        - { name: end_ts, label: "结束", type: timestamp, unit: ns, hidden: true }
        - { name: dur_ns, label: "时长(ns)", type: duration, unit: ns, hidden: true }
        - { name: dur_ms, label: "时长(ms)", type: number }
        - { name: source_status, label: "数据源", type: string, hidden: true }
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH lane_bounds AS (
        SELECT start_ts AS t_start, end_ts AS t_end FROM trace_bounds
      ),
      -- Top app from battery stats (already has ts + duration)
      app_segments AS (
        SELECT
          ts AS start_ts,
          ts + MAX(dur, 50000000) AS end_ts,
          str_value AS state,
          ROW_NUMBER() OVER (ORDER BY ts) AS rn
        FROM android_battery_stats_event_slices
        WHERE track_name = 'battery_stats.top'
          AND MAX(dur, 50000000) > 50000000
        ORDER BY ts
      ),
      -- Gap filling (with empty-data fallback)
      gaps AS (
        -- Fallback: no app data → single UNKNOWN covering entire trace
        SELECT
          (SELECT t_start FROM lane_bounds) AS start_ts,
          (SELECT t_end FROM lane_bounds) AS end_ts,
          'UNKNOWN' AS state
        WHERE NOT EXISTS (SELECT 1 FROM app_segments)

        UNION ALL

        -- Leading gap
        SELECT
          (SELECT t_start FROM lane_bounds) AS start_ts,
          (SELECT MIN(start_ts) FROM app_segments) AS end_ts,
          'UNKNOWN' AS state
        WHERE EXISTS (SELECT 1 FROM app_segments)
          AND (SELECT MIN(start_ts) FROM app_segments) > (SELECT t_start FROM lane_bounds)

        UNION ALL

        -- Inter-app gaps (< 500ms → transitioning, >= 500ms → UNKNOWN)
        SELECT
          a1.end_ts AS start_ts,
          a2.start_ts AS end_ts,
          CASE
            WHEN a2.start_ts - a1.end_ts < 500000000 THEN '(transitioning)'
            ELSE 'UNKNOWN'
          END AS state
        FROM app_segments a1
        JOIN app_segments a2 ON a2.rn = a1.rn + 1
        WHERE a2.start_ts > a1.end_ts

        UNION ALL

        -- Trailing gap
        SELECT
          (SELECT MAX(end_ts) FROM app_segments) AS start_ts,
          (SELECT t_end FROM lane_bounds) AS end_ts,
          'UNKNOWN' AS state
        WHERE EXISTS (SELECT 1 FROM app_segments)
          AND (SELECT MAX(end_ts) FROM app_segments) < (SELECT t_end FROM lane_bounds)
      ),
      all_segments AS (
        SELECT start_ts, end_ts, state FROM app_segments
        UNION ALL
        SELECT start_ts, end_ts, state FROM gaps
      )
      SELECT
        'app' AS lane,
        state,
        CASE
          WHEN state = 'UNKNOWN' THEN '未知'
          WHEN state = '(transitioning)' THEN '切换中'
          ELSE REPLACE(REPLACE(state, 'com.', ''), 'android.', '')
        END AS state_label,
        printf('%d', start_ts) AS start_ts,
        printf('%d', end_ts) AS end_ts,
        end_ts - start_ts AS dur_ns,
        CAST((end_ts - start_ts) / 1000000 AS INT) AS dur_ms,
        'available' AS source_status
      FROM all_segments
      WHERE end_ts > start_ts
      ORDER BY start_ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
  # -- App fallback: table missing → single UNKNOWN covering entire trace
  - id: app_state_lane_fallback
    type: atomic
    name: "应用状态泳道（降级）"
    condition: timeline_bounds.data[0]?.has_battery_top !== 1
    optional: true
    display:
      level: detail
      layer: list
      title: "应用状态时间线"
      columns:
        - { name: lane, label: "泳道", type: string, hidden: true }
        - { name: state, label: "应用", type: string }
        - { name: state_label, label: "应用名称", type: string }
        - { name: start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_range }
        - { name: end_ts, label: "结束", type: timestamp, unit: ns, hidden: true }
        - { name: dur_ns, label: "时长(ns)", type: duration, unit: ns, hidden: true }
        - { name: dur_ms, label: "时长(ms)", type: number }
        - { name: source_status, label: "数据源", type: string, hidden: true }
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH lane_bounds AS (
        SELECT start_ts AS t_start, end_ts AS t_end FROM trace_bounds
      )
      SELECT
        'app' AS lane,
        'UNKNOWN' AS state,
        '未知' AS state_label,
        printf('%d', t_start) AS start_ts,
        printf('%d', t_end) AS end_ts,
        t_end - t_start AS dur_ns,
        CAST((t_end - t_start) / 1000000 AS INT) AS dur_ms,
        'table_missing' AS source_status
      FROM lane_bounds
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
  # ==========================================================================
  # Step 4: 系统状态泳道 (系统事件)
  # ==========================================================================
  - id: system_state_lane
    type: atomic
    name: "系统状态泳道"
    display:
      level: detail
      layer: list
      title: "系统状态时间线"
      columns:
        - { name: lane, label: "泳道", type: string, hidden: true }
        - { name: state, label: "状态", type: string }
        - { name: state_label, label: "状态描述", type: string }
        - { name: start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_range }
        - { name: end_ts, label: "结束", type: timestamp, unit: ns, hidden: true }
        - { name: dur_ns, label: "时长(ns)", type: duration, unit: ns, hidden: true }
        - { name: dur_ms, label: "时长(ms)", type: number }
        - { name: source_status, label: "数据源", type: string, hidden: true }
        - { name: confidence, label: "置信度", type: string, hidden: true }
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH lane_bounds AS (
        SELECT start_ts AS t_start, end_ts AS t_end FROM trace_bounds
      ),
      -- Detect system events from known patterns in system_server / SurfaceFlinger
      system_events AS (
        SELECT
          s.ts AS start_ts,
          s.ts + s.dur AS end_ts,
          CASE
            WHEN s.name GLOB '*KeyguardGoing*' OR s.name GLOB '*keyguardGoingAway*'
              THEN 'UNLOCK'
            WHEN s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*'
              THEN 'RECENT_APPS'
            WHEN (s.name GLOB '*StatusBar*expand*' OR s.name GLOB '*NotificationShade*'
                  OR s.name GLOB '*StatusBarWindow*')
              AND s.dur > 10000000
              THEN 'NOTIFICATION_SHADE'
            WHEN s.name GLOB '*showSoftInput*' OR s.name GLOB '*InputMethodService*show*'
                 OR s.name GLOB '*InputMethodManager*show*'
              THEN 'KEYBOARD'
            WHEN (s.name GLOB '*WindowAnimation*' OR s.name GLOB '*Transition*'
                  OR s.name GLOB '*RemoteAnimation*' OR s.name GLOB '*AppTransition*')
              AND s.dur > 10000000
              THEN 'ANIMATION'
            ELSE NULL
          END AS state,
          -- Priority for overlap resolution (higher = wins)
          CASE
            WHEN s.name GLOB '*KeyguardGoing*' OR s.name GLOB '*keyguardGoingAway*' THEN 50
            WHEN s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*' THEN 40
            WHEN s.name GLOB '*StatusBar*expand*' OR s.name GLOB '*NotificationShade*'
                 OR s.name GLOB '*StatusBarWindow*' THEN 30
            WHEN s.name GLOB '*showSoftInput*' OR s.name GLOB '*InputMethodService*show*'
                 OR s.name GLOB '*InputMethodManager*show*' THEN 20
            ELSE 10
          END AS priority
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        JOIN process p ON t.upid = p.upid
        WHERE s.dur > 10000000
          AND (
            p.name IN ('system_server', '/system/bin/surfaceflinger')
            OR p.name GLOB 'com.android.systemui*'
          )
          AND (
            s.name GLOB '*KeyguardGoing*'
            OR s.name GLOB '*keyguardGoingAway*'
            OR s.name GLOB '*RecentsAnimation*'
            OR s.name GLOB '*startRecentsActivity*'
            OR s.name GLOB '*StatusBar*expand*'
            OR s.name GLOB '*NotificationShade*'
            OR s.name GLOB '*StatusBarWindow*'
            OR s.name GLOB '*showSoftInput*'
            OR s.name GLOB '*InputMethodService*show*'
            OR s.name GLOB '*InputMethodManager*show*'
            OR s.name GLOB '*WindowAnimation*'
            OR s.name GLOB '*Transition*'
            OR s.name GLOB '*RemoteAnimation*'
            OR s.name GLOB '*AppTransition*'
          )
      ),
      -- Sweep-line interval merge: produce non-overlapping segments where the
      -- highest-priority event wins at each time point.
      -- 1. Collect valid (non-NULL state) events
      valid_events AS (
        SELECT start_ts, end_ts, state, priority
        FROM system_events
        WHERE state IS NOT NULL
      ),
      -- 2. Extract all transition points (event starts + ends, deduplicated)
      transition_points AS (
        SELECT start_ts AS ts FROM valid_events
        UNION
        SELECT end_ts AS ts FROM valid_events
      ),
      sorted_points AS (
        SELECT ts, ROW_NUMBER() OVER (ORDER BY ts) AS rn
        FROM transition_points
      ),
      -- 3. Create micro-segments between consecutive transition points
      micro_segments AS (
        SELECT p1.ts AS seg_start, p2.ts AS seg_end
        FROM sorted_points p1
        JOIN sorted_points p2 ON p2.rn = p1.rn + 1
        WHERE p2.ts > p1.ts
      ),
      -- 4. For each micro-segment, pick the highest-priority event covering it
      segment_winners AS (
        SELECT
          ms.seg_start,
          ms.seg_end,
          ve.state,
          ROW_NUMBER() OVER (
            PARTITION BY ms.seg_start, ms.seg_end
            ORDER BY ve.priority DESC,
                     (ve.end_ts - ve.start_ts) DESC,
                     ve.start_ts ASC,
                     ve.state ASC
          ) AS rn
        FROM micro_segments ms
        JOIN valid_events ve
          ON ve.start_ts <= ms.seg_start
         AND ve.end_ts >= ms.seg_end
      ),
      winners AS (
        SELECT seg_start, seg_end, state
        FROM segment_winners
        WHERE rn = 1
      ),
      -- 5. Merge consecutive segments with same state (gaps-and-islands)
      island_groups AS (
        SELECT seg_start, seg_end, state,
          ROW_NUMBER() OVER (ORDER BY seg_start) -
          ROW_NUMBER() OVER (PARTITION BY state ORDER BY seg_start) AS grp
        FROM winners
      ),
      deduped AS (
        SELECT MIN(seg_start) AS start_ts, MAX(seg_end) AS end_ts, state
        FROM island_groups
        GROUP BY state, grp
      ),
      numbered AS (
        SELECT *, ROW_NUMBER() OVER (ORDER BY start_ts) AS rn
        FROM deduped
      ),
      -- Gap filling with UNKNOWN
      gaps AS (
        -- Leading gap
        SELECT
          (SELECT t_start FROM lane_bounds) AS start_ts,
          COALESCE((SELECT MIN(start_ts) FROM deduped), (SELECT t_end FROM lane_bounds)) AS end_ts,
          'UNKNOWN' AS state

        UNION ALL

        -- Inter-event gaps
        SELECT
          n1.end_ts AS start_ts,
          n2.start_ts AS end_ts,
          'UNKNOWN' AS state
        FROM numbered n1
        JOIN numbered n2 ON n2.rn = n1.rn + 1
        WHERE n2.start_ts > n1.end_ts

        UNION ALL

        -- Trailing gap (only when deduped has events; otherwise leading gap covers full trace)
        SELECT
          (SELECT MAX(end_ts) FROM deduped) AS start_ts,
          (SELECT t_end FROM lane_bounds) AS end_ts,
          'UNKNOWN' AS state
        WHERE EXISTS (SELECT 1 FROM deduped)
          AND (SELECT MAX(end_ts) FROM deduped) < (SELECT t_end FROM lane_bounds)
      ),
      all_segments AS (
        SELECT start_ts, end_ts, state FROM deduped
        UNION ALL
        SELECT start_ts, end_ts, state FROM gaps
      )
      SELECT
        'system' AS lane,
        state,
        CASE state
          WHEN 'ANIMATION' THEN '系统动画'
          WHEN 'KEYBOARD' THEN '键盘弹出'
          WHEN 'NOTIFICATION_SHADE' THEN '通知栏'
          WHEN 'RECENT_APPS' THEN '多任务'
          WHEN 'UNLOCK' THEN '解锁'
          ELSE '未知'
        END AS state_label,
        printf('%d', start_ts) AS start_ts,
        printf('%d', end_ts) AS end_ts,
        end_ts - start_ts AS dur_ns,
        CAST((end_ts - start_ts) / 1000000 AS INT) AS dur_ms,
        'available' AS source_status,
        CASE
          WHEN state = 'UNKNOWN' THEN 'N/A'
          ELSE 'MEDIUM'
        END AS confidence
      FROM all_segments
      WHERE end_ts > start_ts
      ORDER BY start_ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
  # ==========================================================================
  # Step 5: 泳道汇总
  # ==========================================================================
  - id: lane_summary
    type: atomic
    name: "泳道统计汇总"
    display:
      level: summary
      layer: overview
      title: "状态时间线概览"
      columns:
        - { name: lane, label: "泳道", type: string }
        - { name: segment_count, label: "段数", type: number }
        - { name: total_dur_sec, label: "总时长(秒)", type: number }
        - { name: dominant_state, label: "主要状态", type: string }
        - { name: source_status, label: "数据源", type: string }
    sql: |
      -- Summary: aggregate stats per lane
      -- This step always succeeds (uses slice table which always exists)
      WITH lane_bounds AS (
        SELECT ROUND((end_ts - start_ts) / 1e9, 2) AS duration_sec FROM trace_bounds
      ),
      table_status AS (
        SELECT
          CASE WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_screen_state') THEN 'available' ELSE 'table_missing' END AS device_status,
          CASE
            WHEN NOT EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_input_events') THEN 'table_missing'
            WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='actual_frame_timeline_slice') THEN 'partial'
            ELSE 'partial'
          END AS input_status,
          CASE WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_battery_stats_event_slices') THEN 'available' ELSE 'table_missing' END AS app_status,
          'available' AS system_status
      )
      SELECT 'device' AS lane, 0 AS segment_count, (SELECT duration_sec FROM lane_bounds) AS total_dur_sec, '-' AS dominant_state, (SELECT device_status FROM table_status) AS source_status
      UNION ALL
      SELECT 'input' AS lane, 0 AS segment_count, (SELECT duration_sec FROM lane_bounds) AS total_dur_sec, '-' AS dominant_state, (SELECT input_status FROM table_status) AS source_status
      UNION ALL
      SELECT 'app' AS lane, 0 AS segment_count, (SELECT duration_sec FROM lane_bounds) AS total_dur_sec, '-' AS dominant_state, (SELECT app_status FROM table_status) AS source_status
      UNION ALL
      SELECT 'system' AS lane, 0 AS segment_count, (SELECT duration_sec FROM lane_bounds) AS total_dur_sec, '-' AS dominant_state, (SELECT system_status FROM table_status) AS source_status

output:
  format: layered
  default_expanded: [device_state_lane, device_state_lane_fallback, input_state_lane_frames, input_state_lane_fallback, app_state_lane, app_state_lane_fallback, system_state_lane]
