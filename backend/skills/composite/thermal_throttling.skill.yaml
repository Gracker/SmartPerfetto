# =============================================================================
# Thermal Throttling Analysis v3.0 (Composite Skill)
# =============================================================================
# 系统级分析：温度监控、热节流检测、CPU 频率相关性
#
# 核心表：
# - counter: 系统计数器 (温度传感器、频率)
# - counter_track: 计数器轨道元数据
# - cpu_counter_track: CPU 频率轨道
#
# 分析维度：
# - L0: 温度数据存在性检查
# - L1: 温度概览 (zone/传感器温度统计)
# - L1: CPU 频率与温度关联
# - L2: 温度事件时间线
# - L2: 节流检测 (频率下降与温度上升关联)
# - 诊断: SQL 驱动根因分类
#
# 温度单位注意：
# - 部分设备上报 millidegrees (值 > 1000)，需归一化为摄氏度
# - 频率阈值使用相对值 (基于最大观测频率)，不硬编码绝对值
# =============================================================================

name: thermal_throttling
version: "3.0"
type: composite
tier: S

meta:
  display_name: "热节流分析"
  description: "分析系统温度、热节流对 CPU 频率和性能的影响"
  icon: "thermometer"
  tags: [thermal, throttling, temperature, cpu, frequency, system]

triggers:
  keywords:
    zh: [温度, 热节流, 降频, 发热, 过热, 散热, 温控]
    en: [thermal, throttling, temperature, frequency, overheat, cooling, heat]
  patterns:
    - ".*温度.*"
    - ".*[热發].*节流.*"
    - ".*[Tt]hermal.*"
    - ".*[Tt]hrottl.*"
    - ".*降频.*"
    - ".*过热.*"

prerequisites:
  required_tables:
    - counter
  modules: []

inputs:
  - name: package
    type: string
    required: false
    description: "应用包名（可选）"
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳（纳秒，可选）"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳（纳秒，可选）"
  - name: enable_expert_probes
    type: boolean
    required: false
    default: true
    description: "是否启用专家探针（热预测/GPU DVFS）"
  - name: thermal_predictor_high_drop_pct
    type: number
    required: false
    default: 30
    description: "热预测高风险的平均降频阈值（%）"
  - name: thermal_predictor_medium_drop_pct
    type: number
    required: false
    default: 15
    description: "热预测中风险的平均降频阈值（%）"
  - name: thermal_predictor_high_core_ratio_pct
    type: number
    required: false
    default: 50
    description: "热预测高风险的限频核心占比阈值（%）"
  - name: thermal_predictor_medium_core_ratio_pct
    type: number
    required: false
    default: 25
    description: "热预测中风险的限频核心占比阈值（%）"
  - name: thermal_predictor_core_drop_threshold_pct
    type: number
    required: false
    default: 30
    description: "判定单核心疑似限频的降频阈值（%）"
  - name: gpu_transition_threshold_pct
    type: number
    required: false
    default: 12
    description: "GPU 升降频判定阈值（%）"
  - name: gpu_downshift_warning_pct
    type: number
    required: false
    default: 25
    description: "GPU 降频占比告警阈值（%）"

steps:
  # ========== L0: 温度数据检查 ==========
  - id: data_check
    type: atomic
    name: "温度数据检测"
    display: false
    sql_fragments:
      - fragments/system_cpu_freq_limit_spans.sql
    sql: |
      SELECT
        CASE WHEN EXISTS (
          SELECT 1 FROM counter_track
          WHERE name LIKE '%thermal%'
             OR name LIKE '%temp%'
             OR name LIKE '%temperature%'
             OR name LIKE '%tsens%'
        ) THEN 1 ELSE 0 END as has_thermal_data,
        CASE WHEN EXISTS (
          SELECT 1 FROM cpu_counter_track WHERE name = 'cpufreq'
        ) THEN 1 ELSE 0 END as has_freq_data,
        CASE WHEN EXISTS (
          SELECT 1 FROM sqlite_master
          WHERE type IN ('table', 'view') AND name = 'android_gpu_frequency'
        ) THEN 1 ELSE 0 END as has_gpu_freq_data,
        -- Direct throttling evidence. A temperature counter correlating with a
        -- low frequency proves nothing; the limit track does the actual work.
        -- Limit evidence needs a VALID max-limit sample: a min-only capture or
        -- an empty/invalid-only max track is missing evidence, not "no limit".
        ds.has_max_limit_data,
        ds.limit_evidence_missing_reason
      FROM system_cpu_freq_limit_data_status ds
    save_as: data_check

  # ========== L0: 专家分析时间窗 ==========
  # 规则：
  # 1) 若用户传入 start_ts/end_ts，直接采用用户窗口
  # 2) 若未传入，则用 thermal/cpufreq/gpu 观测数据边界自动推断窗口
  - id: expert_analysis_window
    type: atomic
    name: "热分析窗口"
    display: false
    sql: |
      WITH observed AS (
        SELECT
          MIN(c.ts) as min_ts,
          MAX(c.ts) as max_ts
        FROM counter c
        LEFT JOIN counter_track ct ON c.track_id = ct.id
        LEFT JOIN cpu_counter_track cct ON c.track_id = cct.id
        WHERE (
            cct.name = 'cpufreq'
            OR ct.name LIKE '%thermal%'
            OR ct.name LIKE '%temp%'
            OR ct.name LIKE '%temperature%'
            OR ct.name LIKE '%tsens%'
            OR ct.name LIKE '%gpu%'
          )
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      )
      SELECT
        CASE
          WHEN COALESCE(${start_ts}, min_ts) IS NOT NULL
            THEN printf('%d', COALESCE(${start_ts}, min_ts))
          ELSE NULL
        END as window_start_ts,
        CASE
          WHEN COALESCE(${end_ts}, max_ts) IS NOT NULL
            THEN printf('%d', COALESCE(${end_ts}, max_ts))
          ELSE NULL
        END as window_end_ts,
        CASE
          WHEN COALESCE(${start_ts}, min_ts) IS NOT NULL
            AND COALESCE(${end_ts}, max_ts) IS NOT NULL
            THEN ROUND((COALESCE(${end_ts}, max_ts) - COALESCE(${start_ts}, min_ts)) / 1e6, 2)
          ELSE NULL
        END as window_ms,
        CASE
          WHEN ${start_ts} IS NOT NULL OR ${end_ts} IS NOT NULL THEN 'user_selected'
          WHEN min_ts IS NOT NULL AND max_ts IS NOT NULL THEN 'auto_observed_range'
          ELSE 'unavailable'
        END as window_source
      FROM observed
    save_as: analysis_window
    condition: "enable_expert_probes !== false && (data_check.data[0]?.has_thermal_data === 1 || data_check.data[0]?.has_freq_data === 1 || data_check.data[0]?.has_gpu_freq_data === 1)"
    optional: true

  # ========== L0: CPU 频率趋势（性能专家探针，不判定热机制） ==========
  - id: thermal_predictor_probe
    type: skill
    name: "CPU 频率趋势"
    skill: thermal_predictor
    params:
      start_ts: "${analysis_window.data?.[0]?.window_start_ts ?? start_ts ?? null}"
      end_ts: "${analysis_window.data?.[0]?.window_end_ts ?? end_ts ?? null}"
      high_drop_threshold_pct: "${thermal_predictor_high_drop_pct|30}"
      medium_drop_threshold_pct: "${thermal_predictor_medium_drop_pct|15}"
      high_core_ratio_threshold_pct: "${thermal_predictor_high_core_ratio_pct|50}"
      medium_core_ratio_threshold_pct: "${thermal_predictor_medium_core_ratio_pct|25}"
      core_drop_threshold_pct: "${thermal_predictor_core_drop_threshold_pct|30}"
    display:
      level: summary
      layer: overview
      title: "CPU 频率趋势（专家探针）"
      title_i18n:
        en: "CPU frequency trend (expert probe)"
      columns:
        - name: avg_start_freq_mhz
          label: "区间初段频率"
          type: number
        - name: avg_end_freq_mhz
          label: "区间末段频率"
          type: number
        - name: avg_drop_pct
          label: "平均降幅"
          type: percentage
          format: percentage
        - name: throttled_core_ratio_pct
          label: "频率变化核心占比"
          type: percentage
          format: percentage
        - name: frequency_trend_risk
          label: "频率变化信号"
          type: string
        - name: thermal_risk
          label: "热原因证据"
          type: string
        - name: prediction
          label: "预测"
          type: string
    save_as: thermal_prediction
    condition: "enable_expert_probes !== false && data_check.data[0]?.has_freq_data === 1 && analysis_window.data?.[0]?.window_start_ts != null && analysis_window.data?.[0]?.window_end_ts != null"
    optional: true

  # ========== L1: 直接限频证据（cpufreq policy limit + cooling device） ==========
  # Correlating a temperature counter with a low frequency cannot establish
  # throttling. The limit track says a cap was APPLIED; whether a kernel
  # cooling device applied it is decided once, by the shared verdict fragment
  # (a tightening limit write forward-paired with a cooling device tied to the
  # same policy). This step only selects the fragment's window summary: its
  # classification, `is_confirmed`, class note and per-class episode counts.
  # Full who/what/anomaly attribution lives in cpu_frequency_limit_attribution.
  - id: direct_limit_evidence
    type: atomic
    name: "直接限频证据"
    optional: true
    condition: "data_check.data?.[0]?.has_max_limit_data === 1"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_freq_limit_spans.sql
      - fragments/system_cpu_freq_limit_episodes.sql
      - fragments/thermal_cooling_spans.sql
      - fragments/thermal_cdev_policy_association.sql
      - fragments/thermal_signal_signatures.sql
      - fragments/system_cpu_freq_limit_episode_verdicts.sql
    display:
      level: summary
      layer: overview
      title: "直接限频证据（限频区段 x 关联散热设备）"
      columns:
        - {name: episode_count, label: "限频区段数", type: number}
        - {name: policy_count, label: "涉及 policy 数", type: number}
        - {name: deepest_depth_pct, label: "最大限频深度", type: percentage}
        - {name: longest_episode_ns, label: "最长区段", type: duration, unit: ns}
        - {name: cooling_confirmed_episodes, label: "由关联散热设备施加的区段", type: number}
        - {name: onset_unknown_episodes, label: "起点不可观测的区段", type: number}
        - {name: has_cdev_data, label: "采集到散热设备档位变化", type: boolean}
        - {name: freq_limit_classification, label: "限频触发分类", type: string}
        - {name: is_confirmed, label: "已核验由内核热控施加", type: boolean}
        - {name: onset_trigger_mix, label: "逐次限频写入分类", type: string}
        - {name: thermal_throttling_evidence, label: "热节流证据", type: string}
        - {name: class_note, label: "分类说明", type: string}
        - {name: next_step, label: "下一步", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "窗口内没有超过阈值的限频区段。"
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${start_ts}, (SELECT MIN(ts) FROM sched_slice), (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      )
      SELECT
        ws.episode_count,
        ws.policy_count,
        ws.deepest_depth_pct,
        ws.longest_episode_ns,
        ws.confirmed_episode_count AS cooling_confirmed_episodes,
        ws.onset_unknown_episode_count AS onset_unknown_episodes,
        ws.cooling_transition_coverage AS has_cdev_data,
        ws.freq_limit_classification,
        ws.is_confirmed,
        ws.onset_trigger_mix,
        CASE WHEN ws.is_confirmed = 1 THEN 'confirmed_by_cooling_device'
          ELSE 'limit_observed_cause_unverified' END AS thermal_throttling_evidence,
        ws.class_note,
        '用 cpu_frequency_limit_attribution 查看谁触发了限频、限频前的负载归因与异常线程' AS next_step,
        'observation_not_causal' AS evidence_scope
      FROM system_cpu_freq_limit_window_summary ws
      WHERE ws.window_id = 0
    save_as: direct_limit_evidence

  # ========== L1: 温度传感器概览 ==========
  - id: thermal_overview
    type: atomic
    name: "温度传感器概览"
    synthesize:
      role: overview
      fields:
        - key: sensor_name
          label: 传感器
        - key: max_temp_c
          label: 最高温度
          format: "{{value}} C"
        - key: avg_temp_c
          label: 平均温度
          format: "{{value}} C"
        - key: temp_severity
          label: 温度评级
      insights:
        - condition: "max_temp_c > 80"
          template: "传感器 {{sensor_name}} 峰值 {{max_temp_c}}C，需核对传感器位置和热阈值"
        - condition: "max_temp_c > 60 && max_temp_c <= 80"
          template: "传感器 {{sensor_name}} 峰值 {{max_temp_c}}C，温度偏高"
        - condition: "temp_range_c > 20"
          template: "传感器 {{sensor_name}} 温度波动 {{temp_range_c}}C，波动较大"
    display:
      level: summary
      layer: overview
      title: "温度传感器概览"
      columns:
        - name: sensor_name
          label: "传感器"
          type: string
        - name: sample_quality
          label: "样本质量"
          type: string
        - name: unit_basis
          label: "单位依据"
          type: string
        - name: sample_count
          label: "采样数"
          type: number
          format: compact
        - name: min_temp_c
          label: "最低温度"
          type: number
          format: compact
        - name: max_temp_c
          label: "最高温度"
          type: number
          format: compact
        - name: avg_temp_c
          label: "平均温度"
          type: number
          format: compact
        - name: temp_range_c
          label: "温度波动"
          type: number
          format: compact
        - name: temp_severity
          label: "评级"
          type: string
    sql_fragments: [fragments/thermal_sample_quality.sql]
    sql: |
      SELECT sensor_track_id, sensor_name, source_unit, unit_basis, sample_count,
        sample_quality, ROUND(raw_min_temp_c, 1) AS raw_min_temp_c,
        ROUND(raw_max_temp_c, 1) AS raw_max_temp_c,
        ROUND(CASE WHEN sample_quality = 'accepted' THEN raw_min_temp_c END, 1) AS min_temp_c,
        ROUND(CASE WHEN sample_quality = 'accepted' THEN raw_max_temp_c END, 1) AS max_temp_c,
        ROUND(CASE WHEN sample_quality = 'accepted' THEN raw_avg_temp_c END, 1) AS avg_temp_c,
        ROUND(CASE WHEN sample_quality = 'accepted' THEN raw_max_temp_c - raw_min_temp_c END, 1) AS temp_range_c,
        CASE WHEN sample_quality != 'accepted' THEN '温度数据可疑'
          WHEN raw_max_temp_c > 60 THEN '观测到高温，需结合传感器位置判断'
          ELSE '有效温度观测，不代表 CPU 结温' END AS temp_severity
      FROM thermal_track_stats ORDER BY max_temp_c DESC
    save_as: thermal_overview
    optional: true
    condition: "data_check.data[0]?.has_thermal_data === 1"

  # ========== L1: CPU 频率概览 (与温度关联) ==========
  - id: cpu_freq_overview
    type: atomic
    name: "CPU 频率概览"
    synthesize:
      role: overview
      fields:
        - key: cpu_id
          label: CPU 核心
        - key: min_freq_mhz
          label: 最低频率
          format: "{{value}} MHz"
        - key: max_freq_mhz
          label: 最高频率
          format: "{{value}} MHz"
        - key: throttle_ratio
          label: 观测频率跨度
      insights:
        - condition: "throttle_ratio > 50"
          template: "CPU{{cpu_id}} 频率下降超过最大频率 50%，仅说明 DVFS 频率变化，不能确定热节流"
        - condition: "throttle_ratio > 30"
          template: "CPU{{cpu_id}} 频率下降超过最大频率 30%，需结合负载和直接限频证据判断原因"
    display:
      level: summary
      layer: overview
      title: "CPU 频率与节流状态"
      columns:
        - name: cpu_id
          label: "CPU"
          type: number
        - name: min_freq_mhz
          label: "最低频率"
          type: number
          format: compact
        - name: max_freq_mhz
          label: "最高频率"
          type: number
          format: compact
        - name: avg_freq_mhz
          label: "平均频率"
          type: number
          format: compact
        - name: sample_count
          label: "采样数"
          type: number
          format: compact
        - name: throttle_ratio
          label: "观测频率跨度(%)"
          type: percentage
          format: percentage
        - name: throttling_status
          label: "状态"
          type: string
    sql: |
      SELECT
        cct.cpu as cpu_id,
        ROUND(MIN(c.value / 1000.0), 0) as min_freq_mhz,
        ROUND(MAX(c.value / 1000.0), 0) as max_freq_mhz,
        ROUND(AVG(c.value / 1000.0), 0) as avg_freq_mhz,
        COUNT(*) as sample_count,
        -- 相对节流比例：(max - min) / max * 100
        ROUND((MAX(c.value) - MIN(c.value)) * 100.0 / NULLIF(MAX(c.value), 0), 1) as throttle_ratio,
        CASE
          WHEN MIN(c.value) < MAX(c.value) * 0.3 THEN '大幅 DVFS 变化，原因未核验'
          WHEN MIN(c.value) < MAX(c.value) * 0.5 THEN 'DVFS 变化，原因未核验'
          WHEN MIN(c.value) < MAX(c.value) * 0.7 THEN 'DVFS 变化，原因未核验'
          ELSE '正常'
        END as throttling_status
      FROM counter c
      JOIN cpu_counter_track cct ON c.track_id = cct.id
      WHERE cct.name = 'cpufreq'
        AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
        AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      GROUP BY cct.cpu
      ORDER BY cpu_id
    save_as: cpu_freq_overview
    optional: true
    condition: "data_check.data[0]?.has_freq_data === 1"

  # ========== L1: GPU 功耗状态探针 (性能专家) ==========
  - id: gpu_power_probe
    type: skill
    name: "GPU DVFS 探针"
    skill: gpu_power_state_analysis
    params:
      start_ts: "${analysis_window.data?.[0]?.window_start_ts ?? start_ts ?? null}"
      end_ts: "${analysis_window.data?.[0]?.window_end_ts ?? end_ts ?? null}"
      transition_threshold_pct: "${gpu_transition_threshold_pct|12}"
    display:
      level: detail
      layer: list
      title: "GPU 功耗状态（专家探针）"
      columns:
        - name: gpu_id
          label: "GPU"
          type: number
        - name: samples
          label: "采样数"
          type: number
        - name: avg_freq_mhz
          label: "平均频率(MHz)"
          type: number
        - name: min_freq_mhz
          label: "最低频率(MHz)"
          type: number
        - name: max_freq_mhz
          label: "最高频率(MHz)"
          type: number
        - name: downshift_count
          label: "降频次数"
          type: number
        - name: downshift_ratio_pct
          label: "降频占比"
          type: percentage
          format: percentage
    save_as: gpu_power_probe
    condition: "enable_expert_probes !== false && data_check.data[0]?.has_gpu_freq_data === 1 && analysis_window.data?.[0]?.window_start_ts != null && analysis_window.data?.[0]?.window_end_ts != null"
    optional: true

  # ========== L2: 温度变化时间线 ==========
  - id: thermal_timeline
    type: atomic
    name: "温度变化时间线"
    display:
      level: detail
      layer: list
      title: "温度变化趋势"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          clickAction: navigate_timeline
        - name: sensor_name
          label: "传感器"
          type: string
        - name: temp_c
          label: "温度(C)"
          type: number
          format: compact
        - name: delta_c
          label: "变化(C)"
          type: number
          format: compact
        - name: severity
          label: "状态"
          type: string
    sql_fragments: [fragments/thermal_sample_quality.sql]
    sql: |
      WITH sampled AS (
        SELECT *, ROW_NUMBER() OVER (PARTITION BY sensor_track_id ORDER BY ts, id) AS rn,
          COUNT(*) OVER (PARTITION BY sensor_track_id) AS total_samples
        FROM thermal_valid_samples
      )
      SELECT printf('%d', ts) AS ts, sensor_track_id, sensor_name,
        ROUND(temp_c, 1) AS temp_c, ROUND(temp_c - COALESCE(prev_temp_c, temp_c), 1) AS delta_c,
        CASE WHEN temp_c > 60 THEN 'high_temperature_observed' ELSE 'temperature_observed' END AS severity
      FROM sampled
      WHERE rn % MAX(1, total_samples / 100) = 0 OR temp_c > 60
        OR ABS(temp_c - COALESCE(prev_temp_c, temp_c)) > 3
      ORDER BY ts LIMIT 200
    save_as: thermal_timeline
    optional: true
    condition: "data_check.data[0]?.has_thermal_data === 1"

  # ========== L2: 频率骤降事件 (节流检测) ==========
  - id: frequency_drop_events
    type: atomic
    name: "频率骤降事件"
    synthesize:
      role: list
      groupBy:
        - field: cpu_id
          title: 按 CPU 核心分布
      fields:
        - key: cpu_id
          label: CPU
        - key: drop_pct
          label: 降频幅度
          format: "{{value}}%"
        - key: prev_freq_mhz
          label: 降频前
          format: "{{value}} MHz"
    display:
      level: detail
      layer: list
      title: "CPU 频率骤降事件（需核对负载）"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          clickAction: navigate_timeline
        - name: cpu_id
          label: "CPU"
          type: number
        - name: prev_freq_mhz
          label: "降频前"
          type: number
          format: compact
        - name: new_freq_mhz
          label: "降频后"
          type: number
          format: compact
        - name: drop_pct
          label: "降幅(%)"
          type: percentage
          format: percentage
        - name: severity
          label: "严重程度"
          type: string
    sql: |
      WITH freq_with_max AS (
        SELECT
          cct.cpu as cpu_id,
          c.ts,
          c.value / 1000.0 as freq_mhz,
          LAG(c.value / 1000.0) OVER (PARTITION BY cct.cpu ORDER BY c.ts) as prev_freq_mhz,
          MAX(c.value / 1000.0) OVER (PARTITION BY cct.cpu) as cpu_max_freq_mhz
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        WHERE cct.name = 'cpufreq'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      )
      SELECT
        printf('%d', ts) as ts,
        cpu_id,
        ROUND(prev_freq_mhz, 0) as prev_freq_mhz,
        ROUND(freq_mhz, 0) as new_freq_mhz,
        ROUND((prev_freq_mhz - freq_mhz) * 100.0 / prev_freq_mhz, 1) as drop_pct,
        CASE
          WHEN freq_mhz < cpu_max_freq_mhz * 0.3 THEN 'large_frequency_change'
          WHEN freq_mhz < cpu_max_freq_mhz * 0.5 THEN 'frequency_change'
          ELSE 'notice'
        END as severity
      FROM freq_with_max
      WHERE prev_freq_mhz IS NOT NULL
        AND freq_mhz < prev_freq_mhz * 0.7  -- 30%+ 降频
      ORDER BY (prev_freq_mhz - freq_mhz) DESC
      LIMIT 30
    save_as: frequency_drops
    optional: true
    condition: "data_check.data[0]?.has_freq_data === 1"

  # ========== L2: 温度-频率相关性分析 ==========
  - id: thermal_freq_correlation
    type: atomic
    name: "温度-频率相关性"
    synthesize:
      role: list
      fields:
        - key: second
          label: 时间(秒)
        - key: max_temp_c
          label: 最高温度
          format: "{{value}} C"
        - key: avg_freq_mhz
          label: 平均频率
          format: "{{value}} MHz"
        - key: status
          label: 状态
      insights:
        - condition: "status === 'high_temperature_with_low_frequency'"
          template: "在 {{second}}s 检测到高温伴随低频，不能据此确定热节流"
    display:
      level: detail
      layer: list
      title: "温度与 CPU 频率关联（按秒聚合）"
      columns:
        - name: second
          label: "时间(s)"
          type: number
        - name: max_temp_c
          label: "最高温度(C)"
          type: number
          format: compact
        - name: avg_freq_mhz
          label: "平均频率(MHz)"
          type: number
          format: compact
        - name: freq_ratio_pct
          label: "频率利用率(%)"
          type: percentage
          format: percentage
        - name: status
          label: "状态"
          type: string
    sql_fragments: [fragments/thermal_sample_quality.sql]
    sql: |
      WITH
      time_range AS (
        SELECT MIN(ts) as base_ts FROM counter
      ),
      thermal_by_sec AS (
        SELECT CAST((ts - (SELECT base_ts FROM time_range)) / 1e9 AS INT) AS second,
          MAX(temp_c) AS max_temp_c
        FROM thermal_valid_samples GROUP BY second
      ),
      freq_by_sec AS (
        SELECT
          CAST((c.ts - (SELECT base_ts FROM time_range)) / 1e9 AS INT) as second,
          AVG(c.value / 1000.0) as avg_freq_mhz,
          MAX(c.value / 1000.0) as max_freq_mhz
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        WHERE cct.name = 'cpufreq'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
        GROUP BY CAST((c.ts - (SELECT base_ts FROM time_range)) / 1e9 AS INT)
      ),
      global_max_freq AS (
        SELECT MAX(c.value / 1000.0) as global_max_mhz
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        WHERE cct.name = 'cpufreq'
      )
      SELECT
        t.second,
        ROUND(t.max_temp_c, 1) as max_temp_c,
        ROUND(f.avg_freq_mhz, 0) as avg_freq_mhz,
        ROUND(f.avg_freq_mhz * 100.0 / NULLIF((SELECT global_max_mhz FROM global_max_freq), 0), 1) as freq_ratio_pct,
        CASE
          WHEN t.max_temp_c > 70 AND f.avg_freq_mhz < (SELECT global_max_mhz FROM global_max_freq) * 0.5
            THEN 'high_temperature_with_low_frequency'
          WHEN t.max_temp_c > 60 AND f.avg_freq_mhz < (SELECT global_max_mhz FROM global_max_freq) * 0.7
            THEN 'high_temperature_with_low_frequency'
          WHEN t.max_temp_c > 60 THEN 'high_temp'
          ELSE 'normal'
        END as status
      FROM thermal_by_sec t
      JOIN freq_by_sec f ON t.second = f.second
      ORDER BY t.second
      LIMIT 120
    save_as: thermal_freq_correlation
    optional: true
    condition: "data_check.data[0]?.has_thermal_data === 1 && data_check.data[0]?.has_freq_data === 1"

  # ========== L2: 高温时段识别 ==========
  - id: high_temp_periods
    type: atomic
    name: "高温时段"
    display:
      level: detail
      layer: list
      title: "高温持续时段"
      columns:
        - name: sensor_name
          label: "传感器"
          type: string
        - name: start_ts
          label: "开始"
          type: timestamp
          clickAction: navigate_timeline
        - name: end_ts
          label: "结束"
          type: timestamp
          clickAction: navigate_timeline
        - name: duration_sec
          label: "持续(秒)"
          type: number
          format: compact
        - name: peak_temp_c
          label: "峰值温度(C)"
          type: number
          format: compact
        - name: sample_count
          label: "采样数"
          type: number
          format: compact
    sql_fragments: [fragments/thermal_sample_quality.sql]
    sql: |
      WITH classified AS (
        SELECT *, SUM(CASE WHEN temp_c <= 60 OR prev_ts IS NULL OR ts - prev_ts > 5000000000
          THEN 1 ELSE 0 END) OVER (PARTITION BY sensor_track_id ORDER BY ts, id) AS period_id
        FROM thermal_valid_samples
      )
      SELECT sensor_track_id, sensor_name, printf('%d', MIN(ts)) AS start_ts,
        printf('%d', MAX(ts)) AS end_ts, ROUND((MAX(ts)-MIN(ts))/1e9, 2) AS duration_sec,
        ROUND(MAX(temp_c), 1) AS peak_temp_c, COUNT(*) AS sample_count
      FROM classified WHERE temp_c > 60 GROUP BY sensor_track_id, sensor_name, period_id
      HAVING COUNT(*) >= 5 AND MAX(ts)-MIN(ts) >= 3000000000
      ORDER BY peak_temp_c DESC
    save_as: high_temp_periods
    optional: true
    condition: "data_check.data[0]?.has_thermal_data === 1"

  # ========== 根因分类 (SQL-driven) ==========
  - id: root_cause_classification
    type: atomic
    name: "根因分类"
    synthesize:
      role: conclusion
      fields:
        - key: classification
          label: 分类
        - key: peak_temp_c
          label: 峰值温度
          format: "{{value}} C"
        - key: throttled_cpu_count
          label: 已核验热限频CPU数
      insights:
        - condition: "classification === 'DATA_SUSPECT'"
          template: "温度数据需复核，峰值 {{peak_temp_c}}C 仅来自通过质量筛选的传感器"
        - condition: "classification === 'HIGH_TEMP_OBSERVED'"
          template: "观测到高温 {{peak_temp_c}}C，热节流原因未核验"
    display:
      level: summary
      layer: overview
      title: "热节流根因分类"
      columns:
        - name: classification
          label: "分类"
          type: string
        - name: peak_temp_c
          label: "峰值温度(C)"
          type: number
          format: compact
        - name: throttled_cpu_count
          label: "已核验热限频CPU数"
          type: number
        - name: severe_drop_count
          label: "严重降频次数"
          type: number
          format: compact
        - name: thermal_throttling_evidence
          label: "热节流证据"
          type: string
        - name: limit_episode_count
          label: "限频区段数"
          type: number
        - name: next_step
          label: "下一步"
          type: string
        - name: description
          label: "描述"
          type: string
    sql_fragments: [fragments/thermal_sample_quality.sql]
    sql: |
      WITH
      -- The limit side comes from the shared verdict fragment through
      -- direct_limit_evidence: its window classification, `is_confirmed` and
      -- class note. No class is mapped or restated here.
      limit_facts AS (
        SELECT ${direct_limit_evidence.data[0].is_confirmed|0} AS is_confirmed,
          '${direct_limit_evidence.data[0].freq_limit_classification|}' AS freq_limit_classification,
          '${direct_limit_evidence.data[0].class_note|}' AS class_note,
          ${direct_limit_evidence.data[0].episode_count|0} AS episode_count
      ),
      thermal_peak AS (
        SELECT MAX(temp_c) AS peak_temp_c FROM thermal_valid_samples
      ),
      thermal_quality AS (
        SELECT COUNT(*) AS track_count,
          SUM(CASE WHEN sample_quality != 'accepted' THEN 1 ELSE 0 END) AS rejected_tracks,
          MAX(CASE WHEN sample_quality = 'accepted' THEN raw_max_temp_c END)
          - MIN(CASE WHEN sample_quality = 'accepted' THEN raw_max_temp_c END) AS sensor_spread_c
        FROM thermal_track_stats
      ),
      cpu_freq_stats AS (
        SELECT
          cct.cpu as cpu_id,
          MIN(c.value / 1000.0) as min_freq_mhz,
          MAX(c.value / 1000.0) as max_freq_mhz
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        WHERE cct.name = 'cpufreq'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
        GROUP BY cct.cpu
      ),
      throttled_cpus AS (
        SELECT COUNT(*) as cnt
        FROM cpu_freq_stats
        WHERE min_freq_mhz < max_freq_mhz * 0.5
      ),
      freq_drops AS (
        SELECT COUNT(*) as cnt
        FROM (
          SELECT
            cct.cpu,
            c.value / 1000.0 as freq_mhz,
            LAG(c.value / 1000.0) OVER (PARTITION BY cct.cpu ORDER BY c.ts) as prev_freq
          FROM counter c
          JOIN cpu_counter_track cct ON c.track_id = cct.id
          WHERE cct.name = 'cpufreq'
            AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
            AND (${end_ts} IS NULL OR c.ts < ${end_ts})
        ) sub
        WHERE prev_freq IS NOT NULL AND freq_mhz < prev_freq * 0.7
      )
      SELECT
        -- A confirmed limit class comes only from the shared verdict fragment
        -- (a limit write applied by a tied cooling device). Temperature alone
        -- never reaches this branch.
        CASE WHEN (SELECT is_confirmed FROM limit_facts) = 1
            THEN (SELECT freq_limit_classification FROM limit_facts)
          WHEN (SELECT rejected_tracks FROM thermal_quality) > 0
            OR (SELECT sensor_spread_c FROM thermal_quality) > 30 THEN 'DATA_SUSPECT'
          WHEN (SELECT peak_temp_c FROM thermal_peak) IS NULL THEN 'THERMAL_DATA_UNAVAILABLE'
          WHEN (SELECT peak_temp_c FROM thermal_peak) > 60 THEN 'HIGH_TEMP_OBSERVED'
          WHEN (SELECT cnt FROM freq_drops) > 10 THEN 'FREQ_INSTABILITY'
          ELSE 'THERMAL_NORMAL' END AS classification,
        ROUND((SELECT peak_temp_c FROM thermal_peak), 1) AS peak_temp_c,
        NULL AS throttled_cpu_count,
        (SELECT cnt FROM throttled_cpus) AS frequency_variation_cpu_count,
        (SELECT cnt FROM freq_drops) AS severe_drop_count,
        (SELECT rejected_tracks FROM thermal_quality) AS rejected_temperature_tracks,
        ROUND((SELECT sensor_spread_c FROM thermal_quality), 1) AS sensor_spread_c,
        CASE WHEN (SELECT is_confirmed FROM limit_facts) = 1
            THEN 'confirmed_by_cooling_device'
          WHEN (SELECT episode_count FROM limit_facts) > 0
            THEN 'limit_observed_cause_unverified'
          ELSE 'not_established' END AS thermal_throttling_evidence,
        (SELECT episode_count FROM limit_facts) AS limit_episode_count,
        '用 cpu_frequency_limit_attribution 查看谁触发了限频、限频前的负载归因与异常线程' AS next_step,
        CASE WHEN (SELECT is_confirmed FROM limit_facts) = 1
          THEN (SELECT class_note FROM limit_facts)
          WHEN (SELECT rejected_tracks FROM thermal_quality) > 0
          THEN '温度数据可疑：已排除低质量轨道；峰值仅代表有效传感器，不代表 CPU 结温。'
          WHEN (SELECT sensor_spread_c FROM thermal_quality) > 30
          THEN '传感器温差较大：皮肤和结温不可直接比较，需核对位置、单位及时间覆盖。'
          WHEN (SELECT peak_temp_c FROM thermal_peak) IS NULL THEN '温度数据不可用，不能判断热状态。'
          WHEN (SELECT peak_temp_c FROM thermal_peak) > 60 THEN '有效传感器观测到高温，不代表持续高温或热节流。'
          ELSE '有效传感器未见高温；频率变化可由负载或空闲 DVFS 引起，不能据此确定热节流。'
        END AS description
    save_as: root_cause
    condition: "data_check.data[0]?.has_thermal_data === 1 || data_check.data[0]?.has_freq_data === 1"

  # ========== 诊断 ==========
  - id: thermal_diagnosis
    type: diagnostic
    name: "热节流诊断"
    synthesize:
      role: conclusion
      fields:
        - key: diagnosis
          label: 诊断结论
        - key: severity
          label: 严重程度
        - key: confidence
          label: 置信度
      insights:
        - template: "热节流诊断：{{diagnosis}}"
    display:
      level: key
      layer: overview
      title: "问题诊断"
    inputs: [thermal_overview, cpu_freq_overview, thermal_prediction, gpu_power_probe, frequency_drops, high_temp_periods, direct_limit_evidence, root_cause]
    rules:
      - condition: "root_cause.data[0]?.classification === 'THERMAL_LIMIT_CONFIRMED'"
        severity: warning
        diagnosis: "已核验热限频：${direct_limit_evidence.data[0].cooling_confirmed_episodes} 段限频区段中有限频写入紧跟在与该 policy 时序关联的内核散热设备升档之后（最大深度 ${direct_limit_evidence.data[0].deepest_depth_pct}%；逐次写入分类 ${direct_limit_evidence.data[0].onset_trigger_mix}）"
        confidence: high
        suggestions:
          - "用 cpu_frequency_limit_attribution 查看谁触发了限频、限频前的负载归因与异常线程"
          - "散热设备与 policy 的对应关系来自档位变更与上限变更的时序配对，不来自设备名；核对触发它的热区阈值"
      - condition: "root_cause.data[0]?.thermal_throttling_evidence === 'limit_observed_cause_unverified'"
        severity: info
        diagnosis: "观测到 ${direct_limit_evidence.data[0].episode_count} 段限频区段，但没有一次限频写入由关联散热设备施加（分类 ${direct_limit_evidence.data[0].freq_limit_classification}）；限频原因未核验"
        confidence: medium
        suggestions:
          - "用 cpu_frequency_limit_attribution 判断是用户态温控守护进程、非热策略限频，还是采集缺少 thermal/cdev_update"
      - condition: "root_cause.data[0]?.classification === 'DATA_SUSPECT'"
        severity: warning
        diagnosis: "温度数据可疑或传感器不可直接比较；峰值仅来自通过质量筛选的轨道，不能确定热节流"
        confidence: low
        suggestions:
          - "检查各轨道 sample_quality、unit_basis 和传感器位置，勿将皮肤温度视为 CPU 结温"
      - condition: "root_cause.data[0]?.classification === 'THERMAL_DATA_UNAVAILABLE'"
        severity: info
        diagnosis: "没有足够可靠的温度数据，热状态不可判定"
        confidence: low
      - condition: "root_cause.data[0]?.classification === 'HIGH_TEMP_OBSERVED'"
        severity: warning
        diagnosis: "观测到高温 ${root_cause.data[0].peak_temp_c}C；需要持续时间和直接限频证据才能判断热节流"
        confidence: medium
      - condition: "root_cause.data[0]?.classification === 'FREQ_INSTABILITY'"
        severity: info
        diagnosis: "观测到 ${root_cause.data[0].severe_drop_count} 次频率下降，负载或空闲 DVFS 均可解释，热原因未核验"
        confidence: medium
      - condition: "root_cause.data[0]?.classification === 'THERMAL_NORMAL'"
        severity: info
        diagnosis: "有效传感器未见高温；不代表所有 CPU 结温均可观测"
        confidence: medium

  # ========== 无数据回退 ==========
  - id: no_data_fallback
    type: atomic
    name: "无温度数据"
    display:
      level: summary
      layer: overview
      title: "温度数据不可用"
      columns:
        - name: message
          label: "说明"
          type: string
    sql: |
      SELECT '未检测到温度传感器数据。可能原因：Trace 未包含 thermal/temperature counter，或设备不支持温度上报。建议：确保 Trace 包含 ftrace thermal 事件。' as message
    save_as: no_data_fallback
    condition: "data_check.data[0]?.has_thermal_data !== 1 && data_check.data[0]?.has_freq_data !== 1 && data_check.data[0]?.has_gpu_freq_data !== 1"

output:
  format: layered
  default_expanded: [direct_limit_evidence, thermal_overview, cpu_freq_overview, root_cause_classification]