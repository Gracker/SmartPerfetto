name: gpu_analysis
version: "3.0"
type: composite
tier: S

meta:
  display_name: "GPU 分析"
  description: "分析 GPU 频率分布、内存使用和帧渲染关联，识别 GPU 瓶颈"
  icon: "memory"
  tags: [gpu, rendering, frequency, memory, composite]

triggers:
  keywords:
    zh: [GPU, 显卡, 图形, GPU频率, GPU内存, 显存, GPU负载, GPU瓶颈]
    en: [gpu, graphics, gpu frequency, gpu memory, gpu load, gpu bound, mali, adreno]
  patterns:
    - ".*[Gg][Pp][Uu].*"
    - ".*显卡.*"
    - ".*图形.*性能.*"

prerequisites:
  modules:
    - android.gpu.memory

inputs:
  - name: package
    type: string
    required: false
    description: "应用包名（可选，不填则分析全局 GPU 状态）"
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳（纳秒，可选）"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳（纳秒，可选）"
  - name: high_freq_threshold_pct
    type: number
    required: false
    default: 70
    description: "GPU 高负载判定阈值（最高频占比百分比）"
  - name: mid_freq_threshold_pct
    type: number
    required: false
    default: 40
    description: "GPU 中负载判定阈值（最高频占比百分比）"
  - name: low_freq_threshold_pct
    type: number
    required: false
    default: 10
    description: "GPU 低负载判定阈值（最高频占比百分比）"
  - name: freq_drop_ratio
    type: number
    required: false
    default: 0.7
    description: "频率突降检测比例（低于上次频率的该比例视为突降）"
  - name: freq_drop_count_threshold
    type: number
    required: false
    default: 20
    description: "频率突降次数阈值（超过该值判定为限频）"
  - name: high_load_min_dur_ns
    type: number
    required: false
    default: 500000000
    description: "高负载时段最小持续时间阈值（纳秒，默认500ms）"

steps:
  # ==========================================================================
  # L0: 数据源检测 - GPU counter track 是否可用
  # ==========================================================================
  - id: data_check
    type: atomic
    name: "GPU 数据源检测"
    display: false
    sql_fragments:
      - fragments/gpu_frequency_intervals.sql
    sql: |
      SELECT
        CASE WHEN EXISTS (SELECT 1 FROM gpu_frequency_samples) THEN 1 ELSE 0 END as has_gpu_freq,
        CASE
          WHEN EXISTS (
            SELECT 1 FROM sqlite_master
            WHERE type IN ('table', 'view') AND name = 'android_gpu_memory_per_process'
          ) THEN 1
          ELSE 0
        END as has_gpu_memory,
        CASE
          WHEN EXISTS (
            SELECT 1 FROM sqlite_master
            WHERE type IN ('table', 'view') AND name = 'actual_frame_timeline_slice'
          ) THEN 1
          ELSE 0
        END as has_frame_timeline,
        CASE WHEN EXISTS (SELECT 1 FROM gpu_frequency_samples WHERE unit_basis != 'out_of_domain') THEN 1 ELSE 0 END as has_gpu_data
    save_as: data_check

  # ==========================================================================
  # L1: GPU 频率概览 - 加权平均频率、最高频占比、频率档位数
  # ==========================================================================
  - id: gpu_freq_overview
    type: atomic
    name: "GPU 频率概览"
    optional: true
    synthesize:
      role: overview
      fields:
        - key: weighted_avg_freq_mhz
          label: 运行时加权平均频率
          format: "{{value}} MHz"
        - key: max_freq_time_pct
          label: 最高频占比
          format: "{{value}}%"
        - key: total_time_sec
          label: 总采样时间
          format: "{{value}} s"
      insights:
        - condition: "max_freq_time_pct > 70"
          template: "GPU 在最高频率运行 {{max_freq_time_pct}}%，可能存在 GPU 瓶颈"
        - condition: "off_pct >= 50"
          template: "GPU 在 {{off_pct}}% 的观测时间里处于关闭状态，负载较轻"
        - condition: "max_freq_time_pct < 10 && off_pct < 50"
          template: "GPU 运行时大部分低于最高频，负载较轻"
        - condition: "freq_change_count > 500"
          template: "GPU 频率变化 {{freq_change_count}} 次，调频活跃"
    display:
      level: summary
      layer: overview
      title: "GPU 频率概览"
      columns:
        - name: gpu_id
          label: "GPU ID"
          type: number
        - name: weighted_avg_freq_mhz
          label: "运行时加权平均频率"
          type: number
          format: compact
        - name: max_freq_mhz
          label: "最高频率"
          type: number
          format: compact
        - name: min_freq_mhz
          label: "最低频率"
          type: number
          format: compact
        - name: max_freq_time_pct
          label: "最高频占比"
          type: percentage
          format: percentage
        - name: freq_levels
          label: "频率档位数"
          type: number
        - name: freq_change_count
          label: "变频次数"
          type: number
          format: compact
        - name: off_pct
          label: "GPU 关闭占比"
          type: percentage
          format: percentage
        - name: total_time_sec
          label: "采样时间"
          type: number
        - name: rating
          label: "评级"
          type: string
    sql_fragments:
      - fragments/gpu_frequency_intervals.sql
      - fragments/gpu_frequency_window.sql
      - fragments/gpu_frequency_summary.sql
    sql: |
      -- MHz from fragments/gpu_frequency_intervals.sql. Average and range are of
      -- the time the GPU ran; max_freq_time_pct and off_pct are of all observed
      -- time, so time powered off counts as not at the top frequency.
      WITH overview AS (
        SELECT
          s.*,
          100.0 * COALESCE((
            SELECT SUM(w.dur) FROM gpu_frequency_window w
            WHERE w.gpu_id = s.gpu_id AND w.running_mhz = s.max_running_mhz
          ), 0) / NULLIF(s.observed_ns, 0) AS top_pct
        FROM gpu_frequency_summary s
      )
      SELECT
        gpu_id,
        ROUND(avg_running_mhz, 0) as weighted_avg_freq_mhz,
        ROUND(max_running_mhz, 0) as max_freq_mhz,
        ROUND(min_running_mhz, 0) as min_freq_mhz,
        ROUND(top_pct, 1) as max_freq_time_pct,
        running_levels as freq_levels,
        running_change_count as freq_change_count,
        ROUND(100.0 * off_ns / NULLIF(observed_ns, 0), 1) as off_pct,
        ROUND(observed_ns / 1e9, 2) as total_time_sec,
        CASE
          WHEN top_pct > ${high_freq_threshold_pct|70} THEN '高负载'
          WHEN top_pct > ${mid_freq_threshold_pct|40} THEN '中负载'
          WHEN top_pct > ${low_freq_threshold_pct|10} THEN '低负载'
          ELSE '空闲'
        END as rating
      FROM overview
      ORDER BY gpu_id
    save_as: gpu_freq_overview
    condition: "data_check.data[0]?.has_gpu_data === 1"

  # ==========================================================================
  # L1: GPU 内存概览 (可选 - 部分 trace 无 GPU 内存数据)
  # ==========================================================================
  - id: gpu_memory_overview
    type: atomic
    name: "GPU 内存概览"
    optional: true
    synthesize:
      role: overview
      fields:
        - key: total_max_mb
          label: 全局 GPU 内存峰值
          format: "{{value}} MB"
        - key: process_count
          label: 使用 GPU 内存的进程数
    display:
      level: summary
      layer: overview
      title: "GPU 内存概览"
      columns:
        - name: process_name
          label: "进程"
          type: string
        - name: max_gpu_memory_mb
          label: "峰值内存"
          type: bytes
          format: compact
        - name: avg_gpu_memory_mb
          label: "平均内存"
          type: bytes
          format: compact
        - name: min_gpu_memory_mb
          label: "最小内存"
          type: bytes
          format: compact
        - name: memory_change_mb
          label: "内存变化"
          type: number
    sql: |
      SELECT
        p.name as process_name,
        ROUND(MAX(gm.gpu_memory) / 1024.0 / 1024.0, 2) as max_gpu_memory_mb,
        ROUND(AVG(gm.gpu_memory) / 1024.0 / 1024.0, 2) as avg_gpu_memory_mb,
        ROUND(MIN(gm.gpu_memory) / 1024.0 / 1024.0, 2) as min_gpu_memory_mb,
        ROUND((MAX(gm.gpu_memory) - MIN(gm.gpu_memory)) / 1024.0 / 1024.0, 2) as memory_change_mb
      FROM android_gpu_memory_per_process gm
      JOIN process p ON gm.upid = p.upid
      WHERE (('${package}' = '' OR p.name = '${package}' OR p.name GLOB '${package}:*') OR '${package}' = '')
        AND (${start_ts} IS NULL OR gm.ts >= ${start_ts})
        AND (${end_ts} IS NULL OR gm.ts < ${end_ts})
      GROUP BY p.name
      ORDER BY max_gpu_memory_mb DESC
      LIMIT 15
    save_as: gpu_memory_overview
    condition: "data_check.data[0]?.has_gpu_memory === 1"

  # ==========================================================================
  # L2: GPU 频率档位分布详情
  # ==========================================================================
  - id: gpu_freq_distribution
    type: atomic
    name: "GPU 频率档位分布"
    optional: true
    display:
      level: detail
      layer: list
      title: "GPU 频率档位分布"
      columns:
        - name: gpu_id
          label: "GPU"
          type: number
        - name: state
          label: "状态"
          type: string
        - name: gpu_freq_mhz
          label: "频率 (MHz)"
          type: number
          format: compact
        - name: total_time_sec
          label: "持续时间"
          type: number
        - name: time_pct
          label: "时间占比"
          type: percentage
          format: percentage
        - name: is_max_freq
          label: "是否最高频"
          type: string
    sql_fragments:
      - fragments/gpu_frequency_intervals.sql
      - fragments/gpu_frequency_window.sql
      - fragments/gpu_frequency_summary.sql
    sql: |
      -- One row per running frequency of each GPU, plus one for time powered off
      -- and one for samples whose value is no GPU clock; time_pct is of all
      -- observed time of that GPU.
      WITH levels AS (
        SELECT
          gpu_id,
          CASE WHEN is_off THEN 'off' WHEN freq_mhz IS NULL THEN 'out_of_domain' ELSE 'running' END as state,
          freq_mhz,
          SUM(dur) as dur
        FROM gpu_frequency_window
        GROUP BY gpu_id, state, freq_mhz
      )
      SELECT
        l.gpu_id,
        CASE l.state WHEN 'running' THEN '运行' WHEN 'off' THEN 'GPU 关闭' ELSE '频率不可读' END as state,
        ROUND(l.freq_mhz, 0) as gpu_freq_mhz,
        ROUND(l.dur / 1e9, 3) as total_time_sec,
        ROUND(100.0 * l.dur / NULLIF(s.observed_ns, 0), 2) as time_pct,
        CASE WHEN l.freq_mhz = s.max_running_mhz THEN '是' ELSE '' END as is_max_freq
      FROM levels l
      JOIN gpu_frequency_summary s USING (gpu_id)
      ORDER BY l.gpu_id, l.state DESC, l.freq_mhz DESC
    save_as: gpu_freq_distribution
    condition: "data_check.data[0]?.has_gpu_data === 1"

  # ==========================================================================
  # L2: GPU-帧渲染关联分析
  # ==========================================================================
  - id: gpu_frame_correlation
    type: atomic
    name: "GPU-帧渲染关联"
    optional: true
    display:
      level: detail
      layer: list
      title: "GPU 频率与帧渲染关联"
      columns:
        - name: jank_type
          label: "帧类型"
          type: string
        - name: frame_count
          label: "帧数"
          type: number
          format: compact
        - name: frames_with_running_freq
          label: "有运行频率的帧"
          type: number
          format: compact
        - name: avg_gpu_freq_mhz
          label: "帧内平均运行频率"
          type: number
          format: compact
        - name: avg_frame_dur_ms
          label: "平均帧耗时"
          type: duration
          format: duration_ms
          unit: ms
        - name: max_frame_dur_ms
          label: "最大帧耗时"
          type: duration
          format: duration_ms
          unit: ms
        - name: gpu_freq_range
          label: "频率范围"
          type: string
        - name: gpu_id
          label: "GPU"
          type: number
    sql_fragments:
      - fragments/gpu_frequency_intervals.sql
    sql: |
      -- Each frame against the lowest-numbered GPU: the running frequency
      -- weighted by time inside the frame, leaving out time the GPU was off.
      -- A GPU often powers up after a frame starts, so a frame whose interval
      -- holds no running time is counted, not dropped, and has no frequency.
      WITH
      gpu AS MATERIALIZED (
        SELECT ts, dur, freq_mhz, gpu_id
        FROM gpu_frequency_intervals
        WHERE freq_mhz > 0
          AND gpu_id = (SELECT MIN(gpu_id) FROM gpu_frequency_intervals)
      ),
      frames AS (
        SELECT f.id, f.ts, f.dur, COALESCE(f.jank_type, 'None') as jank_type
        FROM actual_frame_timeline_slice f
        LEFT JOIN process p ON f.upid = p.upid
        WHERE f.dur > 0
          AND ('${package}' = '' OR p.name = '${package}' OR p.name GLOB '${package}:*')
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR f.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR f.ts < ${end_ts})
          AND COALESCE(f.display_frame_token, f.surface_frame_token) IS NOT NULL
      ),
      frame_gpu AS (
        SELECT
          f.id,
          f.dur,
          f.jank_type,
          SUM(g.freq_mhz * (MIN(g.ts + g.dur, f.ts + f.dur) - MAX(g.ts, f.ts)))
            / NULLIF(SUM(MIN(g.ts + g.dur, f.ts + f.dur) - MAX(g.ts, f.ts)), 0) as gpu_freq_mhz
        FROM frames f
        LEFT JOIN gpu g ON g.ts < f.ts + f.dur AND g.ts + g.dur > f.ts
        GROUP BY f.id
      )
      SELECT
        jank_type,
        COUNT(*) as frame_count,
        COUNT(gpu_freq_mhz) as frames_with_running_freq,
        ROUND(AVG(gpu_freq_mhz), 0) as avg_gpu_freq_mhz,
        ROUND(AVG(dur) / 1e6, 2) as avg_frame_dur_ms,
        ROUND(MAX(dur) / 1e6, 2) as max_frame_dur_ms,
        ROUND(MIN(gpu_freq_mhz), 0) || ' - ' || ROUND(MAX(gpu_freq_mhz), 0) || ' MHz' as gpu_freq_range,
        (SELECT MIN(gpu_id) FROM gpu) as gpu_id
      FROM frame_gpu
      GROUP BY jank_type
      ORDER BY frame_count DESC
      LIMIT 10
    save_as: gpu_frame_correlation
    condition: "data_check.data[0]?.has_gpu_data === 1 && data_check.data[0]?.has_frame_timeline === 1"

  # ==========================================================================
  # L2: GPU 高负载时段识别
  # ==========================================================================
  - id: gpu_high_load_periods
    type: atomic
    name: "GPU 高负载时段"
    optional: true
    display:
      level: detail
      layer: list
      title: "GPU 高负载时段"
      columns:
        - name: gpu_id
          label: "GPU"
          type: number
        - name: start_ts
          label: "开始时间"
          type: timestamp
          clickAction: navigate_range
          durationColumn: duration_ns
        - name: high_freq_dur_ms
          label: "高频持续时间"
          type: duration
          format: duration_ms
          unit: ms
        - name: segment_count
          label: "段数"
          type: number
        - name: duration_ns
          label: "持续时间"
          type: duration
          format: duration_ms
          unit: ns
          hidden: true
    sql_fragments:
      - fragments/gpu_frequency_intervals.sql
      - fragments/gpu_frequency_window.sql
      - fragments/gpu_frequency_summary.sql
    sql: |
      -- Running at 90% of the top running frequency or above, per second.
      WITH high_freq_periods AS (
        SELECT
          w.gpu_id,
          w.ts,
          w.dur,
          CAST(w.ts / 1000000000 AS INTEGER) as time_bucket
        FROM gpu_frequency_window w
        JOIN gpu_frequency_summary s USING (gpu_id)
        WHERE w.running_mhz >= s.max_running_mhz * 0.9
      )
      SELECT
        gpu_id,
        printf('%d', MIN(ts)) as start_ts,
        ROUND(SUM(dur) / 1e6, 1) as high_freq_dur_ms,
        COUNT(*) as segment_count,
        printf('%d', MAX(ts + dur) - MIN(ts)) as duration_ns
      FROM high_freq_periods
      GROUP BY gpu_id, time_bucket
      HAVING SUM(dur) > ${high_load_min_dur_ns|500000000}  -- > 500ms of high freq per second bucket
      ORDER BY MIN(ts)
      LIMIT 20
    save_as: gpu_high_load
    condition: "data_check.data[0]?.has_gpu_data === 1"

  # ==========================================================================
  # Root Cause: GPU 问题根因分类
  # ==========================================================================
  - id: root_cause_classification
    type: atomic
    name: "GPU 根因分类"
    optional: true
    synthesize:
      role: conclusion
      fields:
        - key: gpu_category
          label: GPU 状态
        - key: confidence
          label: 置信度
          format: "{{value}}%"
      insights:
        - template: "GPU 诊断：{{gpu_category}} - {{root_cause_summary}}"
    display:
      level: summary
      layer: overview
      title: "GPU 分析结论"
      columns:
        - name: gpu_category
          label: "GPU 状态"
          type: enum
        - name: confidence
          label: "置信度"
          type: percentage
          format: percentage
        - name: root_cause_summary
          label: "根因总结"
          type: string
        - name: evidence
          label: "关键证据"
          type: string
        - name: suggestion
          label: "优化建议"
          type: string
    sql_fragments:
      - fragments/gpu_frequency_intervals.sql
      - fragments/gpu_frequency_window.sql
      - fragments/gpu_frequency_summary.sql
    sql: |
      WITH
      -- Per GPU, as shares of all observed time: at the top running
      -- frequency, at 90% of it or above, running at 30% of it or below, and
      -- powered off. An off GPU is idle, not slow, so GPU_IDLE reads low
      -- running time and off time together and the evidence names each.
      per_gpu AS (
        SELECT
          w.gpu_id,
          ROUND(100.0 * SUM(CASE WHEN w.running_mhz = s.max_running_mhz THEN w.dur ELSE 0 END) / NULLIF(s.observed_ns, 0), 1) as max_freq_pct,
          ROUND(100.0 * SUM(CASE WHEN w.running_mhz >= s.max_running_mhz * 0.9 THEN w.dur ELSE 0 END) / NULLIF(s.observed_ns, 0), 1) as high_freq_pct,
          ROUND(100.0 * SUM(CASE WHEN w.running_mhz <= s.max_running_mhz * 0.3 THEN w.dur ELSE 0 END) / NULLIF(s.observed_ns, 0), 1) as low_running_pct,
          ROUND(100.0 * s.off_ns / NULLIF(s.observed_ns, 0), 1) as off_pct,
          -- A drop of more than 30% between two running frequencies.
          SUM(w.is_running_change AND w.running_mhz < w.prev_freq_mhz * ${freq_drop_ratio|0.7}) as drop_count
        FROM gpu_frequency_window w
        JOIN gpu_frequency_summary s USING (gpu_id)
        GROUP BY w.gpu_id
      ),
      -- The most loaded GPU decides.
      busiest_gpu AS (
        SELECT * FROM per_gpu ORDER BY high_freq_pct DESC, gpu_id LIMIT 1
      ),
      frame_stats AS (
        SELECT
          COUNT(*) as total_frames,
          SUM(CASE WHEN jank_type GLOB '*GPU*' THEN 1 ELSE 0 END) as gpu_jank_frames
        FROM actual_frame_timeline_slice
        WHERE dur > 0
          AND (${start_ts} IS NULL OR ts >= ${start_ts})
          AND (${end_ts} IS NULL OR ts < ${end_ts})
      ),
      analysis AS (
        SELECT
          COALESCE((SELECT max_freq_pct FROM busiest_gpu), 0) as max_freq_pct,
          COALESCE((SELECT high_freq_pct FROM busiest_gpu), 0) as high_freq_pct,
          COALESCE((SELECT low_running_pct FROM busiest_gpu), 0) as low_running_pct,
          COALESCE((SELECT off_pct FROM busiest_gpu), 0) as off_pct,
          COALESCE((SELECT drop_count FROM busiest_gpu), 0) as freq_drop_count,
          COALESCE((SELECT gpu_jank_frames FROM frame_stats), 0) as gpu_jank_frames,
          COALESCE((SELECT total_frames FROM frame_stats), 0) as total_frames
      ),
      -- One classification; every column below follows it, so they cannot drift apart.
      verdict AS (
        SELECT a.*,
          CASE
            WHEN high_freq_pct > ${high_freq_threshold_pct|70} THEN 'GPU_BOUND'
            WHEN freq_drop_count > ${freq_drop_count_threshold|20} AND high_freq_pct > 30 THEN 'GPU_FREQ_DROPS'
            WHEN low_running_pct + off_pct > ${high_freq_threshold_pct|70} THEN 'GPU_IDLE'
            WHEN gpu_jank_frames > 0 THEN 'GPU_JANK_RELATED'
            ELSE 'NORMAL'
          END AS gpu_category
        FROM analysis a
      )
      SELECT
        gpu_category,
        CASE gpu_category
          WHEN 'GPU_BOUND' THEN 0.9
          WHEN 'GPU_FREQ_DROPS' THEN 0.75
          WHEN 'GPU_IDLE' THEN 0.85
          WHEN 'GPU_JANK_RELATED' THEN 0.7
          ELSE 0.6
        END as confidence,
        CASE gpu_category
          WHEN 'GPU_BOUND' THEN
            'GPU 瓶颈: 高频区间 (>=90%最高频) 运行时间占 ' || high_freq_pct || '%，GPU 持续满载'
          WHEN 'GPU_FREQ_DROPS' THEN
            'GPU 频率突降: 检测到 ' || freq_drop_count || ' 次（仅为频率观测：可能来自负载变化、DVFS 调速或频率上限，本 Skill 未采集 GPU 频率上限证据，是否限频未判定）'
          WHEN 'GPU_IDLE' THEN
            'GPU 空闲: 低频运行占观测时间 ' || low_running_pct || '%、关闭占 ' || off_pct || '%，GPU 负载极低'
          WHEN 'GPU_JANK_RELATED' THEN
            'GPU 相关掉帧: 检测到 ' || gpu_jank_frames || ' 帧 GPU 相关 Jank'
          ELSE
            'GPU 状态正常，频率分布合理'
        END as root_cause_summary,
        '[' ||
          '"最高频占比: ' || max_freq_pct || '%",' ||
          '"高频区间占比: ' || high_freq_pct || '%",' ||
          '"低频运行占观测时间: ' || low_running_pct || '%",' ||
          '"GPU 关闭占比: ' || off_pct || '%",' ||
          '"频率突降次数: ' || freq_drop_count || '",' ||
          '"GPU 相关掉帧: ' || gpu_jank_frames || '"' ||
        ']' as evidence,
        CASE gpu_category
          WHEN 'GPU_BOUND' THEN '减少 GPU 负载：简化 shader、降低绘制复杂度、减少 overdraw'
          WHEN 'GPU_FREQ_DROPS' THEN '结合 GPU 负载与 DVFS 调速记录核对频率突降的原因；仅凭频率变化不能据此判定限频或温控'
          WHEN 'GPU_IDLE' THEN 'GPU 空闲，性能瓶颈不在 GPU 侧'
          WHEN 'GPU_JANK_RELATED' THEN '检查 GPU 渲染管线，优化 RenderThread 工作负载'
          ELSE '当前 GPU 运行状态良好，无需特别优化'
        END as suggestion
      FROM verdict
    save_as: conclusion
    condition: "data_check.data[0]?.has_gpu_data === 1"

  # ==========================================================================
  # Fallback: GPU 数据不可用
  # ==========================================================================
  - id: fallback_no_gpu_data
    type: atomic
    name: "GPU 数据不可用"
    condition: "data_check.data[0]?.has_gpu_data === 0"
    display:
      level: summary
      layer: overview
      title: "GPU 分析 - 数据缺失"
      columns:
        - name: status
          label: "状态"
          type: string
        - name: missing_data
          label: "缺失数据"
          type: string
        - name: suggestion
          label: "建议"
          type: string
    sql: |
      SELECT
        '无法执行 GPU 分析' as status,
        'gpufreq 计数器（GPU 频率数据）' as missing_data,
        '请确保 trace 采集时启用了 GPU 频率采集 (需要内核支持 gpu_frequency tracepoint)' as suggestion
      UNION ALL
      SELECT
        '可用替代方案' as status,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='gpu_counter_track') THEN 'gpu_counter_track (可用)'
          ELSE 'gpu_counter_track (不可用)'
        END as missing_data,
        '可尝试通过 gpu_counter_track 获取 GPU 频率和利用率数据' as suggestion
    save_as: fallback_info

output:
  format: layered
  default_expanded: [overview, list]
  conclusion:
    category: $conclusion.gpu_category
    confidence: $conclusion.confidence
    summary: $conclusion.root_cause_summary
    evidence: $conclusion.evidence
    suggestion: $conclusion.suggestion