name: selection_range_cpu_sched_summary
version: "1.0"
type: composite
category: kernel
tier: B

meta:
  display_name: "选区 CPU 调度与频率摘要"
  description: "面向用户选区/可见窗口的快速 CPU 摆核、Running 排名、四象限和频率分布分析"
  icon: "speed"
  tags: [selection, range, cpu, sched, frequency, quadrant, migration, quick]

triggers:
  keywords:
    zh: [选区, 这一段, 这段, 摆核, 核心摆放, 平均频率, 频率分布, Running 排名, 四象限]
    en: [selection range, current window, cpu placement, core placement, average frequency, frequency distribution, running ranking, quadrant]
  patterns:
    - ".*(选区|这段|这一段).*(CPU|摆核|核心|频率|Running|四象限).*"
    - ".*(selected|current).*(range|window).*(cpu|core|frequency|running|quadrant).*"

prerequisites:
  required_tables:
    - thread_state
    - thread
    - process
  modules:
    - linux.cpu.frequency


inputs:
  - name: start_ts
    type: timestamp
    required: true
    description: "选区起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "选区结束时间戳(ns)"
  - name: package
    type: string
    required: false
    description: "可选进程名过滤（精确匹配，含 name:* 子进程）"
  - name: thread_name
    type: string
    required: false
    description: "可选线程名包含匹配"
  - name: top_k
    type: number
    required: false
    description: "线程/进程排名返回数量"
  - name: freq_bucket_mhz
    type: number
    required: false
    description: "频率分布桶大小，单位 MHz"

steps:
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    params:
      start_ts: "${start_ts}"
      end_ts: "${end_ts}"
    display:
      level: hidden
    optional: true

  - id: running_thread_quadrants
    type: atomic
    name: "Running 线程四象限与摆核"
    optional: true
    display:
      level: key
      layer: overview
      title: "选区 Running 线程四象限"
      columns:
        - {name: window_id, label: "window_id", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: upid, label: "upid", type: number, hidden: true}
        - {name: utid, label: "utid", type: number, hidden: true}
        - {name: role, label: "role", type: string, hidden: true}
        - {name: state_covered_ns, label: "state_covered_ns", type: duration, unit: ns, hidden: true}
        - {name: total_observed_threads, label: "total_observed_threads", type: number, hidden: true}
        - {name: sampling_evidence, label: "sampling_evidence", type: string, hidden: true}
        - {name: unknown_running_ms, label: "unknown_running_ms", type: number, hidden: true}
        - {name: other_state_ms, label: "other_state_ms", type: number, hidden: true}
        - name: thread_name
          label: "线程"
          type: string
        - name: process_name
          label: "进程"
          type: string
        - name: tid
          label: "TID"
          type: number
        - name: total_cpu_ms
          label: "CPU 时间"
          type: duration
          format: duration_ms
          unit: ms
        - name: q1_perf_running_ms
          label: "Q1 性能核运行"
          type: duration
          format: duration_ms
          unit: ms
        - name: q2_little_running_ms
          label: "Q2 小核运行"
          type: duration
          format: duration_ms
          unit: ms
        - name: q3_runnable_ms
          label: "Q3 等待调度"
          type: duration
          format: duration_ms
          unit: ms
        - name: q4a_uninterruptible_ms
          label: "Q4a 不可中断等待"
          type: duration
          format: duration_ms
          unit: ms
        - name: q4b_sleeping_ms
          label: "Q4b 睡眠等待"
          type: duration
          format: duration_ms
          unit: ms
        - name: perf_core_pct
          label: "性能核占比"
          type: percentage
          format: percentage
        - name: running_cpus
          label: "运行 CPU"
          type: string
        - name: running_core_types
          label: "核心类型"
          type: string
        - name: migrations
          label: "核迁移"
          type: number
        - name: cross_cluster_migrations
          label: "跨簇迁移"
          type: number
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_thread_state_spans.sql
      - fragments/system_sched_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package|}'='' OR p.name='${package|}' OR p.name GLOB '${package|}:*') AND ('${thread_name|}'='' OR COALESCE(t.name,'') GLOB '*${thread_name|}*')
      ),
      states AS (
       SELECT ss.*,t.tid,t.name AS thread_name,p.name AS process_name,COALESCE(ct.core_type,'unknown') AS core_type
       FROM system_thread_state_spans ss JOIN thread t ON t.utid=ss.utid JOIN process p ON p.upid=ss.upid
       LEFT JOIN system_cpu_topology ct ON ct.ucpu=ss.ucpu
      ),
      runs AS (
       SELECT *,LAG(ucpu) OVER(PARTITION BY window_id,utid ORDER BY raw_start_ts,thread_state_id) AS prev_ucpu,
         LAG(core_type) OVER(PARTITION BY window_id,utid ORDER BY raw_start_ts,thread_state_id) AS prev_core_type
       FROM states WHERE state='Running'
      ),
      migrations AS (
       SELECT window_id,utid,SUM(CASE WHEN prev_ucpu IS NOT NULL AND prev_ucpu!=ucpu THEN 1 ELSE 0 END) AS migrations,
         SUM(CASE WHEN prev_ucpu IS NOT NULL AND prev_ucpu!=ucpu AND core_type!='unknown' AND prev_core_type!='unknown'
           AND core_type!=prev_core_type THEN 1 ELSE 0 END) AS cross_cluster_migrations
       FROM runs GROUP BY window_id,utid
      ),
      summary AS (
       SELECT s.window_id,s.window_start_ts,s.window_end_ts,s.upid,s.utid,s.tid,s.thread_name,s.process_name,s.role,
        SUM(s.dur_ns) AS state_covered_ns,
        SUM(CASE WHEN s.state='Running' THEN s.dur_ns ELSE 0 END)/1e6 AS total_cpu_ms,
        SUM(CASE WHEN s.state='Running' AND s.core_type IN ('prime','big','medium') THEN s.dur_ns ELSE 0 END)/1e6 AS q1_perf_running_ms,
        SUM(CASE WHEN s.state='Running' AND s.core_type='little' THEN s.dur_ns ELSE 0 END)/1e6 AS q2_little_running_ms,
        SUM(CASE WHEN s.state='Running' AND s.core_type='unknown' THEN s.dur_ns ELSE 0 END)/1e6 AS unknown_running_ms,
        SUM(CASE WHEN s.state IN ('R','R+') THEN s.dur_ns ELSE 0 END)/1e6 AS q3_runnable_ms,
        SUM(CASE WHEN s.state IN ('D','DK') THEN s.dur_ns ELSE 0 END)/1e6 AS q4a_uninterruptible_ms,
        SUM(CASE WHEN s.state IN ('S','I') THEN s.dur_ns ELSE 0 END)/1e6 AS q4b_sleeping_ms,
        SUM(CASE WHEN s.state NOT IN ('Running','R','R+','D','DK','S','I') THEN s.dur_ns ELSE 0 END)/1e6 AS other_state_ms,
        CASE WHEN SUM(CASE WHEN s.state='Running' AND s.core_type='unknown' THEN s.dur_ns ELSE 0 END)>0 THEN NULL
          ELSE SUM(CASE WHEN s.state='Running' AND s.core_type IN ('prime','big','medium') THEN s.dur_ns ELSE 0 END)*100.0/
            NULLIF(SUM(CASE WHEN s.state='Running' THEN s.dur_ns ELSE 0 END),0) END AS perf_core_pct,
        GROUP_CONCAT(DISTINCT CASE WHEN s.state='Running' THEN s.cpu END) AS running_cpus,
        GROUP_CONCAT(DISTINCT CASE WHEN s.state='Running' THEN s.core_type END) AS running_core_types,
        COALESCE(m.migrations,0) AS migrations,COALESCE(m.cross_cluster_migrations,0) AS cross_cluster_migrations
       FROM states s LEFT JOIN migrations m ON m.window_id=s.window_id AND m.utid=s.utid
       GROUP BY s.window_id,s.utid
      )
      SELECT *,COUNT(*) OVER(PARTITION BY window_id) AS total_observed_threads,
        'full_aggregate_before_display_limit' AS sampling_evidence
      FROM summary
      ORDER BY CASE WHEN role='main' THEN 0 ELSE 1 END,MAX(q3_runnable_ms,q4a_uninterruptible_ms,total_cpu_ms) DESC
      LIMIT ${top_k|20}
    save_as: running_thread_quadrants

  - id: running_process_ranking
    type: atomic
    name: "Running 进程排名"
    optional: true
    display:
      level: summary
      layer: list
      title: "选区 Running 进程排名"
      columns:
        - {name: upid, label: "upid", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: runnable_ms, label: "runnable_ms", type: number, hidden: true}
        - name: process_name
          label: "进程"
          type: string
        - name: pid
          label: "PID"
          type: number
        - name: running_ms
          label: "Running 时间"
          type: duration
          format: duration_ms
          unit: ms
        - name: thread_count
          label: "线程数"
          type: number
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_thread_state_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package|}'='' OR p.name='${package|}' OR p.name GLOB '${package|}:*') AND ('${thread_name|}'='' OR COALESCE(t.name,'') GLOB '*${thread_name|}*')
      )
      SELECT s.upid,p.name AS process_name,p.pid,s.window_start_ts,s.window_end_ts,
       SUM(CASE WHEN s.state='Running' THEN s.dur_ns ELSE 0 END)/1e6 AS running_ms,
       SUM(CASE WHEN s.state IN ('R','R+') THEN s.dur_ns ELSE 0 END)/1e6 AS runnable_ms,
       COUNT(DISTINCT s.utid) AS thread_count
      FROM system_thread_state_spans s JOIN process p ON p.upid=s.upid
      GROUP BY s.window_id,s.upid ORDER BY running_ms DESC LIMIT ${top_k|20}
    save_as: running_process_ranking

  - id: cpu_freq_by_core
    type: atomic
    name: "各核 duration-weighted 频率"
    optional: true
    display:
      level: summary
      layer: list
      title: "选区各核平均频率"
      columns:
        - {name: window_id, label: "window_id", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: ucpu, label: "ucpu", type: number, hidden: true}
        - {name: topology_source, label: "topology_source", type: string, hidden: true}
        - name: cpu
          label: "CPU"
          type: number
        - name: core_type
          label: "核心类型"
          type: string
        - name: avg_freq_mhz
          label: "平均频率"
          type: number
        - name: min_freq_mhz
          label: "最低频率"
          type: number
        - name: max_freq_mhz
          label: "最高频率"
          type: number
        - name: covered_ms
          label: "覆盖时长"
          type: duration
          format: duration_ms
          unit: ms
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_frequency_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts)
      SELECT f.window_id,f.window_start_ts,f.window_end_ts,f.ucpu,f.cpu,ct.core_type,ct.topology_source,
       SUM(f.freq_khz*1.0*f.dur_ns)/SUM(f.dur_ns)/1000.0 AS avg_freq_mhz,
       MIN(f.freq_khz)/1000.0 AS min_freq_mhz,MAX(f.freq_khz)/1000.0 AS max_freq_mhz,
       SUM(f.dur_ns)/1e6 AS covered_ms
      FROM system_cpu_frequency_spans f LEFT JOIN system_cpu_topology ct ON ct.ucpu=f.ucpu
      GROUP BY f.window_id,f.ucpu ORDER BY f.ucpu
    save_as: cpu_freq_by_core

  - id: cpu_freq_distribution
    type: atomic
    name: "各核频率分布"
    optional: true
    display:
      level: detail
      layer: deep
      title: "选区各核频率分布"
      columns:
        - {name: window_id, label: "window_id", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: ucpu, label: "ucpu", type: number, hidden: true}
        - name: cpu
          label: "CPU"
          type: number
        - name: core_type
          label: "核心类型"
          type: string
        - name: freq_mhz_bucket
          label: "频率桶"
          type: number
        - name: duration_ms
          label: "时长"
          type: duration
          format: duration_ms
          unit: ms
        - name: pct_of_range
          label: "区间占比"
          type: percentage
          format: percentage
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_frequency_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts)
      SELECT f.window_id,f.window_start_ts,f.window_end_ts,f.ucpu,f.cpu,ct.core_type,
       CAST(ROUND(f.freq_khz/(${freq_bucket_mhz|100}*1000.0))*${freq_bucket_mhz|100} AS INTEGER) AS freq_mhz_bucket,
       SUM(f.dur_ns)/1e6 AS duration_ms,
       100.0*SUM(f.dur_ns)/(f.window_end_ts-f.window_start_ts) AS pct_of_range
      FROM system_cpu_frequency_spans f LEFT JOIN system_cpu_topology ct ON ct.ucpu=f.ucpu
      GROUP BY f.window_id,f.ucpu,freq_mhz_bucket ORDER BY f.ucpu,duration_ms DESC
    save_as: cpu_freq_distribution

output:
  format: structured
