name: scene_reconstruction
version: "1.1"
type: composite
category: interaction
tier: S

meta:
  display_name: "场景还原"
  description: "通过用户输入和屏幕状态还原用户操作场景"
  icon: "movie_creation"
  tags: [scene, input, screen, composite]

prerequisites:
  modules:
    - android.input
    - android.binder
    - android.screen_state
    - android.battery_stats
    - android.startup.startups
    - android.frames.timeline
    - android.anrs

triggers:
  keywords:
    zh: [场景还原, 还原场景, 发生了什么, 用户操作, 操作场景, 用户行为, 操作记录]
    en: [scene, reconstruct, what happened, user action, user behavior]
  patterns:
    - ".*场景.*还原.*"
    - ".*发生.*什么.*"
    - ".*用户.*操作.*"

inputs:
  - {name: start_ts, type: timestamp, required: false}
  - {name: end_ts, type: timestamp, required: false}
  - name: trace_id
    type: string
    required: true

  - name: scene_row_limit
    type: number
    required: false
    default: 4096

steps:
  - id: input_coverage
    type: atomic
    name: "输入事实覆盖范围"
    display:
      level: hidden
      layer: overview
    investigation_evidence:
      window: {start: start_ts, end: end_ts}
      metrics: []
      scan:
        domain: scene_input
        resultStepId: user_gestures
        totalRowsColumn: gesture_count
        outputTruncatedColumn: output_truncated
        cursorClosedColumn: cursor_closed
        parseFailuresColumn: missing_timestamp_count
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql, fragments/scene_input_window.sql]
    sql: |
      SELECT printf('%d', b.start_ts) AS start_ts, printf('%d', b.end_ts) AS end_ts,
        (SELECT COUNT(*) FROM scene_input_facts WHERE ts >= b.start_ts AND ts <= b.end_ts) AS observed_event_count,
        (SELECT COUNT(*) FROM scene_primary_input WHERE ts >= b.start_ts AND ts <= b.end_ts) AS physical_event_count,
        (SELECT COUNT(*) FROM scene_primary_input WHERE event_action = 'UNKNOWN' AND ts >= b.start_ts AND ts <= b.end_ts) AS physical_missing_action_count,
        (SELECT COUNT(*) FROM scene_input_facts WHERE event_action = 'UNKNOWN' AND ts >= b.start_ts AND ts <= b.end_ts) AS missing_action_count,
        (SELECT COUNT(*) FROM scene_raw_input WHERE ts IS NULL) AS missing_timestamp_count, 'whole_trace_unlocatable' AS timestamp_failure_scope,
        (SELECT COUNT(*) FROM scene_windowed_gestures) AS gesture_count,
        (SELECT COUNT(*) FROM scene_input_gaps WHERE end_ts > ts AND ts < b.end_ts AND end_ts > b.start_ts) AS gap_count,
        MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096) AS output_row_limit,
        CASE WHEN (SELECT COUNT(*) FROM scene_windowed_gestures) > MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
          THEN 1 ELSE 0 END AS output_truncated,
        'partial' AS source_status, 'capture_completeness_unproven' AS reason,
        'inertial_boundary_unavailable' AS inertial_source_status,
        1 AS cursor_closed, 'scene_input_v1' AS normalization_version FROM scene_requested_bounds b
    save_as: input_coverage
    optional: true

  # ==========================================================================
  # L1: Trace 时间范围
  # ==========================================================================
  - id: trace_time_range
    type: atomic
    name: "Trace 时间范围"
    display:
      level: summary
      layer: overview
      title: "Trace 概览"
      columns:
        - name: start_ts_str
          label: "开始时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: end_ts_str
          label: "结束时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: duration_sec
          label: "时长(秒)"
          type: number
    sql: |
      SELECT printf('%d', start_ts) AS start_ts, printf('%d', end_ts) AS end_ts,
        printf('%d', start_ts) AS start_ts_str, printf('%d', end_ts) AS end_ts_str,
        ROUND((end_ts - start_ts) / 1e9, 2) AS duration_sec FROM trace_bounds
    save_as: time_range

  # ==========================================================================
  # L1: 可用数据表探测（用于门禁可选步骤，避免缺表报错）
  # ==========================================================================
  - id: table_availability
    type: atomic
    name: "可用数据表探测"
    display:
      level: hidden
    sql: |
      SELECT
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_screen_state') THEN 1
          ELSE 0
        END AS has_screen_state,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_battery_stats_event_slices') THEN 1
          ELSE 0
        END AS has_battery_top,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_input_events') THEN 1
          ELSE 0
        END AS has_input_events,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_startups') THEN 1
          ELSE 0
        END AS has_startups,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='actual_frame_timeline_slice') THEN 1
          ELSE 0
        END AS has_frame_timeline,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='process_counter_track') THEN 1
          ELSE 0
        END AS has_process_counter_track,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_key_events') THEN 1
          ELSE 0
        END AS has_key_events,
        CASE
          WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table', 'view') AND name='android_anrs') THEN 1
          ELSE 0
        END AS has_anrs
    save_as: table_availability

  # ==========================================================================
  # L2: 屏幕状态变化
  # ==========================================================================
  - id: screen_state_changes
    type: atomic
    name: "屏幕状态变化"
    condition: table_availability.data[0]?.has_screen_state === 1
    display:
      level: hidden
      layer: list
      title: "屏幕状态"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "状态"
          type: string
        - name: category
          label: "类别"
          type: string
    sql_fragments: [fragments/scene_screen_facts.sql]
    sql: |
      SELECT printf('%d', ts) AS ts, printf('%d', end_ts - ts) AS dur,
        CASE state WHEN 'SCREEN_ON' THEN '屏幕点亮' WHEN 'SCREEN_OFF' THEN '屏幕熄灭'
          WHEN 'SCREEN_DOZE' THEN '屏幕低功耗显示（DOZE）' ELSE '屏幕状态未知' END AS event,
        'screen' AS category, state, raw_state, short_screen_state, source_status, boundary_kind,
        'android_screen_state' AS source_table, CAST(source_id AS TEXT) AS source_id,
        COUNT(*) OVER () AS total_rows
      FROM scene_screen_facts WHERE end_ts >= ts ORDER BY ts
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: screen_events
    optional: true

  # ==========================================================================
  # L2: Top App 切换
  # ==========================================================================
  - id: top_app_changes
    type: atomic
    name: "Top App 切换"
    condition: table_availability.data[0]?.has_battery_top === 1
    display:
      level: hidden
      layer: list
      title: "应用切换"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: app_package
          label: "包名"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH RECURSIVE battery_check AS (
        SELECT 1 AS dummy WHERE EXISTS (
          SELECT 1 FROM sqlite_master WHERE type='table' AND name='android_battery_stats_event_slices'
        )
      )
      SELECT
        printf('%d', ts) AS ts,
        printf('%d', safe_dur) AS dur,
        '切换到 ' || REPLACE(REPLACE(str_value, 'com.', ''), 'android.', '') AS event,
        str_value AS app_package,
        'app_switch' AS category
      FROM android_battery_stats_event_slices
      WHERE track_name = 'battery_stats.top'
        AND safe_dur > 50000000
      ORDER BY ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: app_switches
    optional: true

  # ==========================================================================
  # L2: Activity 生命周期事件
  # ==========================================================================
  - id: activity_lifecycle
    type: atomic
    name: "Activity 生命周期"
    display:
      level: hidden
      layer: list
      title: "Activity 生命周期"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: activity_name
          label: "Activity"
          type: string
        - name: lifecycle_event
          label: "生命周期事件"
          type: string
        - name: dur_ms
          label: "耗时(ms)"
          type: number
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH lifecycle_slices AS (
        SELECT
          s.ts,
          s.dur,
          s.name,
          CASE
            WHEN s.name GLOB '*activityStart*' THEN 'activityStart'
            WHEN s.name GLOB '*activityResume*' THEN 'activityResume'
            WHEN s.name GLOB '*activityPause*' THEN 'activityPause'
            WHEN s.name GLOB '*activityStop*' THEN 'activityStop'
            WHEN s.name GLOB '*activityDestroy*' THEN 'activityDestroy'
            WHEN s.name GLOB '*performCreate*' THEN 'performCreate'
            WHEN s.name GLOB '*performResume*' THEN 'performResume'
            WHEN s.name GLOB '*performPause*' THEN 'performPause'
            WHEN s.name GLOB '*performStop*' THEN 'performStop'
            WHEN s.name GLOB '*performDestroy*' THEN 'performDestroy'
            ELSE NULL
          END AS lifecycle_event,
          CASE
            WHEN s.name LIKE '%:%' THEN SUBSTR(s.name, INSTR(s.name, ':') + 1)
            ELSE s.name
          END AS activity_name
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        WHERE t.is_main_thread = 1
          AND (
            s.name GLOB '*activityStart*'
            OR s.name GLOB '*activityResume*'
            OR s.name GLOB '*activityPause*'
            OR s.name GLOB '*activityStop*'
            OR s.name GLOB '*activityDestroy*'
            OR s.name GLOB '*performCreate*'
            OR s.name GLOB '*performResume*'
            OR s.name GLOB '*performPause*'
            OR s.name GLOB '*performStop*'
            OR s.name GLOB '*performDestroy*'
          )
          AND s.dur > 0
      ),
      startup_activities AS (
        SELECT
          s.ts,
          s.dur,
          s.package AS activity_name,
          'startup (' ||
            CASE
              WHEN EXISTS (
                SELECT 1 FROM android_startup_threads st
                JOIN thread_track tt ON tt.utid = st.utid
                JOIN slice sl ON sl.track_id = tt.id
                WHERE st.startup_id = s.startup_id
                  AND st.is_main_thread = 1
                  AND sl.name = 'bindApplication'
                  AND sl.ts + sl.dur > st.ts AND sl.ts < st.ts + st.dur
              ) THEN 'cold'
              ELSE s.startup_type
            END
          || ')' AS lifecycle_event
        FROM android_startups s
        WHERE s.dur > 0
          AND EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_startups')
      )
      SELECT
        printf('%d', ts) AS ts,
        activity_name,
        lifecycle_event,
        ROUND(dur / 1e6, 1) AS dur_ms
      FROM (
        SELECT ts, activity_name, lifecycle_event, dur FROM lifecycle_slices WHERE lifecycle_event IS NOT NULL
        UNION ALL
        SELECT ts, activity_name, lifecycle_event, dur FROM startup_activities
      )
      ORDER BY ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: activity_lifecycle
    optional: true

  # ==========================================================================
  # L2: 用户手势识别 (点击/滑动/长按)
  # ==========================================================================
  - id: user_gestures
    type: atomic
    name: "用户手势识别"
    investigation_evidence:
      window: {start: ts, end: end_ts}
      identity: {upid: upid}
      metrics:
        - {domain: scene_input, metric_id: scene.input.event_count, value: event_count, status: source_status}
    condition: table_availability.data[0]?.has_input_events === 1
    display:
      level: hidden
      layer: list
      title: "用户操作"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "操作"
          type: string
        - name: gesture_type
          label: "类型"
          type: string
        - name: confidence
          label: "置信度"
          type: string
        - name: move_count
          label: "移动次数"
          type: number
        - name: app_package
          label: "应用"
          type: string
        - name: category
          label: "类别"
          type: string
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql, fragments/scene_input_window.sql]
    sql: |
      SELECT printf('%d', clipped_ts) AS ts, printf('%d', clipped_end_ts) AS end_ts, printf('%d', clipped_end_ts - clipped_ts) AS dur,
        printf('%d', ts) AS source_start_ts, printf('%d', end_ts) AS source_end_ts,
        CASE WHEN ts != clipped_ts OR end_ts != clipped_end_ts THEN 1 ELSE 0 END AS window_clipped,
        CASE gesture_type WHEN 'touch_move' THEN '连续触摸移动' WHEN 'touch_hold' THEN '持续触摸（长按识别未确认）' WHEN 'tap' THEN '点击接触' WHEN 'cancelled' THEN '触摸取消' WHEN 'key' THEN '按键输入' WHEN 'scroll_input' THEN '滚动轴输入（ACTION_SCROLL）' WHEN 'wheel' THEN '滚轮输入' ELSE '输入活动（动作信息不完整）' END AS event, gesture_type, 'MEDIUM' AS confidence,
        move_count, app_package, 'gesture' AS category, CASE WHEN ts != clipped_ts OR end_ts != clipped_end_ts THEN 'partial' ELSE source_status END AS source_status,
        source_table, source_id, source_ids, stream_key, upid, event_channel,
        device_id, display_id, input_source, CASE WHEN ts = clipped_ts AND end_ts = clipped_end_ts THEN boundary_complete ELSE 0 END AS boundary_complete, event_count, missing_action_count, 'original_gesture' AS event_count_scope,
        first_physical_event_id, last_physical_event_id, dispatch_count, receiver_count, identity_status,
        COUNT(*) OVER () AS total_rows
      FROM scene_windowed_gestures ORDER BY ts, stream_key, gesture_id
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: gestures
    optional: true

  # ==========================================================================
  # L2: 滑动启动检测 (面向初学者：精确定位滑动开始时刻)
  # ==========================================================================
  - id: scroll_initiation
    type: atomic
    name: "滚动处理区间"
    condition: table_availability.data[0]?.has_input_events === 1
    display:
      level: hidden
      layer: list
      title: "滚动处理"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: event
          label: "事件"
          type: string
        - name: gesture_id
          label: "手势ID"
          type: number
        - name: app_package
          label: "前台应用"
          type: string
        - name: category
          label: "类别"
          type: string
        - name: explanation
          label: "说明"
          type: string
    sql: |
      SELECT printf('%d', s.ts) AS ts, printf('%d', s.dur) AS dur,
        'RecyclerView 滚动处理' AS event, s.id AS gesture_id, p.name AS app_package,
        'scroll_processing' AS event_type, 'scroll_start' AS category,
        'RecyclerView RV Scroll 标记；不据此推断手势开始时间' AS explanation,
        'slice' AS source_table, CAST(s.id AS TEXT) AS source_id,
        t.upid, s.track_id, 'observed' AS source_status, COUNT(*) OVER () AS total_rows
      FROM slice s JOIN thread_track tt ON s.track_id = tt.id
      JOIN thread t ON t.utid = tt.utid JOIN process p ON p.upid = t.upid
      WHERE s.name = 'RV Scroll' AND s.dur >= 0 AND t.is_main_thread = 1
      ORDER BY s.ts
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: scroll_starts
    optional: true

  # ==========================================================================
  # L2: 导航按键事件 (Back/Home/Recents — 三键导航)
  # ==========================================================================
  - id: navigation_keys
    type: atomic
    name: "导航按键"
    condition: table_availability.data[0]?.has_key_events === 1
    display:
      level: hidden
      layer: list
      title: "导航按键"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: key_name
          label: "按键"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      -- Pair DOWN → nearest UP per key_code using ROW_NUMBER for strict matching.
      -- Handles repeats/double-taps by assigning each DOWN its own ordinal.
      WITH downs AS (
        SELECT
          ts, key_code,
          ROW_NUMBER() OVER (PARTITION BY key_code ORDER BY ts) AS rn
        FROM android_key_events
        WHERE action = 0 AND key_code IN (3, 4, 187)
      ),
      ups AS (
        SELECT
          ts AS up_ts, key_code,
          ROW_NUMBER() OVER (PARTITION BY key_code ORDER BY ts) AS rn
        FROM android_key_events
        WHERE action = 1 AND key_code IN (3, 4, 187)
      )
      SELECT
        printf('%d', d.ts) AS ts,
        printf('%d', COALESCE(u.up_ts - d.ts, 0)) AS dur,
        CASE d.key_code
          WHEN 4 THEN '返回键'
          WHEN 3 THEN 'Home键'
          WHEN 187 THEN '最近任务键'
        END AS event,
        CASE d.key_code
          WHEN 4 THEN 'back_key'
          WHEN 3 THEN 'home_key'
          WHEN 187 THEN 'recents_key'
        END AS key_name,
        'navigation_key' AS category
      FROM downs d
      LEFT JOIN ups u ON u.key_code = d.key_code AND u.rn = d.rn AND u.up_ts >= d.ts
      WHERE COALESCE(u.up_ts - d.ts, 0) >= 0
      ORDER BY d.ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: nav_keys
    optional: true

  # ==========================================================================
  # L2: 手势导航 (Back gesture / SwipeToHome — 手势导航模式)
  # ==========================================================================
  - id: gesture_navigation
    type: atomic
    name: "手势导航"
    display:
      level: hidden
      layer: list
      title: "手势导航"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: key_name
          label: "类型"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      SELECT
        printf('%d', s.ts) AS ts,
        printf('%d', s.dur) AS dur,
        CASE
          WHEN s.name GLOB '*BackGesture*' OR s.name GLOB '*onBackGesture*'
            OR s.name GLOB '*BackPanel*' THEN '返回手势'
          WHEN s.name GLOB '*SwipeToHome*' OR s.name GLOB '*goToHome*'
            OR s.name GLOB '*launcher*goHome*' THEN 'Home手势'
          WHEN s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*'
            THEN '最近任务手势'
          ELSE NULL
        END AS event,
        CASE
          WHEN s.name GLOB '*BackGesture*' OR s.name GLOB '*onBackGesture*'
            OR s.name GLOB '*BackPanel*' THEN 'back_key'
          WHEN s.name GLOB '*SwipeToHome*' OR s.name GLOB '*goToHome*'
            OR s.name GLOB '*launcher*goHome*' THEN 'home_key'
          WHEN s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*'
            THEN 'recents_key'
        END AS key_name,
        'navigation_key' AS category
      FROM slice s
      JOIN thread_track tt ON s.track_id = tt.id
      JOIN thread t ON tt.utid = t.utid
      JOIN process p ON t.upid = p.upid
      WHERE (p.name GLOB 'com.android.systemui*' OR p.name GLOB '*launcher*')
        AND s.dur > 10000000
        AND (
          s.name GLOB '*BackGesture*' OR s.name GLOB '*onBackGesture*'
          OR s.name GLOB '*BackPanel*'
          OR s.name GLOB '*SwipeToHome*' OR s.name GLOB '*goToHome*'
          OR s.name GLOB '*launcher*goHome*'
          OR s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*'
        )
      ORDER BY s.ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: gesture_nav
    optional: true

  # ==========================================================================
  # L2: 窗口转场动画
  # ==========================================================================
  - id: window_transitions
    type: atomic
    name: "窗口转场"
    display:
      level: hidden
      layer: list
      title: "窗口转场"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: transition_type
          label: "转场类型"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      SELECT
        printf('%d', s.ts) AS ts,
        printf('%d', s.dur) AS dur,
        CASE
          WHEN s.name GLOB '*openAnimation*' OR s.name GLOB '*AppTransitionReady*'
            THEN '窗口打开 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
          WHEN s.name GLOB '*closeAnimation*'
            THEN '窗口关闭 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
          WHEN s.name GLOB '*Shell transition*'
            THEN 'Shell转场 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
          WHEN s.name GLOB '*startingWindow*'
            THEN '启动窗口 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
          ELSE '窗口转场 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
        END AS event,
        CASE
          WHEN s.name GLOB '*openAnimation*' OR s.name GLOB '*AppTransitionReady*' THEN 'open'
          WHEN s.name GLOB '*closeAnimation*' THEN 'close'
          WHEN s.name GLOB '*Shell transition*' THEN 'shell'
          WHEN s.name GLOB '*startingWindow*' THEN 'starting_window'
          ELSE 'other'
        END AS transition_type,
        'window_transition' AS category
      FROM slice s
      JOIN thread_track tt ON s.track_id = tt.id
      JOIN thread t ON tt.utid = t.utid
      JOIN process p ON t.upid = p.upid
      WHERE (p.name = 'system_server' OR p.name GLOB 'com.android.wm.shell*')
        AND s.dur > 50000000
        AND (
          s.name GLOB '*AppTransition*'
          OR s.name GLOB '*openAnimation*'
          OR s.name GLOB '*closeAnimation*'
          OR s.name GLOB '*Shell transition*'
          OR s.name GLOB '*startingWindow*'
        )
      ORDER BY s.ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: win_transitions
    optional: true

  # ==========================================================================
  # L2: ANR 检测
  # ==========================================================================
  - id: anr_events
    type: atomic
    name: "ANR 事件"
    condition: table_availability.data[0]?.has_anrs === 1
    display:
      level: hidden
      layer: list
      title: "ANR 事件"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: process_name
          label: "进程"
          type: string
        - name: anr_type
          label: "ANR类型"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      -- ts in android_anrs is the detection moment (when timeout expired).
      -- The actual blocking period is [ts - timeout, ts].
      -- Use anr_dur_ms → default_anr_dur_ms fallback for the blocking window.
      SELECT
        printf('%d', ts - CAST(COALESCE(anr_dur_ms, default_anr_dur_ms, 5000) AS INTEGER) * 1000000) AS ts,
        printf('%d', CAST(COALESCE(anr_dur_ms, default_anr_dur_ms, 5000) AS INTEGER) * 1000000) AS dur,
        'ANR: ' || REPLACE(REPLACE(process_name, 'com.', ''), 'android.', '') ||
          ' (' || COALESCE(anr_type, 'unknown') || ')' AS event,
        process_name,
        COALESCE(anr_type, 'unknown') AS anr_type,
        'anr' AS category
      FROM android_anrs
      ORDER BY ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: anr_events
    optional: true

  # ==========================================================================
  # L2: 输入法 (键盘) 显示/隐藏
  # ==========================================================================
  - id: ime_events
    type: atomic
    name: "输入法事件"
    display:
      level: hidden
      layer: list
      title: "输入法"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: ime_action
          label: "操作"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      SELECT
        printf('%d', s.ts) AS ts,
        printf('%d', s.dur) AS dur,
        CASE
          WHEN s.name GLOB '*showSoftInput*'
            OR s.name GLOB '*InputMethodService*show*'
            OR s.name GLOB '*InputMethodManager*show*'
            THEN '键盘弹出 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
          WHEN s.name GLOB '*hideSoftInput*'
            OR s.name GLOB '*InputMethodService*hide*'
            OR s.name GLOB '*InputMethodManager*hide*'
            THEN '键盘收起 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
          ELSE NULL
        END AS event,
        CASE
          WHEN s.name GLOB '*show*' THEN 'ime_show'
          ELSE 'ime_hide'
        END AS ime_action,
        'ime' AS category
      FROM slice s
      WHERE s.dur > 5000000
        AND (
          s.name GLOB '*showSoftInput*'
          OR s.name GLOB '*hideSoftInput*'
          OR s.name GLOB '*InputMethodService*show*'
          OR s.name GLOB '*InputMethodService*hide*'
          OR s.name GLOB '*InputMethodManager*show*'
          OR s.name GLOB '*InputMethodManager*hide*'
        )
      ORDER BY s.ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: ime_events
    optional: true

  # ==========================================================================
  # L2: 惯性滑动检测 (UP 后仍持续渲染)
  # ==========================================================================
  - id: inertial_scrolls
    type: atomic
    name: "惯性滑动"
    condition: table_availability.data[0]?.has_input_events === 1 && table_availability.data[0]?.has_frame_timeline === 1
    display:
      level: hidden
      layer: list
      title: "惯性滑动"
      columns:
        - name: ts
          label: "开始时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: frame_count
          label: "帧数"
          type: number
        - name: jank_frames
          label: "掉帧数"
          type: number
        - name: app_package
          label: "应用"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      -- A frame after UP does not prove fling. Confirmed fling evidence is
      -- collected by the scene investigation, with producer and object identity.
      SELECT printf('%d', ts) AS ts, '0' AS dur, '' AS event,
        0 AS frame_count, 0 AS jank_frames, NULL AS app_package,
        'inertial_scroll' AS category, 'unavailable' AS source_status
      FROM slice WHERE 0
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: inertial_scrolls
    optional: true

  # ==========================================================================
  # L2: 未观测到输入的区间（采集完整性未确认）
  # ==========================================================================
  - id: idle_periods
    type: atomic
    name: "未观测到输入的区间（采集完整性未确认）"
    investigation_evidence:
      window: {start: ts, end: end_ts}
      metrics: []
    condition: table_availability.data[0]?.has_input_events === 1
    display:
      level: hidden
      layer: list
      title: "未观测到输入的区间（采集完整性未确认）"
      title_i18n:
        en: "Intervals with no observed input (capture completeness unconfirmed)"
      columns:
        - { name: end_ts, label: "结束时间", type: timestamp, unit: ns, hidden: true }
        - name: ts
          label: "开始时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: confidence
          label: "置信度"
          type: string
        - name: category
          label: "类别"
          type: string
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql]
    sql: |
      SELECT printf('%d', ts) AS ts, printf('%d', end_ts) AS end_ts, printf('%d', end_ts - ts) AS dur,
        '未观测到输入（采集完整性未确认）' AS event, 'LOW' AS confidence,
        'unknown' AS category, 'partial' AS source_status,
        'input_coverage_gap' AS source_table, 'capture_completeness_unproven' AS reason,
        COUNT(*) OVER () AS total_rows
      FROM scene_input_gaps WHERE end_ts > ts ORDER BY ts
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: idle_periods
    optional: true

  # ==========================================================================
  # L2: App 启动事件
  # ==========================================================================
  - id: app_launches
    type: atomic
    name: "App 启动事件"
    condition: table_availability.data[0]?.has_startups === 1
    display:
      level: hidden
      layer: list
      title: "App 启动"
      columns:
        - name: startup_id
          label: "ID"
          type: number
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "耗时"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: startup_type
          label: "类型"
          type: string
        - name: package
          label: "包名"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH RECURSIVE startup_check AS (
        SELECT 1 AS dummy WHERE EXISTS (
          SELECT 1 FROM sqlite_master WHERE type='table' AND name='android_startups'
        )
      ),
      -- Reclassify startup_type: platform may report 'warm' even when
      -- bindApplication exists (process killed + ActivityRecord survives).
      -- bindApplication on main thread = cold start, period.
      validated_startups AS (
        SELECT
          s.*,
          CASE
            WHEN EXISTS (
              SELECT 1 FROM android_startup_threads st
              JOIN thread_track tt ON tt.utid = st.utid
              JOIN slice sl ON sl.track_id = tt.id
              WHERE st.startup_id = s.startup_id
                AND st.is_main_thread = 1
                AND sl.name = 'bindApplication'
                AND sl.ts + sl.dur > st.ts AND sl.ts < st.ts + st.dur
            ) THEN 'cold'
            ELSE s.startup_type
          END AS validated_type
        FROM android_startups s
        WHERE s.dur > 0
      )
      SELECT
        s.startup_id,
        printf('%d', s.ts) AS ts,
        printf('%d', s.dur) AS dur,
        CASE s.validated_type
          WHEN 'cold' THEN '冷启动'
          WHEN 'warm' THEN '温启动'
          WHEN 'hot' THEN '热启动'
          ELSE '启动'
        END || ' ' ||
        REPLACE(REPLACE(s.package, 'com.', ''), 'android.', '') ||
        ' [' || CAST(s.dur / 1000000 AS INT) || 'ms]' AS event,
        s.validated_type AS startup_type,
        s.package,
        NULL AS ttid_ms,
        NULL AS ttfd_ms,
        'app_launch' AS category
      FROM validated_startups s
      ORDER BY s.ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: launches
    optional: true

  # ==========================================================================
  # L2: 系统事件 (解锁/通知栏/分屏等)
  # ==========================================================================
  - id: system_events
    type: atomic
    name: "系统事件"
    display:
      level: hidden
      layer: list
      title: "系统事件"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: event_type
          label: "类型"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      SELECT
        printf('%d', ts) AS ts,
        printf('%d', dur) AS dur,
        CASE
          WHEN LOWER(name) LIKE '%keyguard%dismiss%'
            OR LOWER(name) LIKE '%keyguard%unlock%'
            OR LOWER(name) LIKE '%lockscreen%unlock%'
            OR LOWER(name) LIKE '%unlock%screen%'
            THEN '解锁屏幕'
          WHEN LOWER(name) LIKE '%notificationpanel%expand%' THEN '下拉通知栏'
          WHEN LOWER(name) LIKE '%notificationpanel%collapse%' THEN '收起通知栏'
          WHEN LOWER(name) LIKE '%splitscreen%' THEN '分屏操作'
          WHEN LOWER(name) LIKE '%enterpictureinpicture%' THEN '进入画中画'
          WHEN LOWER(name) LIKE '%exitpictureinpicture%' THEN '退出画中画'
          ELSE NULL
        END AS event,
        CASE
          WHEN LOWER(name) LIKE '%keyguard%dismiss%'
            OR LOWER(name) LIKE '%keyguard%unlock%'
            OR LOWER(name) LIKE '%lockscreen%unlock%'
            OR LOWER(name) LIKE '%unlock%screen%'
            THEN 'screen_unlock'
          WHEN LOWER(name) LIKE '%notificationpanel%' THEN 'notification'
          WHEN LOWER(name) LIKE '%splitscreen%' THEN 'split_screen'
          WHEN LOWER(name) LIKE '%pictureinpicture%' THEN 'pip'
          ELSE 'system'
        END AS event_type,
        'system' AS category
      FROM slice
      WHERE (
          -- 解锁: 真实解锁 >= 100ms
          (LOWER(name) LIKE '%keyguard%dismiss%' AND dur > 100000000)
          OR (LOWER(name) LIKE '%keyguard%unlock%' AND dur > 100000000)
          OR (LOWER(name) LIKE '%lockscreen%unlock%' AND dur > 100000000)
          OR (LOWER(name) LIKE '%unlock%screen%' AND dur > 100000000)
          -- 通知栏: 面板动画 >= 200ms
          OR (LOWER(name) LIKE '%notificationpanel%expand%' AND dur > 200000000)
          OR (LOWER(name) LIKE '%notificationpanel%collapse%' AND dur > 200000000)
          -- 分屏: 用户可感知操作 >= 500ms
          OR (LOWER(name) LIKE '%splitscreen%' AND dur > 500000000)
          -- 画中画: 过渡动画 >= 300ms
          OR (LOWER(name) LIKE '%enterpictureinpicture%' AND dur > 300000000)
          OR (LOWER(name) LIKE '%exitpictureinpicture%' AND dur > 300000000)
        )
        -- 排除干扰项
        AND LOWER(name) NOT LIKE '%unlockcanvasandpost%'
        AND LOWER(name) NOT LIKE '%unlockandpost%'
        AND LOWER(name) != 'unlock'
      ORDER BY ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: sys_events
    optional: true

  # ==========================================================================
  # L2: 广播事件 (Broadcast/Alarm)
  # ==========================================================================
  - id: broadcast_events
    type: atomic
    name: "广播事件"
    display:
      level: hidden
      layer: list
      title: "广播事件"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: receiver_name
          label: "接收者"
          type: string
        - name: broadcast_action
          label: "广播类型"
          type: string
        - name: dur_ms
          label: "耗时(ms)"
          type: number
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      SELECT
        printf('%d', s.ts) AS ts,
        CASE
          WHEN s.name LIKE '%:%' THEN SUBSTR(s.name, INSTR(s.name, ':') + 1)
          WHEN s.name LIKE '% %' THEN SUBSTR(s.name, INSTR(s.name, ' ') + 1)
          ELSE p.name
        END AS receiver_name,
        CASE
          WHEN s.name GLOB '*BroadcastQueue*' THEN 'BroadcastQueue'
          WHEN s.name GLOB '*broadcastReceive*' THEN 'broadcastReceive'
          WHEN s.name GLOB '*AlarmManager*' THEN 'AlarmManager'
          ELSE s.name
        END AS broadcast_action,
        ROUND(s.dur / 1e6, 1) AS dur_ms
      FROM slice s
      JOIN thread_track tt ON s.track_id = tt.id
      JOIN thread t ON tt.utid = t.utid
      JOIN process p ON t.upid = p.upid
      WHERE (
        s.name GLOB '*BroadcastQueue*'
        OR s.name GLOB '*broadcastReceive*'
        OR s.name GLOB '*AlarmManager*'
      )
        AND s.dur > 1000000
      ORDER BY s.ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: broadcast_events
    optional: true

  # ==========================================================================
  # L2: 跨进程交互 (显著 Binder 事务 >10ms)
  # ==========================================================================
  - id: cross_process_interactions
    type: atomic
    name: "跨进程交互"
    display:
      level: hidden
      layer: list
      title: "跨进程交互"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: client_process
          label: "客户端进程"
          type: string
        - name: server_process
          label: "服务端进程"
          type: string
        - name: dur_ms
          label: "耗时(ms)"
          type: number
        - name: interface_name
          label: "接口名"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      -- 使用 stdlib android_binder_txns 替代手动 7-table JOIN
      SELECT
        printf('%d', bt.client_ts) AS ts,
        bt.client_process,
        bt.server_process,
        ROUND(bt.client_dur / 1e6, 1) AS dur_ms,
        COALESCE(bt.aidl_name, 'binder transaction') AS interface_name
      FROM android_binder_txns bt
      WHERE bt.client_dur > 10000000
        AND bt.client_process IS NOT NULL
        AND bt.server_process IS NOT NULL
        AND bt.client_process != bt.server_process
      ORDER BY bt.client_dur DESC
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: cross_process_interactions
    optional: true

  # ==========================================================================
  # L2: 性能事件 (掉帧)
  # ==========================================================================
  - id: jank_events
    type: atomic
    name: "掉帧事件"
    condition: table_availability.data[0]?.has_frame_timeline === 1
    display:
      level: hidden
      layer: list
      title: "性能事件"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dur
          label: "帧耗时"
          type: duration
          format: duration_ms
          unit: ns
        - name: event
          label: "事件"
          type: string
        - name: jank_type
          label: "掉帧类型"
          type: string
        - name: jank_severity_type
          label: "严重程度"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      SELECT
        printf('%d', ts) AS ts,
        printf('%d', dur) AS dur,
        CASE
          WHEN jank_type LIKE '%App Deadline%' OR jank_type = 'Self Jank' THEN 'App掉帧'
          WHEN jank_type LIKE '%SurfaceFlinger%' THEN '合成器掉帧'
          WHEN jank_type LIKE '%Buffer Stuffing%' THEN '缓冲区积压'
          ELSE '掉帧'
        END ||
        CASE jank_severity_type
          WHEN 'Partial' THEN ' (轻微)'
          WHEN 'Full' THEN ' (严重)'
          ELSE ''
        END ||
        ' [' || CAST(dur / 1000000 AS INT) || 'ms]' AS event,
        jank_type,
        jank_severity_type,
        'performance' AS category
      FROM actual_frame_timeline_slice
      WHERE jank_type IS NOT NULL
        AND jank_type != 'None'
        AND jank_type != ''
      ORDER BY ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: janks
    optional: true

  # ==========================================================================
  # L2: 设备状态（CPU频率/内存压力/温度/充电）
  # ==========================================================================
  - id: device_state
    type: atomic
    name: "设备状态"
    display:
      level: detail
      layer: list
      title: "设备状态"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: event
          label: "状态"
          type: string
        - name: value
          label: "值"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH time_bounds AS (
        SELECT start_ts AS t_start, end_ts AS t_end FROM trace_bounds
      ),
      -- CPU frequency ranges: report min/max freq per CPU cluster
      cpu_freq AS (
        SELECT
          printf('%d', MIN(c.ts)) AS ts,
          'CPU ' || ct.cpu || ' 频率范围' AS event,
          CAST(CAST(MIN(c.value) / 1000 AS INT) AS TEXT) || ' - ' ||
            CAST(CAST(MAX(c.value) / 1000 AS INT) AS TEXT) || ' MHz' AS value,
          'cpu_freq' AS category
        FROM counter c
        JOIN cpu_counter_track ct ON c.track_id = ct.id
        WHERE ct.name = 'cpufreq'
        GROUP BY ct.cpu
      ),
      -- Memory pressure (low memory killer / pressure stall)
      mem_pressure AS (
        SELECT
          printf('%d', c.ts) AS ts,
          'MemPressure: ' || ct.name AS event,
          CAST(ROUND(c.value) AS TEXT) AS value,
          'memory' AS category
        FROM counter c
        JOIN counter_track ct ON c.track_id = ct.id
        WHERE (ct.name LIKE '%mem%pressure%'
          OR ct.name LIKE '%MemFree%'
          OR ct.name LIKE '%SwapFree%'
          OR ct.name = 'oom_score_adj')
          AND c.value IS NOT NULL
        ORDER BY c.ts
        LIMIT 1
      ),
      -- Thermal zones
      thermal AS (
        SELECT
          printf('%d', c.ts) AS ts,
          '温度: ' || ct.name AS event,
          CAST(ROUND(c.value / 1000.0, 1) AS TEXT) || ' °C' AS value,
          'thermal' AS category
        FROM counter c
        JOIN counter_track ct ON c.track_id = ct.id
        WHERE ct.name LIKE '%thermal_zone%'
          AND c.value IS NOT NULL
        GROUP BY ct.name
        HAVING c.ts = MAX(c.ts)

      ),
      -- Battery / charging status from counter tracks
      battery AS (
        SELECT
          printf('%d', c.ts) AS ts,
          CASE
            WHEN ct.name LIKE '%charge%' THEN '电池电量'
            WHEN ct.name LIKE '%plugged%' THEN '充电状态'
            WHEN ct.name LIKE '%voltage%' THEN '电池电压'
            WHEN ct.name LIKE '%current%' THEN '电池电流'
            ELSE ct.name
          END AS event,
          CASE
            WHEN ct.name LIKE '%plugged%' THEN
              CASE CAST(c.value AS INT)
                WHEN 0 THEN '未充电'
                WHEN 1 THEN 'AC 充电'
                WHEN 2 THEN 'USB 充电'
                WHEN 4 THEN '无线充电'
                ELSE '充电(' || CAST(CAST(c.value AS INT) AS TEXT) || ')'
              END
            WHEN ct.name LIKE '%charge%' AND c.value <= 100 THEN CAST(CAST(c.value AS INT) AS TEXT) || '%'
            ELSE CAST(ROUND(c.value) AS TEXT)
          END AS value,
          'battery' AS category
        FROM counter c
        JOIN counter_track ct ON c.track_id = ct.id
        WHERE (ct.name LIKE '%battery%charge%'
          OR ct.name LIKE '%battery%plugged%'
          OR ct.name LIKE 'batt.%')
          AND c.value IS NOT NULL
        GROUP BY ct.name
        HAVING c.ts = MIN(c.ts)
        ORDER BY c.ts

      ),
      -- Foreground apps (oom_adj <= 0)
      fg_apps AS (
        SELECT
          printf('%d', c.ts) AS ts,
          '前台进程: ' || p.name AS event,
          'oom_adj=' || CAST(CAST(c.value AS INT) AS TEXT) AS value,
          'foreground_app' AS category
        FROM counter c
        JOIN process_counter_track pct ON c.track_id = pct.id
        JOIN process p ON pct.upid = p.upid
        WHERE pct.name = 'oom_score_adj'
          AND c.value <= 0
          AND p.name IS NOT NULL
          AND p.name != ''
          AND p.name NOT LIKE '%system_server%'
          AND p.name NOT LIKE '%surfaceflinger%'
          AND p.name NOT LIKE '%zygote%'
        GROUP BY p.name
        HAVING c.ts = MIN(c.ts)
        ORDER BY c.ts

      )
      SELECT * FROM cpu_freq
      UNION ALL SELECT * FROM mem_pressure
      UNION ALL SELECT * FROM thermal
      UNION ALL SELECT * FROM battery
      UNION ALL SELECT * FROM fg_apps
      ORDER BY ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: device_state
    optional: true

  # ==========================================================================
  # L2: App 前后台状态跟踪（oom_adj 变化 + 进程生死）
  # ==========================================================================
  - id: app_state_tracking
    type: atomic
    name: "App 状态跟踪"
    display:
      level: detail
      layer: list
      title: "App 前后台状态"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: event
          label: "事件"
          type: string
        - name: app_package
          label: "应用"
          type: string
        - name: oom_adj
          label: "oom_adj"
          type: number
        - name: state_label
          label: "状态"
          type: string
        - name: category
          label: "类别"
          type: string
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH oom_changes AS (
        SELECT
          c.ts,
          p.name AS app_package,
          CAST(c.value AS INT) AS oom_adj,
          LAG(CAST(c.value AS INT)) OVER (PARTITION BY p.name ORDER BY c.ts) AS prev_oom_adj
        FROM counter c
        JOIN process_counter_track pct ON c.track_id = pct.id
        JOIN process p ON pct.upid = p.upid
        WHERE pct.name = 'oom_score_adj'
          AND p.name IS NOT NULL
          AND p.name != ''
          AND p.name NOT LIKE '%system_server%'
          AND p.name NOT LIKE '%surfaceflinger%'
          AND p.name NOT LIKE '%servicemanager%'
          AND p.name NOT LIKE '%zygote%'
          AND p.name NOT LIKE '%init%'
          AND p.name NOT LIKE '%logd%'
          AND p.name NOT LIKE '%vold%'
          AND p.name NOT LIKE '%lmkd%'
      ),
      -- Filter to only significant transitions (foreground/visible/background boundaries)
      significant_changes AS (
        SELECT
          ts, app_package, oom_adj, prev_oom_adj,
          CASE
            WHEN oom_adj <= 0 THEN '前台'
            WHEN oom_adj <= 200 THEN '可见'
            WHEN oom_adj <= 700 THEN '后台'
            ELSE '缓存/即将回收'
          END AS state_label,
          CASE
            WHEN prev_oom_adj IS NULL THEN '进程出现'
            WHEN prev_oom_adj > 0 AND oom_adj <= 0 THEN '进入前台'
            WHEN prev_oom_adj <= 0 AND oom_adj > 0 THEN '离开前台'
            WHEN prev_oom_adj <= 200 AND oom_adj > 200 THEN '进入后台'
            WHEN prev_oom_adj > 700 AND oom_adj <= 200 THEN '恢复可见'
            ELSE NULL
          END AS transition
        FROM oom_changes
        WHERE prev_oom_adj IS NULL
          OR (prev_oom_adj > 0 AND oom_adj <= 0)
          OR (prev_oom_adj <= 0 AND oom_adj > 0)
          OR (prev_oom_adj <= 200 AND oom_adj > 200)
          OR (prev_oom_adj > 700 AND oom_adj <= 200)
      ),
      -- Process start events (from process table start_ts)
      proc_starts AS (
        SELECT
          p.start_ts AS ts,
          p.name AS app_package,
          -1000 AS oom_adj,
          '进程创建' AS state_label,
          '进程创建' AS transition
        FROM process p
        WHERE p.start_ts IS NOT NULL
          AND p.start_ts > 0
          AND p.name IS NOT NULL
          AND p.name GLOB '*.*'
          AND p.name NOT LIKE '%system_server%'
          AND p.name NOT LIKE '%zygote%'
      )
      SELECT
        printf('%d', ts) AS ts,
        COALESCE(transition, state_label) AS event,
        app_package,
        oom_adj,
        state_label,
        'app_state' AS category
      FROM (
        SELECT ts, app_package, oom_adj, state_label, transition
        FROM significant_changes
        WHERE transition IS NOT NULL
        UNION ALL
        SELECT ts, app_package, oom_adj, state_label, transition
        FROM proc_starts
      )
      ORDER BY ts
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: app_states
    optional: true

  # ==========================================================================
  # L2: 操作链（按时间顺序合并所有用户可感知事件）
  # ==========================================================================
  - id: operation_chain
    type: atomic
    name: "操作链"
    display:
      level: hidden
      layer: list
      title: "操作链"
      columns:
        - name: time_offset
          label: "时间偏移"
          type: string
        - name: ts
          label: "时间戳"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: event
          label: "事件"
          type: string
        - name: category
          label: "类别"
          type: string
        - name: priority
          label: "优先级"
          type: number
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql]
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH time_bounds AS (
        SELECT start_ts AS t_start FROM trace_bounds
      ),
      -- Screen on/off
      screen_ev AS (
        SELECT ts,
          CASE simple_screen_state WHEN 'off' THEN '屏幕熄灭' WHEN 'on' THEN '屏幕点亮' WHEN 'doze' THEN '屏幕低功耗显示（DOZE）'
            ELSE '屏幕状态 ' || screen_state END AS event,
          'screen' AS category, 1 AS priority
        FROM android_screen_state WHERE dur > 0

      ),
      -- App launches (reclassify: bindApplication on main thread → cold)
      launch_validated AS (
        SELECT s.ts, s.dur, s.package, s.startup_id,
          CASE
            WHEN EXISTS (
              SELECT 1 FROM android_startup_threads st
              JOIN thread_track tt ON tt.utid = st.utid
              JOIN slice sl ON sl.track_id = tt.id
              WHERE st.startup_id = s.startup_id
                AND st.is_main_thread = 1
                AND sl.name = 'bindApplication'
                AND sl.ts + sl.dur > st.ts AND sl.ts < st.ts + st.dur
            ) THEN 'cold'
            ELSE s.startup_type
          END AS startup_type
        FROM android_startups s WHERE s.dur > 0
      ),
      launch_ev AS (
        SELECT ts,
          CASE startup_type WHEN 'cold' THEN '冷启动' WHEN 'warm' THEN '温启动' WHEN 'hot' THEN '热启动'
            ELSE '启动' END || ' ' || package || ' [' || CAST(dur / 1000000 AS INT) || 'ms]' AS event,
          'app_launch' AS category, 2 AS priority
        FROM launch_validated

      ),
      -- Top-app switches
      topapp_ev AS (
        SELECT ts,
          '切换前台: ' || str_value AS event,
          'app_switch' AS category, 3 AS priority
        FROM android_battery_stats_event_slices
        WHERE track_name = 'battery_stats.top' AND safe_dur > 100000000

      ),
      -- Gestures (simplified from input events)
      gesture_ev AS (
        SELECT ts, CASE gesture_type WHEN 'touch_move' THEN '连续触摸移动' WHEN 'touch_hold' THEN '持续触摸（长按识别未确认）' WHEN 'tap' THEN '点击接触' WHEN 'cancelled' THEN '触摸取消' WHEN 'key' THEN '按键输入' WHEN 'scroll_input' THEN '滚动轴输入（ACTION_SCROLL）' WHEN 'wheel' THEN '滚轮输入' ELSE '输入活动（动作信息不完整）' END AS event, 'gesture' AS category, 4 AS priority FROM scene_gestures
      ),
      -- Foreground transitions (oom_adj crossing 0)
      fg_transitions AS (
        SELECT c.ts,
          CASE
            WHEN CAST(c.value AS INT) <= 0 THEN '进入前台: ' || p.name
            ELSE '离开前台: ' || p.name
          END AS event,
          'app_state' AS category, 5 AS priority
        FROM counter c
        JOIN process_counter_track pct ON c.track_id = pct.id
        JOIN process p ON pct.upid = p.upid
        WHERE pct.name = 'oom_score_adj'
          AND p.name GLOB '*.*'
          AND p.name NOT LIKE '%system_server%'
          AND p.name NOT LIKE '%zygote%'
          AND (
            (CAST(c.value AS INT) <= 0
              AND COALESCE(
                (SELECT CAST(c2.value AS INT) FROM counter c2
                 WHERE c2.track_id = c.track_id AND c2.ts < c.ts
                 ORDER BY c2.ts DESC LIMIT 1), 999) > 0)
            OR
            (CAST(c.value AS INT) > 0
              AND COALESCE(
                (SELECT CAST(c2.value AS INT) FROM counter c2
                 WHERE c2.track_id = c.track_id AND c2.ts < c.ts
                 ORDER BY c2.ts DESC LIMIT 1), 999) <= 0)
          )

      ),
      -- System events (quality-gated: per-event duration thresholds)
      sys_ev AS (
        SELECT ts,
          CASE
            WHEN LOWER(name) LIKE '%keyguard%dismiss%' OR LOWER(name) LIKE '%keyguard%unlock%'
              OR LOWER(name) LIKE '%lockscreen%unlock%' OR LOWER(name) LIKE '%unlock%screen%'
              THEN '解锁屏幕'
            WHEN LOWER(name) LIKE '%notificationpanel%expand%' THEN '下拉通知栏'
            WHEN LOWER(name) LIKE '%notificationpanel%collapse%' THEN '收起通知栏'
            WHEN LOWER(name) LIKE '%splitscreen%' THEN '分屏操作'
            WHEN LOWER(name) LIKE '%enterpictureinpicture%' THEN '进入画中画'
            WHEN LOWER(name) LIKE '%exitpictureinpicture%' THEN '退出画中画'
            ELSE NULL
          END AS event,
          'system' AS category, 2 AS priority
        FROM slice
        WHERE (
            (LOWER(name) LIKE '%keyguard%dismiss%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%keyguard%unlock%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%lockscreen%unlock%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%unlock%screen%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%notificationpanel%expand%' AND dur > 200000000)
            OR (LOWER(name) LIKE '%notificationpanel%collapse%' AND dur > 200000000)
            OR (LOWER(name) LIKE '%splitscreen%' AND dur > 500000000)
            OR (LOWER(name) LIKE '%enterpictureinpicture%' AND dur > 300000000)
            OR (LOWER(name) LIKE '%exitpictureinpicture%' AND dur > 300000000)
          )
          AND LOWER(name) NOT LIKE '%unlockcanvasandpost%'
          AND LOWER(name) NOT LIKE '%unlockandpost%'
          AND LOWER(name) != 'unlock'

      ),
      all_chain AS (
        SELECT * FROM screen_ev
        UNION ALL SELECT * FROM launch_ev
        UNION ALL SELECT * FROM topapp_ev
        UNION ALL SELECT * FROM gesture_ev
        UNION ALL SELECT * FROM fg_transitions
        UNION ALL SELECT * FROM sys_ev WHERE event IS NOT NULL
      )
      SELECT
        printf('%02d:%02d.%03d',
          CAST((ts - (SELECT t_start FROM time_bounds)) / 60000000000 AS INT),
          CAST(((ts - (SELECT t_start FROM time_bounds)) / 1000000000) % 60 AS INT),
          CAST(((ts - (SELECT t_start FROM time_bounds)) / 1000000) % 1000 AS INT)
        ) AS time_offset,
        printf('%d', ts) AS ts,
        event,
        category,
        priority
      FROM all_chain
      ORDER BY ts, priority
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: operation_chain
    optional: true

  # ==========================================================================
  # 干净时间线 — 用户看到的主要输出
  # ==========================================================================
  - id: clean_timeline
    type: atomic
    name: "场景时间线"
    condition: table_availability.data[0]?.has_input_events === 1 || table_availability.data[0]?.has_startups === 1 || table_availability.data[0]?.has_key_events === 1 || table_availability.data[0]?.has_anrs === 1
    display:
      level: detail
      layer: list
      title: "场景时间线"
      columns:
        - name: event_id
          label: "ID"
          type: string
          hidden: true
        - name: time_offset
          label: "时间"
          type: string
        - name: ts
          label: "时间戳"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
          hidden: true
        - name: dur_ms
          label: "耗时(ms)"
          type: number
        - name: event_type
          label: "类型"
          type: string
          hidden: true
        - name: event
          label: "事件"
          type: string
        - name: app_package
          label: "应用"
          type: string
        - name: rating
          label: "评级"
          type: string
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql]
    sql: |
      SELECT scene_rows.*, COUNT(*) OVER () AS total_rows FROM (
      WITH time_bounds AS (
        SELECT start_ts AS t_start FROM trace_bounds
      ),
      -- Screen state removed: now shown in dedicated Device State lane (state_timeline skill)
      -- ========== 数据源 1: App 启动 (reclassify: bindApplication → cold) ==========
      launch_type_validated AS (
        SELECT
          s.ts, s.dur, s.package, s.startup_id,
          CASE
            WHEN EXISTS (
              SELECT 1 FROM android_startup_threads st
              JOIN thread_track tt ON tt.utid = st.utid
              JOIN slice sl ON sl.track_id = tt.id
              WHERE st.startup_id = s.startup_id
                AND st.is_main_thread = 1
                AND sl.name = 'bindApplication'
                AND sl.ts + sl.dur > st.ts AND sl.ts < st.ts + st.dur
            ) THEN 'cold'
            ELSE s.startup_type
          END AS startup_type
        FROM android_startups s
        WHERE s.dur > 0
          AND EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_startups')
      ),
      launch_ev AS (
        SELECT
          s.ts,
          s.dur,
          CASE s.startup_type
            WHEN 'cold' THEN '冷启动'
            WHEN 'warm' THEN '温启动'
            WHEN 'hot' THEN '热启动'
            ELSE '启动'
          END || ' ' ||
          REPLACE(REPLACE(s.package, 'com.', ''), 'android.', '') ||
          ' [' || CAST(s.dur / 1000000 AS INT) || 'ms]' AS event,
          CASE s.startup_type
            WHEN 'cold' THEN 'cold_start'
            WHEN 'warm' THEN 'warm_start'
            WHEN 'hot' THEN 'hot_start'
            ELSE 'cold_start'
          END AS event_type,
          s.package AS app_package,
          'app_launch' AS category,
          2 AS priority
        FROM launch_type_validated s

      ),
      -- ========== 数据源 3: 用户手势 (tap/scroll/long_press) ==========
      gesture_ev AS (
        SELECT ts, dur, CASE gesture_type WHEN 'touch_move' THEN '连续触摸移动' WHEN 'touch_hold' THEN '持续触摸（长按识别未确认）' WHEN 'tap' THEN '点击接触' WHEN 'cancelled' THEN '触摸取消' WHEN 'key' THEN '按键输入' WHEN 'scroll_input' THEN '滚动轴输入（ACTION_SCROLL）' WHEN 'wheel' THEN '滚轮输入' ELSE '输入活动（动作信息不完整）' END AS event, gesture_type AS event_type,
          app_package, 'gesture' AS category, 3 AS priority FROM scene_gestures
      ),
      -- ========== 数据源 4: Top App 切换 ==========
      topapp_ev AS (
        SELECT
          ts,
          safe_dur AS dur,
          '切换到 ' || REPLACE(REPLACE(str_value, 'com.', ''), 'android.', '') AS event,
          CASE
            WHEN LOWER(str_value) LIKE '%launcher%' OR LOWER(str_value) LIKE '%miui.home%'
              OR LOWER(str_value) LIKE '%trebuchet%' OR LOWER(str_value) LIKE '%nexuslauncher%'
              OR LOWER(str_value) LIKE '%lawnchair%' OR LOWER(str_value) LIKE '%.home%'
              THEN 'home_screen'
            ELSE 'app_foreground'
          END AS event_type,
          str_value AS app_package,
          'app_switch' AS category,
          4 AS priority
        FROM android_battery_stats_event_slices
        WHERE track_name = 'battery_stats.top'
          AND safe_dur > 100000000
          AND EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_battery_stats_event_slices')

      ),
      -- ========== 数据源 5: 系统事件 (quality-gated) ==========
      system_ev AS (
        SELECT
          ts,
          dur,
          CASE
            WHEN LOWER(name) LIKE '%keyguard%dismiss%'
              OR LOWER(name) LIKE '%keyguard%unlock%'
              OR LOWER(name) LIKE '%lockscreen%unlock%'
              OR LOWER(name) LIKE '%unlock%screen%'
              THEN '解锁屏幕'
            WHEN LOWER(name) LIKE '%notificationpanel%expand%' THEN '下拉通知栏'
            WHEN LOWER(name) LIKE '%notificationpanel%collapse%' THEN '收起通知栏'
            WHEN LOWER(name) LIKE '%splitscreen%' THEN '分屏操作'
            WHEN LOWER(name) LIKE '%enterpictureinpicture%' THEN '进入画中画'
            WHEN LOWER(name) LIKE '%exitpictureinpicture%' THEN '退出画中画'
            ELSE NULL
          END AS event,
          CASE
            WHEN LOWER(name) LIKE '%keyguard%' OR LOWER(name) LIKE '%lockscreen%'
              OR LOWER(name) LIKE '%unlock%screen%' THEN 'screen_unlock'
            WHEN LOWER(name) LIKE '%notificationpanel%' THEN 'notification'
            WHEN LOWER(name) LIKE '%splitscreen%' THEN 'split_screen'
            WHEN LOWER(name) LIKE '%pictureinpicture%' THEN 'pip'
            ELSE 'system'
          END AS event_type,
          NULL AS app_package,
          'system' AS category,
          2 AS priority
        FROM slice
        WHERE (
            (LOWER(name) LIKE '%keyguard%dismiss%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%keyguard%unlock%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%lockscreen%unlock%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%unlock%screen%' AND dur > 100000000)
            OR (LOWER(name) LIKE '%notificationpanel%expand%' AND dur > 200000000)
            OR (LOWER(name) LIKE '%notificationpanel%collapse%' AND dur > 200000000)
            OR (LOWER(name) LIKE '%splitscreen%' AND dur > 500000000)
            OR (LOWER(name) LIKE '%enterpictureinpicture%' AND dur > 300000000)
            OR (LOWER(name) LIKE '%exitpictureinpicture%' AND dur > 300000000)
          )
          AND LOWER(name) NOT LIKE '%unlockcanvasandpost%'
          AND LOWER(name) NOT LIKE '%unlockandpost%'
          AND LOWER(name) != 'unlock'

      ),
      -- ========== 数据源 6: 未观测到输入（采集完整性未确认） ==========
      idle_ev AS (
        SELECT ts, end_ts - ts AS dur, '未观测到输入（采集完整性未确认）' AS event,
          'unknown' AS event_type, NULL AS app_package, 'unknown' AS category, 5 AS priority
        FROM scene_input_gaps WHERE end_ts > ts
      ),
      -- ========== 数据源 7: 导航按键 + 手势导航 ==========
      nav_key_ev AS (
        SELECT ts, dur, event, key_name AS event_type, NULL AS app_package,
               'navigation_key' AS category, 2 AS priority
        FROM (
          -- Source A: android_key_events (三键导航)
          SELECT printf('%d', d.ts) AS ts, printf('%d', COALESCE(u.up_ts - d.ts, 0)) AS dur,
            CASE d.key_code WHEN 4 THEN '返回键' WHEN 3 THEN 'Home键' WHEN 187 THEN '最近任务键' END AS event,
            CASE d.key_code WHEN 4 THEN 'back_key' WHEN 3 THEN 'home_key' WHEN 187 THEN 'recents_key' END AS key_name
          FROM (SELECT ts, key_code, ROW_NUMBER() OVER (PARTITION BY key_code ORDER BY ts) AS rn
                FROM android_key_events WHERE action = 0 AND key_code IN (3,4,187)) d
          LEFT JOIN (SELECT ts AS up_ts, key_code, ROW_NUMBER() OVER (PARTITION BY key_code ORDER BY ts) AS rn
                     FROM android_key_events WHERE action = 1 AND key_code IN (3,4,187)) u
            ON u.key_code = d.key_code AND u.rn = d.rn AND u.up_ts >= d.ts
          WHERE EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_key_events')
          UNION ALL
          -- Source B: gesture navigation slices (手势导航)
          SELECT printf('%d', s.ts) AS ts, printf('%d', s.dur) AS dur,
            CASE
              WHEN s.name GLOB '*BackGesture*' OR s.name GLOB '*onBackGesture*' OR s.name GLOB '*BackPanel*' THEN '返回手势'
              WHEN s.name GLOB '*SwipeToHome*' OR s.name GLOB '*goToHome*'
                OR s.name GLOB '*launcher*goHome*' THEN 'Home手势'
              WHEN s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*' THEN '最近任务手势'
            END AS event,
            CASE
              WHEN s.name GLOB '*BackGesture*' OR s.name GLOB '*onBackGesture*' OR s.name GLOB '*BackPanel*' THEN 'back_key'
              WHEN s.name GLOB '*SwipeToHome*' OR s.name GLOB '*goToHome*'
                OR s.name GLOB '*launcher*goHome*' THEN 'home_key'
              WHEN s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*' THEN 'recents_key'
            END AS key_name
          FROM slice s
          JOIN thread_track tt ON s.track_id = tt.id JOIN thread t ON tt.utid = t.utid JOIN process p ON t.upid = p.upid
          WHERE (p.name GLOB 'com.android.systemui*' OR p.name GLOB '*launcher*')
            AND s.dur > 10000000
            AND (s.name GLOB '*BackGesture*' OR s.name GLOB '*onBackGesture*' OR s.name GLOB '*BackPanel*'
                 OR s.name GLOB '*SwipeToHome*' OR s.name GLOB '*goToHome*' OR s.name GLOB '*launcher*goHome*'
                 OR s.name GLOB '*RecentsAnimation*' OR s.name GLOB '*startRecentsActivity*')
        ) sub
        WHERE event IS NOT NULL

      ),
      -- ========== 数据源 8: ANR ==========
      anr_ev AS (
        SELECT
          printf('%d', ts - CAST(COALESCE(anr_dur_ms, default_anr_dur_ms, 5000) AS INTEGER) * 1000000) AS ts,
          printf('%d', CAST(COALESCE(anr_dur_ms, default_anr_dur_ms, 5000) AS INTEGER) * 1000000) AS dur,
          'ANR: ' || REPLACE(REPLACE(process_name, 'com.', ''), 'android.', '') ||
            ' (' || COALESCE(anr_type, 'unknown') || ')' AS event,
          'anr' AS event_type,
          process_name AS app_package,
          'anr' AS category,
          1 AS priority
        FROM android_anrs
        WHERE EXISTS (SELECT 1 FROM sqlite_master WHERE type IN ('table','view') AND name='android_anrs')

      ),
      -- ========== 数据源 9: 输入法 ==========
      ime_ev AS (
        SELECT printf('%d', s.ts) AS ts, printf('%d', s.dur) AS dur,
          CASE WHEN s.name GLOB '*show*' THEN '键盘弹出 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
               ELSE '键盘收起 [' || CAST(s.dur / 1000000 AS INT) || 'ms]'
          END AS event,
          CASE WHEN s.name GLOB '*show*' THEN 'ime_show' ELSE 'ime_hide' END AS event_type,
          NULL AS app_package, 'ime' AS category, 4 AS priority
        FROM slice s
        WHERE s.dur > 5000000
          AND (s.name GLOB '*showSoftInput*' OR s.name GLOB '*hideSoftInput*'
               OR s.name GLOB '*InputMethodService*show*' OR s.name GLOB '*InputMethodService*hide*'
               OR s.name GLOB '*InputMethodManager*show*' OR s.name GLOB '*InputMethodManager*hide*')

      ),
      -- ========== 数据源 10: 窗口转场 ==========
      win_trans_ev AS (
        SELECT printf('%d', s.ts) AS ts, printf('%d', s.dur) AS dur,
          CASE
            WHEN s.name GLOB '*openAnimation*' THEN '窗口打开'
            WHEN s.name GLOB '*closeAnimation*' THEN '窗口关闭'
            WHEN s.name GLOB '*Shell transition*' THEN 'Shell转场'
            ELSE '窗口转场'
          END || ' [' || CAST(s.dur / 1000000 AS INT) || 'ms]' AS event,
          'window_transition' AS event_type,
          NULL AS app_package, 'window_transition' AS category, 4 AS priority
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id JOIN thread t ON tt.utid = t.utid JOIN process p ON t.upid = p.upid
        WHERE (p.name = 'system_server' OR p.name GLOB 'com.android.wm.shell*')
          AND s.dur > 50000000
          AND (s.name GLOB '*AppTransition*' OR s.name GLOB '*openAnimation*'
               OR s.name GLOB '*closeAnimation*' OR s.name GLOB '*Shell transition*'
               OR s.name GLOB '*startingWindow*')

      ),
      -- ========== 合并 + 过滤 + 排序 ==========
      all_events AS (
        SELECT ts, dur, event, event_type, app_package, category, priority FROM launch_ev
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM gesture_ev
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM topapp_ev
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM system_ev WHERE event IS NOT NULL
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM idle_ev
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM nav_key_ev
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM anr_ev
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM ime_ev
        UNION ALL
        SELECT ts, dur, event, event_type, app_package, category, priority FROM win_trans_ev
      ),
      -- ========== 格式化输出 ==========
      ranked AS (
        SELECT CAST(ts AS INTEGER) AS ts, CAST(dur AS INTEGER) AS dur,
          event, event_type, app_package, category, priority,
          ROW_NUMBER() OVER (ORDER BY CAST(ts AS INTEGER), priority) AS rn
        FROM all_events
      )
      SELECT
        'evt_' || rn AS event_id,
        printf('%02d:%02d.%03d',
          CAST((ts - (SELECT t_start FROM time_bounds)) / 60000000000 AS INT),
          CAST(((ts - (SELECT t_start FROM time_bounds)) / 1000000000) % 60 AS INT),
          CAST(((ts - (SELECT t_start FROM time_bounds)) / 1000000) % 1000 AS INT)
        ) AS time_offset,
        printf('%d', ts) AS ts,
        printf('%d', dur) AS dur,
        CAST(dur / 1000000 AS INT) AS dur_ms,
        event_type,
        event,
        app_package,
        CASE
          -- 启动评级
          WHEN event_type = 'cold_start' AND dur / 1e6 < 500 THEN '🟢 优秀'
          WHEN event_type = 'cold_start' AND dur / 1e6 < 1000 THEN '🟡 良好'
          WHEN event_type = 'cold_start' THEN '🔴 需优化'
          WHEN event_type = 'warm_start' AND dur / 1e6 < 300 THEN '🟢 优秀'
          WHEN event_type = 'warm_start' AND dur / 1e6 < 600 THEN '🟡 良好'
          WHEN event_type = 'warm_start' THEN '🔴 需优化'
          WHEN event_type = 'hot_start' AND dur / 1e6 < 100 THEN '🟢 优秀'
          WHEN event_type = 'hot_start' AND dur / 1e6 < 200 THEN '🟡 良好'
          WHEN event_type = 'hot_start' THEN '🔴 需优化'
          -- ANR 固定严重
          WHEN event_type = 'anr' THEN '🔴 ANR'
          -- 窗口转场评级
          WHEN event_type = 'window_transition' AND dur / 1e6 < 300 THEN '🟢'
          WHEN event_type = 'window_transition' AND dur / 1e6 < 500 THEN '🟡'
          WHEN event_type = 'window_transition' THEN '🔴'
          -- 其他事件不评级
          ELSE ''
        END AS rating
      FROM ranked
      ORDER BY ts, priority
      ) AS scene_rows
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: clean_timeline
    optional: true

  # ==========================================================================
  # 合并所有事件生成时间线 (deprecated — superseded by clean_timeline)
  # ==========================================================================
  - id: merged_timeline
    type: atomic
    name: "合并时间线"
    condition: table_availability.data[0]?.has_screen_state === 1 || table_availability.data[0]?.has_input_events === 1 || table_availability.data[0]?.has_startups === 1 || table_availability.data[0]?.has_frame_timeline === 1
    display:
      level: hidden
      layer: list
      title: "操作时间线"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur
        - name: dur
          label: "持续"
          type: duration
          format: duration_ms
          unit: ns
        - name: time_offset_sec
          label: "时间偏移(s)"
          type: number
        - name: event
          label: "事件"
          type: string
        - name: category
          label: "类别"
          type: string
        - name: priority
          label: "优先级"
          type: number
    sql_fragments: [fragments/android_input_events_normalized.sql, fragments/scene_input_facts.sql, fragments/scene_screen_facts.sql]
    sql: |
      WITH events AS (
        SELECT ts, dur, CASE gesture_type WHEN 'touch_move' THEN '连续触摸移动' WHEN 'touch_hold' THEN '持续触摸（长按识别未确认）' WHEN 'tap' THEN '点击接触' WHEN 'cancelled' THEN '触摸取消' WHEN 'key' THEN '按键输入' WHEN 'scroll_input' THEN '滚动轴输入（ACTION_SCROLL）' WHEN 'wheel' THEN '滚轮输入' ELSE '输入活动（动作信息不完整）' END AS event, 'gesture' AS category, 3 AS priority FROM scene_gestures
        UNION ALL SELECT ts, end_ts - ts, raw_state, 'screen', 1 FROM scene_screen_facts
        UNION ALL SELECT ts, dur, '应用启动: ' || package, 'app_launch', 2 FROM android_startups WHERE dur >= 0
      )
      SELECT printf('%d', ts) AS ts, printf('%d', dur) AS dur,
        ROUND((ts - (SELECT start_ts FROM trace_bounds)) / 1e9, 2) AS time_offset_sec,
        event, category, priority, COUNT(*) OVER () AS total_rows
      FROM events ORDER BY ts, priority
      LIMIT MIN(MAX(CAST(${scene_row_limit|4096} AS INT), 1), 4096)
    save_as: timeline
    optional: true

output:
  format: layered
  default_expanded: [L1, L2]
