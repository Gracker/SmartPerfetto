name: scrolling_analysis
version: "2.1"  # v2.1: add android.input pipeline evidence and input-bound frame attribution
type: composite
tier: S

meta:
  display_name: "滑动性能分析"
  description: "基于 Perfetto FrameTimeline 与 android.input 的滑动分析，分层展示：概览 → 区间 → 帧详情"
  icon: "swipe"
  tags: [scrolling, jank, fps, frames, input, latency, layered]

triggers:
  keywords:
    zh: [滑动, 卡顿, 帧率, 掉帧, 丢帧, FPS, 流畅度, 列表滑动, fling, 输入延迟, 触摸延迟, 跟手]
    en: [scroll, jank, fps, frame, fling, stutter, smoothness, list, input latency, touch latency, follow finger]
  patterns:
    - ".*滑动.*卡.*"
    - ".*scroll.*jank.*"
    - ".*帧率.*"

prerequisites:
  modules:
    - android.input
    - android.frames.timeline
    - android.frames.jank_type
    - android.binder
    - android.garbage_collection
    - android.monitor_contention

inputs:
  - name: package
    type: string
    required: false
    description: "应用包名（可选，不填则分析所有应用）"
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳（纳秒，可选）"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳（纳秒，可选）"
  - name: enable_frame_details
    type: boolean
    required: false
    description: "是否执行逐帧详情分析（L4，默认不执行）"
  - name: max_frames_per_session
    type: number
    required: false
    description: "每个滑动区间最多返回的掉帧帧数（默认 200，配合 batch_frame_root_cause 批量分类）"
  - name: enable_expert_probes
    type: boolean
    required: false
    default: true
    description: "是否启用专家探针（帧方差等）"
  - name: frame_variance_probe_min_janky_frames
    type: number
    required: false
    default: 5
    description: "触发帧方差探针的最小掉帧数"
  - name: frame_variance_transition_threshold_ms
    type: number
    required: false
    default: 8
    description: "帧间高抖动阈值（ms）"
  - name: input_handling_budget_ratio
    type: number
    required: false
    default: 0.5
    description: "输入处理慢判定阈值：占当前 VSync 帧预算的比例（默认 50%）"
  - name: input_event_backlog_threshold
    type: number
    required: false
    default: 3
    description: "同帧输入事件堆积候选阈值（默认 3，必须同时有处理耗时证据才作为根因）"

identity:
  policy: verify_if_present
  scope: process
  aliases: [package, process_name]
  rewriteTo: recommended_process_name_param

steps:
  # ==========================================================================
  # Step 0: 初始化共享 CPU 拓扑视图
  # ==========================================================================
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # ==========================================================================
  # L0: 数据源检测 - FrameTimeline 是否可用
  # ==========================================================================
  - id: frame_timeline_check
    type: atomic
    name: "FrameTimeline 数据源检测"
    display: false
    sql: |
      SELECT
        CASE
          WHEN EXISTS (
            SELECT 1 FROM sqlite_master
            WHERE type = 'table' AND name = 'actual_frame_timeline_slice'
          ) THEN 1
          ELSE 0
        END as has_frame_timeline
    save_as: frame_timeline

  # ==========================================================================
  # L1: 环境配置检测 - Vsync/刷新率
  # ==========================================================================
  - id: vsync_config
    type: atomic
    name: "Vsync 配置"
    sql_fragments:
      - fragments/vsync_config.sql
    display:
      level: summary
      layer: overview
      title: "显示配置"
      columns:
        - name: refresh_rate_hz
          label: "刷新率"
          type: number
          format: compact
        - name: vsync_period_ms
          label: "VSync 周期"
          type: duration
          format: duration_ms
          unit: ms
        - name: vsync_source
          label: "来源"
          type: string
        - name: total_frames
          label: "总帧数"
          type: number
          format: compact
    sql: |
      WITH
      frame_count AS (
        SELECT COUNT(*) as total_frames
        FROM actual_frame_timeline_slice a
        LEFT JOIN process p ON a.upid = p.upid
        WHERE (
            '${package}' = ''
            OR p.name = '${package}'
            OR p.name GLOB '${package}:*'
          )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
          AND COALESCE(a.display_frame_token, a.surface_frame_token) IS NOT NULL
      )
      SELECT
        vsync_period_ns,
        CAST(ROUND(1e9 / vsync_period_ns) AS INTEGER) as refresh_rate_hz,
        ROUND(vsync_period_ns / 1e6, 2) as vsync_period_ms,
        vsync_source,
        (SELECT total_frames FROM frame_count) as total_frames,
        CASE WHEN (SELECT total_frames FROM frame_count) > 0 THEN 1 ELSE 0 END as has_data
      FROM vsync_config
    save_as: environment
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1"

  # Compare package-scoped FrameTimeline coverage with one qualified primary
  # BufferTX producer track before selecting the mutually exclusive overview.
  - id: buffer_tx_coverage_probe
    type: atomic
    name: "BufferTX / FrameTimeline 覆盖探针"
    optional: true
    display: false
    sql_fragments:
      - fragments/vsync_config.sql
      - fragments/buffer_tx_frame_production.sql
    sql: |
      WITH
      target_process_presence AS (
        SELECT COUNT(*) as target_process_count
        FROM process p
        WHERE '${package}' <> ''
          AND (
            p.name = '${package}'
            OR p.name GLOB '${package}:*'
          )
      ),
      frame_timeline_coverage AS (
        SELECT COUNT(DISTINCT CASE
          WHEN a.display_frame_token IS NOT NULL
            THEN 'display:' || CAST(a.display_frame_token AS TEXT)
          WHEN a.surface_frame_token IS NOT NULL
            THEN 'surface:' || COALESCE(a.layer_name, '') || ':' || CAST(a.surface_frame_token AS TEXT)
          ELSE NULL
        END) as frame_timeline_frames
        FROM actual_frame_timeline_slice a
        LEFT JOIN process p ON a.upid = p.upid
        WHERE (
            '${package}' = ''
            OR p.name = '${package}'
            OR p.name GLOB '${package}:*'
          )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
      )
      SELECT
        tp.target_process_count,
        CASE
          WHEN '${package}' = '' THEN 'not_requested'
          WHEN tp.target_process_count = 0 THEN 'not_found'
          ELSE 'found'
        END as target_process_status,
        ft.frame_timeline_frames,
        COALESCE(bt.produced_frames, 0) as buffer_tx_frames,
        CASE
          WHEN bt.produced_frames > 0
            THEN ROUND(ft.frame_timeline_frames * 1.0 / bt.produced_frames, 4)
          ELSE NULL
        END as frame_timeline_to_buffer_tx_ratio,
        bt.track_id as buffer_tx_track_id,
        bt.track_name as frame_source_track,
        bt.effective_span_ns as buffer_tx_effective_span_ns,
        CASE
          WHEN '${package}' <> '' AND tp.target_process_count = 0
            THEN 'target_process_not_found'
          WHEN bt.track_id IS NULL THEN 'no_buffer_tx_candidate'
          WHEN ft.frame_timeline_frames = 0 THEN 'no_frame_timeline_coverage'
          WHEN ft.frame_timeline_frames * 1.0 / bt.produced_frames < 0.75
            THEN 'partial_frame_timeline_coverage'
          ELSE 'sufficient_frame_timeline_coverage'
        END as coverage_status,
        CASE
          WHEN '${package}' <> '' AND tp.target_process_count = 0 THEN 0
          WHEN bt.track_id IS NOT NULL
            AND (
              ft.frame_timeline_frames = 0
              OR ft.frame_timeline_frames * 1.0 / bt.produced_frames < 0.75
            )
            THEN 1
          ELSE 0
        END as should_fallback
      FROM frame_timeline_coverage ft
      CROSS JOIN target_process_presence tp
      LEFT JOIN selected_buffer_tx_track bt ON 1 = 1
    save_as: buffer_tx_coverage
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1"

  # ==========================================================================
  # L1: 帧性能汇总 (双信号混合检测掉帧)
  # ==========================================================================
  # 核心原理：
  # - 非 BS 帧：present_type IN ('Late Present', 'Dropped Frame') 为权威信号
  # - BS 帧：present_type 始终为 Late Present，需用 present_ts 间隔二次验证
  #   间隔 > 1.5x vsync = 真实掉帧；否则 = 管线背压（非感知掉帧）
  # - vsync_missed 用 present_ts 间隔估算严重度（辅助信号）
  # - jank_type 用于判断责任归属（App vs SF）
  - id: performance_summary
    type: atomic
    name: "帧性能汇总"
    synthesize:
      role: overview
      fields:
        - key: total_frames
          label: 总帧数
        - key: perceived_jank_frames
          label: 感知掉帧
          format: "{{value}} ({{jank_rate}}%)"
        - key: buffer_stuffing_frames
          label: Buffer Stuffing
          format: "{{value}} ({{buffer_stuffing_rate}}%)"
        - key: avg_fps
          label: 平均 FPS
        - key: app_jank
          label: App 侧掉帧
        - key: sf_jank
          label: SF 侧掉帧
      insights:
        - condition: "jank_rate > 10"
          template: "感知掉帧率 {{jank_rate}}% 较高，需要优化"
        - condition: "buffer_stuffing_rate > 50"
          template: "Buffer Stuffing 占比 {{buffer_stuffing_rate}}%，管线背压显著（非 App 问题）"
        - condition: "app_jank > sf_jank"
          template: "App 侧掉帧 ({{app_jank}}) 多于 SF 侧 ({{sf_jank}})"
    display:
      level: summary
      layer: overview
      title: "滑动性能概览"
      columns:
        - name: total_frames
          label: "总帧数"
          type: number
          format: compact
        - name: perceived_jank_frames
          label: "感知掉帧"
          type: number
          format: compact
        - name: jank_rate
          label: "感知掉帧率"
          type: percentage
          format: percentage
        - name: buffer_stuffing_frames
          label: "Buffer Stuffing"
          type: number
          format: compact
        - name: buffer_stuffing_rate
          label: "BS 占比"
          type: percentage
          format: percentage
          hidden: true
        - name: app_janky_frames
          label: "App 侧掉帧"
          type: number
          format: compact
        - name: sf_jank_count
          label: "SF 侧掉帧"
          type: number
          format: compact
        - name: actual_fps
          label: "实际 FPS"
          type: number
        - name: refresh_rate
          label: "刷新率"
          type: number
        - name: avg_frame_dur
          label: "平均呈现间隔"
          type: duration
          format: duration_ms
          unit: ns
        - name: p95_frame_dur
          label: "P95 呈现间隔"
          type: duration
          format: duration_ms
          unit: ns
        - name: rating
          label: "评级"
          type: string
    sql: |
      WITH
      -- 获取 VSync 周期（从 VSYNC-sf 信号计算，限定在分析区间内）
      vsync_intervals AS (
        SELECT
          c.ts - LAG(c.ts) OVER (ORDER BY c.ts) as interval_ns
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        WHERE t.name = 'VSYNC-sf'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      ),
      timing_config AS (
        SELECT CASE
          WHEN raw_ns BETWEEN 5500000 AND 6500000 THEN 6060606
          WHEN raw_ns BETWEEN 6500001 AND 7500000 THEN 6944444
          WHEN raw_ns BETWEEN 7500001 AND 9500000 THEN 8333333
          WHEN raw_ns BETWEEN 9500001 AND 12500000 THEN 11111111
          WHEN raw_ns BETWEEN 12500001 AND 20000000 THEN 16666667
          WHEN raw_ns BETWEEN 20000001 AND 35000000 THEN 33333333
          ELSE raw_ns
        END AS vsync_period_ns
        FROM (
          SELECT CAST(COALESCE(
            (SELECT PERCENTILE(interval_ns, 50)
             FROM vsync_intervals
             WHERE interval_ns > 5500000 AND interval_ns < 50000000),
            16666667
          ) AS INTEGER) AS raw_ns
        )
      ),
      -- APP_FRAME_DEDUP_CTES_BEGIN
      app_frame_rows AS (
        SELECT
          a.*,
          CASE
            WHEN a.display_frame_token IS NOT NULL
              THEN 'display:' || CAST(a.display_frame_token AS TEXT)
            WHEN a.surface_frame_token IS NOT NULL
              THEN 'surface:' || COALESCE(a.layer_name, '') || ':' || CAST(a.surface_frame_token AS TEXT)
            ELSE NULL
          END as frame_key
        FROM actual_frame_timeline_slice a
        LEFT JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
          AND (a.display_frame_token IS NOT NULL OR a.surface_frame_token IS NOT NULL)
      ),
      -- APP_FRAME_DEDUP_CTES_END
      -- FRAME_TIME_RANGE_CTES_BEGIN
      display_frame_times AS (
        SELECT
          frame_key,
          MIN(ts) as frame_ts,
          MAX(ts + CASE WHEN dur > 0 THEN dur ELSE 0 END) as present_ts
        FROM app_frame_rows
        GROUP BY frame_key
      ),
      ordered_display_frames AS (
        SELECT
          frame_key,
          frame_ts,
          present_ts,
          MAX(present_ts) OVER (
            ORDER BY frame_ts, frame_key
            ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
          ) as prev_present_ts
        FROM display_frame_times
      ),
      frame_time_range_stats AS (
        SELECT
          MIN(frame_ts) as start_ts,
          MAX(present_ts) as end_ts,
          MAX(present_ts) - MIN(frame_ts) as raw_duration_ns,
          COALESCE(SUM(
            CASE
              WHEN prev_present_ts IS NOT NULL
                AND frame_ts - prev_present_ts > (SELECT vsync_period_ns * 6 FROM timing_config)
              THEN frame_ts - prev_present_ts
              ELSE 0
            END
          ), 0) as inter_session_idle_ns,
          COALESCE(SUM(
            CASE
              WHEN prev_present_ts IS NOT NULL
                AND frame_ts - prev_present_ts > (SELECT vsync_period_ns * 6 FROM timing_config)
              THEN 1
              ELSE 0
            END
          ), 0) as session_break_count
        FROM ordered_display_frames
      ),
      time_range AS (
        SELECT
          start_ts,
          end_ts,
          raw_duration_ns,
          inter_session_idle_ns,
          session_break_count,
          CASE
            WHEN raw_duration_ns IS NULL OR raw_duration_ns <= 0
              THEN (SELECT vsync_period_ns FROM timing_config)
            ELSE MAX(
              raw_duration_ns - inter_session_idle_ns,
              (SELECT vsync_period_ns FROM timing_config)
            )
          END as duration_ns
        FROM frame_time_range_stats
      ),
      -- FRAME_TIME_RANGE_CTES_END
      app_frame_intervals AS (
        SELECT
          ts + CASE WHEN dur > 0 THEN dur ELSE 0 END as present_ts,
          LAG(ts + CASE WHEN dur > 0 THEN dur ELSE 0 END)
            OVER (PARTITION BY layer_name ORDER BY ts, frame_key) as prev_present_ts
        FROM app_frame_rows
      ),
      valid_frame_intervals AS (
        SELECT
          present_ts - prev_present_ts as frame_interval_ns
        FROM app_frame_intervals
        WHERE prev_present_ts IS NOT NULL
          AND present_ts > prev_present_ts
          AND present_ts - prev_present_ts >= (SELECT vsync_period_ns FROM timing_config) * 0.5
          AND present_ts - prev_present_ts <= (SELECT vsync_period_ns FROM timing_config) * 6
      ),
      -- App 报告的掉帧（旧逻辑，仅供参考）
      app_stats AS (
        SELECT
          COUNT(DISTINCT frame_key) as total,
          COUNT(DISTINCT CASE WHEN jank_type != 'None' THEN frame_key END) as app_janky_frames,
          COALESCE(
            (SELECT CAST(ROUND(AVG(frame_interval_ns)) AS INTEGER) FROM valid_frame_intervals),
            CAST(ROUND(AVG(CASE WHEN dur > 0 THEN dur ELSE NULL END)) AS INTEGER),
            0
          ) as avg_present_interval,
          COALESCE(
            (SELECT CAST(MAX(frame_interval_ns) AS INTEGER) FROM valid_frame_intervals),
            MAX(CASE WHEN dur > 0 THEN dur ELSE NULL END),
            0
          ) as max_present_interval,
          COALESCE(
            (SELECT CAST(ROUND(PERCENTILE(frame_interval_ns, 50)) AS INTEGER) FROM valid_frame_intervals),
            CAST(ROUND(PERCENTILE(CASE WHEN dur > 0 THEN dur ELSE NULL END, 50)) AS INTEGER),
            0
          ) as median_present_interval,
          COALESCE(
            (SELECT CAST(ROUND(PERCENTILE(frame_interval_ns, 95)) AS INTEGER) FROM valid_frame_intervals),
            CAST(ROUND(PERCENTILE(CASE WHEN dur > 0 THEN dur ELSE NULL END, 95)) AS INTEGER),
            0
          ) as p95_present_interval,
          COALESCE(
            (SELECT CAST(ROUND(PERCENTILE(frame_interval_ns, 99)) AS INTEGER) FROM valid_frame_intervals),
            CAST(ROUND(PERCENTILE(CASE WHEN dur > 0 THEN dur ELSE NULL END, 99)) AS INTEGER),
            0
          ) as p99_present_interval
        FROM app_frame_rows
      ),
      -- Per-layer 帧序列：双信号混合检测基础数据
      -- present_type = SurfaceFlinger 的消费状态（非 BS 帧的权威信号）
      -- present_ts interval = BS 帧的二次验证信号（区分真实掉帧 vs 管线背压）
      consumer_layer_frames AS (
        SELECT
          frame_key,
          COALESCE(a.display_frame_token, a.surface_frame_token) as display_frame_token,
          a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END as present_ts,
          LAG(a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END)
            OVER (PARTITION BY a.layer_name ORDER BY a.ts) as prev_present_ts,
          COALESCE(a.jank_type, 'None') as jank_type,
          COALESCE(a.present_type, 'Unknown Present') as present_type,
          CASE
            WHEN a.jank_type GLOB '*Self Jank*' OR android_is_app_jank_type(a.jank_type) THEN 'APP'
            WHEN a.jank_type GLOB '*SurfaceFlinger*' THEN 'SF'
            WHEN a.jank_type GLOB '*Buffer Stuffing*' THEN 'BUFFER_STUFFING'
            WHEN android_is_sf_jank_type(a.jank_type) THEN 'SF'
            WHEN a.jank_type = 'None' OR a.jank_type IS NULL THEN 'HIDDEN'
            ELSE 'UNKNOWN'
          END as jank_responsibility,
          a.layer_name
        FROM app_frame_rows a
      ),
      -- 掉帧检测：双信号混合策略
      -- 非 BS 帧：present_type IN ('Late Present', 'Dropped Frame') 为权威信号
      -- BS 帧：present_type 始终为 Late Present，需用 present_ts 间隔作为二次验证
      --        间隔 > 1.5x vsync = 真实掉帧（被 BS 掩盖）；否则 = 管线背压（非感知掉帧）
      consumer_frame_signals AS (
        SELECT
          frame_key,
          CASE
            WHEN present_type IN ('Late Present', 'Dropped Frame')
              AND (jank_responsibility != 'BUFFER_STUFFING' OR android_is_missed_frame_type(jank_type)) THEN 1
            WHEN jank_responsibility = 'BUFFER_STUFFING'
              AND prev_present_ts IS NOT NULL
              AND present_ts - prev_present_ts > (SELECT vsync_period_ns FROM timing_config) * 1.5
              AND present_ts - prev_present_ts <= (SELECT vsync_period_ns FROM timing_config) * 6 THEN 1
            ELSE 0
          END as consumer_jank,
          CASE
            WHEN present_type IN ('Late Present', 'Dropped Frame')
              AND jank_responsibility = 'APP' THEN 1
            ELSE 0
          END as app_jank,
          CASE WHEN jank_responsibility = 'BUFFER_STUFFING' THEN 1 ELSE 0 END as buffer_stuffing,
          CASE
            WHEN (
              (present_type IN ('Late Present', 'Dropped Frame')
                AND (jank_responsibility != 'BUFFER_STUFFING' OR android_is_missed_frame_type(jank_type)))
              OR (jank_responsibility = 'BUFFER_STUFFING' AND prev_present_ts IS NOT NULL
                  AND present_ts - prev_present_ts > (SELECT vsync_period_ns FROM timing_config) * 1.5
                  AND present_ts - prev_present_ts <= (SELECT vsync_period_ns FROM timing_config) * 6)
            ) AND prev_present_ts IS NOT NULL
              AND present_ts - prev_present_ts > (SELECT vsync_period_ns FROM timing_config) * 1.5
            THEN MAX(CAST(ROUND((present_ts - prev_present_ts) * 1.0 / (SELECT vsync_period_ns FROM timing_config) - 1, 0) AS INTEGER), 0)
            ELSE 0
          END as vsync_missed
        FROM consumer_layer_frames
      ),
      display_frame_signals AS (
        SELECT
          frame_key,
          MAX(consumer_jank) as consumer_jank,
          MAX(app_jank) as app_jank,
          MAX(buffer_stuffing) as buffer_stuffing,
          MAX(vsync_missed) as vsync_missed
        FROM consumer_frame_signals
        GROUP BY frame_key
      ),
      consumer_gap_stats AS (
        SELECT
          COUNT(*) as total_frames,
          SUM(consumer_jank) as consumer_jank_frames,
          SUM(app_jank) as app_jank_frames,
          SUM(buffer_stuffing) as buffer_stuffing_frames,
          SUM(vsync_missed) as total_vsync_missed,
          MAX(vsync_missed) as max_vsync_missed
        FROM display_frame_signals
      ),
      resolved_jank AS (
        SELECT
          COALESCE((SELECT consumer_jank_frames FROM consumer_gap_stats), (SELECT app_janky_frames FROM app_stats), 0) as janky_frames,
          COALESCE((SELECT app_jank_frames FROM consumer_gap_stats), (SELECT app_janky_frames FROM app_stats), 0) as app_janky_frames,
          -- 感知掉帧 = consumer_jank_frames（双信号已过滤掉正常 BS 帧）
          COALESCE((SELECT consumer_jank_frames FROM consumer_gap_stats), (SELECT app_janky_frames FROM app_stats), 0) as perceived_jank_frames,
          COALESCE((SELECT buffer_stuffing_frames FROM consumer_gap_stats), 0) as buffer_stuffing_frames,
          COALESCE((SELECT max_vsync_missed FROM consumer_gap_stats), 0) as max_vsync_missed,
          COALESCE((SELECT total_vsync_missed FROM consumer_gap_stats), 0) as total_vsync_missed,
          'present_type' as fps_source
      )
      SELECT
        (SELECT total FROM app_stats) as total_frames,
        -- 感知掉帧（排除 Buffer Stuffing）— 用户真正能感知到的掉帧
        (SELECT perceived_jank_frames FROM resolved_jank) as perceived_jank_frames,
        -- 感知掉帧率（主指标，用于 rating）
        ROUND(
          100.0 * (SELECT perceived_jank_frames FROM resolved_jank) / NULLIF((SELECT total FROM app_stats), 0),
          2
        ) as jank_rate,
        -- Buffer Stuffing 帧数（管线背压，非 App 逻辑问题）
        (SELECT buffer_stuffing_frames FROM resolved_jank) as buffer_stuffing_frames,
        -- 总掉帧数（含 Buffer Stuffing，用于完整性展示）
        (SELECT janky_frames FROM resolved_jank) as janky_frames,
        (SELECT app_janky_frames FROM resolved_jank) as app_janky_frames,
        MAX(
          (SELECT perceived_jank_frames FROM resolved_jank) -
          (SELECT app_janky_frames FROM resolved_jank),
          0
        ) as sf_jank_count,
        -- App 侧掉帧率
        ROUND(
          100.0 * (SELECT app_janky_frames FROM resolved_jank) / NULLIF((SELECT total FROM app_stats), 0),
          2
        ) as app_jank_rate,
        -- Buffer Stuffing 率
        ROUND(
          100.0 * (SELECT buffer_stuffing_frames FROM resolved_jank) / NULLIF((SELECT total FROM app_stats), 0),
          2
        ) as buffer_stuffing_rate,
        (SELECT avg_present_interval FROM app_stats) as avg_frame_dur,
        (SELECT max_present_interval FROM app_stats) as max_frame_dur,
        (SELECT median_present_interval FROM app_stats) as median_frame_dur,
        (SELECT p95_present_interval FROM app_stats) as p95_frame_dur,
        (SELECT p99_present_interval FROM app_stats) as p99_frame_dur,
        ROUND((SELECT duration_ns FROM time_range) / 1e9, 2) as duration_sec,
        MIN(
          ROUND(1e9 * (SELECT total FROM app_stats) / NULLIF((SELECT duration_ns FROM time_range), 0), 1),
          CAST(ROUND(1e9 / (SELECT vsync_period_ns FROM timing_config)) AS INTEGER)
        ) as actual_fps,
        CAST(ROUND(1e9 / (SELECT vsync_period_ns FROM timing_config)) AS INTEGER) as refresh_rate,
        -- 评级基于感知掉帧率（排除 Buffer Stuffing）
        CASE
          WHEN (SELECT perceived_jank_frames FROM resolved_jank) = 0 THEN '优秀'
          WHEN 100.0 * (SELECT perceived_jank_frames FROM resolved_jank) / NULLIF((SELECT total FROM app_stats), 0) < 1 THEN '优秀'
          WHEN 100.0 * (SELECT perceived_jank_frames FROM resolved_jank) / NULLIF((SELECT total FROM app_stats), 0) < 5 THEN '良好'
          WHEN 100.0 * (SELECT perceived_jank_frames FROM resolved_jank) / NULLIF((SELECT total FROM app_stats), 0) < 15 THEN '一般'
          ELSE '较差'
        END as rating,
        (SELECT fps_source FROM resolved_jank) as fps_source,
        (SELECT max_vsync_missed FROM resolved_jank) as max_vsync_missed,
        (SELECT total_vsync_missed FROM resolved_jank) as total_vsync_missed,
        ROUND((SELECT vsync_period_ns FROM timing_config) / 1e6, 2) as vsync_period_ms
      LIMIT 1
    save_as: perf_summary
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && environment.data[0]?.has_data === 1 && buffer_tx_coverage.data[0]?.coverage_status !== 'target_process_not_found' && buffer_tx_coverage.data[0]?.should_fallback !== 1"

  # FrameTimeline 在部分 SurfaceView/软件渲染/OEM trace 中存在但无目标包行。
  # 此时只从目标包 BufferTX 正向 delta 恢复帧产出/FPS；不伪造 jank 或根因。
  - id: buffer_tx_performance_fallback
    type: atomic
    name: "BufferTX 帧率回退"
    sql_fragments:
      - fragments/vsync_config.sql
      - fragments/buffer_tx_frame_production.sql
    synthesize:
      role: overview
      fields:
        - key: total_frames
          label: BufferTX 产出帧
        - key: actual_fps
          label: 平均 FPS
        - key: fps_source
          label: 帧率来源
        - key: duration_sec
          label: 有效时段
        - key: frame_source_track
          label: BufferTX 证据轨道
        - key: coverage_status
          label: FrameTimeline 覆盖状态
        - key: frame_timeline_to_buffer_tx_ratio
          label: FrameTimeline 覆盖率
        - key: vsync_source
          label: VSync 证据来源
        - key: evidence_status
          label: 可交付证据范围
    display:
      level: summary
      layer: overview
      title: "滑动帧率概览（BufferTX 回退）"
      columns:
        - name: total_frames
          label: "BufferTX 产出帧"
          type: number
          format: compact
        - name: actual_fps
          label: "实际 FPS"
          type: number
        - name: duration_sec
          label: "有效时段(s)"
          type: number
        - name: refresh_rate
          label: "刷新率"
          type: number
        - name: fps_source
          label: "帧率来源"
          type: string
        - name: vsync_source
          label: "VSync 证据来源"
          type: string
        - name: frame_source_track
          label: "BufferTX 证据轨道"
          type: string
        - name: frame_timeline_to_buffer_tx_ratio
          label: "FrameTimeline/BufferTX 帧数比"
          type: number
        - name: coverage_status
          label: "FrameTimeline 覆盖状态"
          type: string
        - name: evidence_status
          label: "可交付证据范围"
          type: string
        - name: rating
          label: "证据边界"
          type: string
    sql: |
      WITH
      frame_timeline_coverage AS (
        SELECT COUNT(DISTINCT CASE
          WHEN a.display_frame_token IS NOT NULL
            THEN 'display:' || CAST(a.display_frame_token AS TEXT)
          WHEN a.surface_frame_token IS NOT NULL
            THEN 'surface:' || COALESCE(a.layer_name, '') || ':' || CAST(a.surface_frame_token AS TEXT)
          ELSE NULL
        END) as frame_timeline_frames
        FROM actual_frame_timeline_slice a
        LEFT JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
      ),
      fallback_summary AS (
        SELECT
          bt.produced_frames as total_frames,
          ROUND(bt.effective_span_ns / 1e9, 3) as duration_sec,
          MIN(
            ROUND(bt.produced_frames * 1e9 / NULLIF(bt.effective_span_ns, 0), 1),
            CAST(ROUND(1e9 / (SELECT vsync_period_ns FROM vsync_config)) AS INTEGER)
          ) as actual_fps,
          bt.track_name as frame_source_track,
          ft.frame_timeline_frames,
          ROUND(ft.frame_timeline_frames * 1.0 / bt.produced_frames, 4) as frame_timeline_to_buffer_tx_ratio,
          CASE
            WHEN ft.frame_timeline_frames = 0 THEN 'no_frame_timeline_coverage'
            ELSE 'partial_frame_timeline_coverage'
          END as coverage_status
        FROM selected_buffer_tx_track bt
        CROSS JOIN frame_timeline_coverage ft
      )
      SELECT
        total_frames,
        NULL as perceived_jank_frames,
        NULL as jank_rate,
        NULL as buffer_stuffing_frames,
        NULL as janky_frames,
        NULL as app_janky_frames,
        NULL as sf_jank_count,
        NULL as app_jank_rate,
        NULL as buffer_stuffing_rate,
        NULL as avg_frame_dur,
        NULL as max_frame_dur,
        NULL as median_frame_dur,
        NULL as p95_frame_dur,
        NULL as p99_frame_dur,
        duration_sec,
        actual_fps,
        CAST(ROUND(1e9 / (SELECT vsync_period_ns FROM vsync_config)) AS INTEGER) as refresh_rate,
        '仅帧率（FrameTimeline 根因证据不足）' as rating,
        'buffer_tx_rising_edge_fallback' as fps_source,
        NULL as max_vsync_missed,
        NULL as total_vsync_missed,
        ROUND((SELECT vsync_period_ns FROM vsync_config) / 1e6, 2) as vsync_period_ms,
        (SELECT vsync_source FROM vsync_config) as vsync_source,
        frame_source_track,
        frame_timeline_frames,
        total_frames as buffer_tx_frames,
        frame_timeline_to_buffer_tx_ratio,
        coverage_status,
        'frame_rate_only' as evidence_status
      FROM fallback_summary
    save_as: perf_summary
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && buffer_tx_coverage.data[0]?.should_fallback === 1"

  # ==========================================================================
  # L1: Input Pipeline 数据源与延迟概览
  # ==========================================================================
  # android.input stdlib 将 InputDispatcher socket 传输、App ACK 与关联帧
  # 标准化为 android_input_events。这里把它作为可选证据源：缺数据不阻断
  # FrameTimeline 滑动分析，有数据时补充分发/处理/ACK/跟手度分解。
  - id: input_data_fallback_view
    type: atomic
    name: "Input 数据源回退视图"
    optional: true
    display: false
    sql: |
      CREATE VIEW IF NOT EXISTS android_input_events AS
      SELECT
        CAST(NULL AS INTEGER) as dispatch_latency_dur,
        CAST(NULL AS INTEGER) as handling_latency_dur,
        CAST(NULL AS INTEGER) as ack_latency_dur,
        CAST(NULL AS INTEGER) as total_latency_dur,
        CAST(NULL AS INTEGER) as end_to_end_latency_dur,
        CAST(NULL AS INTEGER) as tid,
        CAST(NULL AS TEXT) as thread_name,
        CAST(NULL AS INTEGER) as upid,
        CAST(NULL AS INTEGER) as pid,
        CAST(NULL AS TEXT) as process_name,
        CAST(NULL AS TEXT) as event_type,
        CAST(NULL AS TEXT) as event_action,
        CAST(NULL AS INTEGER) as event_seq,
        CAST(NULL AS TEXT) as event_channel,
        CAST(NULL AS TEXT) as normalized_event_channel,
        CAST(NULL AS INTEGER) as input_event_id,
        CAST(NULL AS INTEGER) as read_time,
        CAST(NULL AS INTEGER) as dispatch_track_id,
        CAST(NULL AS INTEGER) as dispatch_ts,
        CAST(NULL AS INTEGER) as dispatch_dur,
        CAST(NULL AS INTEGER) as receive_track_id,
        CAST(NULL AS INTEGER) as receive_ts,
        CAST(NULL AS INTEGER) as receive_dur,
        CAST(NULL AS INTEGER) as frame_id,
        CAST(NULL AS INTEGER) as is_speculative_frame,
        CAST(NULL AS INTEGER) as event_time
      WHERE 0
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && environment.data[0]?.has_data === 1"

  - id: input_data_check
    type: atomic
    name: "Input 数据源检测"
    optional: true
    display:
      level: summary
      layer: overview
      title: "Input 数据源"
      columns:
        - name: input_data_status
          label: "状态"
          type: string
        - name: total_input_events
          label: "输入事件"
          type: number
          format: compact
        - name: move_events
          label: "MOVE事件"
          type: number
          format: compact
        - name: frame_matched_events
          label: "关联帧事件"
          type: number
          format: compact
        - name: target_processes
          label: "进程数"
          type: number
          format: compact
    sql: |
      WITH scoped_events AS (
        SELECT *
        FROM android_input_events
        WHERE (
          '${package}' = ''
          OR process_name = '${package}'
          OR process_name GLOB '${package}:*'
        )
          AND (${start_ts} IS NULL OR receive_ts + receive_dur > ${start_ts})
          AND (${end_ts} IS NULL OR dispatch_ts < ${end_ts})
      )
      SELECT
        CASE
          WHEN COUNT(*) = 0 THEN 'unavailable'
          WHEN COALESCE(SUM(CASE WHEN frame_id IS NOT NULL THEN 1 ELSE 0 END), 0) = 0 THEN 'no_frame_match'
          ELSE 'available'
        END as input_data_status,
        COUNT(*) as total_input_events,
        COALESCE(SUM(CASE WHEN event_action = 'MOVE' THEN 1 ELSE 0 END), 0) as move_events,
        COALESCE(SUM(CASE WHEN frame_id IS NOT NULL THEN 1 ELSE 0 END), 0) as frame_matched_events,
        COUNT(DISTINCT process_name) as target_processes
      FROM scoped_events
    save_as: input_data
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && environment.data[0]?.has_data === 1"

  - id: input_latency_summary
    type: atomic
    name: "Input 延迟概览"
    optional: true
    synthesize:
      role: overview
      fields:
        - key: total_input_events
          label: 输入事件
        - key: max_handling_ms
          label: 最慢 App 处理
          format: "{{value}} ms"
        - key: slow_handling_events
          label: 慢输入处理事件
        - key: max_e2e_ms
          label: 最慢 Input→Present
          format: "{{value}} ms"
        - key: input_backlog_frames
          label: 输入堆积帧
      insights:
        - condition: "slow_handling_events > 0"
          template: "检测到 {{slow_handling_events}} 个输入事件的 App 处理耗时超过帧预算阈值"
        - condition: "input_backlog_frames > 0"
          template: "{{input_backlog_frames}} 个帧关联的输入事件数超过堆积候选阈值"
        - condition: "speculative_frame_matches > 0"
          template: "{{speculative_frame_matches}} 个输入事件使用推测帧关联，跟手度证据需降权"
    display:
      level: summary
      layer: overview
      title: "Input 延迟概览"
      columns:
        - name: target_process
          label: "目标进程"
          type: string
        - name: total_input_events
          label: "输入事件"
          type: number
          format: compact
        - name: move_events
          label: "MOVE事件"
          type: number
          format: compact
        - name: avg_dispatch_ms
          label: "平均分发"
          type: duration
          format: duration_ms
          unit: ms
        - name: p95_handling_ms
          label: "P95 App处理"
          type: duration
          format: duration_ms
          unit: ms
        - name: max_handling_ms
          label: "最慢App处理"
          type: duration
          format: duration_ms
          unit: ms
        - name: max_e2e_ms
          label: "最慢Input→Present"
          type: duration
          format: duration_ms
          unit: ms
        - name: slow_handling_events
          label: "慢处理事件"
          type: number
          format: compact
        - name: input_backlog_frames
          label: "输入堆积帧"
          type: number
          format: compact
        - name: speculative_frame_matches
          label: "推测帧关联"
          type: number
          format: compact
        - name: input_latency_rating
          label: "评级"
          type: string
    sql: |
      WITH
      vsync_intervals AS (
        SELECT c.ts - LAG(c.ts) OVER (ORDER BY c.ts) as interval_ns
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        WHERE t.name = 'VSYNC-sf'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      ),
      timing_config AS (
        SELECT CASE
          WHEN raw_ns BETWEEN 5500000 AND 6500000 THEN 6060606
          WHEN raw_ns BETWEEN 6500001 AND 7500000 THEN 6944444
          WHEN raw_ns BETWEEN 7500001 AND 9500000 THEN 8333333
          WHEN raw_ns BETWEEN 9500001 AND 12500000 THEN 11111111
          WHEN raw_ns BETWEEN 12500001 AND 20000000 THEN 16666667
          WHEN raw_ns BETWEEN 20000001 AND 35000000 THEN 33333333
          ELSE raw_ns
        END AS vsync_period_ns
        FROM (
          SELECT CAST(COALESCE(
            (SELECT PERCENTILE(interval_ns, 50)
             FROM vsync_intervals
             WHERE interval_ns > 5500000 AND interval_ns < 50000000),
            16666667
          ) AS INTEGER) AS raw_ns
        )
      ),
      scoped_events AS (
        SELECT *
        FROM android_input_events
        WHERE (
          '${package}' = ''
          OR process_name = '${package}'
          OR process_name GLOB '${package}:*'
        )
          AND (${start_ts} IS NULL OR receive_ts + receive_dur > ${start_ts})
          AND (${end_ts} IS NULL OR dispatch_ts < ${end_ts})
      ),
      ranked_processes AS (
        SELECT
          process_name,
          COUNT(*) as event_count,
          ROW_NUMBER() OVER (ORDER BY COUNT(*) DESC, MAX(total_latency_dur) DESC) as rn
        FROM scoped_events
        GROUP BY process_name
      ),
      target AS (
        SELECT process_name
        FROM ranked_processes
        WHERE rn = 1
      ),
      target_events AS (
        SELECT e.*
        FROM scoped_events e
        JOIN target t ON e.process_name = t.process_name
      ),
      frame_backlog AS (
        SELECT frame_id, COUNT(*) as event_count
        FROM target_events
        WHERE frame_id IS NOT NULL
        GROUP BY frame_id
      )
      SELECT
        (SELECT process_name FROM target) as target_process,
        COUNT(*) as total_input_events,
        SUM(CASE WHEN event_action = 'MOVE' THEN 1 ELSE 0 END) as move_events,
        ROUND(AVG(dispatch_latency_dur) / 1e6, 2) as avg_dispatch_ms,
        ROUND(MAX(dispatch_latency_dur) / 1e6, 2) as max_dispatch_ms,
        ROUND(AVG(handling_latency_dur) / 1e6, 2) as avg_handling_ms,
        ROUND(PERCENTILE(handling_latency_dur, 95) / 1e6, 2) as p95_handling_ms,
        ROUND(MAX(handling_latency_dur) / 1e6, 2) as max_handling_ms,
        ROUND(AVG(ack_latency_dur) / 1e6, 2) as avg_ack_ms,
        ROUND(MAX(ack_latency_dur) / 1e6, 2) as max_ack_ms,
        ROUND(AVG(end_to_end_latency_dur) / 1e6, 2) as avg_e2e_ms,
        ROUND(MAX(end_to_end_latency_dur) / 1e6, 2) as max_e2e_ms,
        SUM(CASE
          WHEN handling_latency_dur > (SELECT vsync_period_ns FROM timing_config) * ${input_handling_budget_ratio|0.5}
          THEN 1 ELSE 0 END) as slow_handling_events,
        (SELECT COUNT(*) FROM frame_backlog WHERE event_count >= ${input_event_backlog_threshold|3}) as input_backlog_frames,
        SUM(CASE WHEN is_speculative_frame = 1 THEN 1 ELSE 0 END) as speculative_frame_matches,
        ROUND((SELECT vsync_period_ns FROM timing_config) / 1e6, 2) as frame_budget_ms,
        CASE
          WHEN COUNT(*) = 0 THEN '无 input 事件'
          WHEN SUM(CASE WHEN handling_latency_dur > (SELECT vsync_period_ns FROM timing_config) * ${input_handling_budget_ratio|0.5} THEN 1 ELSE 0 END) = 0 THEN '正常'
          WHEN MAX(handling_latency_dur) > (SELECT vsync_period_ns FROM timing_config) * 2 THEN '严重'
          ELSE '需关注'
        END as input_latency_rating
      FROM target_events
    save_as: input_latency
    condition: "input_data.data[0]?.total_input_events > 0"

  # ==========================================================================
  # L1: 专家探针 - 时间窗与帧波动
  # ==========================================================================
  # 原则：
  # 1) 用户显式给 start_ts/end_ts 时严格尊重用户窗口
  # 2) 未给窗口时，自动使用目标包名的 FrameTimeline 边界作为分析窗口
  # 3) 仅在已确认存在可见掉帧时才启用额外探针，避免无谓开销
  - id: expert_analysis_window
    type: atomic
    name: "专家分析窗口"
    display: false
    sql: |
      WITH frame_bounds AS (
        SELECT
          MIN(a.ts) as min_ts,
          MAX(a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END) as max_ts
        FROM actual_frame_timeline_slice a
        LEFT JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND COALESCE(a.display_frame_token, a.surface_frame_token) IS NOT NULL
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
      )
      SELECT
        CASE
          WHEN COALESCE(${start_ts}, min_ts) IS NOT NULL
            THEN printf('%d', COALESCE(${start_ts}, min_ts))
          ELSE NULL
        END as window_start_ts,
        CASE
          WHEN COALESCE(${end_ts}, max_ts) IS NOT NULL
            THEN printf('%d', COALESCE(${end_ts}, max_ts))
          ELSE NULL
        END as window_end_ts,
        CASE
          WHEN COALESCE(${start_ts}, min_ts) IS NOT NULL
            AND COALESCE(${end_ts}, max_ts) IS NOT NULL
            THEN ROUND((COALESCE(${end_ts}, max_ts) - COALESCE(${start_ts}, min_ts)) / 1e6, 2)
          ELSE NULL
        END as window_ms,
        CASE
          WHEN ${start_ts} IS NOT NULL OR ${end_ts} IS NOT NULL THEN 'user_selected'
          WHEN min_ts IS NOT NULL AND max_ts IS NOT NULL THEN 'auto_frame_bounds'
          ELSE 'unavailable'
        END as window_source
      FROM frame_bounds
    save_as: expert_window
    condition: "${enable_expert_probes|true} == true && frame_timeline.data[0]?.has_frame_timeline === 1 && environment.data[0]?.has_data === 1"
    optional: true

  - id: frame_variance_probe
    type: skill
    name: "帧方差探针"
    skill: frame_pipeline_variance
    params:
      package: "${package}"
      start_ts: "${expert_window.data?.[0]?.window_start_ts ?? start_ts ?? null}"
      end_ts: "${expert_window.data?.[0]?.window_end_ts ?? end_ts ?? null}"
      transition_threshold_ms: "${frame_variance_transition_threshold_ms|8}"
    display:
      level: summary
      layer: overview
      title: "帧稳定性方差（专家探针）"
      columns:
        - name: total_frames
          label: "总帧数"
          type: number
        - name: avg_frame_ms
          label: "平均帧耗时"
          type: duration
          format: duration_ms
          unit: ms
        - name: stddev_ms
          label: "标准差"
          type: duration
          format: duration_ms
          unit: ms
        - name: avg_delta_ms
          label: "帧间波动"
          type: duration
          format: duration_ms
          unit: ms
        - name: high_variance_transitions
          label: "高抖动转折"
          type: number
        - name: variance_level
          label: "波动等级"
          type: string
    save_as: frame_variance_probe
    condition: "${enable_expert_probes|true} == true && frame_timeline.data[0]?.has_frame_timeline === 1 && (perf_summary?.data?.[0]?.janky_frames || 0) >= (frame_variance_probe_min_janky_frames || 5)"
    optional: true

  # ==========================================================================
  # L1: 掉帧分析 - 消费端 vs App 报告对比
  # ==========================================================================
  # 展示 jank_type 与实际消费端掉帧的关系
  # - 假阳性: jank_type 报告掉帧，但 gap=1 (用户看到流畅)
  # - 假阴性: jank_type=None，但 gap>1 (用户看到卡顿)
  - id: jank_type_stats
    type: atomic
    name: "掉帧类型统计"
    display:
      level: summary
      layer: overview
      title: "掉帧类型分布"
      columns:
        - name: jank_type
          label: "掉帧类型"
          type: string
        - name: count
          label: "帧数"
          type: number
          format: compact
        - name: real_jank_count
          label: "实际掉帧"
          type: number
          format: compact
        - name: false_positive
          label: "假阳性"
          type: number
        - name: total_dur
          label: "总耗时"
          type: duration
          format: duration_ms
          unit: ns
        - name: avg_dur
          label: "平均耗时"
          type: duration
          format: duration_ms
          unit: ns
        - name: responsibility
          label: "类型标签"
          type: string
        - name: frame_timeline_coverage_status
          label: "FrameTimeline 覆盖状态"
          type: string
          hidden: true
        - name: frame_timeline_to_buffer_tx_ratio
          label: "FrameTimeline/BufferTX 帧数比"
          type: number
          hidden: true
        - name: evidence_scope
          label: "根因证据范围"
          type: string
          hidden: true
    sql: |
      WITH
      vsync_intervals AS (
        SELECT
          c.ts - LAG(c.ts) OVER (ORDER BY c.ts) as interval_ns
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        WHERE t.name = 'VSYNC-sf'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      ),
      vsync_config AS (
        SELECT CASE
          WHEN raw_ns BETWEEN 5500000 AND 6500000 THEN 6060606
          WHEN raw_ns BETWEEN 6500001 AND 7500000 THEN 6944444
          WHEN raw_ns BETWEEN 7500001 AND 9500000 THEN 8333333
          WHEN raw_ns BETWEEN 9500001 AND 12500000 THEN 11111111
          WHEN raw_ns BETWEEN 12500001 AND 20000000 THEN 16666667
          WHEN raw_ns BETWEEN 20000001 AND 35000000 THEN 33333333
          ELSE raw_ns
        END AS vsync_period_ns
        FROM (
          SELECT CAST(COALESCE(
            (SELECT PERCENTILE(interval_ns, 50)
             FROM vsync_intervals
             WHERE interval_ns > 5500000 AND interval_ns < 50000000),
            16666667
          ) AS INTEGER) AS raw_ns
        )
      ),
      app_frames AS (
        SELECT
          CASE
            WHEN a.display_frame_token IS NOT NULL
              THEN 'display:' || CAST(a.display_frame_token AS TEXT)
            WHEN a.surface_frame_token IS NOT NULL
              THEN 'surface:' || COALESCE(a.layer_name, '') || ':' || CAST(a.surface_frame_token AS TEXT)
            ELSE NULL
          END as frame_key,
          COALESCE(a.display_frame_token, a.surface_frame_token) as display_frame_token,
          a.ts,
          CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END as dur,
          COALESCE(a.jank_type, 'Unknown') as jank_type,
          COALESCE(a.present_type, 'Unknown Present') as present_type,
          CASE
            WHEN a.jank_type GLOB '*Self Jank*' OR android_is_app_jank_type(a.jank_type) THEN 'APP'
            WHEN a.jank_type GLOB '*SurfaceFlinger*' THEN 'SF'
            WHEN a.jank_type GLOB '*Buffer Stuffing*' THEN 'BUFFER_STUFFING'
            WHEN android_is_sf_jank_type(a.jank_type) THEN 'SF'
            WHEN a.jank_type = 'None' OR a.jank_type IS NULL THEN 'HIDDEN'
            ELSE 'UNKNOWN'
          END as jank_responsibility,
          a.layer_name,
          a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END as present_ts,
          LAG(a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END)
            OVER (PARTITION BY a.layer_name ORDER BY a.ts) as prev_present_ts
        FROM actual_frame_timeline_slice a
        LEFT JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
          AND COALESCE(a.display_frame_token, a.surface_frame_token) IS NOT NULL
      ),
      -- 掉帧检测：双信号混合策略
      jank_row_signals AS (
        SELECT
          frame_key,
          jank_type,
          dur,
          layer_name,
          -- is_consumer_jank: 双信号混合检测
          CASE
            WHEN present_type IN ('Late Present', 'Dropped Frame')
              AND (jank_responsibility != 'BUFFER_STUFFING' OR android_is_missed_frame_type(jank_type)) THEN 1
            WHEN jank_responsibility = 'BUFFER_STUFFING'
              AND prev_present_ts IS NOT NULL
              AND present_ts - prev_present_ts > (SELECT vsync_period_ns FROM vsync_config) * 1.5
              AND present_ts - prev_present_ts <= (SELECT vsync_period_ns FROM vsync_config) * 6 THEN 1
            ELSE 0
          END as row_is_consumer_jank
        FROM app_frames
      ),
      -- JANK_TYPE_DISPLAY_DEDUP_CTES_BEGIN
      ranked_jank_rows AS (
        SELECT
          *,
          MAX(row_is_consumer_jank) OVER (PARTITION BY frame_key) as is_consumer_jank,
          ROW_NUMBER() OVER (
            PARTITION BY frame_key
            ORDER BY
              row_is_consumer_jank DESC,
              CASE
                WHEN jank_type GLOB '*Self Jank*' OR android_is_app_jank_type(jank_type) THEN 1
                WHEN jank_type GLOB '*SurfaceFlinger*' THEN 2
                WHEN jank_type GLOB '*Buffer Stuffing*' THEN 3
                WHEN android_is_sf_jank_type(jank_type) THEN 4
                WHEN jank_type != 'None' THEN 5
                ELSE 6
              END,
              dur DESC,
              layer_name ASC
          ) as frame_row_rank
        FROM jank_row_signals
      ),
      jank_analysis AS (
        SELECT frame_key, jank_type, dur, is_consumer_jank
        FROM ranked_jank_rows
        WHERE frame_row_rank = 1
      )
      -- JANK_TYPE_DISPLAY_DEDUP_CTES_END
      SELECT
        jank_type,
        COUNT(*) as count,
        -- 实际用户感知掉帧数（present_type 为 Late/Dropped）
        SUM(is_consumer_jank) as real_jank_count,
        -- 假阳性数（jank_type 报告掉帧，但 present_type 未标记为 Late/Dropped）
        SUM(CASE WHEN jank_type != 'None' AND is_consumer_jank = 0 THEN 1 ELSE 0 END) as false_positive,
        CAST(SUM(CASE WHEN dur > 0 THEN dur ELSE 0 END) AS REAL) as total_dur,
        CAST(ROUND(AVG(CASE WHEN dur > 0 THEN dur ELSE NULL END)) AS INTEGER) as avg_dur,
        CASE
          WHEN jank_type GLOB '*Self Jank*' OR android_is_app_jank_type(jank_type) THEN '标签:App'
          WHEN jank_type GLOB '*SurfaceFlinger*' THEN '标签:SurfaceFlinger'
          WHEN jank_type GLOB '*Buffer Stuffing*' THEN '标签:Buffer Stuffing(需验证)'
          WHEN android_is_sf_jank_type(jank_type) THEN '标签:SurfaceFlinger'
          WHEN jank_type = 'None' THEN '标签:None(可能漏检)'
          ELSE '标签:Other'
        END as responsibility,
        '${buffer_tx_coverage.data[0].coverage_status}' as frame_timeline_coverage_status,
        ${buffer_tx_coverage.data[0].frame_timeline_to_buffer_tx_ratio} as frame_timeline_to_buffer_tx_ratio,
        CASE
          WHEN '${buffer_tx_coverage.data[0].coverage_status}' = 'partial_frame_timeline_coverage'
            THEN 'partial_sample'
          WHEN '${buffer_tx_coverage.data[0].coverage_status}' = 'no_buffer_tx_candidate'
            THEN 'frame_timeline_only_unbenchmarked'
          ELSE 'full_frame_timeline'
        END as evidence_scope
      FROM jank_analysis
      GROUP BY jank_type
      ORDER BY real_jank_count DESC, count DESC
      LIMIT 10
    save_as: jank_stats
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && environment.data[0]?.has_data === 1"

  # ==========================================================================
  # L2: 滑动区间列表
  # ==========================================================================
  - id: scroll_sessions
    type: atomic
    name: "滑动区间列表"
    display:
      level: detail
      layer: list
      title: "滑动区间"
      expandable: true
      expandableBindSource: session_stats  # 绑定 session_stats_batch 的 save_as
      columns:
        - name: session_id
          label: "区间"
          type: number
        - name: process_name
          label: "进程"
          type: string
        - name: start_ts
          label: "开始时间"
          type: timestamp
          clickAction: navigate_range
          durationColumn: duration
        - name: end_ts
          label: "结束时间"
          type: timestamp
          clickAction: navigate_timeline
        - name: frame_count
          label: "帧数"
          type: number
          format: compact
        - name: duration_ms
          label: "持续时间"
          type: duration
          format: duration_ms
          unit: ms
          hidden: true
        - name: duration
          label: "持续时间"
          type: duration
          format: duration_ms
          unit: ns
        - name: avg_dur
          label: "平均帧耗时"
          type: duration
          format: duration_ms
          unit: ns
        - name: max_dur
          label: "最大帧耗时"
          type: duration
          format: duration_ms
          unit: ns
        - name: session_fps
          label: "FPS"
          type: number
    sql: |
      WITH
      -- 动态 VSync 周期检测用于 session 切分（限定在分析区间内）
      vsync_intervals AS (
        SELECT c.ts - LAG(c.ts) OVER (ORDER BY c.ts) as interval_ns
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        WHERE t.name = 'VSYNC-sf'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      ),
      vsync_config AS (
        SELECT CASE
          WHEN raw_ns BETWEEN 5500000 AND 6500000 THEN 6060606
          WHEN raw_ns BETWEEN 6500001 AND 7500000 THEN 6944444
          WHEN raw_ns BETWEEN 7500001 AND 9500000 THEN 8333333
          WHEN raw_ns BETWEEN 9500001 AND 12500000 THEN 11111111
          WHEN raw_ns BETWEEN 12500001 AND 20000000 THEN 16666667
          WHEN raw_ns BETWEEN 20000001 AND 35000000 THEN 33333333
          ELSE raw_ns
        END AS vsync_period_ns
        FROM (
          SELECT CAST(COALESCE(
            (SELECT PERCENTILE(interval_ns, 50)
             FROM vsync_intervals
             WHERE interval_ns > 5500000 AND interval_ns < 50000000),
            16666667
          ) AS INTEGER) AS raw_ns
        )
      ),
      frame_gaps AS (
        SELECT
          COALESCE(a.display_frame_token, a.surface_frame_token) as frame_id,
          a.ts,
          a.dur,
          a.upid,
          p.name as process_name,
          LAG(a.ts + a.dur) OVER (PARTITION BY a.upid ORDER BY a.ts) as prev_end,
          a.ts - LAG(a.ts + a.dur) OVER (PARTITION BY a.upid ORDER BY a.ts) as gap_ns
        FROM actual_frame_timeline_slice a
        JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
          AND a.dur > 0
          AND COALESCE(a.display_frame_token, a.surface_frame_token) IS NOT NULL
      ),
      session_markers AS (
        SELECT *,
          CASE WHEN gap_ns IS NULL OR gap_ns > (SELECT vsync_period_ns * 6 FROM vsync_config) THEN 1 ELSE 0 END as new_session
        FROM frame_gaps
      ),
      sessions AS (
        SELECT *,
          SUM(new_session) OVER (PARTITION BY upid ORDER BY ts) as session_id
        FROM session_markers
      )
      SELECT
        session_id,
        process_name,
        printf('%d', MIN(ts)) as start_ts,
        printf('%d', MAX(ts + dur)) as end_ts,
        COUNT(*) as frame_count,
        -- duration_ms is the primary display column (already in ms)
        ROUND((MAX(ts + dur) - MIN(ts)) / 1e6, 1) as duration_ms,
        -- duration in ns as string to avoid 32-bit integer overflow (for downstream consumers)
        printf('%d', MAX(ts + dur) - MIN(ts)) as duration,
        CAST(ROUND(AVG(dur)) AS INTEGER) as avg_dur,
        MAX(dur) as max_dur,
        ROUND(1e9 * COUNT(*) / NULLIF(MAX(ts + dur) - MIN(ts), 0), 1) as session_fps
      FROM sessions
      GROUP BY upid, session_id
      HAVING COUNT(*) >= 10
        AND (MAX(ts + dur) - MIN(ts)) > 200000000
      ORDER BY MIN(ts)
    save_as: sessions
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && environment.data[0]?.has_data === 1"

  # ==========================================================================
  # L2: Per-Session Statistics Batch (expandable data for scroll_sessions)
  # 每个滑动区间的四象限/CPU频率/大小核分布，作为展开行数据
  # 一次扫描 thread_state，一次扫描 counter，避免 N 次重复查询
  # ==========================================================================
  - id: session_stats_batch
    type: atomic
    name: "滑动区间统计（批量）"
    optional: true
    display: false
    save_as: session_stats
    condition: "scroll_sessions.data?.length > 0"
    sql: |
      WITH
      -- 1. VSync config (同 scroll_sessions)
      vsync_intervals AS (
        SELECT c.ts - LAG(c.ts) OVER (ORDER BY c.ts) as interval_ns
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        WHERE t.name = 'VSYNC-sf'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      ),
      vsync_config AS (
        SELECT CASE
          WHEN raw_ns BETWEEN 5500000 AND 6500000 THEN 6060606
          WHEN raw_ns BETWEEN 6500001 AND 7500000 THEN 6944444
          WHEN raw_ns BETWEEN 7500001 AND 9500000 THEN 8333333
          WHEN raw_ns BETWEEN 9500001 AND 12500000 THEN 11111111
          WHEN raw_ns BETWEEN 12500001 AND 20000000 THEN 16666667
          WHEN raw_ns BETWEEN 20000001 AND 35000000 THEN 33333333
          ELSE raw_ns
        END AS vsync_period_ns
        FROM (
          SELECT CAST(COALESCE(
            (SELECT PERCENTILE(interval_ns, 50)
             FROM vsync_intervals
             WHERE interval_ns > 5500000 AND interval_ns < 50000000),
            16666667
          ) AS INTEGER) AS raw_ns
        )
      ),
      -- 2. Session boundaries (同 scroll_sessions)
      frame_gaps AS (
        SELECT
          a.ts, a.dur, a.upid,
          p.name as process_name,
          a.ts - LAG(a.ts + a.dur) OVER (PARTITION BY a.upid ORDER BY a.ts) as gap_ns
        FROM actual_frame_timeline_slice a
        JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
          AND a.dur > 0
          AND COALESCE(a.display_frame_token, a.surface_frame_token) IS NOT NULL
      ),
      session_markers AS (
        SELECT *,
          CASE WHEN gap_ns IS NULL OR gap_ns > (SELECT vsync_period_ns * 6 FROM vsync_config) THEN 1 ELSE 0 END as new_session
        FROM frame_gaps
      ),
      sessions_raw AS (
        SELECT *,
          SUM(new_session) OVER (PARTITION BY upid ORDER BY ts) as session_id
        FROM session_markers
      ),
      session_bounds AS (
        SELECT
          upid, session_id, process_name,
          MIN(ts) as start_ts,
          MAX(ts + dur) as end_ts
        FROM sessions_raw
        GROUP BY upid, session_id
        HAVING COUNT(*) >= 10
          AND (MAX(ts + dur) - MIN(ts)) > 200000000
      ),
      -- 3. ONE scan of thread_state: 同时供四象限和大小核分布使用
      thread_detail AS (
        SELECT
          sb.session_id,
          sb.process_name,
          CASE WHEN t.tid = p.pid THEN 'MainThread' ELSE t.name END as thread_name,
          ts.state,
          COALESCE(ct.core_type, 'unknown') as core_type,
          ts.dur
        FROM thread_state ts
        JOIN thread t ON ts.utid = t.utid
        JOIN process p ON t.upid = p.upid
        LEFT JOIN _cpu_topology ct ON ts.cpu = ct.cpu_id
        JOIN session_bounds sb ON p.upid = sb.upid
          AND ts.ts >= sb.start_ts AND ts.ts < sb.end_ts
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (t.tid = p.pid OR t.name IN ('RenderThread', 'GPU completion', 'hwuiTask0', 'hwuiTask1'))
      ),
      -- 4. 四象限聚合 (MainThread + RenderThread)
      quadrant_agg AS (
        SELECT
          session_id, process_name,
          thread_name as thread,
          SUM(CASE WHEN state = 'Running' AND core_type IN ('prime', 'big') THEN dur ELSE 0 END) as q1_ns,
          SUM(CASE WHEN state = 'Running' AND core_type NOT IN ('prime', 'big') THEN dur ELSE 0 END) as q2_ns,
          SUM(CASE WHEN state = 'R' THEN dur ELSE 0 END) as q3_ns,
          SUM(CASE WHEN state IN ('D', 'DK') THEN dur ELSE 0 END) as q4a_ns,
          SUM(CASE WHEN state IN ('S', 'I') THEN dur ELSE 0 END) as q4b_ns,
          SUM(dur) as total_ns
        FROM thread_detail
        WHERE thread_name IN ('MainThread', 'RenderThread')
        GROUP BY session_id, process_name, thread_name
      ),
      -- 5. 大小核分布聚合 (所有出图线程, Running 状态)
      core_aff_raw AS (
        SELECT
          session_id, process_name, thread_name, core_type,
          SUM(CASE WHEN state = 'Running' THEN dur ELSE 0 END) as run_dur_ns
        FROM thread_detail
        GROUP BY session_id, process_name, thread_name, core_type
        HAVING SUM(CASE WHEN state = 'Running' THEN dur ELSE 0 END) > 0
      ),
      core_aff_with_pct AS (
        SELECT ca.*,
          ROUND(100.0 * ca.run_dur_ns / NULLIF(
            SUM(ca.run_dur_ns) OVER (PARTITION BY ca.session_id, ca.process_name, ca.thread_name), 0
          ), 1) as pct
        FROM core_aff_raw ca
      ),
      -- 6. CPU 频率聚合 (一次 counter 扫描)
      cpu_freq_agg AS (
        SELECT
          sb.session_id, sb.process_name,
          ct.core_type,
          COUNT(DISTINCT cct.cpu) as num_cores,
          ROUND(AVG(c.value) / 1000, 0) as avg_freq_mhz,
          ROUND(MAX(c.value) / 1000, 0) as max_freq_mhz,
          ROUND(MIN(c.value) / 1000, 0) as min_freq_mhz
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        JOIN _cpu_topology ct ON cct.cpu = ct.cpu_id
        JOIN session_bounds sb ON c.ts >= sb.start_ts AND c.ts < sb.end_ts
        WHERE cct.name = 'cpufreq'
        GROUP BY sb.session_id, sb.process_name, ct.core_type
      )
      -- 最终输出: 每个 session 一行, 3 个 JSON 列 + 匹配键
      SELECT
        sb.session_id,
        sb.process_name,
        printf('%d', sb.start_ts) as start_ts,
        (SELECT json_group_array(json_object(
          'thread', sub.thread,
          'q1_big_pct', ROUND(100.0 * sub.q1_ns / NULLIF(sub.total_ns, 0), 1),
          'q2_little_pct', ROUND(100.0 * sub.q2_ns / NULLIF(sub.total_ns, 0), 1),
          'q3_runnable_pct', ROUND(100.0 * sub.q3_ns / NULLIF(sub.total_ns, 0), 1),
          'q4a_io_pct', ROUND(100.0 * sub.q4a_ns / NULLIF(sub.total_ns, 0), 1),
          'q4b_sleep_pct', ROUND(100.0 * sub.q4b_ns / NULLIF(sub.total_ns, 0), 1),
          'total_ms', ROUND(sub.total_ns / 1e6, 1)
        )) FROM (
          SELECT * FROM quadrant_agg qa
          WHERE qa.session_id = sb.session_id AND qa.process_name = sb.process_name
          ORDER BY CASE qa.thread WHEN 'MainThread' THEN 1 ELSE 2 END
        ) sub) as quadrant_json,
        (SELECT json_group_array(json_object(
          'core_type', sub.core_type,
          'num_cores', sub.num_cores,
          'avg_freq_mhz', sub.avg_freq_mhz,
          'max_freq_mhz', sub.max_freq_mhz,
          'min_freq_mhz', sub.min_freq_mhz
        )) FROM (
          SELECT * FROM cpu_freq_agg cf
          WHERE cf.session_id = sb.session_id AND cf.process_name = sb.process_name
          ORDER BY cf.max_freq_mhz DESC
        ) sub) as cpu_freq_json,
        (SELECT json_group_array(json_object(
          'thread_name', sub.thread_name,
          'core_type', sub.core_type,
          'run_ms', ROUND(sub.run_dur_ns / 1e6, 2),
          'pct', sub.pct
        )) FROM (
          SELECT * FROM core_aff_with_pct cap
          WHERE cap.session_id = sb.session_id AND cap.process_name = sb.process_name
          ORDER BY
            CASE cap.thread_name
              WHEN 'MainThread' THEN 1 WHEN 'RenderThread' THEN 2
              WHEN 'GPU completion' THEN 3 ELSE 4
            END, cap.run_dur_ns DESC
        ) sub) as core_affinity_json
      FROM session_bounds sb
      ORDER BY sb.start_ts

  # ==========================================================================
  # L2: 区间掉帧统计 (基于 present_type 列检测掉帧)
  # ==========================================================================
  - id: session_jank
    type: atomic
    name: "区间掉帧统计"
    display:
      level: detail
      layer: list
      title: "区间掉帧"
      columns:
        - name: session_id
          label: "区间"
          type: number
        - name: frame_count
          label: "总帧数"
          type: number
          format: compact
        - name: janky_count
          label: "感知掉帧"
          type: number
          format: compact
        - name: jank_rate
          label: "感知掉帧率"
          type: percentage
          format: percentage
        - name: app_janky_count
          label: "App 掉帧"
          type: number
          format: compact
        - name: buffer_stuffing_count
          label: "Buffer Stuffing"
          type: number
          format: compact
        - name: max_vsync_missed
          label: "最大跳帧"
          type: number
        - name: jank_types
          label: "掉帧类型"
          type: string
          format: truncate
    sql: |
      WITH
      -- 动态 VSync 周期检测（限定在分析区间内，仅用于 session 切分）
      vsync_intervals_for_session AS (
        SELECT c.ts - LAG(c.ts) OVER (ORDER BY c.ts) as interval_ns
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        WHERE t.name = 'VSYNC-sf'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      ),
      vsync_config_for_session AS (
        SELECT CASE
          WHEN raw_ns BETWEEN 5500000 AND 6500000 THEN 6060606
          WHEN raw_ns BETWEEN 6500001 AND 7500000 THEN 6944444
          WHEN raw_ns BETWEEN 7500001 AND 9500000 THEN 8333333
          WHEN raw_ns BETWEEN 9500001 AND 12500000 THEN 11111111
          WHEN raw_ns BETWEEN 12500001 AND 20000000 THEN 16666667
          WHEN raw_ns BETWEEN 20000001 AND 35000000 THEN 33333333
          ELSE raw_ns
        END AS vsync_period_ns
        FROM (
          SELECT CAST(COALESCE(
            (SELECT PERCENTILE(interval_ns, 50)
             FROM vsync_intervals_for_session
             WHERE interval_ns > 5500000 AND interval_ns < 50000000),
            16666667
          ) AS INTEGER) AS raw_ns
        )
      ),
      frame_gaps AS (
        SELECT
          COALESCE(a.display_frame_token, a.surface_frame_token) as display_frame_token,
          a.ts, a.dur, a.upid,
          a.layer_name,
          a.jank_type,
          COALESCE(a.present_type, 'Unknown Present') as present_type,
          CASE
            WHEN a.jank_type GLOB '*Self Jank*' OR android_is_app_jank_type(a.jank_type) THEN 'APP'
            WHEN a.jank_type GLOB '*SurfaceFlinger*' THEN 'SF'
            WHEN a.jank_type GLOB '*Buffer Stuffing*' THEN 'BUFFER_STUFFING'
            WHEN android_is_sf_jank_type(a.jank_type) THEN 'SF'
            WHEN a.jank_type = 'None' OR a.jank_type IS NULL THEN 'HIDDEN'
            ELSE 'UNKNOWN'
          END as jank_responsibility,
          p.name as process_name,
          a.ts - LAG(a.ts + a.dur) OVER (PARTITION BY a.upid ORDER BY a.ts) as time_gap_ns,
          a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END as present_ts,
          LAG(a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END)
            OVER (PARTITION BY a.layer_name ORDER BY a.ts) as prev_present_ts
        FROM actual_frame_timeline_slice a
        JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
          AND a.dur > 0
          AND COALESCE(a.display_frame_token, a.surface_frame_token) IS NOT NULL
      ),
      session_markers AS (
        SELECT *,
          CASE WHEN time_gap_ns IS NULL OR time_gap_ns > (SELECT vsync_period_ns * 6 FROM vsync_config_for_session) THEN 1 ELSE 0 END as new_session
        FROM frame_gaps
      ),
      sessions_raw AS (
        SELECT *,
          SUM(new_session) OVER (PARTITION BY upid ORDER BY ts) as session_id
        FROM session_markers
      ),
      sessions AS (
        SELECT
          session_id,
          process_name,
          MIN(ts) as start_ts,
          MAX(ts + dur) as end_ts,
          COUNT(*) as frame_count
        FROM sessions_raw
        GROUP BY upid, session_id
        HAVING COUNT(*) >= 10
          AND (MAX(ts + dur) - MIN(ts)) > 200000000
      ),
      -- 掉帧检测：双信号混合策略
      session_token_gap_jank AS (
        SELECT
          sr.session_id,
          -- 感知掉帧：双信号混合检测
          SUM(CASE
            WHEN sr.present_type IN ('Late Present', 'Dropped Frame')
              AND (sr.jank_responsibility != 'BUFFER_STUFFING' OR android_is_missed_frame_type(sr.jank_type)) THEN 1
            WHEN sr.jank_responsibility = 'BUFFER_STUFFING'
              AND sr.prev_present_ts IS NOT NULL
              AND sr.present_ts - sr.prev_present_ts > (SELECT vsync_period_ns FROM vsync_config_for_session) * 1.5
              AND sr.present_ts - sr.prev_present_ts <= (SELECT vsync_period_ns FROM vsync_config_for_session) * 6 THEN 1
            ELSE 0 END) as consumer_jank_count,
          SUM(CASE WHEN sr.present_type IN ('Late Present', 'Dropped Frame')
            AND sr.jank_responsibility = 'APP' THEN 1 ELSE 0 END) as app_jank_count,
          -- Buffer Stuffing 总帧数（管线背压，含正常 BS 和异常 BS）
          SUM(CASE WHEN sr.jank_responsibility = 'BUFFER_STUFFING' THEN 1 ELSE 0 END) as buffer_stuffing_count,
          MAX(CASE
            WHEN (
              (sr.present_type IN ('Late Present', 'Dropped Frame')
                AND (sr.jank_responsibility != 'BUFFER_STUFFING' OR android_is_missed_frame_type(sr.jank_type)))
              OR (sr.jank_responsibility = 'BUFFER_STUFFING' AND sr.prev_present_ts IS NOT NULL
                  AND sr.present_ts - sr.prev_present_ts > (SELECT vsync_period_ns FROM vsync_config_for_session) * 1.5
                  AND sr.present_ts - sr.prev_present_ts <= (SELECT vsync_period_ns FROM vsync_config_for_session) * 6)
            ) AND sr.prev_present_ts IS NOT NULL
              AND sr.present_ts - sr.prev_present_ts > (SELECT vsync_period_ns FROM vsync_config_for_session) * 1.5
            THEN MAX(CAST(ROUND((sr.present_ts - sr.prev_present_ts) * 1.0 / (SELECT vsync_period_ns FROM vsync_config_for_session) - 1, 0) AS INTEGER), 0)
            ELSE 0 END) as max_vsync_missed,
          GROUP_CONCAT(DISTINCT CASE
            WHEN (sr.present_type IN ('Late Present', 'Dropped Frame')
              AND (sr.jank_responsibility != 'BUFFER_STUFFING' OR android_is_missed_frame_type(sr.jank_type)))
              OR (sr.jank_responsibility = 'BUFFER_STUFFING' AND sr.prev_present_ts IS NOT NULL
                  AND sr.present_ts - sr.prev_present_ts > (SELECT vsync_period_ns FROM vsync_config_for_session) * 1.5)
            THEN COALESCE(sr.jank_type, 'None') END) as jank_types
        FROM sessions_raw sr
        GROUP BY sr.session_id
      )
      SELECT
        s.session_id,
        s.frame_count,
        -- 感知掉帧 = consumer_jank_count（双信号已过滤正常 BS）
        COALESCE(stj.consumer_jank_count, 0) as janky_count,
        ROUND(100.0 * COALESCE(stj.consumer_jank_count, 0) / NULLIF(s.frame_count, 0), 2) as jank_rate,
        COALESCE(stj.app_jank_count, 0) as app_janky_count,
        COALESCE(stj.buffer_stuffing_count, 0) as buffer_stuffing_count,
        COALESCE(stj.max_vsync_missed, 0) as max_vsync_missed,
        stj.jank_types
      FROM sessions s
      LEFT JOIN session_token_gap_jank stj ON s.session_id = stj.session_id
      ORDER BY s.session_id
    save_as: session_jank_data
    optional: true
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && environment.data[0]?.has_data === 1"

  # ==========================================================================
  # 内部步骤：获取所有掉帧的帧列表 (双信号混合检测)
  # ==========================================================================
  # 核心原理：
  # - 非 BS 帧：present_type IN ('Late Present', 'Dropped Frame') 为权威信号
  # - BS 帧：间隔 > 1.5x vsync = 真实掉帧（被 BS 掩盖）
  # - vsync_missed 用 present_ts 间隔估算严重度（辅助信号）
  # - jank_type 用于标记责任归属（App 侧 vs SF 侧）
  - id: get_app_jank_frames
    type: atomic
    name: "获取真正掉帧帧"
    sql_fragments:
      - fragments/root_cause_sample_cap.sql
    synthesize:
      role: list
      groupBy:
        - field: jank_responsibility
          title: 责任归属分布
        - field: jank_type
          title: 掉帧类型分布
    display: false  # 隐藏独立显示 — 由 batch_frame_root_cause 统一展示掉帧列表。此 step 仍运行，数据通过 save_as 供下游引用。
    sql: |
      WITH
      -- VSync 周期（限定在分析区间内，避免 VRR 省电时段干扰）
      vsync_intervals AS (
        SELECT c.ts - LAG(c.ts) OVER (ORDER BY c.ts) as interval_ns
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        WHERE t.name = 'VSYNC-sf'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      ),
      timing_config AS (
        SELECT CASE
          WHEN raw_ns BETWEEN 5500000 AND 6500000 THEN 6060606
          WHEN raw_ns BETWEEN 6500001 AND 7500000 THEN 6944444
          WHEN raw_ns BETWEEN 7500001 AND 9500000 THEN 8333333
          WHEN raw_ns BETWEEN 9500001 AND 12500000 THEN 11111111
          WHEN raw_ns BETWEEN 12500001 AND 20000000 THEN 16666667
          WHEN raw_ns BETWEEN 20000001 AND 35000000 THEN 33333333
          ELSE raw_ns
        END AS vsync_period_ns
        FROM (
          SELECT CAST(COALESCE(
            (SELECT PERCENTILE(interval_ns, 50)
             FROM vsync_intervals
             WHERE interval_ns > 5500000 AND interval_ns < 50000000),
            16666667
          ) AS INTEGER) AS raw_ns
        )
      ),
      -- Per-layer 帧序列：按 layer_name 分组，计算 token gap + 时间 gap
      layer_frames AS (
        SELECT
          CASE
            WHEN a.display_frame_token IS NOT NULL
              THEN 'display:' || CAST(a.display_frame_token AS TEXT)
            WHEN a.surface_frame_token IS NOT NULL
              THEN 'surface:' || COALESCE(a.layer_name, '') || ':' || CAST(a.surface_frame_token AS TEXT)
            ELSE NULL
          END as frame_key,
          a.display_frame_token,
          COALESCE(a.display_frame_token, a.surface_frame_token) as frame_token,
          a.ts,
          a.dur,
          a.upid,
          a.layer_name,
          a.jank_type,
          a.jank_severity_type,
          COALESCE(a.present_type, 'Unknown Present') as present_type,
          CASE
            WHEN a.jank_type GLOB '*Self Jank*' OR android_is_app_jank_type(a.jank_type) THEN 'APP'
            WHEN a.jank_type GLOB '*SurfaceFlinger*' THEN 'SF'
            WHEN a.jank_type GLOB '*Buffer Stuffing*' THEN 'BUFFER_STUFFING'
            WHEN android_is_sf_jank_type(a.jank_type) THEN 'SF'
            WHEN a.jank_type = 'None' OR a.jank_type IS NULL THEN 'HIDDEN'
            ELSE 'UNKNOWN'
          END as jank_responsibility,
          -- Per-layer token gap：SF 跳过了多少个 DisplayFrame 没有消费该 layer 的 buffer
          a.display_frame_token - LAG(a.display_frame_token)
            OVER (PARTITION BY a.layer_name ORDER BY a.display_frame_token) AS token_gap,
          -- 时间 gap（会话切分用）
          a.ts - LAG(a.ts + a.dur)
            OVER (PARTITION BY a.layer_name ORDER BY a.ts) AS time_gap_ns,
          -- present_ts（vsync_missed 严重度估算 + 报告展示用）
          a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END AS present_ts,
          LAG(a.ts + CASE WHEN a.dur > 0 THEN a.dur ELSE 0 END)
            OVER (PARTITION BY a.layer_name ORDER BY a.ts) AS prev_present_ts
        FROM actual_frame_timeline_slice a
        LEFT JOIN process p ON a.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
          AND (${start_ts} IS NULL OR a.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR a.ts < ${end_ts})
          AND COALESCE(a.display_frame_token, a.surface_frame_token) IS NOT NULL
      ),
      session_markers AS (
        SELECT
          *,
          CASE WHEN time_gap_ns IS NULL OR time_gap_ns > (SELECT vsync_period_ns * 6 FROM timing_config) THEN 1 ELSE 0 END as new_session
        FROM layer_frames
      ),
      sessions_map AS (
        SELECT
          *,
          SUM(new_session) OVER (PARTITION BY layer_name ORDER BY ts) as session_id
        FROM session_markers
      ),
      -- Per-layer 掉帧检测：双信号混合策略
      -- 非 BS 帧：present_type IN ('Late Present', 'Dropped Frame')
      -- BS 帧：间隔 > 1.5x vsync = 真实掉帧（被 BS 掩盖的卡顿）
      jank_frames AS (
        SELECT
          sm.frame_key,
          sm.frame_token as frame_id,
          sm.display_frame_token,
          sm.upid,
          sm.ts as actual_start,
          sm.ts + sm.dur as actual_end,
          sm.dur as actual_dur,
          sm.jank_type,
          sm.jank_severity_type,
          sm.layer_name,
          sm.session_id,
          -- token_gap 保留用于信息展示
          sm.token_gap,
          -- vsync_missed：用 present_ts 间隔估算严重度（辅助信号）
          CASE
            WHEN sm.prev_present_ts IS NOT NULL AND sm.present_ts - sm.prev_present_ts > tc.vsync_period_ns * 1.5
              THEN MAX(CAST(ROUND((sm.present_ts - sm.prev_present_ts) * 1.0 / tc.vsync_period_ns - 1, 0) AS INTEGER), 0)
            ELSE 1  -- at least 1 vsync missed if present_type is Late/Dropped
          END as vsync_missed,
          sm.jank_responsibility,
          -- 消费端呈现间隔（毫秒）— 报告展示用
          ROUND((sm.present_ts - COALESCE(sm.prev_present_ts, sm.present_ts)) / 1e6, 2) as present_interval_ms,
          -- 隐形掉帧标记
          CASE WHEN sm.jank_type = 'None' OR sm.jank_type IS NULL THEN 1 ELSE 0 END as is_hidden_jank
        FROM sessions_map sm
        CROSS JOIN timing_config tc
        WHERE (
          -- 非 BS：present_type 为权威信号
          (sm.present_type IN ('Late Present', 'Dropped Frame')
            AND (sm.jank_responsibility != 'BUFFER_STUFFING' OR android_is_missed_frame_type(sm.jank_type)))
          OR
          -- BS + 异常间隔：真实掉帧被 BS 掩盖
          (sm.jank_responsibility = 'BUFFER_STUFFING'
           AND sm.prev_present_ts IS NOT NULL
           AND (sm.present_ts - sm.prev_present_ts) > tc.vsync_period_ns * 1.5
           AND (sm.present_ts - sm.prev_present_ts) <= tc.vsync_period_ns * 6)
        )
        -- 排除会话间断帧
        AND (sm.time_gap_ns IS NULL OR sm.time_gap_ns <= tc.vsync_period_ns * 6)
      ),
      -- Guilty frame 溯源：找到导致缓冲区枯竭的慢帧
      -- BlastBufferQueue 三缓冲下，可见卡顿发生在慢帧 2-3 帧之后
      guilty_frame_candidates AS (
        SELECT
          jf.frame_id AS starvation_frame_id,
          prev.display_frame_token AS candidate_id,
          prev.ts AS candidate_start,
          prev.dur AS candidate_dur,
          prev.jank_type AS candidate_jank_type,
          CASE WHEN prev.dur > tc.vsync_period_ns THEN 1 ELSE 0 END AS is_slow,
          ROUND((prev.dur - tc.vsync_period_ns) / 1e6, 2) AS over_budget_ms,
          ROW_NUMBER() OVER (
            PARTITION BY jf.frame_id
            ORDER BY prev.dur DESC
          ) AS guilt_rank
        FROM jank_frames jf
        CROSS JOIN timing_config tc
        JOIN sessions_map prev
          ON prev.layer_name = jf.layer_name
          AND prev.session_id = jf.session_id
          AND prev.display_frame_token IS NOT NULL
          AND prev.display_frame_token >= jf.display_frame_token - 5
          AND prev.display_frame_token < jf.display_frame_token
          AND prev.dur > 0
        WHERE jf.display_frame_token IS NOT NULL
      ),
      guilty_frames AS (
        SELECT
          starvation_frame_id,
          candidate_id AS guilty_frame_id,
          candidate_start AS guilty_start,
          candidate_dur AS guilty_dur,
          candidate_jank_type AS guilty_jank_type,
          over_budget_ms
        FROM guilty_frame_candidates
        WHERE guilt_rank = 1 AND is_slow = 1
      ),
      frame_thread_info AS (
        SELECT
          jf.frame_key,
          jf.frame_id,
          jf.upid,
          jf.actual_start,
          jf.actual_end,
          jf.actual_dur,
          jf.jank_type,
          jf.jank_severity_type,
          jf.layer_name,
          jf.session_id,
          jf.token_gap,
          jf.vsync_missed,
          jf.jank_responsibility,
          jf.present_interval_ms,
          jf.is_hidden_jank,
          -- Guilty frame 信息
          gf.guilty_frame_id,
          gf.guilty_dur,
          gf.over_budget_ms,
          -- 生产线程时间范围（动态检测，不依赖硬编码线程名）
          (SELECT MIN(s.ts) FROM slice s
           JOIN thread_track tt ON s.track_id = tt.id
           JOIN thread t ON tt.utid = t.utid
           WHERE t.upid = jf.upid
             AND t.name NOT LIKE 'Binder:%'
             AND s.ts >= jf.actual_start - 5000000
             AND s.ts <= jf.actual_end
             AND (s.name LIKE 'Choreographer#doFrame%' OR s.name LIKE 'Framework::BeginFrame%'
                  OR s.name LIKE 'DrawFrame%' OR s.name LIKE 'PlayerLoop%'
                  OR s.dur > 2000000)
          ) as main_start_ts,
          (SELECT MAX(s.ts + s.dur) FROM slice s
           JOIN thread_track tt ON s.track_id = tt.id
           JOIN thread t ON tt.utid = t.utid
           WHERE t.upid = jf.upid
             AND t.name NOT LIKE 'Binder:%'
             AND s.ts >= jf.actual_start - 5000000
             AND s.ts <= jf.actual_end
          ) as main_end_ts,
          (SELECT MIN(s.ts) FROM slice s
           JOIN thread_track tt ON s.track_id = tt.id
           JOIN thread t ON tt.utid = t.utid
           JOIN process p ON t.upid = p.upid
           WHERE t.upid = jf.upid
             AND t.tid != p.pid
             AND t.name NOT LIKE 'Binder:%'
             AND s.ts >= jf.actual_start
             AND s.ts <= jf.actual_end
             AND s.dur > 1000000
          ) as render_start_ts,
          (SELECT MAX(s.ts + s.dur) FROM slice s
           JOIN thread_track tt ON s.track_id = tt.id
           JOIN thread t ON tt.utid = t.utid
           JOIN process p ON t.upid = p.upid
           WHERE t.upid = jf.upid
             AND t.tid != p.pid
             AND t.name NOT LIKE 'Binder:%'
             AND s.ts >= jf.actual_start
             AND s.ts <= jf.actual_end
          ) as render_end_ts
        FROM jank_frames jf
        LEFT JOIN guilty_frames gf ON gf.starvation_frame_id = jf.frame_id
      ),
      -- GET_APP_DISPLAY_DEDUP_CTE_BEGIN
      deduped_frames AS (
        SELECT
          fti.*,
          p.name as process_name,
          p.pid,
          ROW_NUMBER() OVER (
            PARTITION BY fti.frame_key
            ORDER BY
              CASE fti.jank_responsibility
                WHEN 'APP' THEN 1
                WHEN 'SF' THEN 2
                WHEN 'BUFFER_STUFFING' THEN 3
                WHEN 'HIDDEN' THEN 4
                ELSE 5
              END,
              fti.vsync_missed DESC,
              fti.actual_dur DESC,
              fti.layer_name ASC
          ) as display_frame_rank
        FROM frame_thread_info fti
        JOIN process p ON fti.upid = p.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR p.name GLOB '${package}:*'
        )
          AND p.name NOT LIKE '/system/%'
      ),
      -- GET_APP_DISPLAY_DEDUP_CTE_END
      ranked_frames AS (
        SELECT
          df.frame_key,
          df.frame_id,
          df.actual_start,
          df.actual_end,
          df.main_start_ts,
          df.main_end_ts,
          df.render_start_ts,
          df.render_end_ts,
          df.actual_dur,
          df.jank_type,
          df.jank_severity_type,
          df.layer_name,
          df.session_id,
          df.token_gap,
          df.vsync_missed,
          df.jank_responsibility,
          df.present_interval_ms,
          df.process_name,
          df.pid,
          df.upid,
          df.is_hidden_jank,
          -- Guilty frame 信息
          df.guilty_frame_id,
          df.guilty_dur,
          df.over_budget_ms,
          -- 前序帧信息（用于掉帧原因诊断）
          LAG(df.actual_dur) OVER (PARTITION BY df.session_id ORDER BY df.actual_start) as prev_frame_dur,
          LAG(df.jank_type) OVER (PARTITION BY df.session_id ORDER BY df.actual_start) as prev_frame_jank_type,
          -- 按 vsync_missed 排序（最严重的掉帧优先）
          ROW_NUMBER() OVER (PARTITION BY df.session_id ORDER BY df.vsync_missed DESC, df.actual_dur DESC) as rank_in_session
        FROM deduped_frames df
        WHERE df.display_frame_rank = 1
      )
      SELECT
        printf('%d', frame_id) as frame_id,
        CASE
          WHEN frame_key GLOB 'display:*' THEN printf('%d', frame_id)
          ELSE frame_key
        END as frame_identity_key,
        printf('%d', actual_start) as start_ts,
        printf('%d', actual_end) as end_ts,
        printf('%d', COALESCE(main_start_ts, actual_start)) as main_start_ts,
        printf('%d', COALESCE(main_end_ts, actual_end)) as main_end_ts,
        COALESCE(main_end_ts - main_start_ts, 0) as main_dur,
        ROUND(COALESCE(main_end_ts - main_start_ts, 0) / 1e6, 2) as main_dur_ms,
        printf('%d', COALESCE(render_start_ts, actual_start)) as render_start_ts,
        printf('%d', COALESCE(render_end_ts, actual_end)) as render_end_ts,
        COALESCE(render_end_ts - render_start_ts, 0) as render_dur,
        ROUND(COALESCE(render_end_ts - render_start_ts, 0) / 1e6, 2) as render_dur_ms,
        printf('%d', actual_dur) as dur,
        ROUND(actual_dur / 1e6, 2) as dur_ms,
        jank_type,
        jank_severity_type,
        layer_name,
        process_name,
        pid,
        session_id,
        token_gap,
        vsync_missed,
        present_interval_ms,
        jank_responsibility,
        -- Guilty frame 信息
        CASE WHEN guilty_frame_id IS NOT NULL THEN printf('%d', guilty_frame_id) END as guilty_frame_id,
        CASE WHEN guilty_dur IS NOT NULL THEN ROUND(guilty_dur / 1e6, 2) END as guilty_dur_ms,
        over_budget_ms,
        -- 掉帧原因说明
        -- JANK_CAUSE_CASE_BEGIN
        CASE
          -- 管线耗尽：guilty frame 导致缓冲区枯竭
          WHEN guilty_frame_id IS NOT NULL THEN
            '管线耗尽 — 帧 ' || guilty_frame_id || ' 耗时 '
            || ROUND(guilty_dur / 1e6, 2) || 'ms（超出预算 '
            || over_budget_ms || 'ms），导致后续 ' || vsync_missed || ' 帧缓冲区枯竭'
          -- 隐形掉帧：框架标记 None 但 token gap 检测到掉帧
          WHEN jank_responsibility = 'HIDDEN' THEN
            '缓冲区枯竭 — 框架未标记（Perfetto 时间线帧颜色为绿色），'
            || '但该 Layer 跳过 ' || vsync_missed || ' 个 DisplayFrame 无新 buffer'
          -- App responsibility outranks lower-priority mixed SF prediction labels.
          WHEN jank_responsibility = 'APP' AND jank_type GLOB '*Self Jank*' THEN
            'App 自身处理超时（' || ROUND(actual_dur / 1e6, 2) || 'ms），跳过 ' || vsync_missed || ' 帧'
          WHEN jank_responsibility = 'APP' AND jank_type GLOB '*App Deadline Missed*' THEN
            'App 未在 VSync deadline 前完成渲染（' || ROUND(actual_dur / 1e6, 2) || 'ms），跳过 ' || vsync_missed || ' 帧'
          WHEN jank_responsibility = 'APP' THEN
            'FrameTimeline 确认 App 侧帧时序异常（' || COALESCE(jank_type, '未知') || '），底层原因需结合直接证据判断'
          WHEN jank_responsibility = 'BUFFER_STUFFING' THEN
            '帧耗时 ' || ROUND(actual_dur / 1e6, 2) || 'ms，BufferQueue 阻塞（Buffer Stuffing），延迟 ' || vsync_missed || ' 个 VSync'
          WHEN jank_responsibility = 'SF' AND jank_type GLOB '*Prediction Error*' THEN
            'SurfaceFlinger 调度器预测时间漂移；应看聚合占比，孤立事件通常不代表用户可感知 App 卡顿'
          WHEN jank_responsibility = 'SF' AND jank_type GLOB '*Display HAL*' THEN
            'SurfaceFlinger 已按时提交，但显示 HAL 未在目标 VSync 呈现'
          -- SurfaceFlinger 问题
          WHEN jank_responsibility = 'SF' THEN
            'SurfaceFlinger 合成延迟（' || jank_type || '），App 已按时交付 buffer'
          ELSE
            COALESCE(jank_type, '未知') || '，跳过 ' || vsync_missed || ' 帧'
        END
        -- JANK_CAUSE_CASE_END
        as jank_cause,
        is_hidden_jank,
        ROW_NUMBER() OVER (ORDER BY session_id, actual_start) as frame_index
      FROM ranked_frames
      WHERE rank_in_session <= (SELECT root_cause_sample_limit_per_session FROM root_cause_sample_config)
      ORDER BY session_id, actual_start
    save_as: app_jank_frames
    condition: "frame_timeline.data[0]?.has_frame_timeline === 1 && environment?.data?.[0]?.has_data === 1 && ((perf_summary?.data?.[0]?.janky_frames || 0) > 0 || (jank_stats?.data?.[0]?.real_jank_count || 0) > 0)"

  # ==========================================================================
  # L3-batch: 批量帧根因分类（每 Session 严重帧上限内 → 单次 SQL 根因决策树）
  # 目的：分析已选择掉帧帧的完整指标，并显式输出 eligible/analyzed 覆盖率
  # 输出：四象限(MainThread+RenderThread) + CPU频率 + Binder/GC重叠 + 根因分类
  # jank_frame_detail 仅用于可选补充深钻（CPU freq timeline + top slices 详情）
  # ==========================================================================
  - id: batch_frame_root_cause
    type: atomic
    name: "掉帧列表（含根因分类）"
    optional: true
    sql_fragments:
      - fragments/vsync_config.sql
      - fragments/root_cause_sample_cap.sql
    synthesize:
      role: list
      groupBy:
        - field: jank_responsibility
          title: 责任归属分布
        - field: reason_code
          title: 根因分类分布
      insights:
        - template: "根因分析覆盖 {{root_cause_analyzed_frame_count}}/{{root_cause_eligible_frame_count}} 帧，coverage={{root_cause_coverage_ratio}}，每 Session 上限 {{root_cause_sample_limit_per_session}}，scope={{root_cause_analysis_scope}}"
    display:
      level: detail
      layer: list
      title: "掉帧列表"
      expandable: true
      expandableBindSource: batch_root_cause  # 自绑定：展开行显示 hidden 列的详细诊断数据
