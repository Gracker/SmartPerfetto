name: code_pinpoint
version: "1.1"
type: composite
tier: S

meta:
  display_name: "代码定位线索"
  description: "从 trace 中提取可用于 codebase-aware resolve_symbol / lookup_source 的线程、slice、module 和 symbol 线索"
  icon: "code"
  tags: [codebase, symbol, source, root_cause]

triggers:
  keywords:
    zh: [代码, 源码, 函数, 符号, patch, 修复建议, file line]
    en: [code, source, symbol, function, patch, file line]

prerequisites:
  modules:
    - slices.with_context
    - android.process_metadata

inputs:
  - name: package
    type: string
    required: false
    description: "应用包名或进程名（可选）"
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳（纳秒，可选）"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳（纳秒，可选）"

identity:
  policy: verify_if_present
  scope: process
  aliases: [package, process_name]
  rewriteTo: recommended_process_name_param

steps:
  - id: hot_slices
    type: atomic
    name: "代码定位候选 slice"
    display:
      level: detail
      layer: list
      title: "Code Pinpoint Candidates"
      columns:
        - name: slice_id
          label: "Slice ID"
          type: number
        - name: ts
          label: "Timestamp"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dur_ms
          label: "Duration"
          type: duration
          unit: ms
        - name: upid
          label: "UPID"
          type: number
        - name: utid
          label: "UTID"
          type: number
        - name: process_name
          label: "Process"
          type: string
        - name: thread_name
          label: "Thread"
          type: string
        - name: slice_name
          label: "Slice"
          type: string
        - name: anchor_kind
          label: "Anchor Kind"
          type: string
        - name: source_query_hint
          label: "Source Query Hint"
          type: string
    synthesize:
      role: list
      fields:
        - key: slice_name
          label: Trace 锚点
        - key: anchor_kind
          label: 锚点类型
        - key: source_query_hint
          label: 源码检索词
    sql: |
      INCLUDE PERFETTO MODULE slices.with_context;

      WITH scoped_slices AS (
        SELECT
          id AS slice_id,
          ts,
          dur AS dur_ns,
          ROUND(dur / 1e6, 3) AS dur_ms,
          upid,
          utid,
          process_name,
          thread_name,
          name AS slice_name,
          (
            '${package}' != ''
            AND is_main_thread = 1
            AND LENGTH(name) BETWEEN 2 AND 64
            AND SUBSTR(name, 1, 1) GLOB '[A-Z]'
            AND name NOT GLOB '*[^A-Za-z0-9]*'
            AND name GLOB '*[a-z]*'
          ) AS is_app_trace_label
        FROM thread_slice
        WHERE dur > 0
          AND (
            '${package}' = ''
            OR process_name = '${package}'
            OR (
              '${package}' != ''
              AND SUBSTR(process_name, 1, LENGTH('${package}') + 1) = '${package}' || ':'
            )
          )
          AND (${start_ts} IS NULL OR ts >= ${start_ts})
          AND (${end_ts} IS NULL OR ts + dur <= ${end_ts})
      )
      SELECT
        slice_id,
        ts,
        dur_ms,
        upid,
        utid,
        process_name,
        thread_name,
        slice_name,
        CASE
          WHEN is_app_trace_label THEN 'app_trace_label'
          ELSE 'generic_anchor_only'
        END AS anchor_kind,
        CASE
          WHEN is_app_trace_label THEN slice_name
          ELSE NULL
        END AS source_query_hint
      FROM scoped_slices
      ORDER BY dur_ns DESC, ts, slice_id
      LIMIT 30;

  - id: native_symbols
    type: atomic
    name: "Native symbol / module / build-id 线索"
    display:
      level: debug
      layer: deep
      title: "Native Symbol Anchors"
      columns:
        - name: function_name
          label: "Function"
          type: string
        - name: module_name
          label: "Module"
          type: string
        - name: build_id
          label: "Build ID"
          type: string
        - name: sample_count
          label: "Samples"
          type: number
          format: compact
    synthesize:
      role: list
      fields:
        - key: function_name
          label: 函数名
        - key: module_name
          label: 模块
        - key: build_id
          label: Build ID
        - key: sample_count
          label: 采样数
    optional: true
    on_empty: "no_symbol_data: trace 中没有符合当前进程与时间窗的 CPU profiling 符号数据"
    sql: |
      WITH
      scoped_samples AS (
        SELECT ps.callsite_id
        FROM perf_sample ps
        JOIN thread t ON t.utid = ps.utid
        JOIN process p ON p.upid = t.upid
        WHERE (
          '${package}' = ''
          OR p.name = '${package}'
          OR (
            '${package}' != ''
            AND SUBSTR(p.name, 1, LENGTH('${package}') + 1) = '${package}' || ':'
          )
        )
          AND (${start_ts} IS NULL OR ps.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR ps.ts <= ${end_ts})
      ),
      resolved_samples AS (
        SELECT
          COALESCE(
            (
              SELECT symbol.name
              FROM stack_profile_symbol symbol
              WHERE symbol.symbol_set_id = frame.symbol_set_id
              ORDER BY symbol.inlined DESC, symbol.id
              LIMIT 1
            ),
            frame.deobfuscated_name,
            frame.name
          ) AS function_name,
          mapping.name AS module_name,
          mapping.build_id AS build_id
        FROM scoped_samples sample
        JOIN stack_profile_callsite callsite ON callsite.id = sample.callsite_id
        JOIN stack_profile_frame frame ON frame.id = callsite.frame_id
        JOIN stack_profile_mapping mapping ON mapping.id = frame.mapping
      )
      SELECT
        function_name,
        module_name,
        build_id,
        COUNT(*) AS sample_count
      FROM resolved_samples
      WHERE function_name IS NOT NULL
        AND function_name != ''
        AND module_name IS NOT NULL
        AND module_name != ''
      GROUP BY function_name, module_name, build_id
      ORDER BY sample_count DESC, function_name, module_name, build_id
      LIMIT 30;
