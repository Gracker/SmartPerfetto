# =============================================================================
# CPU Frequency Limit Episode (per-episode drill-down)
# =============================================================================
# Called by cpu_frequency_limit_attribution as the iterator `item_skill`. It
# answers, for ONE limit episode:
#   WHO   - was a kernel cooling device mitigating, or was a userspace thermal
#           daemon running, immediately around the limit change?
#   WHAT  - which threads, on which cores, at what frequency, were running in
#           the lookback window before the limit; were any of them anomalous;
#           were non-CPU heat sources active?
#
# It has no triggers on purpose: it is a drill-down, not an entry point.
#
# The trigger verdict is NOT decided here. It is read from the shared
# fragment (system_cpu_freq_limit_episode_verdicts.sql), scoped to the parent's
# analysis window, so this detail and the parent summary always agree: the
# same best class, the same per-onset mix, and never an onset after the window.
#
# Nothing here establishes causality on its own. A cooling device counts as the
# one that applied a limit only when the shared association fragment tied it to
# this policy by transition/limit-change timing AND the limit write followed its
# tightening. A thermal daemon that ran shortly before the limit is a
# candidate, not a cause - it also runs when nothing is throttled.
# =============================================================================

name: cpu_frequency_limit_episode
version: "1.0"
type: composite
category: thermal
tier: A

meta:
  display_name: "限频区段归因详情"
  description: "对单个限频区段回溯散热设备、温控守护、限频前负载、异常线程与非 CPU 热源；仅给出证据与候选，不断言因果"
  icon: "travel_explore"
  tags: [cpu, frequency, limit, thermal, attribution, episode, drilldown]

prerequisites:
  required_tables:
    - counter
    - counter_track
    - sched_slice
  modules:
    - linux.cpu.frequency
    - android.process_metadata

process_scope:
  role: global_context

inputs:
  - name: episode_id
    type: string
    required: false
    description: "区段标识（由上层传入）"
  - name: trace_episode_id
    type: string
    required: false
    description: "全 trace 区段标识（policy%d-tep%d，由上层传入）；缺省时按 policy_cpu 与 episode_start_ts 定位"
  - name: episode_start_ts
    type: timestamp
    required: true
    description: "限频起点时间戳(ns)：上层传入全 trace 区段的起点，不是窗口裁剪后的开始"
  - name: episode_end_ts
    type: timestamp
    required: true
    description: "区段结束时间戳(ns)"
  - name: window_start_ts
    type: timestamp
    required: false
    description: "上层分析窗口起点(ns)；判定只使用在该窗口内生效的限频写入。缺省使用 episode_start_ts"
  - name: window_end_ts
    type: timestamp
    required: false
    description: "上层分析窗口终点(ns)；缺省使用 episode_end_ts"
  - name: policy_cpu
    type: number
    required: false
    description: "cpufreq policy 首核编号"
  - name: core_type
    type: string
    required: false
    description: "核心类型（可能为 unknown）"
  - name: lookback_ms
    type: number
    required: false
    default: 10000
    description: "限频前回溯窗口长度(ms)"
  - name: who_window_ms
    type: number
    required: false
    default: 2000
    description: "限频时刻前后的归因窗口半径(ms)"
  - name: cooling_coincidence_ms
    type: number
    required: false
    default: 50
    description: "散热设备档位变更与限频时刻的重合容差(ms)；重合才视为该次限频由内核热控直接施加"
  - name: episode_drop_pct
    type: number
    required: false
    default: 10
    description: "判定限频区段的降幅阈值（相对本 trace 观测到的最大上限，%）；须与定位 trace_episode_id 的父级一致"
  - name: merge_gap_ms
    type: number
    required: false
    default: 500
    description: "限频区段合并间隔(ms)；须与定位 trace_episode_id 的父级一致"
  - name: cdev_policy_pair_ms
    type: number
    required: false
    default: 1
    description: "散热设备档位变更与其后 policy 上限变更的前向配对窗口(ms)"
  - name: cdev_policy_min_transitions
    type: number
    required: false
    default: 3
    description: "判定散热设备与 policy 关联所需的最少档位变更次数"
  - name: cdev_policy_min_pair_pct
    type: number
    required: false
    default: 80
    description: "判定关联所需的配对占比与同向占比下限(%)"
  - name: package
    type: string
    required: false
    description: "目标包名/进程名"
  - name: process_name
    type: string
    required: false
    description: "目标进程名别名"
  - name: top_n
    type: number
    required: false
    default: 30
    description: "负载/异常线程返回上限"
  - name: sustained_pct
    type: number
    required: false
    default: 80
    description: "异常线程：持续占用阈值(%)"
  - name: spin_avg_slice_us
    type: number
    required: false
    default: 200
    description: "异常线程：疑似空转平均片长上限(us)"
  - name: spin_switches_per_s
    type: number
    required: false
    default: 2000
    description: "异常线程：疑似空转每秒片数下限"
  - name: waker_per_s
    type: number
    required: false
    default: 500
    description: "异常线程：唤醒风暴阈值(次/秒)"
  - name: kernel_daemon_share_pct
    type: number
    required: false
    default: 10
    description: "异常线程：内核守护重载阈值(%)"

steps:
  # ---------------------------------------------------------------------------
  # Window derivation. Clipping is reported, never silently applied.
  # ---------------------------------------------------------------------------
  - id: episode_windows
    type: atomic
    name: "区段分析窗口"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/observed_data_bounds.sql
    display:
      level: detail
      layer: overview
      title: "区段分析窗口"
      columns:
        - {name: episode_id, label: "区段", type: string}
        - {name: policy_cpu, label: "policy 首核", type: number}
        - {name: core_type, label: "核心类型", type: string}
        - {name: episode_start_ts, label: "区段开始", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: episode_end_ts, label: "区段结束", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: before_start_ts, label: "回溯窗口开始", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: before_end_ts, label: "回溯窗口结束", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: before_window_ns, label: "回溯窗口时长", type: duration, unit: ns}
        - {name: window_clipped_to_data_start, label: "回溯窗口被数据起点裁剪", type: boolean}
        - {name: who_start_ts, label: "归因窗口开始", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: who_end_ts, label: "归因窗口结束", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: who_window_clipped, label: "归因窗口被数据边界裁剪", type: boolean}
        - {name: data_start_ts, label: "数据起点", type: timestamp, unit: ns, hidden: true}
        - {name: data_end_ts, label: "数据终点", type: timestamp, unit: ns, hidden: true}
        - {name: window_basis, label: "窗口依据", type: string}
    sql: |
      SELECT
        '${episode_id}' AS episode_id,
        ${policy_cpu} AS policy_cpu,
        '${core_type}' AS core_type,
        ${episode_start_ts} AS episode_start_ts,
        ${episode_end_ts} AS episode_end_ts,
        MAX(db.data_start_ts, ${episode_start_ts} - CAST(${lookback_ms|10000} * 1000000 AS INTEGER)) AS before_start_ts,
        ${episode_start_ts} AS before_end_ts,
        ${episode_start_ts} - MAX(db.data_start_ts, ${episode_start_ts} - CAST(${lookback_ms|10000} * 1000000 AS INTEGER)) AS before_window_ns,
        CASE WHEN ${episode_start_ts} - CAST(${lookback_ms|10000} * 1000000 AS INTEGER) < db.data_start_ts
          THEN 1 ELSE 0 END AS window_clipped_to_data_start,
        MAX(db.data_start_ts, ${episode_start_ts} - CAST(${who_window_ms|2000} * 1000000 AS INTEGER)) AS who_start_ts,
        MIN(db.data_end_ts, ${episode_start_ts} + CAST(${who_window_ms|2000} * 1000000 AS INTEGER)) AS who_end_ts,
        CASE WHEN ${episode_start_ts} - CAST(${who_window_ms|2000} * 1000000 AS INTEGER) < db.data_start_ts
          OR ${episode_start_ts} + CAST(${who_window_ms|2000} * 1000000 AS INTEGER) > db.data_end_ts
          THEN 1 ELSE 0 END AS who_window_clipped,
        db.data_start_ts, db.data_end_ts,
        printf('lookback_ms=%s;who_window_ms=%s;clipped_to_observed_data_bounds',
          ${lookback_ms|10000}, ${who_window_ms|2000}) AS window_basis
      FROM observed_data_bounds db
    save_as: episode_windows

  # ---------------------------------------------------------------------------
  # WHO - kernel cooling device
  # ---------------------------------------------------------------------------
  - id: who_cooling
    type: atomic
    name: "归因窗口内散热设备活动"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_cpu_freq_limit_spans.sql
      - fragments/system_cpu_freq_limit_episodes.sql
      - fragments/thermal_cooling_spans.sql
      - fragments/thermal_cdev_policy_association.sql
    display:
      level: summary
      layer: list
      title: "限频前后的散热设备活动"
      columns:
        - {name: ts, label: "时间", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: rel_to_limit_ns, label: "相对限频时刻", type: duration, unit: ns}
        - {name: cdev_name, label: "散热设备", type: string}
        - {name: cdev_kind_hint, label: "名称提示", type: string}
        - {name: cdev_kind_basis, label: "提示依据", type: string}
        - {name: association_status, label: "与 policy 的时序关联", type: string}
        - {name: associated_policy_cpu, label: "关联 policy 首核", type: number}
        - {name: tied_to_this_policy, label: "关联本 policy", type: boolean}
        - {name: prev_state, label: "变更前", type: number}
        - {name: state, label: "变更后", type: number}
        - {name: direction, label: "方向", type: string}
        - {name: dur_ns, label: "保持时长", type: duration, unit: ns}
        - {name: cooling_source, label: "数据来源", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "归因窗口内没有内核散热设备事件。该平台可能没有 cdev_update，或热控由用户态守护进程直接写 sysfs 完成。"
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id,
          ${episode_windows.data[0].who_start_ts} AS window_start_ts,
          ${episode_windows.data[0].who_end_ts} AS window_end_ts
      )
      SELECT s.raw_start_ts AS ts,
        s.raw_start_ts - ${episode_start_ts} AS rel_to_limit_ns,
        s.cdev_name, s.cdev_kind_hint, s.cdev_kind_basis,
        a.association_status, a.associated_policy_cpu,
        CASE WHEN a.associated_policy_cpu = ${policy_cpu} THEN 1 ELSE 0 END AS tied_to_this_policy,
        s.prev_state, s.state, s.direction, s.dur_ns, s.cooling_source,
        'observation_not_causal' AS evidence_scope
      FROM thermal_cooling_spans s
      LEFT JOIN thermal_cdev_policy_association a ON a.cdev_track_id = s.cdev_track_id
      WHERE s.raw_start_ts >= s.window_start_ts AND s.raw_start_ts < s.window_end_ts
      ORDER BY ABS(s.raw_start_ts - ${episode_start_ts})
      LIMIT 50
    save_as: who_cooling

  # ---------------------------------------------------------------------------
  # WHO - userspace thermal / perf policy daemons
  # ---------------------------------------------------------------------------
  - id: who_daemon
    type: atomic
    name: "归因窗口内温控/性能策略守护进程活动"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/thermal_signal_signatures.sql
    display:
      level: summary
      layer: list
      title: "限频前后的温控/性能策略守护进程活动（名字匹配，仅候选）"
      columns:
        - {name: process_name, label: "进程", type: string}
        - {name: thread_name, label: "线程", type: string}
        - {name: signature_kind, label: "签名类别", type: string}
        - {name: platform_hint, label: "平台提示", type: string}
        - {name: matched_pattern, label: "命中模式", type: string}
        - {name: who_running_ns, label: "归因窗口运行", type: duration, unit: ns}
        - {name: who_slice_count, label: "归因窗口调度片", type: number}
        - {name: who_rate_ns_per_s, label: "归因窗口速率(ns/s)", type: number}
        - {name: baseline_rate_ns_per_s, label: "全 trace 基线速率(ns/s)", type: number}
        - {name: rate_ratio, label: "速率倍数", type: number}
        - {name: ran_before_limit_ns, label: "限频前运行", type: duration, unit: ns}
        - {name: last_run_end_before_ts, label: "限频前最后一次运行结束", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: lead_ns, label: "距离限频时刻", type: duration, unit: ns}
        - {name: match_basis, label: "匹配依据", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "归因窗口内没有名字匹配温控/性能策略签名的线程在运行。"
    sql: |
      WITH win AS (
        SELECT ${episode_windows.data[0].who_start_ts} AS who_start_ts,
          ${episode_windows.data[0].who_end_ts} AS who_end_ts
      ),
      trace_span AS (
        SELECT MIN(ts) AS span_start, MAX(ts + MAX(dur, 0)) AS span_end FROM sched_slice
      ),
      activity AS (
        SELECT d.utid,
          SUM(CASE WHEN s.ts < (SELECT who_end_ts FROM win) AND s.ts + s.dur > (SELECT who_start_ts FROM win)
            THEN MIN(s.ts + s.dur, (SELECT who_end_ts FROM win)) - MAX(s.ts, (SELECT who_start_ts FROM win))
            ELSE 0 END) AS who_running_ns,
          SUM(CASE WHEN s.ts < (SELECT who_end_ts FROM win) AND s.ts + s.dur > (SELECT who_start_ts FROM win)
            THEN 1 ELSE 0 END) AS who_slice_count,
          SUM(CASE WHEN s.ts < ${episode_start_ts} AND s.ts + s.dur > (SELECT who_start_ts FROM win)
            THEN MIN(s.ts + s.dur, ${episode_start_ts}) - MAX(s.ts, (SELECT who_start_ts FROM win))
            ELSE 0 END) AS ran_before_limit_ns,
          MAX(CASE WHEN s.ts < ${episode_start_ts} AND s.ts + s.dur > (SELECT who_start_ts FROM win)
            THEN MIN(s.ts + s.dur, ${episode_start_ts}) END) AS last_run_end_before_ts,
          SUM(s.dur) AS trace_running_ns
        FROM thermal_signal_threads d
        JOIN sched_slice s ON s.utid = d.utid AND s.dur > 0
        GROUP BY d.utid
      )
      SELECT d.process_name, d.thread_name, d.signature_kind, d.platform_hint,
        d.pattern AS matched_pattern,
        a.who_running_ns, a.who_slice_count,
        ROUND(a.who_running_ns * 1e9 / NULLIF((SELECT who_end_ts - who_start_ts FROM win), 0), 1) AS who_rate_ns_per_s,
        ROUND(a.trace_running_ns * 1e9 / NULLIF((SELECT span_end - span_start FROM trace_span), 0), 1) AS baseline_rate_ns_per_s,
        ROUND(
          (a.who_running_ns * 1.0 / NULLIF((SELECT who_end_ts - who_start_ts FROM win), 0))
          / NULLIF(a.trace_running_ns * 1.0 / NULLIF((SELECT span_end - span_start FROM trace_span), 0), 0), 2) AS rate_ratio,
        a.ran_before_limit_ns, a.last_run_end_before_ts,
        CASE WHEN a.last_run_end_before_ts IS NOT NULL
          THEN ${episode_start_ts} - a.last_run_end_before_ts END AS lead_ns,
        'thermal_signal_signatures.name_glob_candidate_not_proof' AS match_basis,
        'observation_not_causal' AS evidence_scope
      FROM thermal_signal_threads d
      JOIN activity a ON a.utid = d.utid
      WHERE a.who_running_ns > 0
      ORDER BY a.ran_before_limit_ns DESC, a.who_running_ns DESC
      LIMIT 30
    save_as: who_daemon

  # ---------------------------------------------------------------------------
  # Temperature context in the lookback window
  # ---------------------------------------------------------------------------
  - id: temperature_context
    type: atomic
    name: "限频前温度上下文"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/thermal_sample_quality.sql
    display:
      level: summary
      layer: list
      title: "限频前回溯窗口内的温度"
      columns:
        - {name: sensor_name, label: "传感器/热区", type: string}
        - {name: sample_count_in_window, label: "窗口采样数", type: number}
        - {name: track_basis, label: "轨道依据", type: string}
        - {name: unit_basis, label: "单位依据", type: string}
        - {name: sample_quality, label: "样本质量", type: string}
        - {name: first_temp_c, label: "窗口起始温度", type: number}
        - {name: last_temp_c, label: "窗口结束温度", type: number}
        - {name: max_temp_c, label: "窗口最高温度", type: number}
        - {name: rise_c, label: "窗口内升温", type: number}
        - {name: first_ts, label: "首个采样", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: last_ts, label: "最后采样", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: temperature_evidence, label: "温度证据", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "回溯窗口内没有温度采样。部分平台温度上报非常稀疏（每分钟数次），窗口内无样本不代表温度未变化。"
    sql: |
      WITH win AS (
        SELECT ${episode_windows.data[0].before_start_ts} AS before_start_ts,
          ${episode_windows.data[0].before_end_ts} AS before_end_ts
      ),
      -- When the trace carries typed thermal_temperature tracks, a track that
      -- merely has a thermal-sounding NAME (an app called ThermalActivity, a
      -- buffer counter) is noise, not a sensor. Name matching is only kept as
      -- the fallback for traces with no typed thermal track at all.
      typed_available AS (
        SELECT COUNT(*) AS n FROM thermal_raw WHERE track_type = 'thermal_temperature'
      ),
      in_window AS (
        SELECT o.sensor_track_id, o.sensor_name, o.ts, o.temp_c, o.id, o.track_type,
          q.sample_quality, q.unit_basis
        FROM thermal_ordered o
        JOIN thermal_track_stats q USING (sensor_track_id)
        WHERE o.ts >= (SELECT before_start_ts FROM win)
          AND o.ts < (SELECT before_end_ts FROM win)
          AND (o.track_type = 'thermal_temperature' OR (SELECT n FROM typed_available) = 0)
      )
      SELECT sensor_name,
        COUNT(*) AS sample_count_in_window,
        CASE WHEN MAX(w.track_type) = 'thermal_temperature'
          THEN 'perfetto_thermal_temperature_track'
          ELSE 'name_matched_track_no_typed_thermal_track_in_trace' END AS track_basis,
        MAX(unit_basis) AS unit_basis,
        MAX(sample_quality) AS sample_quality,
        ROUND((SELECT w2.temp_c FROM in_window w2
          WHERE w2.sensor_track_id = w.sensor_track_id ORDER BY w2.ts, w2.id LIMIT 1), 1) AS first_temp_c,
        ROUND((SELECT w2.temp_c FROM in_window w2
          WHERE w2.sensor_track_id = w.sensor_track_id ORDER BY w2.ts DESC, w2.id DESC LIMIT 1), 1) AS last_temp_c,
        ROUND(MAX(w.temp_c), 1) AS max_temp_c,
        ROUND((SELECT w2.temp_c FROM in_window w2
          WHERE w2.sensor_track_id = w.sensor_track_id ORDER BY w2.ts DESC, w2.id DESC LIMIT 1)
          - (SELECT w2.temp_c FROM in_window w2
          WHERE w2.sensor_track_id = w.sensor_track_id ORDER BY w2.ts, w2.id LIMIT 1), 1) AS rise_c,
        MIN(w.ts) AS first_ts, MAX(w.ts) AS last_ts,
        CASE WHEN MAX(w.sample_quality) != 'accepted' THEN 'suspect_' || MAX(w.sample_quality)
          WHEN COUNT(*) < 2 THEN 'single_sample_no_trend'
          ELSE 'observed' END AS temperature_evidence,
        'observation_not_causal' AS evidence_scope
      FROM in_window w
      GROUP BY w.sensor_track_id, w.sensor_name
      ORDER BY max_temp_c DESC
    save_as: temperature_context

  # ---------------------------------------------------------------------------
  # WHAT was running before the limit
  # ---------------------------------------------------------------------------
  - id: before_workload
    type: skill
    name: "限频前负载归因"
    skill: cpu_workload_attribution_in_range
    optional: true
    params:
      start_ts: "${episode_windows.data?.[0]?.before_start_ts}"
      end_ts: "${episode_windows.data?.[0]?.before_end_ts}"
      package: "${package || ''}"
      process_name: "${process_name || ''}"
      top_n: "${top_n|30}"
    display:
      level: summary
    save_as: before_workload

  - id: before_anomalies
    type: skill
    name: "限频前异常线程"
    skill: cpu_anomalous_threads_in_range
    optional: true
    params:
      start_ts: "${episode_windows.data?.[0]?.before_start_ts}"
      end_ts: "${episode_windows.data?.[0]?.before_end_ts}"
      package: "${package || ''}"
      process_name: "${process_name || ''}"
      sustained_pct: "${sustained_pct|80}"
      spin_avg_slice_us: "${spin_avg_slice_us|200}"
      spin_switches_per_s: "${spin_switches_per_s|2000}"
      waker_per_s: "${waker_per_s|500}"
      kernel_daemon_share_pct: "${kernel_daemon_share_pct|10}"
      top_n: "${top_n|30}"
    display:
      level: summary
    save_as: before_anomalies

  # ---------------------------------------------------------------------------
  # Non-CPU heat context
  # ---------------------------------------------------------------------------
  - id: non_cpu_heat_context
    type: atomic
    name: "限频前非 CPU 热源上下文"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/thermal_signal_signatures.sql
    display:
      level: detail
      layer: list
      title: "限频前回溯窗口内的非 CPU 热源迹象（仅存在性观测）"
      columns:
        - {name: source_kind, label: "来源类别", type: string}
        - {name: source_key, label: "来源", type: string}
        - {name: detail, label: "明细", type: string}
        - {name: observed_count, label: "观测数", type: number}
        - {name: running_ns, label: "运行时长", type: duration, unit: ns}
        - {name: first_ts, label: "首次", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: last_ts, label: "最后", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: interpretation, label: "解释边界", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "回溯窗口内没有观测到非 CPU 热源相关的计数器或进程活动。"
    sql: |
      WITH win AS (
        SELECT ${episode_windows.data[0].before_start_ts} AS before_start_ts,
          ${episode_windows.data[0].before_end_ts} AS before_end_ts
      ),
      counter_presence AS (
        SELECT 'counter_track_type' AS source_kind, ct.type AS source_key,
          printf('%d tracks', COUNT(DISTINCT ct.id)) AS detail,
          COUNT(c.id) AS observed_count, NULL AS running_ns,
          MIN(c.ts) AS first_ts, MAX(c.ts) AS last_ts,
          '存在该类计数器样本，不代表该子系统是本次限频的热源' AS interpretation
        FROM counter_track ct JOIN counter c ON c.track_id = ct.id
        WHERE ct.type IN ('battery_counter', 'power_rails', 'gpu_frequency', 'gpu_memory')
          AND c.ts >= (SELECT before_start_ts FROM win)
          AND c.ts < (SELECT before_end_ts FROM win)
        GROUP BY ct.type
      ),
      sig AS (
        SELECT * FROM thermal_signal_signatures WHERE match_target = 'non_cpu_heat_process'
      ),
      heat_processes AS (
        SELECT p.upid, COALESCE(p.name, '') AS process_name, sig.pattern, sig.signature_kind,
          ROW_NUMBER() OVER (PARTITION BY p.upid ORDER BY sig.rank_hint, sig.pattern) AS rn
        FROM process p
        JOIN sig ON LOWER(COALESCE(p.name, '')) GLOB sig.pattern
      ),
      process_activity AS (
        SELECT 'process_signature' AS source_kind, h.process_name AS source_key,
          h.pattern AS detail,
          COUNT(*) AS observed_count,
          SUM(MIN(s.ts + s.dur, (SELECT before_end_ts FROM win))
            - MAX(s.ts, (SELECT before_start_ts FROM win))) AS running_ns,
          MIN(s.ts) AS first_ts, MAX(s.ts + s.dur) AS last_ts,
          '进程在窗口内运行，不代表其产生的热量导致了本次限频' AS interpretation
        FROM heat_processes h
        JOIN thread t ON t.upid = h.upid
        JOIN sched_slice s ON s.utid = t.utid AND s.dur > 0
        WHERE h.rn = 1
          AND s.ts < (SELECT before_end_ts FROM win)
          AND s.ts + s.dur > (SELECT before_start_ts FROM win)
        GROUP BY h.upid, h.process_name, h.pattern
      )
      SELECT source_kind, source_key, detail, observed_count, running_ns, first_ts, last_ts,
        interpretation, 'observation_not_causal' AS evidence_scope
      FROM (
        SELECT * FROM counter_presence
        UNION ALL
        SELECT * FROM process_activity
      )
      ORDER BY source_kind, COALESCE(running_ns, 0) DESC, observed_count DESC
      LIMIT 40
    save_as: non_cpu_heat_context

  # ---------------------------------------------------------------------------
  # Verdict - read from the shared fragment, never re-derived here. who_verdict
  # resolves the episode once (trace_episode_id, else policy + onset time);
  # limit_onsets lists that episode's in-window onsets by its id.
  # ---------------------------------------------------------------------------
  - id: who_verdict
    type: atomic
    name: "触发方判定"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_freq_limit_spans.sql
      - fragments/system_cpu_freq_limit_episodes.sql
      - fragments/thermal_cooling_spans.sql
      - fragments/thermal_cdev_policy_association.sql
      - fragments/thermal_signal_signatures.sql
      - fragments/system_cpu_freq_limit_episode_verdicts.sql
    display:
      level: key
      layer: overview
      title: "谁触发了这次限频（证据判定）"
      columns:
        - {name: episode_id, label: "区段", type: string}
        - {name: trace_episode_id, label: "全 trace 区段", type: string}
        - {name: policy_cpu, label: "policy 首核", type: number}
        - {name: core_type, label: "核心类型", type: string}
        - {name: who_verdict, label: "判定", type: string}
        - {name: trigger_class, label: "触发分类", type: string}
        - {name: trigger_class_rank, label: "分类等级", type: number}
        - {name: onset_trigger_mix, label: "逐次写入分类", type: string}
        - {name: onset_count, label: "窗口内限频写入次数", type: number}
        - {name: confirmed_onset_count, label: "由关联散热设备施加的写入", type: number}
        - {name: causal_onset_count, label: "收紧或起点未知的写入", type: number}
        - {name: onset_ts, label: "限频起点", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: onset_observed, label: "起点可观测", type: boolean}
        - {name: onset_note, label: "起点说明", type: string}
        - {name: paired_cooling_device, label: "配对散热设备", type: string}
        - {name: cooling_policy_association, label: "散热设备关联", type: string}
        - {name: tied_cooling_device, label: "关联散热设备", type: string}
        - {name: thresholds, label: "阈值", type: string}
        - {name: verdict_scope, label: "判定范围", type: string}
        - {name: interpretation, label: "解释边界", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${window_start_ts}, ${episode_start_ts}) AS window_start_ts,
          COALESCE(${window_end_ts}, ${episode_end_ts}) AS window_end_ts
      )
      SELECT v.episode_id, v.trace_episode_id, v.policy_cpu, v.core_type,
        v.episode_verdict AS who_verdict,
        v.trigger_class, v.trigger_class_rank, v.onset_trigger_mix,
        v.onset_count, v.confirmed_onset_count, v.causal_onset_count,
        v.onset_ts, v.onset_observed,
        CASE v.onset_basis
          WHEN 'first_observed_sample' THEN '区段首个样本即该轨道首个样本：限频起点在记录数据之外，不可观测'
          WHEN 'onset_after_invalid_sample' THEN '区段首个样本紧跟在无效上限样本之后：写入前的状态不可观测'
          ELSE '限频起点落在记录数据之内'
        END AS onset_note,
        v.best_paired_cdev_name AS paired_cooling_device,
        v.cooling_policy_association, v.tied_cooling_device,
        printf('who_window_ms=%s;cooling_coincidence_ms=%s;cdev_policy_pair_ms=%s;cdev_policy_min_transitions=%s;cdev_policy_min_pair_pct=%s',
          ${who_window_ms|2000}, ${cooling_coincidence_ms|50}, ${cdev_policy_pair_ms|1},
          ${cdev_policy_min_transitions|3}, ${cdev_policy_min_pair_pct|80}) AS thresholds,
        v.verdict_scope,
        v.class_note AS interpretation,
        'observation_not_causal' AS evidence_scope
      FROM system_cpu_freq_limit_episode_verdicts v
      WHERE v.window_id = 0 AND (v.trace_episode_id = '${trace_episode_id}'
        OR ('${trace_episode_id}' = '' AND v.policy_cpu = ${policy_cpu}
          AND v.onset_ts <= ${episode_start_ts} AND v.trace_episode_end_ts > ${episode_start_ts}))
      ORDER BY v.onset_ts
      LIMIT 1
    save_as: who_verdict

  - id: limit_onsets
    type: atomic
    name: "逐次限频写入判定"
    optional: true
    condition: "who_verdict.data?.length > 0"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_freq_limit_spans.sql
      - fragments/system_cpu_freq_limit_episodes.sql
      - fragments/thermal_cooling_spans.sql
      - fragments/thermal_cdev_policy_association.sql
      - fragments/thermal_signal_signatures.sql
      - fragments/system_cpu_freq_limit_episode_verdicts.sql
    display:
      level: detail
      layer: list
      title: "本区段在分析窗口内生效的每次限频写入"
      columns:
        - {name: onset_ts, label: "写入时刻", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: value_end_ts, label: "该值失效", type: timestamp, unit: ns, hidden: true}
        - {name: prev_valid_limit_khz, label: "写入前上限", type: number}
        - {name: limit_khz, label: "写入后上限", type: number}
        - {name: direction, label: "方向", type: string}
        - {name: direction_basis, label: "方向依据", type: string}
        - {name: onset_verdict, label: "写入判定", type: string}
        - {name: trigger_class, label: "触发分类", type: string}
        - {name: cooling_basis, label: "散热设备依据", type: string}
        - {name: paired_cdev_name, label: "配对散热设备", type: string}
        - {name: pair_lead_ns, label: "档位变更领先", type: duration, unit: ns}
        - {name: daemon_slices, label: "写入前守护进程调度片", type: number}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "该区段在分析窗口内没有可判定的限频写入。"
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${window_start_ts}, ${episode_start_ts}) AS window_start_ts,
          COALESCE(${window_end_ts}, ${episode_end_ts}) AS window_end_ts
      )
      SELECT o.onset_ts, o.value_end_ts, o.prev_valid_limit_khz, o.limit_khz,
        o.direction, o.direction_basis, o.onset_verdict, o.trigger_class, o.cooling_basis,
        o.paired_cdev_name, o.pair_lead_ns, o.daemon_slices, o.evidence_scope
      FROM system_cpu_freq_limit_window_onset_verdicts o
      WHERE o.window_id = 0 AND o.scope_key = '${who_verdict.data[0].episode_id}'
      ORDER BY o.onset_ts
      LIMIT 100
    save_as: limit_onsets

output:
  format: layered
  default_expanded: [who_verdict, limit_onsets, who_cooling, who_daemon]
