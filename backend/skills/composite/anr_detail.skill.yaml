  # ============================================================================
  # 直接阻塞点候选分类（候选，不等于最终根因）
  # ============================================================================
  - id: thread_evidence_availability
    type: atomic
    process_scope:
      role: global_context
    name: "线程证据可用性"
    optional: true
    display:
      level: hidden
    sql: |
      SELECT
        CASE WHEN EXISTS (
          SELECT 1 FROM sqlite_master
          WHERE type IN ('table', 'view') AND name = 'thread_state'
        ) THEN 1 ELSE 0 END AS has_thread_state,
        CASE WHEN EXISTS (
          SELECT 1 FROM sqlite_master
          WHERE type IN ('table', 'view') AND name = 'thread_track'
        ) THEN 1 ELSE 0 END AS has_thread_track,
        CASE WHEN EXISTS (
          SELECT 1 FROM sqlite_master
          WHERE type IN ('table', 'view') AND name = 'slice'
        ) THEN 1 ELSE 0 END AS has_slice
    save_as: thread_evidence_availability

  - id: direct_blocker_evidence_gap
    type: atomic
    process_scope:
      role: identity_metadata
    name: "直接阻塞点证据缺口"
    optional: true
    display:
      level: key
      layer: deep
      title: "直接阻塞点候选"
      columns:
        - name: direct_blocker_type
          label: "直接阻塞类型"
          type: string
        - name: evidence_ms
          label: "证据时长"
          type: duration
          format: duration_ms
          unit: ms
        - name: pct_of_timeout
          label: "超时占比"
          type: percentage
          format: percentage
        - name: evidence_source
          label: "证据来源"
          type: string
        - name: confidence
          label: "置信度"
          type: string
        - name: root_cause_boundary
          label: "责任边界"
          type: string
        - name: next_evidence_needed
          label: "下一步证据"
          type: string
    condition: "thread_evidence_availability.data[0]?.has_thread_state !== 1"
    sql: |
      SELECT
        'evidence_unavailable' AS direct_blocker_type,
        0 AS evidence_ms,
        0 AS pct_of_timeout,
        'missing_thread_state' AS evidence_source,
        'low' AS confidence,
        'missing_thread_state_evidence' AS root_cause_boundary,
        'Trace 缺少 thread_state，无法从主线程状态判断直接阻塞点；只能保留 trigger/logcat 为上下文证据' AS next_evidence_needed
    save_as: direct_blocker_gap

  - id: direct_blocker_classification
    type: atomic
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
    name: "直接阻塞点候选"
    optional: true
    display:
      level: key
      layer: deep
      title: "直接阻塞点候选"
      columns:
        - name: direct_blocker_type
          label: "直接阻塞类型"
          type: string
        - name: evidence_ms
          label: "证据时长"
          type: duration
          format: duration_ms
          unit: ms
        - name: pct_of_timeout
          label: "超时占比"
          type: percentage
          format: percentage
        - name: evidence_source
          label: "证据来源"
          type: string
        - name: confidence
          label: "置信度"
          type: string
        - name: root_cause_boundary
          label: "责任边界"
          type: string
        - name: next_evidence_needed
          label: "下一步证据"
          type: string
    condition: "thread_evidence_availability.data[0]?.has_thread_state === 1"
    sql: |
      WITH
      anr_window AS (
        SELECT
          ${anr_ts} - ${timeout_ns} AS start_ts,
          ${anr_ts} AS end_ts,
          ${timeout_ns} AS window_ns
      ),
      main_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN effective_target_processes p ON t.upid = p.upid
        WHERE (
            ${__process_scope.upid} IS NOT NULL
            OR (${upid} > 0 AND p.upid = ${upid})
            OR (${upid} <= 0 AND ${pid} > 0 AND p.pid = ${pid}
                AND ('${process_name}' = '' OR p.name = '${process_name}' OR p.name GLOB '${process_name}:*'))
            OR (${upid} <= 0 AND ${pid} <= 0
                AND (p.name = '${process_name}' OR p.name GLOB '${process_name}:*'))
          )
          AND t.tid = p.pid
        LIMIT 1
      ),
      main_states AS (
        SELECT
          ts.state,
          COALESCE(ts.io_wait, 0) AS io_wait,
          LOWER(COALESCE(ts.blocked_function, '')) AS blocked_function,
          MIN(CASE WHEN ts.dur < 0 THEN aw.end_ts ELSE ts.ts + ts.dur END, aw.end_ts) - MAX(ts.ts, aw.start_ts) AS clipped_ns
        FROM thread_state ts
        JOIN main_thread mt ON ts.utid = mt.utid
        CROSS JOIN anr_window aw
        WHERE ts.ts < aw.end_ts
          AND (CASE WHEN ts.dur < 0 THEN aw.end_ts ELSE ts.ts + ts.dur END) > aw.start_ts
      ),
      metrics AS (
        SELECT
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state IN ('S', 'D', 'I')
              AND (blocked_function GLOB '*binder*' OR blocked_function GLOB '*ipc*')), 0) AS binder_wait_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state IN ('S', 'D', 'I')
              AND (blocked_function GLOB '*futex*' OR blocked_function GLOB '*mutex*'
                   OR blocked_function GLOB '*monitor*' OR blocked_function GLOB '*rwsem*'
                   OR blocked_function GLOB '*rwlock*')), 0) AS lock_wait_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state IN ('D', 'DK')
              AND (
                io_wait = 1
                OR blocked_function GLOB '*io_schedule*'
                OR blocked_function GLOB '*filemap*'
                OR blocked_function GLOB '*do_page_fault*'
                OR blocked_function GLOB '*wait_on_page*'
                OR blocked_function GLOB '*folio_wait*'
                OR blocked_function GLOB '*fsync*'
                OR blocked_function GLOB '*submit_bio*'
                OR blocked_function GLOB '*blk*'
                OR blocked_function GLOB '*ext4*'
                OR blocked_function GLOB '*f2fs*'
                OR blocked_function GLOB '*erofs*'
                OR blocked_function GLOB '*ufshcd*'
                OR blocked_function GLOB '*mmc_*'
                OR blocked_function GLOB '*dm_*'
              )), 0) AS disk_wait_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state IN ('D', 'DK')
              AND NOT (
                io_wait = 1
                OR blocked_function GLOB '*io_schedule*'
                OR blocked_function GLOB '*filemap*'
                OR blocked_function GLOB '*do_page_fault*'
                OR blocked_function GLOB '*wait_on_page*'
                OR blocked_function GLOB '*folio_wait*'
                OR blocked_function GLOB '*fsync*'
                OR blocked_function GLOB '*submit_bio*'
                OR blocked_function GLOB '*blk*'
                OR blocked_function GLOB '*ext4*'
                OR blocked_function GLOB '*f2fs*'
                OR blocked_function GLOB '*erofs*'
                OR blocked_function GLOB '*ufshcd*'
                OR blocked_function GLOB '*mmc_*'
                OR blocked_function GLOB '*dm_*'
              )), 0) AS uninterruptible_wait_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state IN ('S', 'D', 'I')
              AND (blocked_function GLOB '*epoll*'
                   OR blocked_function GLOB '*poll*'
                   OR blocked_function GLOB '*do_epoll_wait*')), 0) AS poll_wait_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state IN ('S', 'D', 'I')
              AND (blocked_function GLOB '*nanosleep*'
                   OR blocked_function GLOB '*hrtimer*'
                   OR blocked_function GLOB '*sleep*')), 0) AS sleep_wait_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state IN ('R', 'R+')), 0) AS runnable_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_states
            WHERE state = 'Running'), 0) AS running_ns,
          0 AS reserved_ns
      ),
      candidates AS (
        SELECT 'binder_wait' AS direct_blocker_type, binder_wait_ns AS evidence_ns,
          'thread_state.blocked_function' AS evidence_source,
          CASE WHEN binder_wait_ns > 500000000 THEN 'high' ELSE 'medium' END AS confidence,
          'needs_peer_evidence' AS root_cause_boundary,
          '需要 Binder 对端进程/线程、server_dur 或 system_server 证据；不能只凭客户端等待定责' AS next_evidence_needed
        FROM metrics WHERE binder_wait_ns > 0
        UNION ALL
        SELECT 'lock_or_futex_wait', lock_wait_ns, 'thread_state.blocked_function',
          CASE WHEN lock_wait_ns > 500000000 THEN 'high' ELSE 'medium' END,
          'needs_lock_owner_evidence',
          '需要 monitor_contention/owner thread/锁链证据；普通 futex wait 只能说明候选锁等待'
        FROM metrics WHERE lock_wait_ns > 0
        UNION ALL
        SELECT 'disk_or_page_fault_io', disk_wait_ns, 'thread_state.io_wait_or_blocked_function',
          CASE WHEN disk_wait_ns > 500000000 THEN 'high' ELSE 'medium' END,
          'needs_io_system_context',
          '需要 iowait、blk/mmc、文件/DB slice 或系统 IO 压力交叉验证'
        FROM metrics WHERE disk_wait_ns > 0
        UNION ALL
        SELECT 'uninterruptible_wait', uninterruptible_wait_ns, 'thread_state.D_without_io_function',
          'low',
          'needs_kernel_wait_context',
          'D-state 只能说明不可中断等待；缺少 IO blocked_function 或 slice 证据时不能归因为磁盘/页缺失'
        FROM metrics WHERE uninterruptible_wait_ns > 0
        UNION ALL
        SELECT 'scheduler_pressure', runnable_ns, 'thread_state.R_or_R_plus',
          CASE WHEN runnable_ns * 100.0 / NULLIF((SELECT window_ns FROM anr_window), 0) > 30 THEN 'medium' ELSE 'low' END,
          'needs_system_load_context',
          '需要 CPU health、Top CPU process、sched latency 交叉验证'
        FROM metrics WHERE runnable_ns > 0
        UNION ALL
        SELECT 'cpu_busy_main_thread', running_ns, 'thread_state.Running',
          CASE WHEN running_ns * 100.0 / NULLIF((SELECT window_ns FROM anr_window), 0) > 70 THEN 'medium' ELSE 'low' END,
          'needs_hot_slice_context',
          '需要主线程热点 slice/调用栈确认是否业务计算，不能只凭 Running 定责'
        FROM metrics WHERE running_ns > 0
        UNION ALL
        SELECT 'native_poll_idle_or_ambiguous', poll_wait_ns, 'thread_state.blocked_function',
          'low',
          'not_root_cause_by_itself',
          'nativePoll/epoll 只说明当前快照等待消息；需 EventLog/Logcat/窗口焦点或系统压力补证'
        FROM metrics WHERE poll_wait_ns > 0
        UNION ALL
        SELECT 'main_thread_sleep', sleep_wait_ns, 'thread_state.blocked_function',
          CASE WHEN sleep_wait_ns > 500000000 THEN 'medium' ELSE 'low' END,
          'app_candidate_needs_stack_context',
          '需要 Thread.sleep/wait 调用栈确认是否业务设计问题'
        FROM metrics WHERE sleep_wait_ns > 0
        UNION ALL
        SELECT 'unknown', (SELECT window_ns FROM anr_window), 'no_direct_thread_state_or_slice_signal',
          'low',
          'unknown',
          '当前 Perfetto 表未给出直接阻塞点；需要 ANR trace/logcat/EventLog 或更完整采集'
        WHERE NOT EXISTS (
          SELECT 1 FROM metrics
          WHERE binder_wait_ns + lock_wait_ns + disk_wait_ns + uninterruptible_wait_ns
            + runnable_ns + running_ns + poll_wait_ns + sleep_wait_ns > 0
        )
      )
      SELECT
        direct_blocker_type,
        ROUND(evidence_ns / 1e6, 2) AS evidence_ms,
        ROUND(100.0 * evidence_ns / NULLIF((SELECT window_ns FROM anr_window), 0), 1) AS pct_of_timeout,
        evidence_source,
        confidence,
        root_cause_boundary,
        next_evidence_needed
      FROM candidates
      ORDER BY
        CASE confidence WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END,
        evidence_ns DESC
      LIMIT 5
    save_as: direct_blocker_candidates

  - id: direct_blocker_slice_evidence_gap
    type: atomic
    process_scope:
      role: identity_metadata
    name: "Slice 直接阻塞点证据缺口"
    optional: true
    display:
      level: detail
      layer: deep
      title: "Slice 直接阻塞点候选"
      columns:
        - name: direct_blocker_type
          label: "直接阻塞类型"
          type: string
        - name: evidence_ms
          label: "证据时长"
          type: duration
          format: duration_ms
          unit: ms
        - name: pct_of_timeout
          label: "超时占比"
          type: percentage
          format: percentage
        - name: evidence_source
          label: "证据来源"
          type: string
        - name: confidence
          label: "置信度"
          type: string
        - name: root_cause_boundary
          label: "责任边界"
          type: string
        - name: next_evidence_needed
          label: "下一步证据"
          type: string
    condition: "thread_evidence_availability.data[0]?.has_thread_state === 1 && (thread_evidence_availability.data[0]?.has_thread_track !== 1 || thread_evidence_availability.data[0]?.has_slice !== 1)"
    sql: |
      SELECT
        'slice_evidence_unavailable' AS direct_blocker_type,
        0 AS evidence_ms,
        0 AS pct_of_timeout,
        'missing_thread_track_or_slice' AS evidence_source,
        'low' AS confidence,
        'missing_slice_evidence' AS root_cause_boundary,
        'Trace 缺少 thread_track/slice，无法从主线程或 RenderThread slice 判断 IO/GC/渲染候选；thread_state 直接阻塞点仍可使用' AS next_evidence_needed
    save_as: direct_blocker_slice_gap

  - id: direct_blocker_slice_classification
    type: atomic
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
    name: "Slice 直接阻塞点候选"
    optional: true
    condition: "thread_evidence_availability.data[0]?.has_thread_track === 1 && thread_evidence_availability.data[0]?.has_slice === 1"
    display:
      level: detail
      layer: deep
      title: "Slice 直接阻塞点候选"
      columns:
        - name: direct_blocker_type
          label: "直接阻塞类型"
          type: string
        - name: evidence_ms
          label: "证据时长"
          type: duration
          format: duration_ms
          unit: ms
        - name: pct_of_timeout
          label: "超时占比"
          type: percentage
          format: percentage
        - name: evidence_source
          label: "证据来源"
          type: string
        - name: confidence
          label: "置信度"
          type: string
        - name: root_cause_boundary
          label: "责任边界"
          type: string
        - name: next_evidence_needed
          label: "下一步证据"
          type: string
    sql: |
      WITH
      anr_window AS (
        SELECT
          ${anr_ts} - ${timeout_ns} AS start_ts,
          ${anr_ts} AS end_ts,
          ${timeout_ns} AS window_ns
      ),
      main_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN effective_target_processes p ON t.upid = p.upid
        WHERE (
            ${__process_scope.upid} IS NOT NULL
            OR (${upid} > 0 AND p.upid = ${upid})
            OR (${upid} <= 0 AND ${pid} > 0 AND p.pid = ${pid}
                AND ('${process_name}' = '' OR p.name = '${process_name}' OR p.name GLOB '${process_name}:*'))
            OR (${upid} <= 0 AND ${pid} <= 0
                AND (p.name = '${process_name}' OR p.name GLOB '${process_name}:*'))
          )
          AND t.tid = p.pid
        LIMIT 1
      ),
      render_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN effective_target_processes p ON t.upid = p.upid
        WHERE (
            ${__process_scope.upid} IS NOT NULL
            OR (${upid} > 0 AND p.upid = ${upid})
            OR (${upid} <= 0 AND ${pid} > 0 AND p.pid = ${pid}
                AND ('${process_name}' = '' OR p.name = '${process_name}' OR p.name GLOB '${process_name}:*'))
            OR (${upid} <= 0 AND ${pid} <= 0
                AND (p.name = '${process_name}' OR p.name GLOB '${process_name}:*'))
          )
          AND t.name = 'RenderThread'
        LIMIT 1
      ),
      main_slices AS (
        SELECT
          LOWER(s.name) AS slice_name,
          MIN(CASE WHEN s.dur < 0 THEN aw.end_ts ELSE s.ts + s.dur END, aw.end_ts) - MAX(s.ts, aw.start_ts) AS clipped_ns
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN main_thread mt ON tt.utid = mt.utid
        CROSS JOIN anr_window aw
        WHERE s.ts < aw.end_ts
          AND (CASE WHEN s.dur < 0 THEN aw.end_ts ELSE s.ts + s.dur END) > aw.start_ts
      ),
      render_slices AS (
        SELECT
          LOWER(s.name) AS slice_name,
          MIN(CASE WHEN s.dur < 0 THEN aw.end_ts ELSE s.ts + s.dur END, aw.end_ts) - MAX(s.ts, aw.start_ts) AS clipped_ns
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN render_thread rt ON tt.utid = rt.utid
        CROSS JOIN anr_window aw
        WHERE s.ts < aw.end_ts
          AND (CASE WHEN s.dur < 0 THEN aw.end_ts ELSE s.ts + s.dur END) > aw.start_ts
      ),
      metrics AS (
        SELECT
          COALESCE((SELECT SUM(clipped_ns) FROM main_slices
            WHERE slice_name GLOB '*sqlite*'
              OR slice_name GLOB '*database*'
              OR slice_name GLOB '*fsync*'
              OR slice_name GLOB '*fileio*'
              OR slice_name GLOB '*file_io*'
              OR slice_name GLOB '*disk*'
              OR slice_name GLOB '*sharedpreferences*'
              OR slice_name GLOB '*queuedwork*'), 0) AS main_io_slice_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_slices
            WHERE slice_name GLOB '*gc*'
              OR slice_name GLOB '*garbage*'
              OR slice_name GLOB '*waitforgctocomplete*'
              OR slice_name GLOB '*suspend*'), 0) AS gc_wait_ns,
          COALESCE((SELECT SUM(clipped_ns) FROM main_slices
            WHERE slice_name GLOB '*syncanddraw*'
              OR slice_name GLOB '*waitforfence*'
              OR slice_name GLOB '*dequeuebuffer*'
              OR slice_name GLOB '*egl*'), 0) +
          COALESCE((SELECT SUM(clipped_ns) FROM render_slices
            WHERE slice_name GLOB '*syncanddraw*'
              OR slice_name GLOB '*waitforfence*'
              OR slice_name GLOB '*dequeuebuffer*'
              OR slice_name GLOB '*drawframe*'
              OR slice_name GLOB '*syncframestate*'), 0) AS render_wait_ns
      ),
      candidates AS (
        SELECT 'db_or_file_io_slice' AS direct_blocker_type, main_io_slice_ns AS evidence_ns,
          'main_thread_slice' AS evidence_source,
          CASE WHEN main_io_slice_ns > 500000000 THEN 'medium' ELSE 'low' END AS confidence,
          'app_candidate_needs_window_context' AS root_cause_boundary,
          '需要确认该 IO slice 与 ANR 前窗口重叠，并结合系统 IO 压力判断是否被放大' AS next_evidence_needed
        FROM metrics WHERE main_io_slice_ns > 0
        UNION ALL
        SELECT 'render_or_fence_wait', render_wait_ns, 'main_or_render_thread_slice',
          CASE WHEN render_wait_ns > 500000000 THEN 'medium' ELSE 'low' END,
          'needs_render_sf_evidence',
          '需要 RenderThread、SurfaceFlinger、fence/buffer queue 证据闭环'
        FROM metrics WHERE render_wait_ns > 0
        UNION ALL
        SELECT 'gc_or_stw_wait', gc_wait_ns, 'main_thread_slice',
          CASE WHEN gc_wait_ns > 500000000 THEN 'medium' ELSE 'low' END,
          'needs_memory_gc_evidence',
          '需要 GC/logcat、PSI memory、LMK/OOM 或多线程暂停证据确认'
        FROM metrics WHERE gc_wait_ns > 0
      )
      SELECT
        direct_blocker_type,
        ROUND(evidence_ns / 1e6, 2) AS evidence_ms,
        ROUND(100.0 * evidence_ns / NULLIF((SELECT window_ns FROM anr_window), 0), 1) AS pct_of_timeout,
        evidence_source,
        confidence,
        root_cause_boundary,
        next_evidence_needed
      FROM candidates
      ORDER BY
        CASE confidence WHEN 'medium' THEN 1 ELSE 2 END,
        evidence_ns DESC
      LIMIT 5
    save_as: direct_blocker_slice_candidates

  # ============================================================================
  # 当前 ANR 附近 Logcat / AnrManager 上下文（逐 ANR，避免多事件串台）
  # ============================================================================
  - id: logcat_availability
    type: atomic
    process_scope:
      role: global_context
    name: "Logcat 表可用性"
    display:
      level: hidden
    sql: |
      SELECT
        CASE WHEN EXISTS (
          SELECT 1 FROM sqlite_master
          WHERE type IN ('table', 'view') AND name = 'android_logs'
        ) THEN 1 ELSE 0 END AS has_android_logs
    save_as: logcat_availability
    optional: true

  - id: anr_logcat_evidence_gap
    type: atomic
    process_scope:
      role: identity_metadata
    name: "当前 ANR 日志证据缺口"
    optional: true
    condition: "logcat_availability.data[0]?.has_android_logs !== 1"
    display:
      level: detail
      layer: deep
      title: "当前 ANR 日志上下文"
      columns:
        - name: error_id
          label: "Error ID"
          type: string
        - name: signal_type
          label: "信号类型"
          type: string
        - name: evidence_scope
          label: "证据范围"
          type: string
        - name: root_cause_eligible
          label: "可作根因证据"
          type: boolean
        - name: msg_preview
          label: "消息"
          type: string
    sql: |
      SELECT
        '${error_id}' AS error_id,
        'evidence_unavailable' AS signal_type,
        'missing_source' AS evidence_scope,
        0 AS root_cause_eligible,
        'Trace 缺少 android_logs，无法用 Logcat/AnrManager 校验当前 ANR 触发上下文' AS msg_preview
    save_as: logcat_context_gap

  - id: anr_logcat_context
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - Logcat rows are correlated by event identifiers or message text and do not establish an exact process instance.
    name: "当前 ANR 日志上下文"
    optional: true
    condition: "logcat_availability.data[0]?.has_android_logs === 1"
    display:
      level: detail
      layer: deep
      title: "当前 ANR 日志上下文"
      columns:
        - name: error_id
          label: "Error ID"
          type: string
        - name: relation_to_anr_ms
          label: "相对 ANR"
          type: duration
          format: duration_ms
          unit: ms
        - name: phase
          label: "阶段"
          type: string
        - name: signal_type
          label: "信号类型"
          type: string
        - name: evidence_scope
          label: "证据范围"
          type: string
        - name: root_cause_eligible
          label: "可作根因证据"
          type: boolean
        - name: prio
          label: "级别"
          type: string
        - name: tag
          label: "Tag"
          type: string
        - name: msg_preview
          label: "消息"
          type: string
    sql: |
      WITH anr_window AS (
        SELECT
          ${anr_ts} - ${timeout_ns} AS start_ts,
          ${anr_ts} AS anr_ts,
          ${anr_ts} + 5000000000 AS end_ts
      ),
      tagged AS (
        SELECT
          l.*,
          CASE
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*inputdispatcher*' OR LOWER(COALESCE(l.msg, '')) GLOB '*input dispatch*' THEN 'input_dispatch'
            WHEN LOWER(COALESCE(l.msg, '')) GLOB '*no focused window*' OR LOWER(COALESCE(l.msg, '')) GLOB '*no focus window*' THEN 'no_focus_window'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*anrmanager*' THEN 'anrmanager'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*activitymanager*' OR LOWER(COALESCE(l.tag, '')) GLOB '*activitytaskmanager*' THEN 'activity_manager'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*windowmanager*' THEN 'window_manager'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*broadcastqueue*' OR LOWER(COALESCE(l.msg, '')) GLOB '*broadcast*timeout*' THEN 'broadcast_timeout'
            WHEN LOWER(COALESCE(l.msg, '')) GLOB '*executing service*' OR LOWER(COALESCE(l.msg, '')) GLOB '*foreground service*' THEN 'service_timeout'
            WHEN LOWER(COALESCE(l.msg, '')) GLOB '*contentprovider*' OR LOWER(COALESCE(l.msg, '')) GLOB '*provider not responding*' THEN 'provider_timeout'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*jobscheduler*' OR LOWER(COALESCE(l.msg, '')) GLOB '*jobservice*' THEN 'job_scheduler'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*watchdog*' OR LOWER(COALESCE(l.msg, '')) GLOB '*system_server*watchdog*' THEN 'watchdog'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*lmkd*' OR LOWER(COALESCE(l.tag, '')) GLOB '*lowmemorykiller*' OR LOWER(COALESCE(l.msg, '')) GLOB '*lowmemory*' THEN 'memory_pressure'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*art*' OR LOWER(COALESCE(l.msg, '')) GLOB '*gc*' THEN 'gc_or_art'
            WHEN LOWER(COALESCE(l.tag, '')) GLOB '*strictmode*'
              OR LOWER(COALESCE(l.tag, '')) GLOB '*binder*'
              OR LOWER(COALESCE(l.msg, '')) GLOB '*anr*'
              OR LOWER(COALESCE(l.msg, '')) GLOB '*not responding*'
              THEN 'anr_related'
            ELSE 'other'
          END AS signal_type
        FROM android_logs l
      ),
      scoped AS (
        SELECT
          l.*,
          CASE
            WHEN '${process_name}' <> ''
              AND LOWER(COALESCE(l.msg, '')) LIKE '%' || LOWER('${process_name}') || '%'
              THEN 1 ELSE 0
          END AS process_match,
          CASE
            WHEN '${component}' <> ''
              AND LOWER(COALESCE(l.msg, '')) LIKE '%' || LOWER('${component}') || '%'
              THEN 1 ELSE 0
          END AS component_match,
          CASE
            WHEN '${intent}' <> ''
              AND LOWER(COALESCE(l.msg, '')) LIKE '%' || LOWER('${intent}') || '%'
              THEN 1 ELSE 0
          END AS intent_match,
          CASE
            WHEN '${error_id}' <> ''
              AND LOWER(COALESCE(l.msg, '')) LIKE '%' || LOWER('${error_id}') || '%'
              THEN 1 ELSE 0
          END AS error_match,
          CASE
            WHEN l.signal_type IN (
              'input_dispatch',
              'no_focus_window',
              'anrmanager',
              'activity_manager',
              'window_manager',
              'broadcast_timeout',
              'service_timeout',
              'provider_timeout',
              'job_scheduler',
              'watchdog',
              'memory_pressure',
              'gc_or_art',
              'anr_related'
            ) THEN 1 ELSE 0
          END AS global_signal_match
        FROM tagged l
      )
      SELECT
        '${error_id}' AS error_id,
        ROUND((l.ts - aw.anr_ts) / 1e6, 2) AS relation_to_anr_ms,
        CASE
          WHEN l.ts < aw.anr_ts THEN 'pre_anr'
          WHEN l.ts <= aw.anr_ts + 1000000000 THEN 'dump_or_trigger'
          ELSE 'post_anr'
        END AS phase,
        CASE
          WHEN l.ts <= aw.anr_ts
            AND (l.error_match = 1 OR l.component_match = 1 OR l.intent_match = 1)
            AND (
              l.global_signal_match = 1
              OR (l.prio >= 5 AND l.signal_type <> 'other')
            )
            THEN 1
          ELSE 0
        END AS root_cause_eligible,
        l.signal_type,
        CASE
          WHEN l.error_match = 1 OR l.component_match = 1 OR l.intent_match = 1 THEN 'event_scoped'
          WHEN l.process_match = 1 THEN 'target_process_context'
          ELSE 'global_context'
        END AS evidence_scope,
        CASE l.prio
          WHEN 4 THEN 'INFO'
          WHEN 5 THEN 'WARN'
          WHEN 6 THEN 'ERROR'
          WHEN 7 THEN 'FATAL'
          ELSE CAST(l.prio AS TEXT)
        END AS prio,
        l.tag,
        SUBSTR(l.msg, 1, 220) AS msg_preview
      FROM scoped l
      CROSS JOIN anr_window aw
      WHERE l.ts >= aw.start_ts
        AND l.ts <= aw.end_ts
        AND l.prio >= 4
        AND (
          l.process_match = 1
          OR l.component_match = 1
          OR l.intent_match = 1
          OR l.error_match = 1
          OR (
            l.ts <= aw.anr_ts
            AND l.global_signal_match = 1
          )
        )
      ORDER BY root_cause_eligible DESC, ABS(l.ts - aw.anr_ts), l.ts
      LIMIT 40
    save_as: logcat_event_context

  # ============================================================================
  # 诊断规则
  # ============================================================================
  - id: anr_event_diagnosis
    type: diagnostic
    name: "ANR 事件诊断"
    display:
      level: key
      layer: deep
      title: "诊断结果"
    inputs: [anr_basic, quadrant, render_thread, lock_contention, app_freeze_check, wakeup, main_slices, direct_blocker_gap, direct_blocker_candidates, direct_blocker_slice_gap, direct_blocker_slice_candidates, logcat_context_gap, logcat_event_context]
    rules:
      # === 证据可用性 ===

      - condition: "direct_blocker_gap.data?.find(r => r.direct_blocker_type === 'evidence_unavailable')"
        severity: info
        diagnosis: "当前 trace 缺少 thread_state，直接阻塞点不可判定"
        confidence: low
        suggestions:
          - "不要仅凭 trigger 或 logcat 作为最终根因"
          - "需要包含 thread_state 的 trace 才能判断主线程直接阻塞形态"

      - condition: "direct_blocker_slice_gap.data?.find(r => r.direct_blocker_type === 'slice_evidence_unavailable')"
        severity: info
        diagnosis: "当前 trace 缺少 thread_track/slice，无法用 slice 判断 IO/GC/渲染候选"
        confidence: low
        suggestions:
          - "thread_state 直接阻塞点仍可使用"
          - "不要把缺失 slice 解释为没有 IO/GC/渲染等待"

      - condition: "logcat_context_gap.data?.find(r => r.signal_type === 'evidence_unavailable')"
        severity: info
        diagnosis: "当前 trace 缺少 android_logs，无法用 Logcat/AnrManager 校验触发上下文"
        confidence: low
        suggestions:
          - "保留该缺口，不要把缺失日志解释为没有系统/窗口/Binder 信号"
          - "结合 Perfetto ANR 类型和线程状态继续分析"

      # === 主线程状态诊断 ===

      # 主线程长时间阻塞（Sleeping > 80%，必须有逐事件 direct_blocker 支撑）
      - condition: "(quadrant.data[0]?.sleeping_pct || 0) > 80 && (direct_blocker_candidates.data?.find(r => ['binder_wait','lock_or_futex_wait','disk_or_page_fault_io','main_thread_sleep'].includes(r.direct_blocker_type) && r.confidence !== 'low') || direct_blocker_slice_candidates.data?.find(r => ['db_or_file_io_slice','render_or_fence_wait','gc_or_stw_wait'].includes(r.direct_blocker_type) && r.confidence !== 'low'))"
        severity: warning
        diagnosis: "主线程 Sleeping/Blocked 占比 ${quadrant.data[0].sleeping_pct}%，存在逐事件 direct_blocker 候选；仍需对应的对端/owner/系统上下文闭环"
        confidence: medium
        suggestions:
          - "以 direct_blocker_classification 为准，不使用包名级 blocking 结果单独定因"
          - "Binder wait 需要对端线程证据；锁等待需要 owner/monitor chain；IO/GC/Render 需要同窗口上下文"
          - "nativePoll/epoll 等待不满足该规则，不能单独作为根因"

      # 主线程 CPU 饥饿（Runnable > 30%，需逐事件 scheduler_pressure 候选）
      - condition: "(quadrant.data[0]?.runnable_pct || 0) > 30 && direct_blocker_candidates.data?.find(r => r.direct_blocker_type === 'scheduler_pressure' && r.confidence !== 'low')"
        severity: warning
        diagnosis: "主线程等待调度 ${quadrant.data[0].runnable_pct}%，direct_blocker 标记 scheduler_pressure；需要系统负载/拓扑/调度证据闭环"
        confidence: medium
        suggestions:
          - "主线程想运行但拿不到 CPU"
          - "检查同一 ANR 窗口的 CPU health、Top CPU process 和调度延迟"
          - "不要只凭包名级 sched_latency 结果定因"

      # 主线程运行时间主要在小核且存在调度等待（需调度佐证）
      # A placement observation, not a cause: q1 counts prime/big/medium, and
      # the share is defined only when every Running span has a core tier
      # (unknown_running_ns is unrounded; unknown_running_ms can round to 0).
      # anr_detail collects no cpufreq max-limit evidence. Templates stay within
      # the portable expression subset (no ternary, no Math.*).
      - condition: "quadrant.data[0]?.running_pct > 50 && quadrant.data[0]?.unknown_running_ns === 0 && quadrant.data[0]?.q1_big_running_ms < quadrant.data[0]?.q2_little_running_ms * 0.3 && quadrant.data[0]?.runnable_pct > 10 && direct_blocker_candidates.data?.find(r => r.direct_blocker_type === 'scheduler_pressure' && r.confidence !== 'low')"
        severity: warning
        diagnosis: "主线程运行时间主要在小核：大核组（超大/大/中核）${quadrant.data[0].q1_big_running_ms}ms、小核 ${quadrant.data[0].q2_little_running_ms}ms，同时 Runnable 等待 ${quadrant.data[0].runnable_pct}%"
        confidence: medium
        suggestions:
          - "放置本身不说明原因；可能的解释包括负载均衡、EAS 能效放置、uclamp/cpuset 限制、主线程负载低于上迁阈值、大核组繁忙，需结合调度数据核对"
          - "核对同一 ANR 窗口内占用大核组的任务（目标任务调度交接、窗口 CPU 系统上下文），确认 Runnable 等待是否来自大核组争用"
          - "占比本身不是限频或温控证据；频率上限可能降低大核可用容量并影响放置，是否限频以 ANR 窗口的 CPU 限频证据为准：本 Skill 未采集该证据，限频与否未判定，可在同一窗口调用 cpu_throttling_in_range 核对"

      # === Binder 阻塞诊断 ===

      # Binder 直接阻塞候选（需要对端证据才可定责）
      - condition: "direct_blocker_candidates.data?.find(r => r.direct_blocker_type === 'binder_wait')"
        severity: warning
        diagnosis: "主线程存在 Binder 等待候选，但该证据只能说明客户端等待，不能直接定责对端"
        confidence: medium
        suggestions:
          - "补查 Binder 对端进程、server_dur 或 system_server 线程状态"
          - "将 Binder wait 作为 direct blocker candidate，而不是最终根因"

      # === 锁竞争诊断 ===

      # Futex/锁等待候选（没有 owner 时降级）
      - condition: "direct_blocker_candidates.data?.find(r => r.direct_blocker_type === 'lock_or_futex_wait') && !(lock_contention.data?.find(r => r.blocked_type === 'MainThread'))"
        severity: warning
        diagnosis: "主线程存在 futex/lock 等待候选，但缺少持锁线程/锁链证据"
        confidence: medium
        suggestions:
          - "需要 android_monitor_contention、owner thread 或锁链证据确认"
          - "不要把普通 futex_wait 直接写成死锁"

      # 严重锁竞争（需主线程阻塞态佐证）
      - condition: "direct_blocker_candidates.data?.find(r => r.direct_blocker_type === 'lock_or_futex_wait') && lock_contention.data?.find(r => r.blocked_type === 'MainThread' && r.severity === 'critical') && (quadrant.data[0]?.sleeping_pct || 0) > 50"
        severity: critical
        diagnosis: "主线程严重锁竞争：等待 ${lock_contention.data.find(r => r.blocked_type === 'MainThread' && r.severity === 'critical')?.blocking_thread_name} ${lock_contention.data.find(r => r.blocked_type === 'MainThread' && r.severity === 'critical')?.wait_ms}ms"
        confidence: high
        suggestions:
          - "存在当前 ANR 进程主线程严重锁竞争"
          - "持锁线程：${lock_contention.data.find(r => r.blocked_type === 'MainThread' && r.severity === 'critical')?.blocking_thread_name}"
          - "阻塞方法：${lock_contention.data.find(r => r.blocked_type === 'MainThread' && r.severity === 'critical')?.blocking_method}"

      # 主线程被锁阻塞（需阻塞态佐证）
      - condition: "direct_blocker_candidates.data?.find(r => r.direct_blocker_type === 'lock_or_futex_wait') && lock_contention.data?.find(r => r.blocked_type === 'MainThread') && (quadrant.data[0]?.sleeping_pct || 0) > 30"
        severity: warning
        diagnosis: "主线程被锁阻塞"
        confidence: high
        suggestions:
          - "主线程在等待获取锁"
          - "避免主线程持有长时间锁"
          - "考虑使用异步操作或减少锁粒度"

      # === RenderThread 诊断 ===

      # nativePoll/epoll 只作为降级证据
      - condition: "direct_blocker_candidates.data?.find(r => r.direct_blocker_type === 'native_poll_idle_or_ambiguous') && !direct_blocker_candidates.data?.find(r => ['binder_wait','lock_or_futex_wait','disk_or_page_fault_io'].includes(r.direct_blocker_type)) && !direct_blocker_slice_candidates.data?.find(r => ['db_or_file_io_slice','render_or_fence_wait'].includes(r.direct_blocker_type))"
        severity: info
        diagnosis: "主线程主要表现为 native poll/epoll 等待；这是 idle-or-ambiguous 证据，不能单独作为 ANR 根因"
        confidence: low
        suggestions:
          - "结合 EventLog/Logcat 的 input/no-focus/window 时间线判断真实触发链"
          - "检查系统负载、焦点窗口、对端 Binder 或渲染链路是否是上游原因"

      # nSyncDraw 阻塞（仅在主线程阻塞态明显时作为次要证据）
      - condition: "render_thread.data?.find(r => r.name?.includes('nSyncDraw') && r.dur_ms > 50) && (quadrant.data[0]?.sleeping_pct || 0) > 30"
        severity: warning
        diagnosis: "RenderThread nSyncDraw 阻塞 ${render_thread.data.find(r => r.name?.includes('nSyncDraw'))?.dur_ms}ms"
        confidence: high
        suggestions:
          - "渲染同步点阻塞"
          - "可能与主线程有同步等待"
          - "检查是否有复杂绘制操作"

      # dequeueBuffer 阻塞（仅在主线程阻塞态明显时作为次要证据）
      - condition: "render_thread.data?.find(r => r.name?.includes('dequeueBuffer') && r.dur_ms > 50) && (quadrant.data[0]?.sleeping_pct || 0) > 30"
        severity: warning
        diagnosis: "RenderThread dequeueBuffer 阻塞 ${render_thread.data.find(r => r.name?.includes('dequeueBuffer'))?.dur_ms}ms"
        confidence: medium
        suggestions:
          - "等待 SurfaceFlinger 分配 Buffer"
          - "可能是显示系统繁忙"
          - "检查是否有大量图形渲染"

      # === 应用冻结诊断 ===

      # 应用完全冻结（MainThread、RenderThread、Binder 都冻结）
      - condition: "app_freeze_check.data?.find(r => r.thread_type === 'MainThread')?.status === 'frozen' && app_freeze_check.data?.find(r => r.thread_type === 'RenderThread')?.status === 'frozen' && app_freeze_check.data?.find(r => r.thread_type === 'Binder')?.status === 'frozen' && (quadrant.data[0]?.sleeping_pct || 0) > 80"
        severity: critical
        diagnosis: "应用完全冻结，主线程活动率仅 ${app_freeze_check.data.find(r => r.thread_type === 'MainThread')?.activity_pct}%"
        confidence: high
        suggestions:
          - "MainThread、RenderThread、Binder 均几乎没有活动"
          - "可能是死锁或严重阻塞"
          - "检查 direct_blocker、锁 owner、Binder 对端或系统上下文"

      # 主线程冻结但其他线程未全部冻结
      - condition: "app_freeze_check.data?.find(r => r.thread_type === 'MainThread')?.status === 'frozen' && (quadrant.data[0]?.sleeping_pct || 0) > 80 && !(app_freeze_check.data?.find(r => r.thread_type === 'RenderThread')?.status === 'frozen' && app_freeze_check.data?.find(r => r.thread_type === 'Binder')?.status === 'frozen')"
        severity: warning
        diagnosis: "主线程冻结/低活动，不能直接等同应用完全冻结"
        confidence: medium
        suggestions:
          - "检查 RenderThread、Binder 线程是否仍活跃"
          - "按 direct_blocker、锁 owner、Binder 对端或系统上下文继续定因"
          - "只有 MainThread、RenderThread、Binder 均冻结时才报告应用完全冻结"

output:
  display:
    level: key
    format: summary
