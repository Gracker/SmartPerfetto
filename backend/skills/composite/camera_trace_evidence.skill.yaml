name: camera_trace_evidence
version: "1.1"
type: composite
category: rendering
tier: B

meta:
  display_name: "Camera Trace 证据"
  description: "Camera/preview 的独立 callback 节奏、SF layer/DisplayFrame 呈现端关联、Binder wall/Running 与内存证据；不测 app arrival→present 时延"
  icon: "photo_camera"
  tags: [camera, media, preview, rendering, frame_cadence, evidence, binder, dmabuf, ion, pixel]

triggers:
  keywords:
    zh: [Camera, 相机, 打开相机, 相机内存]
    en: [camera, camera open, camera memory]
  patterns:
    - ".*(camera|Camera|相机).*(open|preview|capture|打开|预览|拍照|DMA|dmabuf).*"
    - ".*(open|preview|capture|打开|预览|拍照).*(camera|Camera|相机).*"

prerequisites:
  required_tables: [slice, thread, process]
  modules:
    - slices.with_context
    - android.binder
    - android.frames.timeline
    - android.memory.dmabuf
    - linux.cpu.frequency
    - pixel.camera

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns)，默认 trace_start()"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns)，默认 trace_end()"
  - name: max_rows
    type: integer
    required: false
    default: 20
    description: "每个明细步骤最大返回行数，限制为 1-100"

steps:
  - id: camera_frame_population
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "FrameTimeline 人口（DisplayFrame / SurfaceFrame 分开）"
    display:
      layer: overview
      level: summary
      title: "FrameTimeline 人口（DisplayFrame / SurfaceFrame 分开）"
      columns:
        - {name: frame_kind, label: "帧类型", type: string}
        - {name: upid, label: "UPID", type: number}
        - {name: process_name, label: "进程", type: string}
        - {name: layer_name, label: "Surface layer（DisplayFrame 为空）", type: string}
        - {name: frame_count, label: "原始条目数", type: number}
        - {name: dropped_frames, label: "Dropped 条目数", type: number}
        - {name: incomplete_frames, label: "未完成条目数", type: number}
        - {name: window_excluded_endpoints, label: "完成但呈现端在窗外的条目数", type: number}
        - {name: prediction_error_frames, label: "Prediction Error 条目数", type: number}
        - {name: scope, label: "范围", type: string}
        - {name: limitation, label: "边界", type: string}
    sql_fragments: [fragments/camera_frame_observations.sql]
    sql: |
      WITH RECURSIVE population AS (
       SELECT frame_kind, upid, process_name, layer_name, COUNT(*) AS frame_count,
         SUM(CASE WHEN present_type = 'Dropped Frame' THEN 1 ELSE 0 END) AS dropped_frames,
         SUM(CASE WHEN dur < 0 OR dur IS NULL THEN 1 ELSE 0 END) AS incomplete_frames,
         SUM(CASE WHEN completed_display_present_ts IS NOT NULL AND display_present_ts IS NULL THEN 1 ELSE 0 END) AS window_excluded_endpoints,
         SUM(CASE WHEN jank_type GLOB '*Prediction Error*' THEN 1 ELSE 0 END) AS prediction_error_frames
       FROM camera_frame_rows, camera_input i WHERE ts >= i.start_ts AND ts < i.end_ts
       GROUP BY frame_kind, upid, layer_name
      )
      SELECT *, 'frame_kind_process_layer_population' AS scope,
       'Population counts frame starts in [start_ts,end_ts). DisplayFrame is SF context; SurfaceFrame is app completion. Prediction Error is not Dropped. Completed endpoints outside the window are counted separately and excluded from cadence/latency. No rows means no observed population.' AS limitation,
       COUNT(*) OVER () AS total_groups
      FROM population ORDER BY frame_kind, upid, layer_name LIMIT (SELECT max_rows FROM camera_input)
    save_as: camera_frame_population
    synthesize:
      role: overview
      fields:
        - key: frame_kind
          label: "帧类型"
        - key: upid
          label: "UPID"
        - key: process_name
          label: "进程"
        - key: layer_name
          label: "Surface layer（DisplayFrame 为空）"
        - key: frame_count
          label: "原始条目数"
        - key: dropped_frames
          label: "Dropped 条目数"
        - key: incomplete_frames
          label: "未完成条目数"
        - key: window_excluded_endpoints
          label: "完成但呈现端在窗外的条目数"
        - key: prediction_error_frames
          label: "Prediction Error 条目数"

  - id: camera_callback_cadence
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "App buffer callback 观测节奏（跨线程合并）"
    display:
      layer: overview
      level: summary
      title: "App buffer callback 观测节奏（跨线程合并）"
      columns:
        - {name: source_upid, label: "观测进程 UPID", type: number}
        - {name: source_process, label: "观测进程", type: string}
        - {name: source_surface, label: "原始 surface 标识", type: string}
        - {name: callback_count, label: "Callback 数", type: number}
        - {name: callback_threads, label: "Callback 线程数", type: number}
        - {name: observed_intervals, label: "观测间隔数", type: number}
        - {name: avg_interval_ns, label: "平均到达间隔", type: duration, unit: ns, format: duration_ms}
        - {name: p95_interval_ns, label: "P95到达间隔", type: duration, unit: ns, format: duration_ms}
        - {name: max_interval_ns, label: "最大到达间隔", type: duration, unit: ns, format: duration_ms}
        - {name: observed_callback_fps, label: "观测到达 FPS", type: number}
        - {name: configured_target_status, label: "配置目标状态", type: string}
        - {name: scope, label: "范围", type: string}
        - {name: limitation, label: "边界", type: string}
    sql_fragments: [fragments/camera_frame_observations.sql]
    sql: |
      WITH RECURSIVE source_stats AS (
       SELECT source_upid, source_process, source_surface, COUNT(*) AS callback_count,
         COUNT(DISTINCT utid) AS callback_threads, COUNT(callback_interval_ns) AS observed_intervals,
         AVG(callback_interval_ns) AS avg_interval_ns, PERCENTILE(callback_interval_ns, 95) AS p95_interval_ns,
         MAX(callback_interval_ns) AS max_interval_ns,
         (COUNT(*)-1)*1e9/NULLIF(MAX(arrival_ts)-MIN(arrival_ts),0) AS observed_callback_fps
       FROM camera_callback_intervals GROUP BY source_upid, source_surface
      )
      SELECT *, 'not_measured' AS configured_target_status, 'process_surface_callback' AS scope,
       'Callback arrival is observed app buffer delivery, not sensor completion or configured FPS. Processes and surfaces remain separate; threads of the same source are merged.' AS limitation,
       COUNT(*) OVER () AS total_groups
      FROM source_stats ORDER BY callback_count DESC, source_upid, source_surface LIMIT (SELECT max_rows FROM camera_input)
    save_as: camera_callback_cadence
    synthesize:
      role: overview
      fields:
        - key: source_upid
          label: "观测进程 UPID"
        - key: source_process
          label: "观测进程"
        - key: source_surface
          label: "原始 surface 标识"
        - key: callback_count
          label: "Callback 数"
        - key: callback_threads
          label: "Callback 线程数"
        - key: observed_intervals
          label: "观测间隔数"
        - key: avg_interval_ns
          label: "平均到达间隔"
        - key: p95_interval_ns
          label: "P95到达间隔"

  - id: camera_display_cadence
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "SF DisplayFrame 呈现端间隔（SF 上下文）"
    display:
      layer: overview
      level: summary
      title: "SF DisplayFrame 呈现端间隔（SF 上下文）"
      columns:
        - {name: upid, label: "SF UPID", type: number}
        - {name: process_name, label: "SF 进程", type: string}
        - {name: presented_display_frames, label: "完成呈现的 DisplayFrame 数", type: number}
        - {name: observed_intervals, label: "呈现端间隔数", type: number}
        - {name: avg_present_interval_ns, label: "平均呈现端间隔", type: duration, unit: ns, format: duration_ms}
        - {name: p50_present_interval_ns, label: "P50呈现端间隔", type: duration, unit: ns, format: duration_ms}
        - {name: p95_present_interval_ns, label: "P95呈现端间隔", type: duration, unit: ns, format: duration_ms}
        - {name: max_present_interval_ns, label: "最大呈现端间隔", type: duration, unit: ns, format: duration_ms}
        - {name: scope, label: "范围", type: string}
        - {name: source, label: "来源", type: string}
        - {name: limitation, label: "边界", type: string}
    sql_fragments: [fragments/camera_frame_observations.sql]
    sql: |
      WITH RECURSIVE display_stats AS (
       SELECT upid, process_name, COUNT(*) AS presented_display_frames, COUNT(display_interval_ns) AS observed_intervals,
         AVG(display_interval_ns) AS avg_present_interval_ns, PERCENTILE(display_interval_ns,50) AS p50_present_interval_ns,
         PERCENTILE(display_interval_ns,95) AS p95_present_interval_ns, MAX(display_interval_ns) AS max_present_interval_ns
       FROM camera_display_intervals GROUP BY upid
      )
      SELECT *, 'sf_process_context' AS scope, 'actual_frame_timeline_slice:completed_DisplayFrame.ts+dur' AS source,
       'Only completed endpoints in [start_ts,end_ts) contribute, including work started before start_ts; intervals require two retained endpoints. SF work start is not presentation. These intervals cover the SF process, not one camera surface or a measured panel clock; neither phase-lock failure nor a mechanism follows from their distribution.' AS limitation,
       COUNT(*) OVER () AS total_groups
      FROM display_stats ORDER BY upid LIMIT (SELECT max_rows FROM camera_input)
    save_as: camera_display_cadence
    synthesize:
      role: overview
      fields:
        - key: upid
          label: "SF UPID"
        - key: process_name
          label: "SF 进程"
        - key: presented_display_frames
          label: "完成呈现的 DisplayFrame 数"
        - key: observed_intervals
          label: "呈现端间隔数"
        - key: avg_present_interval_ns
          label: "平均呈现端间隔"
        - key: p50_present_interval_ns
          label: "P50呈现端间隔"
        - key: p95_present_interval_ns
          label: "P95呈现端间隔"
        - key: max_present_interval_ns
          label: "最大呈现端间隔"

  - id: camera_surface_cadence
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "同 surface marker 的呈现节奏与关联覆盖"
    display:
      layer: overview
      level: summary
      title: "同 surface marker 的呈现节奏与关联覆盖"
      columns:
        - {name: sf_upid, label: "SF UPID", type: number}
        - {name: bindable_surface, label: "Surface marker", type: string}
        - {name: observed_buffer_keys, label: "观测 buffer 键数", type: number}
        - {name: presented_buffers, label: "关联到呈现端的 buffer 数", type: number}
        - {name: unavailable_bindings, label: "缺失或歧义关联数", type: number}
        - {name: observed_intervals, label: "同 surface 呈现间隔数", type: number}
        - {name: p95_present_interval_ns, label: "P95同 surface 呈现间隔", type: duration, unit: ns, format: duration_ms}
        - {name: max_present_interval_ns, label: "最大同 surface 呈现间隔", type: duration, unit: ns, format: duration_ms}
        - {name: arrival_binding_status, label: "App 到达关联状态", type: string}
        - {name: scope, label: "范围", type: string}
        - {name: limitation, label: "边界", type: string}
    sql_fragments: [fragments/camera_frame_observations.sql]
    sql: |
      WITH RECURSIVE surface_stats AS (
       SELECT l.sf_upid, l.bindable_surface, COUNT(*) AS observed_buffer_keys,
         COUNT(s.display_id) AS presented_buffers,
         SUM(CASE WHEN l.binding_status!='sf_commit_display_bound' THEN 1 ELSE 0 END) AS unavailable_bindings,
         COUNT(s.surface_present_interval_ns) AS observed_intervals,
         PERCENTILE(s.surface_present_interval_ns,95) AS p95_present_interval_ns,
         MAX(s.surface_present_interval_ns) AS max_present_interval_ns
       FROM camera_buffer_links l LEFT JOIN camera_surface_presents s ON s.latch_id=l.latch_id
       GROUP BY l.sf_upid,l.bindable_surface
      )
      SELECT *, 'not_measured' AS arrival_binding_status, 'surface_marker_commit_display_token' AS scope,
       'Surface cadence uses unique full-instance SF latch/commit/DisplayFrame matches inside [start_ts,end_ts). BLAST queue IDs and SF layer IDs are different domains: no app arrival association or arrival-to-present latency is measured. Missing, ambiguous, incomplete and edge-crossing SF samples remain unavailable.' AS limitation,
       COUNT(*) OVER () AS total_groups
      FROM surface_stats ORDER BY sf_upid,bindable_surface LIMIT (SELECT max_rows FROM camera_input)
    save_as: camera_surface_cadence
    synthesize:
      role: overview
      fields:
        - key: sf_upid
          label: "SF UPID"
        - key: bindable_surface
          label: "Surface marker"
        - key: observed_buffer_keys
          label: "观测 buffer 键数"
        - key: presented_buffers
          label: "关联到呈现端的 buffer 数"
        - key: unavailable_bindings
          label: "缺失或歧义关联数"
        - key: observed_intervals
          label: "同 surface 呈现间隔数"
        - key: p95_present_interval_ns
          label: "P95同 surface 呈现间隔"
        - key: arrival_binding_status
          label: "App 到达关联状态"

  - id: camera_buffer_delivery
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "SF buffer latch → commit → DisplayFrame 明细"
    display:
      layer: list
      level: detail
      title: "SF buffer latch → commit → DisplayFrame 明细"
      columns:
        - {name: sf_upid, label: "SF UPID", type: number}
        - {name: bindable_surface, label: "完整 SF layer marker", type: string}
        - {name: buffer_number, label: "SF Buffer 编号", type: number}
        - {name: latch_id, label: "Latch slice ID", type: number}
        - {name: commit_id, label: "Commit slice ID", type: number}
        - {name: display_token, label: "Display token", type: number}
        - {name: display_id, label: "DisplayFrame slice ID", type: number}
        - {name: latch_ts, label: "Latch", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: display_present_ts, label: "DisplayFrame 呈现端", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: binding_status, label: "SF 关联状态", type: string}
        - {name: arrival_binding_status, label: "App 到达关联状态", type: string}
        - {name: limitation, label: "边界", type: string}
    sql_fragments: [fragments/camera_frame_observations.sql]
    sql: |
      WITH RECURSIVE bound_rows AS (
       SELECT sf_upid, bindable_surface, buffer_number, latch_id, commit_id, display_token,
         display_id, latch_ts, display_present_ts, binding_status
       FROM camera_buffer_links WHERE binding_status='sf_commit_display_bound'
      )
      SELECT *, 'not_measured' AS arrival_binding_status,
       'SF-only full-instance layer/buffer + native commit parentage/display token inside [start_ts,end_ts). No association to app callbacks or native Camera SurfaceFrames is established; no arrival-to-present latency is measured. The producer endpoint is not an optical measurement or a mechanism.' AS limitation,
       COUNT(*) OVER () AS total_eligible_rows
      FROM bound_rows ORDER BY latch_ts LIMIT (SELECT max_rows FROM camera_input)
    save_as: camera_buffer_delivery
    synthesize:
      role: list
      fields:
        - key: sf_upid
          label: "SF UPID"
        - key: bindable_surface
          label: "完整 SF layer marker"
        - key: buffer_number
          label: "SF Buffer 编号"
        - key: latch_id
          label: "Latch slice ID"
        - key: commit_id
          label: "Commit slice ID"
        - key: display_token
          label: "Display token"
        - key: display_present_ts
          label: "DisplayFrame 呈现端"
        - key: arrival_binding_status
          label: "App 到达关联状态"

  - id: camera_binder_execution
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "Camera Binder wall / 线程 Running（不测余量）"
    display:
      layer: overview
      level: summary
      title: "Camera Binder wall / 线程 Running（不测余量）"
      columns:
        - {name: client_upid, label: "Client UPID", type: number}
        - {name: server_upid, label: "Server UPID", type: number}
        - {name: client_process, label: "Client 进程", type: string}
        - {name: server_process, label: "Server 进程", type: string}
        - {name: transactions, label: "完整同步事务数", type: number}
        - {name: avg_client_wall_ns, label: "Client 平均 wall", type: duration, unit: ns, format: duration_ms}
        - {name: avg_server_wall_ns, label: "Server 平均 wall", type: duration, unit: ns, format: duration_ms}
        - {name: server_state_observed_txns, label: "有 server 线程状态的事务数", type: number}
        - {name: avg_server_running_ns, label: "对应 server 线程平均 Running", type: duration, unit: ns, format: duration_ms}
        - {name: avg_server_state_observed_ns, label: "对应 server 线程平均状态覆盖", type: duration, unit: ns, format: duration_ms}
        - {name: headroom_status, label: "余量测量状态", type: string}
        - {name: limitation, label: "边界", type: string}
    sql: |
      WITH input AS (
       SELECT MIN(COALESCE(${start_ts},trace_start()),COALESCE(${end_ts},trace_end())) AS start_ts,
         MAX(COALESCE(${start_ts},trace_start()),COALESCE(${end_ts},trace_end())) AS end_ts,
         MIN(MAX(COALESCE(${max_rows|20},20),1),100) AS max_rows
      ), states AS (
       SELECT binder_txn_id,binder_reply_id,
         SUM(CASE WHEN thread_state_type='binder_reply' THEN 1 ELSE 0 END) AS server_state_rows,
         SUM(CASE WHEN thread_state_type='binder_reply' AND thread_state='Running' THEN thread_state_dur ELSE 0 END) AS server_running_ns,
         SUM(CASE WHEN thread_state_type='binder_reply' THEN thread_state_dur ELSE 0 END) AS server_state_ns
       FROM android_sync_binder_thread_state_by_txn GROUP BY binder_txn_id,binder_reply_id
      ), txns AS (
       SELECT b.*, CASE WHEN s.server_state_rows>0 THEN s.server_running_ns END AS server_running_ns,
         CASE WHEN s.server_state_rows>0 THEN s.server_state_ns END AS server_state_ns
       FROM android_binder_txns b LEFT JOIN states s USING (binder_txn_id,binder_reply_id),input i
       WHERE b.is_sync=1 AND b.client_dur>=0 AND b.server_dur>=0
         AND b.client_ts>=i.start_ts AND b.client_ts+b.client_dur<=i.end_ts
         AND (lower(COALESCE(b.client_process,'')) GLOB '*camera*' OR lower(COALESCE(b.server_process,'')) GLOB '*camera*'
           OR lower(COALESCE(b.client_process,'')) GLOB '*camx*' OR lower(COALESCE(b.server_process,'')) GLOB '*camx*'
           OR lower(COALESCE(b.client_process,'')) GLOB '*mtkcam*' OR lower(COALESCE(b.server_process,'')) GLOB '*mtkcam*')
      )
      SELECT client_upid,server_upid,client_process,server_process,COUNT(*) AS transactions,
       AVG(client_dur) AS avg_client_wall_ns,AVG(server_dur) AS avg_server_wall_ns,
       COUNT(server_running_ns) AS server_state_observed_txns,
       AVG(server_running_ns) AS avg_server_running_ns,AVG(server_state_ns) AS avg_server_state_observed_ns,
       'not_measured' AS headroom_status,
       'Complete transactions starting and ending in the window. Wall includes waits; Running covers only the bound server thread. Neither measures sensor budget, pipeline depth, in-flight capacity or headroom. No state rows means unknown Running, not zero.' AS limitation,
       COUNT(*) OVER () AS total_groups
      FROM txns GROUP BY client_upid,server_upid ORDER BY transactions DESC LIMIT (SELECT max_rows FROM input)
    save_as: camera_binder_execution
    synthesize:
      role: overview
      fields:
        - key: client_upid
          label: "Client UPID"
        - key: server_upid
          label: "Server UPID"
        - key: client_process
          label: "Client 进程"
        - key: server_process
          label: "Server 进程"
        - key: transactions
          label: "完整同步事务数"
        - key: avg_client_wall_ns
          label: "Client 平均 wall"
        - key: avg_server_wall_ns
          label: "Server 平均 wall"
        - key: server_state_observed_txns
          label: "有 server 线程状态的事务数"

  - id: evidence_coverage
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "Camera 证据覆盖"
    display:
      layer: overview
      level: summary
      title: "Camera 证据覆盖"
      columns:
        - name: evidence_family
          label: "证据族"
          type: string
        - name: status
          label: "状态"
          type: string
        - name: row_count
          label: "行数"
          type: number
        - name: source
          label: "来源"
          type: string
        - name: limitation
          label: "限制"
          type: string
          format: truncate
    sql: |
      WITH
      raw_input AS (
        SELECT
          COALESCE(${start_ts}, trace_start()) AS raw_start_ts,
          COALESCE(${end_ts}, trace_end()) AS raw_end_ts,
          MIN(MAX(COALESCE(${max_rows|20}, 20), 1), 100) AS max_rows
      ),
      input AS (
        SELECT
          MIN(raw_start_ts, raw_end_ts) AS start_ts,
          MAX(raw_start_ts, raw_end_ts) AS end_ts,
          max_rows
        FROM raw_input
      ),
      identity_count AS (
        SELECT
          (SELECT COUNT(*)
           FROM process
           WHERE lower(COALESCE(name, '')) GLOB '*camera*'
              OR lower(COALESCE(name, '')) GLOB '*camx*'
              OR lower(COALESCE(name, '')) GLOB '*mtkcam*')
          +
          (SELECT COUNT(*)
           FROM thread
           WHERE lower(COALESCE(name, '')) GLOB '*camera*'
              OR lower(COALESCE(name, '')) GLOB '*camx*'
              OR lower(COALESCE(name, '')) GLOB '*mtkcam*') AS candidate_count
      ),
      slice_count AS (
        SELECT COUNT(*) AS candidate_count
        FROM thread_slice, input
        WHERE ts < input.end_ts
          AND ts + IIF(dur = -1, trace_end() - ts, dur) > input.start_ts
          AND (
            lower(COALESCE(name, '')) GLOB '*camera*'
            OR lower(COALESCE(name, '')) GLOB '*camx*'
            OR lower(COALESCE(name, '')) GLOB '*mtkcam*'
            OR lower(COALESCE(name, '')) GLOB '*capture*'
            OR lower(COALESCE(name, '')) GLOB '*preview*'
          )
      ),
      binder_count AS (
        SELECT COUNT(*) AS candidate_count
        FROM android_binder_txns, input
        WHERE client_ts >= input.start_ts
          AND client_ts < input.end_ts
          AND (
            lower(COALESCE(client_process, '')) GLOB '*camera*'
            OR lower(COALESCE(server_process, '')) GLOB '*camera*'
            OR lower(COALESCE(client_process, '')) GLOB '*camx*'
            OR lower(COALESCE(server_process, '')) GLOB '*camx*'
            OR lower(COALESCE(client_process, '')) GLOB '*mtkcam*'
            OR lower(COALESCE(server_process, '')) GLOB '*mtkcam*'
          )
      ),
      scheduler_count AS (
        SELECT COUNT(*) AS candidate_count
        FROM sched_slice, input
        WHERE ts < input.end_ts
          AND ts + IIF(dur = -1, trace_end() - ts, dur) > input.start_ts
      ),
      frequency_count AS (
        SELECT COUNT(*) AS candidate_count
        FROM cpu_frequency_counters, input
        WHERE ts < input.end_ts
          AND ts + IIF(dur = -1, trace_end() - ts, dur) > input.start_ts
      ),
      frame_count AS (
        SELECT COUNT(*) AS candidate_count
        FROM actual_frame_timeline_slice, input
        WHERE ts < input.end_ts
          AND ts + IIF(dur = -1, trace_end() - ts, dur) > input.start_ts
      ),
      buffer_memory_count AS (
        SELECT
          (SELECT COUNT(*)
           FROM android_dmabuf_allocs, input
           WHERE ts >= input.start_ts
             AND ts < input.end_ts)
          +
          (SELECT COUNT(*)
           FROM counter AS c
           JOIN thread_counter_track AS tct ON c.track_id = tct.id
           CROSS JOIN input
           WHERE tct.name GLOB 'mem.ion_change*'
             AND c.ts >= input.start_ts
             AND c.ts < input.end_ts) AS candidate_count
      ),
      pixel_count AS (
        SELECT COUNT(*) AS candidate_count
        FROM pixel_camera_frames, input
        WHERE ts >= input.start_ts AND ts < input.end_ts
      )
      SELECT
        'camera_process_thread_identity' AS evidence_family,
        CASE WHEN candidate_count > 0 THEN 'available' ELSE 'missing' END AS status,
        candidate_count AS row_count,
        'process,thread' AS source,
        'Name-based identity candidates are not proof of a specific Camera milestone.' AS limitation
      FROM identity_count
      UNION ALL
      SELECT
        'camera_slice_candidates',
        CASE WHEN candidate_count > 0 THEN 'vendor_specific' ELSE 'missing' END,
        candidate_count,
        'thread_slice',
        'Slice names are implementation-specific candidates and require identity/anchor verification.'
      FROM slice_count
      UNION ALL
      SELECT
        'binder_transactions',
        CASE WHEN candidate_count > 0 THEN 'available' ELSE 'missing' END,
        candidate_count,
        'android_binder_txns',
        'Binder rows provide cross-process correlation; interface names and endpoints must still be verified.'
      FROM binder_count
      UNION ALL
      SELECT
        'scheduler_context',
        CASE WHEN candidate_count > 0 THEN 'available' ELSE 'missing' END,
        candidate_count,
        'sched_slice',
        'Scheduler rows provide execution context only after Camera thread identity is established.'
      FROM scheduler_count
      UNION ALL
      SELECT
        'cpu_frequency_context',
        CASE WHEN candidate_count > 0 THEN 'available' ELSE 'missing' END,
        candidate_count,
        'cpu_frequency_counters',
        'CPU-frequency rows provide system context and do not by themselves attribute Camera latency.'
      FROM frequency_count
      UNION ALL
      SELECT
        'frame_timeline',
        CASE WHEN candidate_count > 0 THEN 'available' ELSE 'missing' END,
        candidate_count,
        'actual_frame_timeline_slice',
        'FrameTimeline can support presentation correlation only after preview surface identity is established.'
      FROM frame_count
      UNION ALL
      SELECT
        'dmabuf_allocations',
        CASE WHEN candidate_count > 0 THEN 'available' ELSE 'missing' END,
        candidate_count,
        'android_dmabuf_allocs; counter + thread_counter_track (mem.ion_change*)',
        'DMA-BUF and legacy ION signed deltas cover only observed events; they are not retained memory or leak proof.'
      FROM buffer_memory_count
      UNION ALL
      SELECT
        'pixel_camera_frames',
        CASE WHEN candidate_count > 0 THEN 'vendor_specific' ELSE 'missing' END,
        candidate_count,
        'pixel_camera_frames',
        'pixel.camera is an optional Pixel slice parser, not a portable Android Camera contract.'
      FROM pixel_count
    save_as: evidence_coverage
    synthesize:
      role: overview
      fields:
        - key: evidence_family
          label: 证据族
        - key: status
          label: 可用性
        - key: row_count
          label: 行数
        - key: limitation
          label: 限制

  - id: camera_process_candidates
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "Camera 进程/线程候选"
    display:
      layer: list
      level: detail
      title: "Camera identity 候选"
      columns:
        - name: identity_kind
          label: "类型"
          type: string
        - name: process_name
          label: "进程"
          type: string
        - name: thread_name
          label: "线程"
          type: string
        - name: upid
          label: "UPID"
          type: number
        - name: pid
          label: "PID"
          type: number
        - name: utid
          label: "UTID"
          type: number
        - name: tid
          label: "TID"
          type: number
        - name: source
          label: "来源"
          type: string
        - name: limitation
          label: "限制"
          type: string
          format: truncate
    sql: |
      WITH
      raw_input AS (
        SELECT
          COALESCE(${start_ts}, trace_start()) AS raw_start_ts,
          COALESCE(${end_ts}, trace_end()) AS raw_end_ts,
          MIN(MAX(COALESCE(${max_rows|20}, 20), 1), 100) AS max_rows
      ),
      input AS (
        SELECT
          MIN(raw_start_ts, raw_end_ts) AS start_ts,
          MAX(raw_start_ts, raw_end_ts) AS end_ts,
          max_rows
        FROM raw_input
      ),
      candidates AS (
        SELECT
          'process' AS identity_kind,
          COALESCE(p.name, '<unnamed process>') AS process_name,
          CAST(NULL AS TEXT) AS thread_name,
          p.upid,
          p.pid,
          CAST(NULL AS INTEGER) AS utid,
          CAST(NULL AS INTEGER) AS tid,
          'process' AS source
        FROM process p
        WHERE lower(COALESCE(p.name, '')) GLOB '*camera*'
           OR lower(COALESCE(p.name, '')) GLOB '*camx*'
           OR lower(COALESCE(p.name, '')) GLOB '*mtkcam*'
        UNION ALL
        SELECT
          'thread',
          COALESCE(p.name, '<unnamed process>'),
          COALESCE(t.name, '<unnamed thread>'),
          t.upid,
          p.pid,
          t.utid,
          t.tid,
          'thread'
        FROM thread t
        LEFT JOIN process p ON p.upid = t.upid
        WHERE lower(COALESCE(t.name, '')) GLOB '*camera*'
           OR lower(COALESCE(t.name, '')) GLOB '*camx*'
           OR lower(COALESCE(t.name, '')) GLOB '*mtkcam*'
      )
      SELECT
        identity_kind,
        process_name,
        thread_name,
        upid,
        pid,
        utid,
        tid,
        source,
        'Name matches are identity candidates; verify process/thread ownership before attributing Camera work.' AS limitation
      FROM candidates, input
      ORDER BY identity_kind, process_name, thread_name
      LIMIT (SELECT max_rows FROM input)
    save_as: camera_process_candidates
    synthesize:
      role: list
      fields:
        - key: identity_kind
          label: Identity 类型
        - key: process_name
          label: 进程
        - key: thread_name
          label: 线程
        - key: source
          label: 来源

  - id: camera_slice_candidates
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "Camera Slice 候选"
    display:
      layer: list
      level: detail
      title: "Camera slice 候选"
      columns:
        - name: ts
          label: "开始"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur_ns
        - name: dur_ns
          label: "时长"
          type: duration
          unit: ns
          format: duration_ms
        - name: slice_name
          label: "Slice"
          type: string
          format: truncate
        - name: process_name
          label: "进程"
          type: string
        - name: thread_name
          label: "线程"
          type: string
        - name: upid
          label: "UPID"
          type: number
        - name: utid
          label: "UTID"
          type: number
        - name: source
          label: "来源"
          type: string
        - name: limitation
          label: "限制"
          type: string
          format: truncate
    sql: |
      WITH
      raw_input AS (
        SELECT
          COALESCE(${start_ts}, trace_start()) AS raw_start_ts,
          COALESCE(${end_ts}, trace_end()) AS raw_end_ts,
          MIN(MAX(COALESCE(${max_rows|20}, 20), 1), 100) AS max_rows
      ),
      input AS (
        SELECT
          MIN(raw_start_ts, raw_end_ts) AS start_ts,
          MAX(raw_start_ts, raw_end_ts) AS end_ts,
          max_rows
        FROM raw_input
      ),
      candidates AS (
        SELECT
          MAX(ts, input.start_ts) AS overlap_ts,
          MIN(ts + IIF(dur = -1, trace_end() - ts, dur), input.end_ts)
            - MAX(ts, input.start_ts) AS overlap_dur,
          COALESCE(name, '<unnamed slice>') AS slice_name,
          COALESCE(process_name, '<unnamed process>') AS process_name,
          COALESCE(thread_name, '<unnamed thread>') AS thread_name,
          upid,
          utid
        FROM thread_slice, input
        WHERE ts < input.end_ts
          AND ts + IIF(dur = -1, trace_end() - ts, dur) > input.start_ts
          AND (
            lower(COALESCE(name, '')) GLOB '*camera*'
            OR lower(COALESCE(name, '')) GLOB '*camx*'
            OR lower(COALESCE(name, '')) GLOB '*mtkcam*'
            OR lower(COALESCE(name, '')) GLOB '*capture*'
            OR lower(COALESCE(name, '')) GLOB '*preview*'
          )
      )
      SELECT
        printf('%d', overlap_ts) AS ts,
        printf('%d', overlap_dur) AS dur_ns,
        slice_name,
        process_name,
        thread_name,
        upid,
        utid,
        'thread_slice' AS source,
        'Slice names are implementation-specific candidates and require identity/anchor verification.' AS limitation
      FROM candidates, input
      WHERE overlap_dur > 0
      ORDER BY overlap_dur DESC
      LIMIT (SELECT max_rows FROM input)
    save_as: camera_slice_candidates
    synthesize:
      role: list
      fields:
        - key: slice_name
          label: Slice 候选
        - key: process_name
          label: 进程
        - key: thread_name
          label: 线程
        - key: source
          label: 来源

  - id: camera_binder_summary
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "Camera Binder 事务"
    display:
      layer: list
      level: detail
      title: "Camera 相关 Binder 事务"
      columns:
        - name: ts
          label: "开始"
          type: timestamp
          unit: ns
          clickAction: navigate_range
          durationColumn: dur_ns
        - name: dur_ns
          label: "耗时"
          type: duration
          unit: ns
          format: duration_ms
        - name: aidl_name
          label: "AIDL"
          type: string
          format: truncate
        - name: client_process
          label: "Client 进程"
          type: string
        - name: client_thread
          label: "Client 线程"
          type: string
        - name: server_process
          label: "Server 进程"
          type: string
        - name: server_thread
          label: "Server 线程"
          type: string
        - name: client_upid
          label: "Client UPID"
          type: number
        - name: client_utid
          label: "Client UTID"
          type: number
        - name: server_upid
          label: "Server UPID"
          type: number
        - name: server_utid
          label: "Server UTID"
          type: number
        - name: source
          label: "来源"
          type: string
        - name: limitation
          label: "限制"
          type: string
          format: truncate
    sql: |
      WITH
      raw_input AS (
        SELECT
          COALESCE(${start_ts}, trace_start()) AS raw_start_ts,
          COALESCE(${end_ts}, trace_end()) AS raw_end_ts,
          MIN(MAX(COALESCE(${max_rows|20}, 20), 1), 100) AS max_rows
      ),
      input AS (
        SELECT
          MIN(raw_start_ts, raw_end_ts) AS start_ts,
          MAX(raw_start_ts, raw_end_ts) AS end_ts,
          max_rows
        FROM raw_input
      )
      SELECT
        printf('%d', client_ts) AS ts,
        printf('%d', MAX(client_dur, 0)) AS dur_ns,
        COALESCE(aidl_name, interface, method_name, '<unknown interface>') AS aidl_name,
        COALESCE(client_process, '<unnamed process>') AS client_process,
        COALESCE(client_thread, '<unnamed thread>') AS client_thread,
        COALESCE(server_process, '<unnamed process>') AS server_process,
        COALESCE(server_thread, '<unnamed thread>') AS server_thread,
        client_upid,
        client_utid,
        server_upid,
        server_utid,
        'android_binder_txns' AS source,
        'Binder rows provide cross-process correlation; interface names and endpoints must still be verified.' AS limitation
      FROM android_binder_txns, input
      WHERE client_ts >= input.start_ts
        AND client_ts < input.end_ts
        AND (
          lower(COALESCE(client_process, '')) GLOB '*camera*'
          OR lower(COALESCE(server_process, '')) GLOB '*camera*'
          OR lower(COALESCE(client_process, '')) GLOB '*camx*'
          OR lower(COALESCE(server_process, '')) GLOB '*camx*'
          OR lower(COALESCE(client_process, '')) GLOB '*mtkcam*'
          OR lower(COALESCE(server_process, '')) GLOB '*mtkcam*'
        )
      ORDER BY client_dur DESC, client_ts
      LIMIT (SELECT max_rows FROM input)
    save_as: camera_binder_summary
    synthesize:
      role: list
      fields:
        - key: aidl_name
          label: Binder 接口
        - key: client_process
          label: Client
        - key: server_process
          label: Server
        - key: source
          label: 来源

  - id: camera_dmabuf_summary
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "Camera DMA-BUF/legacy ION window evidence"
    display:
      layer: list
      level: detail
      title: "Camera DMA-BUF/legacy ION window evidence"
      columns:
        - name: process_name
          label: "进程"
          type: string
        - name: upid
          label: "UPID"
          type: number
        - name: pid
          label: "PID"
          type: number
        - name: memory_source
          label: "内存来源"
          type: string
        - name: allocation_count
          label: "分配次数"
          type: number
        - name: allocation_bytes
          label: "分配量"
          type: bytes
        - name: release_bytes
          label: "释放量"
          type: bytes
        - name: observed_net_delta_bytes
          label: "窗口内观测净变化"
          type: bytes
        - name: peak_event_bytes
          label: "最大单事件"
          type: bytes
        - name: source
          label: "来源"
          type: string
        - name: limitation
          label: "限制"
          type: string
          format: truncate
    sql: |
      WITH
      raw_input AS (
        SELECT
          COALESCE(${start_ts}, trace_start()) AS raw_start_ts,
          COALESCE(${end_ts}, trace_end()) AS raw_end_ts,
          MIN(MAX(COALESCE(${max_rows|20}, 20), 1), 100) AS max_rows
      ),
      input AS (
        SELECT
          MIN(raw_start_ts, raw_end_ts) AS start_ts,
          MAX(raw_start_ts, raw_end_ts) AS end_ts,
          max_rows
        FROM raw_input
      ),
      events AS (
        SELECT
          alloc.ts,
          alloc.buf_size AS signed_bytes,
          COALESCE(alloc.process_name, '<unnamed process>') AS process_name,
          alloc.upid,
          alloc.pid,
          'dmabuf' AS memory_source
        FROM android_dmabuf_allocs AS alloc
        CROSS JOIN input
        WHERE alloc.ts >= input.start_ts
          AND alloc.ts < input.end_ts
          AND (
            lower(COALESCE(alloc.process_name, '')) GLOB '*camera*'
            OR lower(COALESCE(alloc.process_name, '')) GLOB '*camx*'
            OR lower(COALESCE(alloc.process_name, '')) GLOB '*mtkcam*'
            OR lower(COALESCE(alloc.thread_name, '')) GLOB '*camera*'
            OR lower(COALESCE(alloc.thread_name, '')) GLOB '*camx*'
            OR lower(COALESCE(alloc.thread_name, '')) GLOB '*mtkcam*'
          )
        UNION ALL
        SELECT
          c.ts,
          CAST(c.value AS INTEGER) AS signed_bytes,
          COALESCE(p.name, '<unnamed process>') AS process_name,
          p.upid,
          p.pid,
          'legacy_ion' AS memory_source
        FROM counter AS c
        JOIN thread_counter_track AS tct ON c.track_id = tct.id
        JOIN thread AS th ON th.utid = tct.utid
        LEFT JOIN process AS p ON p.upid = th.upid
        CROSS JOIN input
        WHERE tct.name GLOB 'mem.ion_change*'
          AND c.ts >= input.start_ts
          AND c.ts < input.end_ts
          AND (
            lower(COALESCE(p.name, '')) GLOB '*camera*'
            OR lower(COALESCE(p.name, '')) GLOB '*camx*'
            OR lower(COALESCE(p.name, '')) GLOB '*mtkcam*'
            OR lower(COALESCE(th.name, '')) GLOB '*camera*'
            OR lower(COALESCE(th.name, '')) GLOB '*camx*'
            OR lower(COALESCE(th.name, '')) GLOB '*mtkcam*'
          )
      )
      SELECT
        process_name,
        upid,
        pid,
        memory_source,
        SUM(CASE WHEN signed_bytes > 0 THEN 1 ELSE 0 END) AS allocation_count,
        SUM(CASE WHEN signed_bytes > 0 THEN signed_bytes ELSE 0 END) AS allocation_bytes,
        -SUM(CASE WHEN signed_bytes < 0 THEN signed_bytes ELSE 0 END) AS release_bytes,
        SUM(signed_bytes) AS observed_net_delta_bytes,
        MAX(ABS(signed_bytes)) AS peak_event_bytes,
        CASE memory_source
          WHEN 'dmabuf' THEN 'android_dmabuf_allocs'
          ELSE 'counter + thread_counter_track (mem.ion_change*)'
        END AS source,
        'DMA-BUF (android_dmabuf_allocs) and legacy ION (counter + thread_counter_track mem.ion_change*) signed deltas cover only events inside this selected window; allocations may predate it and releases may occur later, so this is not retained memory or leak proof.' AS limitation
      FROM events
      GROUP BY process_name, upid, pid, memory_source
      ORDER BY ABS(SUM(signed_bytes)) DESC, allocation_bytes DESC
      LIMIT (SELECT max_rows FROM input)
    save_as: camera_dmabuf_summary
    synthesize:
      role: list
      fields:
        - key: process_name
          label: 进程
        - key: memory_source
          label: 内存来源
        - key: allocation_bytes
          label: 窗口内分配量
        - key: release_bytes
          label: 窗口内释放量
        - key: observed_net_delta_bytes
          label: 窗口内观测净变化
        - key: limitation
          label: 限制

  - id: pixel_camera_stage_summary
    type: atomic
    process_scope:
      role: global_context
      limitations:
        - "Trace-wide camera/media context grouped by observed identities; not filtered to a target UPID."
    name: "Pixel Camera Stage 摘要"
    display:
      layer: list
      level: detail
      title: "可选 Pixel Camera stage"
      columns:
        - name: cam_id
          label: "Camera ID"
          type: number
        - name: node
          label: "Node"
          type: string
        - name: port_group
          label: "Port group"
          type: string
        - name: frame_count
          label: "帧数"
          type: number
        - name: avg_duration_ns
          label: "平均时长"
          type: duration
          unit: ns
          format: duration_ms
        - name: max_duration_ns
          label: "最大时长"
          type: duration
          unit: ns
          format: duration_ms
        - name: source
          label: "来源"
          type: string
        - name: limitation
          label: "限制"
          type: string
          format: truncate
    sql: |
      WITH
      raw_input AS (
        SELECT
          COALESCE(${start_ts}, trace_start()) AS raw_start_ts,
          COALESCE(${end_ts}, trace_end()) AS raw_end_ts,
          MIN(MAX(COALESCE(${max_rows|20}, 20), 1), 100) AS max_rows
      ),
      input AS (
        SELECT
          MIN(raw_start_ts, raw_end_ts) AS start_ts,
          MAX(raw_start_ts, raw_end_ts) AS end_ts,
          max_rows
        FROM raw_input
      )
      SELECT
        cam_id,
        COALESCE(node, '<unknown node>') AS node,
        COALESCE(port_group, '<unknown port group>') AS port_group,
        COUNT(*) AS frame_count,
        CAST(ROUND(AVG(dur)) AS INTEGER) AS avg_duration_ns,
        MAX(dur) AS max_duration_ns,
        'pixel_camera_frames' AS source,
        'pixel.camera is an optional Pixel slice parser; stage rows require vendor-specific interpretation and portable identity checks.' AS limitation
      FROM pixel_camera_frames, input
      WHERE ts >= input.start_ts
        AND ts < input.end_ts
      GROUP BY cam_id, node, port_group
      ORDER BY max_duration_ns DESC, frame_count DESC
      LIMIT (SELECT max_rows FROM input)
    save_as: pixel_camera_stage_summary
    synthesize:
      role: list
      fields:
        - key: cam_id
          label: Camera ID
        - key: node
          label: Node
        - key: port_group
          label: Port group
        - key: frame_count
          label: 帧数
        - key: source
          label: 来源

output:
  format: structured
