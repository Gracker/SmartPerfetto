# =============================================================================
# 慢点击事件详细分析（组合 Skill）v2.0
# =============================================================================
# 分析单个慢输入事件的详细信息，包括：
# - 延迟分解（dispatch/handling/ack）
# - CPU 大小核占比
# - 四大象限分析：Running/Runnable/Sleeping 分布
# - 主线程阻塞原因
# - Binder 调用分析
# v2.0: 复用 _cpu_topology 视图替代内联 CTE，统一核心分类

name: click_response_detail
version: "2.0"
type: composite
category: interaction
tier: S

meta:
  display_name: "点击详情分析"
  description: "深入分析单个点击事件的处理流程"
  icon: "gesture"
  tags: [click, detail, interaction, composite]

prerequisites:
  required_tables:
    - thread
    - process
    - thread_state
    - sched_slice
  modules:
    - android.input
    - android.binder
    - linux.cpu.frequency

inputs:
  - name: event_ts
    type: timestamp
    required: true
    description: "事件开始时间戳(ns)"
  - name: event_end_ts
    type: timestamp
    required: true
    description: "事件结束时间戳(ns)"
  - name: total_ms
    type: number
    required: true
    description: "dispatch-to-ACK 总延迟(ms)"
  - name: dispatch_ms
    type: number
    required: false
    description: "分发延迟(ms)"
  - name: handling_ms
    type: number
    required: false
    description: "处理延迟(ms)"
  - name: event_type
    type: string
    required: false
    description: "事件类型"
  - name: event_action
    type: string
    required: false
    description: "事件动作"
  - name: process_name
    type: string
    required: true
    description: "进程名"
  # Perfetto 跳转参数
  - name: perfetto_start
    type: timestamp
    required: false
    description: "Perfetto 跳转开始时间"
  - name: perfetto_end
    type: timestamp
    required: false
    description: "Perfetto 跳转结束时间"

steps:
  - id: system_context_window
    type: atomic
    process_scope:
      role: identity_metadata
    name: "系统证据窗口"
    display: false
    sql: |
      SELECT ${event_ts} AS start_ts, ${event_end_ts} AS end_ts
    save_as: system_context_window

  - id: system_cpu_context
    type: skill
    name: "窗口 CPU 系统上下文"
    skill: cpu_system_context_in_range
    optional: true
    params:
      start_ts: "${system_context_window.data[0].start_ts}"
      end_ts: "${system_context_window.data[0].end_ts}"
    save_as: system_cpu_context
    display:
      level: detail
      layer: deep

  - id: system_task_summary
    type: skill
    name: "目标任务系统状态"
    skill: thread_system_summary_in_range
    optional: true
    params:
      start_ts: "${system_context_window.data[0].start_ts}"
      end_ts: "${system_context_window.data[0].end_ts}"
      package: "${process_name}"
    save_as: system_task_summary
    display:
      level: detail
      layer: deep

  - id: system_task_handoffs
    type: skill
    name: "目标任务调度交接"
    skill: thread_preemption_handoffs_in_range
    optional: true
    params:
      start_ts: "${system_context_window.data[0].start_ts}"
      end_ts: "${system_context_window.data[0].end_ts}"
      package: "${process_name}"
    save_as: system_task_handoffs
    display:
      level: detail
      layer: deep

  # ========== 初始化 CPU 拓扑 ==========
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # ========== 事件基本信息 ==========
  - id: event_info
    type: atomic
    name: "事件基本信息"
    display:
      level: key
      layer: deep
      title: "事件详情"
      columns:
        - name: event_type
          label: "事件类型"
          type: string
        - name: event_action
          label: "事件动作"
          type: string
        - name: process_name
          label: "进程名"
          type: string
        - name: total_ms
          label: "总延迟(ACK)"
          type: duration
          format: duration_ms
        - name: dispatch_ms
          label: "分发延迟(ms)"
          type: duration
          format: duration_ms
        - name: handling_ms
          label: "处理延迟(ms)"
          type: duration
          format: duration_ms
        - name: event_ts
          label: "事件开始"
          type: timestamp
          clickAction: navigate_timeline
        - name: event_end_ts
          label: "事件结束"
          type: timestamp
          clickAction: navigate_timeline
        - name: perfetto_start
          label: "Perfetto开始"
          type: timestamp
          clickAction: navigate_range
        - name: perfetto_end
          label: "Perfetto结束"
          type: timestamp
          clickAction: navigate_timeline
        - name: main_bottleneck
          label: "主要瓶颈"
          type: string
        - name: rating
          label: "评级"
          type: string
    sql: |
      SELECT
        '${event_type}' as event_type,
        '${event_action}' as event_action,
        '${process_name}' as process_name,
        ROUND(${total_ms}, 2) as total_ms,
        ROUND(COALESCE(${dispatch_ms}, 0), 2) as dispatch_ms,
        ROUND(COALESCE(${handling_ms}, 0), 2) as handling_ms,
        printf('%d', ${event_ts}) as event_ts,
        printf('%d', ${event_end_ts}) as event_end_ts,
        -- Perfetto 跳转链接参数
        printf('%d', COALESCE(${perfetto_start}, ${event_ts})) as perfetto_start,
        printf('%d', COALESCE(${perfetto_end}, ${event_end_ts})) as perfetto_end,
        -- 延迟主要来源
        CASE
          WHEN COALESCE(${dispatch_ms}, 0) > COALESCE(${handling_ms}, 0) THEN '系统分发'
          ELSE '应用处理'
        END as main_bottleneck,
        -- 评级
        CASE
          WHEN ${total_ms} > 200 THEN '严重'
          WHEN ${total_ms} > 100 THEN '较慢'
          ELSE '偏慢'
        END as rating
    save_as: event_basic

  # ========== 输入分发管线分解 ==========
  - id: input_dispatch_breakdown
    type: atomic
    name: "输入分发管线分解"
    display:
      level: detail
      layer: deep
      title: "输入分发管线 (kernel→InputDispatcher→App)"
      columns:
        - name: stage
          label: "管线阶段"
          type: string
        - name: start_ts
          label: "开始时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dur_ms
          label: "耗时(ms)"
          type: duration
          format: duration_ms
        - name: thread_name
          label: "线程"
          type: string
        - name: detail
          label: "详情"
          type: string
    sql: |
      -- 分解 Input dispatch 管线: kernel → InputDispatcher (system_server) → App
      WITH dispatch_slices AS (
        -- InputDispatcher 处理阶段 (system_server 进程)
        SELECT
          'InputDispatcher' as stage,
          s.ts as start_ts,
          s.dur,
          t.name as thread_name,
          s.name as detail
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        JOIN process p ON t.upid = p.upid
        WHERE (p.name = 'system_server' OR p.name LIKE '/system/bin/%')
          AND (s.name GLOB '*InputDispatcher*' OR s.name GLOB '*InputReader*' OR s.name GLOB '*dispatchMotion*')
          AND s.ts >= (${event_ts} - 50000000)
          AND s.ts <= (${event_ts} + 50000000)
        UNION ALL
        -- App 端接收阶段 (aq:pending:deliver)
        SELECT
          'App接收' as stage,
          s.ts as start_ts,
          s.dur,
          t.name as thread_name,
          s.name as detail
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        JOIN process p ON t.upid = p.upid
        WHERE ('${process_name}' = '' OR p.name = '${process_name}' OR p.name GLOB '${process_name}:*')
          AND (s.name GLOB '*deliverInput*' OR s.name GLOB 'aq:pending:deliver*' OR s.name GLOB '*InputEvent*')
          AND s.ts >= (${event_ts} - 10000000)
          AND s.ts <= (${event_end_ts} + 10000000)
      )
      SELECT
        stage,
        printf('%d', start_ts) as start_ts,
        ROUND(dur / 1e6, 2) as dur_ms,
        thread_name,
        detail
      FROM dispatch_slices
      ORDER BY start_ts
      LIMIT 20
    optional: true

  # ========== 输入管线完整生命周期（android_input_events + 当前 stdlib 阶段表）==========
  - id: input_pipeline_lifecycle
    type: atomic
    name: "输入管线生命周期"
    optional: true
    display:
      level: detail
      layer: deep
      title: "输入管线 5 阶段追踪 (Reader→Dispatch→Receive→Consume→Frame)"
      columns:
        - name: input_id
          label: "输入事件 ID"
          type: string
        - name: channel
          label: "事件通道"
          type: string
        - name: total_latency_ms
          label: "总延迟(ACK)"
          type: duration
          format: duration_ms
        - name: reader_ts
          label: "Reader 时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: reader_ms
          label: "Reader(ms)"
          type: duration
          format: duration_ms
        - name: dispatch_ts
          label: "Dispatch 时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: dispatch_ms
          label: "Dispatch(ms)"
          type: duration
          format: duration_ms
        - name: receive_ts
          label: "Receive 时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: receive_ms
          label: "Receive(ms)"
          type: duration
          format: duration_ms
        - name: consume_ts
          label: "Consume 时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: consume_ms
          label: "Consume(ms)"
          type: duration
          format: duration_ms
        - name: frame_ts
          label: "Frame 时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: frame_ms
          label: "Frame(ms)"
          type: duration
          format: duration_ms
        - name: is_speculative_frame
          label: "推测帧"
          type: boolean
    sql_fragments: [fragments/android_input_events_normalized.sql]
    sql: |
      -- 父 Skill 直接传入 android_input_events 的精确事件边界；不猜测相邻事件。
      -- Frame 阶段自 Perfetto 7b573c1 起由 _android_input_frames 扩展提供。
      WITH target_event AS (
        SELECT *
        FROM android_input_events_normalized
        WHERE process_name = '${process_name}'
          AND dispatch_ts = ${event_ts}
          AND receive_ts + receive_dur = ${event_end_ts}
        ORDER BY input_event_id, event_channel
        LIMIT 1
      )
      SELECT
        e.input_event_id as input_id,
        e.event_channel as channel,
        -- dispatch-to-ACK，与列标签一致；end-to-end 上屏延迟不在这张表里。
        ROUND(e.total_latency_dur / 1e6, 2) as total_latency_ms,
        CASE WHEN e.read_time IS NOT NULL THEN printf('%d', e.read_time) END as reader_ts,
        ROUND(s_read.dur / 1e6, 2) as reader_ms,
        CASE WHEN e.dispatch_ts IS NOT NULL THEN printf('%d', e.dispatch_ts) END as dispatch_ts,
        ROUND(s_dispatch.dur / 1e6, 2) as dispatch_ms,
        CASE WHEN e.receive_ts IS NOT NULL THEN printf('%d', e.receive_ts) END as receive_ts,
        ROUND(s_receive.dur / 1e6, 2) as receive_ms,
        CASE WHEN s_consume.ts IS NOT NULL THEN printf('%d', s_consume.ts) END as consume_ts,
        ROUND(s_consume.dur / 1e6, 2) as consume_ms,
        CASE WHEN frames.ts_do_frame IS NOT NULL THEN printf('%d', frames.ts_do_frame) END as frame_ts,
        ROUND(frames.dur_do_frame / 1e6, 2) as frame_ms,
        e.is_speculative_frame
      FROM target_event e
      LEFT JOIN slice s_read
        ON s_read.ts = e.read_time
        AND s_read.track_id != 0
        AND s_read.name GLOB 'UnwantedInteractionBlocker::notifyMotion*'
      LEFT JOIN slice s_dispatch
        ON s_dispatch.ts = e.dispatch_ts
        AND s_dispatch.track_id = e.dispatch_track_id
      LEFT JOIN slice s_receive
        ON s_receive.ts = e.receive_ts
        AND s_receive.track_id = e.receive_track_id
      LEFT JOIN _input_consumers_lookup s_consume
        ON s_consume.cookie = e.event_seq
      LEFT JOIN _android_input_frames frames
        ON frames.frame_id = e.frame_id
        AND frames.upid = e.upid
    save_as: input_lifecycle

  # ========== 大小核占比分析 ==========
  - id: cpu_core_analysis
    type: atomic
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_sched_spans.sql
    name: "大小核占比分析"
    display:
      level: key
      layer: deep
      title: "大小核占比"
      columns:
        - {name: upid, label: "upid", type: number, hidden: true}
        - {name: utid, label: "utid", type: number, hidden: true}
        - {name: unknown_running_ms, label: "unknown_running_ms", type: number, hidden: true}
        - {name: priority_min, label: "priority_min", type: number, hidden: true}
        - {name: priority_max, label: "priority_max", type: number, hidden: true}
        - {name: scheduling_policy_evidence, label: "scheduling_policy_evidence", type: string, hidden: true}
        - name: thread_type
          label: "线程类型"
          type: string
        - name: big_core_ms
          label: "大核运行(ms)"
          type: number
        - name: little_core_ms
          label: "小核运行(ms)"
          type: number
        - name: total_running_ms
          label: "总运行(ms)"
          type: number
        - name: big_core_pct
          label: "大核占比(%)"
          type: percentage
          format: percentage
        - name: little_core_pct
          label: "小核占比(%)"
          type: percentage
          format: percentage
        - name: running_pct
          label: "运行占总时长(%)"
          type: percentage
          format: percentage
        - {name: used_ucpus, label: "实际 UCPU", type: string, hidden: true}
        - name: used_cpus
          label: "使用CPU"
          type: string
        - name: classify_method
          label: "核判定来源"
          type: string
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id, COALESCE(${event_ts}, (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${event_end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      ),system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid = p.pid THEN 'MainThread' ELSE t.name END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR p.name='${process_name}' OR p.name GLOB '${process_name}:*') AND (t.tid=p.pid)
      ),scene_sched AS (
        SELECT s.* FROM system_sched_spans s JOIN system_target_threads t ON t.window_id=s.window_id AND t.utid=s.utid AND t.upid=s.upid
      )
      SELECT upid,utid,'MainThread' AS thread_type,
        ROUND(SUM(CASE WHEN core_type IN ('prime','big','medium') THEN dur_ns ELSE 0 END)/1e6,2) AS big_core_ms,
        ROUND(SUM(CASE WHEN core_type='little' THEN dur_ns ELSE 0 END)/1e6,2) AS little_core_ms,
        ROUND(SUM(CASE WHEN core_type='unknown' THEN dur_ns ELSE 0 END)/1e6,2) AS unknown_running_ms,
        ROUND(SUM(dur_ns)/1e6,2) AS total_running_ms,
        ROUND(100.0*SUM(CASE WHEN core_type IN ('prime','big','medium') THEN dur_ns ELSE 0 END)/NULLIF(SUM(dur_ns),0),1) AS big_core_pct,
        ROUND(100.0*SUM(CASE WHEN core_type='little' THEN dur_ns ELSE 0 END)/NULLIF(SUM(dur_ns),0),1) AS little_core_pct,
        ROUND(100.0*SUM(dur_ns)/NULLIF(MAX(window_end_ts-window_start_ts),0),1) AS running_pct,
        GROUP_CONCAT(DISTINCT cpu) AS used_cpus,GROUP_CONCAT(DISTINCT ucpu) AS used_ucpus,GROUP_CONCAT(DISTINCT topology_source) AS classify_method,
        MIN(priority) AS priority_min,MAX(priority) AS priority_max,'not_recorded_in_sched_slice' AS scheduling_policy_evidence
      FROM scene_sched GROUP BY window_id,upid,utid
    save_as: cpu_core

  # ========== 四大象限分析 ==========
  - id: quadrant_analysis
    type: atomic
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_thread_state_spans.sql
      - fragments/system_sched_spans.sql
    name: "四大象限分析"
    optional: true
    display:
      level: key
      layer: deep
      title: "四大象限分析"
      columns:
        - {name: upid, label: "upid", type: number, hidden: true}
        - {name: utid, label: "utid", type: number, hidden: true}
        - {name: unknown_running_ms, label: "unknown_running_ms", type: number, hidden: true}
        - {name: uninterruptible_ms, label: "uninterruptible_ms", type: number, hidden: true}
        - {name: interruptible_sleep_ms, label: "interruptible_sleep_ms", type: number, hidden: true}
        - {name: state_coverage_pct, label: "state_coverage_pct", type: number, hidden: true}
        - name: thread_type
          label: "线程类型"
          type: string
        - name: q1_big_running_ms
          label: "Q1大核运行(ms)"
          type: number
        - name: q2_little_running_ms
          label: "Q2小核运行(ms)"
          type: number
        - name: q3_runnable_ms
          label: "Q3可运行等待(ms)"
          type: number
        - name: q4_sleeping_ms
          label: "Q4睡眠阻塞(ms)"
          type: number
        - name: total_ms
          label: "总时长(ms)"
          type: number
        - name: runnable_pct
          label: "Runnable占比(%)"
          type: percentage
          format: percentage
        - name: sleeping_pct
          label: "Sleeping占比(%)"
          type: percentage
          format: percentage
        - name: classify_method
          label: "核判定来源"
          type: string
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id, COALESCE(${event_ts}, (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${event_end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      ),system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid = p.pid THEN 'MainThread' ELSE t.name END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR p.name='${process_name}' OR p.name GLOB '${process_name}:*') AND (t.tid=p.pid)
      ),scene_states AS (
        SELECT s.*,COALESCE(ct.core_type,'unknown') AS core_type,
          COALESCE(ct.topology_source,'cpu_identity_unavailable') AS topology_source
        FROM system_thread_state_spans s LEFT JOIN system_cpu_topology ct ON ct.ucpu=s.ucpu
      )
      SELECT upid,utid,role AS thread_type,
        ROUND(SUM(CASE WHEN state='Running' AND core_type IN ('prime','big','medium') THEN dur_ns ELSE 0 END)/1e6,2) AS q1_big_running_ms,
        ROUND(SUM(CASE WHEN state='Running' AND core_type='little' THEN dur_ns ELSE 0 END)/1e6,2) AS q2_little_running_ms,
        ROUND(SUM(CASE WHEN state='Running' AND core_type='unknown' THEN dur_ns ELSE 0 END)/1e6,2) AS unknown_running_ms,
        ROUND(SUM(CASE WHEN state IN ('R','R+') THEN dur_ns ELSE 0 END)/1e6,2) AS q3_runnable_ms,
        ROUND(SUM(CASE WHEN state IN ('S','I','D','DK') THEN dur_ns ELSE 0 END)/1e6,2) AS q4_sleeping_ms,
        ROUND(SUM(CASE WHEN state IN ('D','DK') THEN dur_ns ELSE 0 END)/1e6,2) AS uninterruptible_ms,
        ROUND(SUM(CASE WHEN state IN ('S','I') THEN dur_ns ELSE 0 END)/1e6,2) AS interruptible_sleep_ms,
        ROUND(SUM(dur_ns)/1e6,2) AS total_ms,
        ROUND(100.0*SUM(CASE WHEN state='Running' THEN dur_ns ELSE 0 END)/NULLIF(SUM(dur_ns),0),1) AS running_pct,
        ROUND(100.0*SUM(CASE WHEN state IN ('R','R+') THEN dur_ns ELSE 0 END)/NULLIF(SUM(dur_ns),0),1) AS runnable_pct,
        ROUND(100.0*SUM(CASE WHEN state IN ('S','I','D','DK') THEN dur_ns ELSE 0 END)/NULLIF(SUM(dur_ns),0),1) AS sleeping_pct,
        ROUND(100.0*SUM(dur_ns)/NULLIF(MAX(window_end_ts-window_start_ts),0),1) AS state_coverage_pct,
        GROUP_CONCAT(DISTINCT topology_source) AS classify_method,
        CASE WHEN SUM(CASE WHEN state IN ('S','I','D','DK') THEN dur_ns ELSE 0 END)>0.8*SUM(dur_ns) THEN 'waiting_dominant'
          WHEN SUM(CASE WHEN state IN ('R','R+') THEN dur_ns ELSE 0 END)>0.3*SUM(dur_ns) THEN 'runnable_dominant'
          WHEN SUM(CASE WHEN state='Running' THEN dur_ns ELSE 0 END)>0.7*SUM(dur_ns) THEN 'busy_running' ELSE 'mixed' END AS status_verdict
      FROM scene_states GROUP BY window_id,upid,utid,role
    save_as: quadrant

  # ========== 主线程阻塞原因 ==========
  - id: blocking_analysis
    type: skill
    name: "阻塞原因分析"
    skill: main_thread_states_in_range
    display:
      level: key
      layer: deep
      title: "阻塞原因 Top5"
      columns:
        - name: state
          label: "状态"
          type: string
        - name: state_desc
          label: "状态说明"
          type: string
        - name: blocked_function
          label: "阻塞函数"
          type: string
          format: code
        - name: total_dur_ms
          label: "总耗时"
          type: duration
          format: duration_ms
        - name: pct
          label: "区间占比"
          type: percentage
          format: percentage
        - name: count
          label: "次数"
          type: number
          format: compact
    params:
      start_ts: "${event_ts}"
      end_ts: "${event_end_ts}"
      package: "${process_name}"
      top_k: 5
    save_as: blocking

  # ========== Binder 调用分析 ==========
  - id: binder_analysis
    type: skill
    name: "Binder 调用分析"
    skill: binder_in_range
    display:
      level: key
      layer: deep
      title: "Binder 调用"
      columns:
        - name: client_process
          label: "客户端"
          type: string
        - name: server_process
          label: "服务端"
          type: string
        - name: call_count
          label: "调用次数"
          type: number
