# =============================================================================
# CPU Workload Attribution In Range
# =============================================================================
# Who was running, on which cores, at what frequency, inside one window.
#
# This is an OBSERVATION skill. It says which threads consumed CPU time before
# or during an event; it never says they caused it. Frequency-weighted work is
# an explicit interval intersection between per-thread sched spans and the
# cpufreq spans of the same ucpu, so it degrades honestly when either side has
# partial coverage instead of silently assuming a constant frequency.
# =============================================================================

name: cpu_workload_attribution_in_range
version: "1.0"
type: atomic
category: cpu
tier: A

meta:
  display_name: "窗口 CPU 负载归因"
  description: "在指定窗口内按线程聚合运行时长、核心分布与频率加权工作量；仅为观测，不构成因果"
  icon: "insights"
  tags: [cpu, sched, attribution, workload, range, evidence]

triggers:
  keywords:
    zh: [窗口 CPU 负载, 谁在跑, CPU 归因, 负载归因]
    en: [cpu workload attribution, who was running, cpu attribution]
  patterns:
    - ".*(窗口|区间).*(CPU|负载).*(归因|谁).*"
    - ".*cpu.*workload.*attribution.*"

prerequisites:
  required_tables:
    - sched_slice
    - thread
    - process
  modules:
    - linux.cpu.frequency
    - intervals.intersect
    - android.process_metadata

process_scope:
  role: global_context

inputs:
  - name: start_ts
    type: timestamp
    required: true
    description: "窗口起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "窗口结束时间戳(ns)"
  - name: package
    type: string
    required: false
    description: "目标包名/进程名；用于标注 actor_class=target_app"
  - name: process_name
    type: string
    required: false
    description: "目标进程名别名；package 为空时使用"
  - name: top_n
    type: number
    required: false
    default: 30
    description: "按工作量返回前 N 个线程"

steps:
  - id: workload_by_thread
    type: atomic
    name: "线程级 CPU 负载归因"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_frequency_spans.sql
      - fragments/actor_class_labels.sql
    investigation_evidence:
      window: {start: window_start_ts, end: window_end_ts}
      identity: {upid: upid, utid: utid}
      context: {window_id: window_id}
      metrics:
        - domain: cpu_capacity
          metric_id: system.thread.running.duration
          value: running_ns
          unit: ns
          status: sched_evidence
          coverage: running_ns
          denominator: window_capacity_ns
        - domain: cpu_frequency
          aggregation: window_interval_intersection
          metric_id: system.thread.frequency_weighted_work
          value: freq_weighted_work_mhz_ms
          unit: MHz*ms
          status: frequency_evidence
          coverage: freq_covered_ns
          denominator: running_ns
    display:
      level: summary
      layer: list
      title: "窗口内 CPU 负载归因（观测，非因果）"
      columns:
        - {name: window_id, label: "window_id", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_dur_ns, label: "窗口时长", type: duration, unit: ns}
        - {name: upid, label: "upid", type: number, hidden: true}
        - {name: utid, label: "utid", type: number, hidden: true}
        - {name: pid, label: "pid", type: number, hidden: true}
        - {name: tid, label: "tid", type: number, hidden: true}
        - {name: process_name, label: "进程", type: string}
        - {name: thread_name, label: "线程", type: string}
        - {name: actor_class, label: "角色", type: string}
        - {name: actor_class_basis, label: "角色判定依据", type: string}
        - {name: running_ns, label: "运行时长", type: duration, unit: ns}
        - {name: running_pct_of_window, label: "窗口 CPU 占用", type: percentage}
        - {name: big_running_ns, label: "大核运行", type: duration, unit: ns}
        - {name: medium_running_ns, label: "中核运行", type: duration, unit: ns}
        - {name: little_running_ns, label: "小核运行", type: duration, unit: ns}
        - {name: unknown_core_running_ns, label: "未知核型运行", type: duration, unit: ns}
        - {name: freq_weighted_work_mhz_ms, label: "频率加权工作量", type: number}
        - {name: share_of_total_work_pct, label: "工作量占比", type: percentage}
        - {name: sched_slice_count, label: "调度片数", type: number}
        - {name: freq_covered_ns, label: "频率覆盖", type: duration, unit: ns}
        - {name: frequency_evidence, label: "频率证据", type: string}
        - {name: sched_evidence, label: "调度证据", type: string}
        - {name: cpu_count, label: "CPU 数", type: number, hidden: true}
        - {name: window_capacity_ns, label: "window_capacity_ns", type: duration, unit: ns, hidden: true}
        - {name: normalization_basis, label: "归一化依据", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "窗口内没有可归因的非 idle 调度片；确认 trace 含 ftrace sched/sched_switch 且窗口落在数据范围内。"
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id, ${start_ts} AS window_start_ts, ${end_ts} AS window_end_ts
      ),
      window_facts AS (
        SELECT w.window_id, w.window_start_ts, w.window_end_ts,
          w.window_end_ts - w.window_start_ts AS window_dur_ns,
          (SELECT COUNT(*) FROM system_cpu_topology) AS cpu_count
        FROM system_windows w
      ),
      busy_spans AS (
        SELECT s.window_id, s.utid, s.upid, s.ucpu, s.core_type,
          s.clipped_start_ts, s.clipped_end_ts, s.dur_ns, s.is_unfinished
        FROM system_sched_spans s
        WHERE COALESCE(s.is_idle, 0) = 0 AND s.dur_ns > 0
      ),
      per_thread AS (
        SELECT window_id, utid, upid,
          SUM(dur_ns) AS running_ns,
          COUNT(*) AS sched_slice_count,
          SUM(CASE WHEN core_type = 'big' THEN dur_ns ELSE 0 END) AS big_running_ns,
          SUM(CASE WHEN core_type = 'medium' THEN dur_ns ELSE 0 END) AS medium_running_ns,
          SUM(CASE WHEN core_type = 'little' THEN dur_ns ELSE 0 END) AS little_running_ns,
          SUM(CASE WHEN core_type NOT IN ('prime', 'big', 'medium', 'little') THEN dur_ns ELSE 0 END) AS unknown_core_running_ns,
          SUM(CASE WHEN is_unfinished THEN dur_ns ELSE 0 END) AS unfinished_ns
        FROM busy_spans
        GROUP BY window_id, utid, upid
      ),
      -- Explicit interval intersection between per-thread run spans and the
      -- cpufreq spans of the SAME ucpu. Both inputs are non-overlapping inside
      -- each ucpu partition by construction: one task runs on a CPU at a time,
      -- and a cpufreq counter holds one value at a time. Each side is already
      -- clipped to the window, which preserves that invariant.
      -- perfetto-interval-intersect-non-overlap-proof: system_sched_spans.sql
      -- (one sched_slice per ucpu at a time) and system_cpu_frequency_spans.sql
      -- (cpu_frequency_counters leading intervals per ucpu).
      ii_sched AS (
        SELECT s.sched_id AS id, s.clipped_start_ts AS ts, s.dur_ns AS dur, s.ucpu AS ucpu
        FROM system_sched_spans s
        WHERE COALESCE(s.is_idle, 0) = 0 AND s.dur_ns > 0 AND s.ucpu IS NOT NULL
      ),
      ii_freq AS (
        SELECT f.counter_id AS id, f.clipped_start_ts AS ts, f.dur_ns AS dur, f.ucpu AS ucpu
        FROM system_cpu_frequency_spans f
        WHERE f.dur_ns > 0 AND f.ucpu IS NOT NULL
      ),
      freq_work AS (
        SELECT ss.utid AS utid,
          SUM(ii.dur * 1.0 * c.value) AS work_ns_khz,
          SUM(ii.dur) AS freq_covered_ns
        FROM _interval_intersect!((ii_sched, ii_freq), (ucpu)) AS ii
        JOIN sched_slice ss ON ss.id = ii.id_0
        JOIN counter c ON c.id = ii.id_1
        GROUP BY ss.utid
      ),
      totals AS (
        SELECT (SELECT SUM(work_ns_khz) FROM freq_work) AS total_work_ns_khz,
          (SELECT SUM(running_ns) FROM per_thread) AS total_running_ns
      )
      SELECT
        wf.window_id, wf.window_start_ts, wf.window_end_ts, wf.window_dur_ns,
        pt.upid, pt.utid, p.pid, th.tid,
        COALESCE(p.name, '') AS process_name,
        COALESCE(th.name, '') AS thread_name,
        COALESCE(ac.actor_class, 'kernel') AS actor_class,
        (SELECT actor_class_basis FROM actor_class_basis) AS actor_class_basis,
        pt.running_ns,
        ROUND(100.0 * pt.running_ns / NULLIF(wf.window_dur_ns * wf.cpu_count, 0), 3) AS running_pct_of_window,
        pt.big_running_ns, pt.medium_running_ns, pt.little_running_ns, pt.unknown_core_running_ns,
        ROUND(COALESCE(fw.work_ns_khz, 0) / 1e9, 1) AS freq_weighted_work_mhz_ms,
        ROUND(100.0 * COALESCE(fw.work_ns_khz, 0) / NULLIF((SELECT total_work_ns_khz FROM totals), 0), 2) AS share_of_total_work_pct,
        pt.sched_slice_count,
        COALESCE(fw.freq_covered_ns, 0) AS freq_covered_ns,
        CASE
          WHEN fw.freq_covered_ns IS NULL THEN 'unavailable'
          WHEN fw.freq_covered_ns < pt.running_ns THEN 'partial'
          ELSE 'observed'
        END AS frequency_evidence,
        CASE WHEN pt.unfinished_ns > 0 THEN 'partial' ELSE 'observed' END AS sched_evidence,
        wf.cpu_count,
        wf.window_dur_ns * wf.cpu_count AS window_capacity_ns,
        'running_pct_of_window = running_ns / (window_dur_ns * cpu_count)' AS normalization_basis,
        'observation_not_causal' AS evidence_scope
      FROM per_thread pt
      CROSS JOIN window_facts wf
      LEFT JOIN freq_work fw ON fw.utid = pt.utid
      LEFT JOIN thread th ON th.utid = pt.utid
      LEFT JOIN process p ON p.upid = pt.upid
      LEFT JOIN actor_class_by_upid ac ON ac.upid = pt.upid
      ORDER BY COALESCE(fw.work_ns_khz, 0) DESC, pt.running_ns DESC
      LIMIT ${top_n|30}
    save_as: workload_by_thread

  - id: workload_summary
    type: atomic
    name: "窗口负载汇总"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/actor_class_labels.sql
    display:
      level: summary
      layer: overview
      title: "窗口负载汇总（按角色 / 按核型）"
      columns:
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_dur_ns, label: "窗口时长", type: duration, unit: ns}
        - {name: breakdown_kind, label: "维度", type: string}
        - {name: breakdown_key, label: "分组", type: string}
        - {name: running_ns, label: "运行时长", type: duration, unit: ns}
        - {name: busy_pct, label: "占用率", type: percentage}
        - {name: thread_count, label: "线程数", type: number}
        - {name: denominator_basis, label: "分母依据", type: string}
        - {name: sched_evidence, label: "调度证据", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "窗口内无调度数据。"
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id, ${start_ts} AS window_start_ts, ${end_ts} AS window_end_ts
      ),
      window_facts AS (
        SELECT w.window_id, w.window_start_ts, w.window_end_ts,
          w.window_end_ts - w.window_start_ts AS window_dur_ns,
          (SELECT COUNT(*) FROM system_cpu_topology) AS cpu_count
        FROM system_windows w
      ),
      busy_spans AS (
        SELECT s.window_id, s.utid, s.upid, s.core_type, s.dur_ns, s.is_unfinished
        FROM system_sched_spans s
        WHERE COALESCE(s.is_idle, 0) = 0 AND s.dur_ns > 0
      ),
      labelled AS (
        SELECT b.*,
          COALESCE(ac.actor_class, 'kernel') AS actor_class
        FROM busy_spans b
        LEFT JOIN actor_class_by_upid ac ON ac.upid = b.upid
      ),
      by_actor AS (
        SELECT 'actor_class' AS breakdown_kind, actor_class AS breakdown_key,
          SUM(dur_ns) AS running_ns, COUNT(DISTINCT utid) AS thread_count,
          MAX(CASE WHEN is_unfinished THEN 1 ELSE 0 END) AS has_unfinished,
          'window_dur_ns * cpu_count' AS denominator_basis,
          SUM(dur_ns) * 1.0 / NULLIF((SELECT window_dur_ns * cpu_count FROM window_facts), 0) AS ratio
        FROM labelled GROUP BY actor_class
      ),
      core_counts AS (
        SELECT core_type, COUNT(*) AS cores FROM system_cpu_topology GROUP BY core_type
      ),
      by_core AS (
        SELECT 'core_type' AS breakdown_kind, l.core_type AS breakdown_key,
          SUM(l.dur_ns) AS running_ns, COUNT(DISTINCT l.utid) AS thread_count,
          MAX(CASE WHEN l.is_unfinished THEN 1 ELSE 0 END) AS has_unfinished,
          'window_dur_ns * cores_of_this_core_type' AS denominator_basis,
          SUM(l.dur_ns) * 1.0 / NULLIF((SELECT window_dur_ns FROM window_facts) * COALESCE(cc.cores, 0), 0) AS ratio
        FROM labelled l LEFT JOIN core_counts cc ON cc.core_type = l.core_type
        GROUP BY l.core_type, cc.cores
      ),
      unioned AS (
        SELECT * FROM by_actor UNION ALL SELECT * FROM by_core
      )
      SELECT wf.window_start_ts, wf.window_end_ts, wf.window_dur_ns,
        u.breakdown_kind, u.breakdown_key, u.running_ns,
        ROUND(100.0 * u.ratio, 2) AS busy_pct,
        u.thread_count, u.denominator_basis,
        CASE WHEN u.has_unfinished = 1 THEN 'partial' ELSE 'observed' END AS sched_evidence,
        'observation_not_causal' AS evidence_scope
      FROM unioned u CROSS JOIN window_facts wf
      ORDER BY u.breakdown_kind, u.running_ns DESC
    save_as: workload_summary

output:
  format: structured
