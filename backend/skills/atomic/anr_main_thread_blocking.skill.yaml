# =============================================================================
# ANR 主线程阻塞链深度分析（原子 Skill）
# =============================================================================
# 深度分析 ANR 事件中主线程的阻塞链：线程状态分布、blocked_function、
# 唤醒链、Binder 阻塞、锁竞争等，帮助定位 ANR 根因。
#
# 分析窗口：
# - 优先使用 anr_ts 前 5s 到后 1s 的窗口
# - 其次使用 start_ts / end_ts
# - 无进程名时发现应用主线程长等待候选；等待时长不证明无响应

name: anr_main_thread_blocking
version: "1.1"
type: composite
category: anr
tier: S

meta:
  display_name: "ANR 主线程阻塞链分析"
  description: "分析主线程等待；无 ANR 时间戳或目标进程时发现应用主线程长等待候选，再结合输入时间线判断是否无响应"
  icon: "bug_report"
  tags: [anr, blocking, main_thread, deadlock, binder, lock, atomic]

prerequisites:
  required_tables:
    - thread_state
    - thread
    - process
  modules:
    - android.binder
    - android.monitor_contention

inputs:
  - name: process_name
    type: string
    required: false
    default: ""
    description: "目标进程名；省略时仅通过 wakeup_chain 发现各应用主线程最长等待候选，不判定 ANR"
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns)"
  - name: anr_ts
    type: timestamp
    required: false
    description: "ANR 事件时间戳(ns)，用于自动计算分析窗口"

  - name: min_wait_ms
    type: number
    required: false
    description: "无目标发现模式的最短单段等待毫秒数，默认 3000"
  - name: top_n
    type: number
    required: false
    description: "无目标发现模式的候选条数，默认 20，上限 100"
  - name: offset
    type: number
    required: false
    description: "无目标发现模式的分页偏移，默认 0"

steps:
  # ==========================================================================
  # Step 1: 主线程状态分布
  # ==========================================================================
  - id: main_thread_state
    type: atomic
    name: "主线程状态分布"
    display:
      level: key
      layer: overview
      title: "ANR 窗口主线程状态分布"
      columns:
        - name: state
          label: "线程状态"
          type: string
        - name: state_display
          label: "状态说明"
          type: string
        - name: total_dur_ms
          label: "总时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: count
          label: "次数"
          type: number
          format: compact
        - name: pct
          label: "占比(%)"
          type: percentage
          format: percentage
        - name: avg_dur_ms
          label: "平均时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: max_dur_ms
          label: "最大时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
    synthesize:
      role: overview
      fields:
        - key: state_display
          label: 状态
        - key: pct
          label: 占比
          format: "{{value}}%"
        - key: total_dur_ms
          label: 总时间
          format: "{{value}} ms"
      insights:
        - condition: "state === 'S' && pct > 50"
          template: "主线程 {{pct}}% 时间处于 Sleep 状态；正常空闲也可如此，需输入处理或调用链证据判断是否异常等待"
        - condition: "state === 'D' && pct > 20"
          template: "主线程 {{pct}}% 时间处于不可中断睡眠 (D)，需结合 io_wait/blocked_function 判断是否为 IO"
        - condition: "state === 'R' && pct > 80"
          template: "主线程 {{pct}}% 时间处于 Runnable/Running，CPU 争抢或繁忙"
    sql: |
      WITH analysis_window AS (
        SELECT
          COALESCE(${start_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} - 5000000000 ELSE NULL END,
            (SELECT MIN(ts) FROM thread_state)
          ) as w_start,
          COALESCE(${end_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} + 1000000000 ELSE NULL END,
            (SELECT MAX(ts + dur) FROM thread_state)
          ) as w_end
      ),
      main_thread AS (
        SELECT t.utid, t.tid, p.upid
        FROM thread t
        JOIN process p ON t.upid = p.upid
        WHERE '${process_name}' != '' AND (p.name = '${process_name}' OR p.name GLOB '${process_name}:*')
          AND (t.is_main_thread = 1 OR t.tid = p.pid)
        LIMIT 1
      ),
      state_dist AS (
        SELECT
          ts_tbl.state,
          COUNT(*) as count,
          SUM(
            MIN(ts_tbl.ts + ts_tbl.dur, (SELECT w_end FROM analysis_window))
            - MAX(ts_tbl.ts, (SELECT w_start FROM analysis_window))
          ) as total_dur_ns
        FROM thread_state ts_tbl
        CROSS JOIN analysis_window aw
        CROSS JOIN main_thread mt
        WHERE ts_tbl.utid = mt.utid
          AND ts_tbl.ts + ts_tbl.dur > aw.w_start
          AND ts_tbl.ts < aw.w_end
        GROUP BY ts_tbl.state
      ),
      total AS (
        SELECT SUM(total_dur_ns) as total_ns FROM state_dist
      )
      SELECT
        sd.state,
        CASE sd.state
          WHEN 'Running' THEN 'Running (运行中)'
          WHEN 'R' THEN 'Runnable (可运行)'
          WHEN 'R+' THEN 'Runnable (Preempted)'
          WHEN 'S' THEN 'Sleeping (睡眠/等待)'
          WHEN 'D' THEN 'Uninterruptible Sleep (不可中断睡眠)'
          WHEN 'T' THEN 'Stopped (已停止)'
          WHEN 'X' THEN 'Dead (已退出)'
          ELSE sd.state
        END as state_display,
        ROUND(sd.total_dur_ns / 1e6, 2) as total_dur_ms,
        sd.count,
        ROUND(100.0 * sd.total_dur_ns / NULLIF((SELECT total_ns FROM total), 0), 1) as pct,
        ROUND(sd.total_dur_ns / NULLIF(sd.count, 0) / 1e6, 2) as avg_dur_ms,
        ROUND((SELECT MAX(
            MIN(ts2.ts + ts2.dur, (SELECT w_end FROM analysis_window))
            - MAX(ts2.ts, (SELECT w_start FROM analysis_window))
          ) FROM thread_state ts2
          CROSS JOIN analysis_window aw2
          CROSS JOIN main_thread mt2
          WHERE ts2.utid = mt2.utid
            AND ts2.state = sd.state
            AND ts2.ts + ts2.dur > aw2.w_start
            AND ts2.ts < aw2.w_end
        ) / 1e6, 2) as max_dur_ms
      FROM state_dist sd
      ORDER BY total_dur_ns DESC
    save_as: main_thread_state

  # ==========================================================================
  # Step 2: 主线程 Sleep 阻塞函数 Top
  # ==========================================================================
  - id: blocked_functions
    type: atomic
    name: "阻塞函数分析"
    display:
      level: key
      layer: list
      title: "主线程 Sleep 阻塞函数 Top"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: blocked_function
          label: "阻塞函数"
          type: string
        - name: dur_ms
          label: "阻塞时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: count
          label: "次数"
          type: number
          format: compact
        - name: total_dur_ms
          label: "总阻塞时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
    sql: |
      WITH analysis_window AS (
        SELECT
          COALESCE(${start_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} - 5000000000 ELSE NULL END,
            (SELECT MIN(ts) FROM thread_state)
          ) as w_start,
          COALESCE(${end_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} + 1000000000 ELSE NULL END,
            (SELECT MAX(ts + dur) FROM thread_state)
          ) as w_end
      ),
      main_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN process p ON t.upid = p.upid
        WHERE '${process_name}' != '' AND (p.name = '${process_name}' OR p.name GLOB '${process_name}:*')
          AND (t.is_main_thread = 1 OR t.tid = p.pid)
        LIMIT 1
      )
      SELECT
        printf('%d', MIN(ts_tbl.ts)) as ts,
        ts_tbl.blocked_function,
        ROUND(MAX(ts_tbl.dur) / 1e6, 2) as dur_ms,
        COUNT(*) as count,
        ROUND(SUM(ts_tbl.dur) / 1e6, 2) as total_dur_ms
      FROM thread_state ts_tbl
      CROSS JOIN analysis_window aw
      CROSS JOIN main_thread mt
      WHERE ts_tbl.utid = mt.utid
        AND ts_tbl.state = 'S'
        AND ts_tbl.blocked_function IS NOT NULL
        AND ts_tbl.blocked_function != ''
        AND ts_tbl.ts + ts_tbl.dur > aw.w_start
        AND ts_tbl.ts < aw.w_end
      GROUP BY ts_tbl.blocked_function
      ORDER BY total_dur_ms DESC
      LIMIT 20
    save_as: blocked_functions
    optional: true

  # ==========================================================================
  # Step 3: 唤醒链分析 (waker_utid)
  # ==========================================================================
  - id: wakeup_chain
    type: atomic
    name: "唤醒链分析"
    display:
      level: key
      layer: list
      title: "主线程等待候选与唤醒证据（长睡眠不等于无响应）"
      columns:
        - {name: process_name, label: "进程名", type: string}
        - {name: candidate_status, label: "候选证据边界", type: string}
        - {name: upid, label: "upid", type: number}
        - {name: utid, label: "utid", type: number}
        - {name: thread_state_id, label: "等待事件ID", type: number}
        - {name: raw_start_ts, label: "原始等待开始", type: timestamp, unit: ns}
        - {name: raw_end_ts, label: "原始等待结束", type: timestamp, unit: ns}
        - {name: start_ts, label: "窗口内等待开始", type: timestamp, unit: ns}
        - {name: end_ts, label: "窗口内等待结束", type: timestamp, unit: ns}
        - {name: is_unfinished, label: "未结束等待", type: number}
        - {name: left_censored, label: "左边界裁剪", type: number}
        - {name: right_censored, label: "右边界裁剪", type: number}
        - {name: wakeup_state_id, label: "后继状态ID", type: number}
        - {name: waker_utid, label: "唤醒线程身份", type: number}
        - {name: waker_upid, label: "唤醒进程身份", type: number}
        - {name: observed_waker_utid, label: "原始唤醒线程字段", type: number}
        - {name: irq_context, label: "IRQ上下文", type: number}
        - {name: wakeup_status, label: "唤醒证据状态", type: string}
        - {name: relation_status, label: "关系证据边界", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
        - {name: wait_span_count, label: "等待区间数", type: number}
        - {name: blocked_state, label: "等待状态", type: string}
        - name: ts
          label: "后继 Runnable 事件时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: waker_thread_name
          label: "唤醒者线程"
          type: string
        - name: waker_process_name
          label: "唤醒者进程"
          type: string
        - name: sleep_dur_ms
          label: "窗口内等待时长(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: blocked_function
          label: "阻塞函数"
          type: string
        - name: wakeup_count
          label: "有唤醒元数据的事件数"
          type: number
          format: compact
    sql_fragments:
      - fragments/system_thread_state_spans.sql
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${start_ts},${anr_ts}-5000000000,(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${end_ts},${anr_ts}+1000000000,(SELECT end_ts FROM trace_bounds)) AS window_end_ts
      ),
      main_thread AS (
        SELECT t.utid,t.upid,p.name AS process_name FROM thread t JOIN process p ON t.upid=p.upid
        WHERE t.tid=p.pid AND (
          ('${process_name}' != '' AND (p.name='${process_name}' OR p.name GLOB '${process_name}:*'))
          OR ('${process_name}' = '' AND p.uid % 100000 >= 10000)
        )
      ),
      system_target_threads AS (
        SELECT w.window_id,t.upid,t.utid,'main' AS role FROM system_windows w CROSS JOIN main_thread t
      ),
      wakeup_events AS (
        SELECT e.utid,e.ts,COUNT(*) AS event_rows,
          CASE WHEN COUNT(*)=1 THEN MAX(e.id) END AS wakeup_state_id,
          CASE WHEN COUNT(*)=1 THEN MAX(e.waker_utid) END AS observed_waker_utid,
          CASE WHEN COUNT(*)=1 THEN MAX(e.irq_context) END AS irq_context
        FROM thread_state e JOIN main_thread t ON t.utid=e.utid CROSS JOIN system_windows w
        WHERE e.state IN ('R','R+') AND e.ts>=w.window_start_ts AND e.ts<w.window_end_ts
        GROUP BY e.utid,e.ts
      ),
      waits AS (
        SELECT s.*,e.event_rows,e.wakeup_state_id,e.observed_waker_utid,e.irq_context AS wake_irq_context,
          CASE WHEN e.event_rows=1 THEN e.ts END AS wakeup_ts,
          CASE WHEN e.event_rows=1 AND COALESCE(e.irq_context,0)!=1 THEN e.observed_waker_utid END AS resolved_waker_utid,
          CASE WHEN e.event_rows>1 THEN 'ambiguous_successor'
            WHEN e.irq_context=1 THEN 'observed_irq'
            WHEN e.observed_waker_utid IS NOT NULL THEN 'observed_thread'
            WHEN e.event_rows=1 THEN 'successor_without_wake_metadata'
            ELSE 'no_in_window_wakeup' END AS wakeup_status
        FROM system_thread_state_spans s
        LEFT JOIN wakeup_events e ON e.utid=s.utid AND e.ts=s.raw_end_ts
        WHERE s.state IN ('S','I','D','DK') AND s.dur_ns>0
      ),
      ranked_waits AS (
        SELECT w.*,ROW_NUMBER() OVER(PARTITION BY w.upid,w.is_unfinished ORDER BY w.dur_ns DESC,w.thread_state_id) AS process_wait_rank
        FROM waits w
        WHERE '${process_name}' != '' OR (
          w.state IN ('S','D','DK') AND w.dur_ns >= MAX(0,${min_wait_ms|3000})*1000000
        )
      )
      SELECT mt.process_name,'observed_wait_not_proven_unresponsiveness' AS candidate_status,
        w.upid,w.utid,w.thread_state_id,w.state AS blocked_state,w.blocked_function,
        printf('%d',w.raw_start_ts) AS raw_start_ts,
        CASE WHEN w.raw_end_ts IS NOT NULL THEN printf('%d',w.raw_end_ts) END AS raw_end_ts,
        printf('%d',w.clipped_start_ts) AS start_ts,printf('%d',w.clipped_end_ts) AS end_ts,
        w.is_unfinished,w.left_censored,w.right_censored,
        w.wakeup_state_id,CASE WHEN w.wakeup_ts IS NOT NULL THEN printf('%d',w.wakeup_ts) END AS ts,
        w.observed_waker_utid,w.wake_irq_context AS irq_context,w.resolved_waker_utid AS waker_utid,wt.upid AS waker_upid,
        COALESCE(wt.name,'unknown') AS waker_thread_name,COALESCE(wp.name,'unknown') AS waker_process_name,
        ROUND(w.dur_ns/1e6,2) AS sleep_dur_ms,
        CASE WHEN w.wakeup_status IN ('observed_irq','observed_thread') THEN 1 ELSE 0 END AS wakeup_count,
        1 AS wait_span_count,w.wakeup_status,
        'observed_wakeup_not_proven_blocking_cause' AS relation_status,
        'one_wait_span_clipped_to_window' AS evidence_scope
      FROM ranked_waits w JOIN main_thread mt ON mt.utid=w.utid
      LEFT JOIN thread wt ON wt.utid=w.resolved_waker_utid
      LEFT JOIN process wp ON wp.upid=wt.upid
      WHERE '${process_name}' != '' OR w.process_wait_rank=1
      ORDER BY w.dur_ns DESC,w.thread_state_id
      LIMIT CASE WHEN '${process_name}' != '' THEN 20 ELSE MIN(100,MAX(1,CAST(${top_n|20} AS INT))) END
      OFFSET CASE WHEN '${process_name}' != '' THEN 0 ELSE MAX(0,CAST(${offset|0} AS INT)) END
    save_as: wakeup_chain
    optional: true

  # ==========================================================================
  # Step 4: Binder 同步调用阻塞主线程
  # ==========================================================================
  - id: binder_blocking
    type: atomic
    name: "Binder 阻塞分析"
    display:
      level: key
      layer: list
      title: "主线程 Binder 同步调用"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: slice_name
          label: "Binder 调用"
          type: string
        - name: dur_ms
          label: "耗时(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: server_process
          label: "服务端进程"
          type: string
        - name: server_thread
          label: "服务端线程"
          type: string
    sql: |
      -- 使用 stdlib android_binder_txns 替代手动 binder slice 解析
      WITH analysis_window AS (
        SELECT
          COALESCE(${start_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} - 5000000000 ELSE NULL END,
            (SELECT MIN(ts) FROM slice)
          ) as w_start,
          COALESCE(${end_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} + 1000000000 ELSE NULL END,
            (SELECT MAX(ts + dur) FROM slice)
          ) as w_end
      )
      SELECT
        printf('%d', bt.client_ts) as ts,
        COALESCE(bt.aidl_name, 'binder transaction') as slice_name,
        ROUND(bt.client_dur / 1e6, 2) as dur_ms,
        bt.server_process,
        bt.server_thread
      FROM android_binder_txns bt
      CROSS JOIN analysis_window aw
      WHERE bt.is_main_thread = 1
        AND bt.is_sync = 1
        AND bt.client_upid = (
          SELECT p.upid FROM process p
          WHERE '${process_name}' != '' AND (p.name = '${process_name}' OR p.name GLOB '${process_name}:*')
          LIMIT 1
        )
        AND bt.client_ts >= aw.w_start
        AND bt.client_ts + bt.client_dur <= aw.w_end
      ORDER BY bt.client_dur DESC
      LIMIT 20
    save_as: binder_blocking
    optional: true

  # ==========================================================================
  # Step 5: 锁竞争 (monitor_contention + futex_wait)
  # ==========================================================================
  - id: lock_contention
    type: atomic
    name: "锁竞争分析"
    display:
      level: detail
      layer: list
      title: "主线程锁等待 (Monitor/Futex)"
      columns:
        - name: ts
          label: "时间"
          type: timestamp
          unit: ns
          clickAction: navigate_timeline
        - name: lock_type
          label: "锁类型"
          type: string
        - name: slice_name
          label: "Slice 名称"
          type: string
        - name: dur_ms
          label: "等待时间(ms)"
          type: duration
          format: duration_ms
          unit: ms
        - name: thread_name
          label: "线程"
          type: string
    sql: |
      -- stdlib android_monitor_contention 提供 blocking_method + blocking_thread
      -- futex 部分保留手动 GLOB（stdlib 不覆盖）
      WITH analysis_window AS (
        SELECT
          COALESCE(${start_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} - 5000000000 ELSE NULL END,
            (SELECT MIN(ts) FROM slice)
          ) as w_start,
          COALESCE(${end_ts},
            CASE WHEN ${anr_ts} IS NOT NULL THEN ${anr_ts} + 1000000000 ELSE NULL END,
            (SELECT MAX(ts + dur) FROM slice)
          ) as w_end
      ),
      main_thread AS (
        SELECT t.utid
        FROM thread t
        JOIN process p ON t.upid = p.upid
        WHERE '${process_name}' != '' AND (p.name = '${process_name}' OR p.name GLOB '${process_name}:*')
          AND (t.is_main_thread = 1 OR t.tid = p.pid)
        LIMIT 1
      ),
      -- monitor contention: 使用 stdlib 获得 blocking_method 和 owner 信息
      monitor_locks AS (
        SELECT
          mc.ts,
          'monitor' as lock_type,
          mc.blocking_method || ' (owner: ' || mc.blocking_thread_name || ')' as slice_name,
          mc.dur,
          mc.blocked_thread_name as thread_name
        FROM android_monitor_contention mc
        CROSS JOIN analysis_window aw
        WHERE mc.blocked_utid = (SELECT utid FROM main_thread)
          AND mc.ts >= aw.w_start
          AND mc.ts + mc.dur <= aw.w_end
      ),
      -- futex: stdlib 不覆盖，保留手动 GLOB
      futex_locks AS (
        SELECT
          s.ts,
          'futex' as lock_type,
          s.name as slice_name,
          s.dur,
          t.name as thread_name
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        CROSS JOIN analysis_window aw
        CROSS JOIN main_thread mt
        WHERE tt.utid = mt.utid
          AND s.name GLOB '*futex*'
          AND s.ts >= aw.w_start
          AND s.ts + s.dur <= aw.w_end
      )
      SELECT
        printf('%d', ts) as ts,
        lock_type,
        slice_name,
        ROUND(dur / 1e6, 2) as dur_ms,
        thread_name
      FROM (
        SELECT * FROM monitor_locks
        UNION ALL
        SELECT * FROM futex_locks
      )
      ORDER BY dur DESC
      LIMIT 20
    save_as: lock_contention
    optional: true

output:
  format: layered
  default_expanded: [main_thread_state, blocked_functions, wakeup_chain]
