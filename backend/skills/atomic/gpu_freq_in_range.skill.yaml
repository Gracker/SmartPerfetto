# =============================================================================
# GPU 频率分析 (Atomic Skill)
# =============================================================================
# 分析指定时间范围内 GPU 频率变化
# 检测 GPU 频率是否跟上渲染需求

name: gpu_freq_in_range
version: "1.0"
type: atomic
category: gpu
tier: B

meta:
  display_name: "GPU 频率分析"
  description: "分析 GPU 频率变化情况"
  icon: "speed"
  tags: [gpu, frequency, atomic]

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns，可选)"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns，可选)"
  - name: low_freq_threshold_pct
    type: number
    required: false
    default: 40
    description: "低频阈值百分比 (相对最大频率，默认 40%)"

display:
  level: detail
  layer: deep
  title: "GPU 频率"
  columns:
    - name: gpu_id
      label: "GPU"
      type: number
    - name: avg_freq_mhz
      label: "运行时平均频率"
      type: number
    - name: max_freq_mhz
      label: "最高运行频率"
      type: number
    - name: min_freq_mhz
      label: "最低运行频率"
      type: number
    - name: freq_changes
      label: "变频次数"
      type: number
    - name: low_freq_pct
      label: "运行时间中低频占比"
      type: percentage
      format: percentage
    - name: off_pct
      label: "GPU 关闭占比"
      type: percentage
      format: percentage
    - name: out_of_domain_pct
      label: "频率不可读占比"
      type: percentage
      format: percentage

process_scope:
  role: global_context

sql_fragments:
  - fragments/gpu_frequency_intervals.sql
  - fragments/gpu_frequency_window.sql
  - fragments/gpu_frequency_summary.sql

sql: |
  -- MHz from fragments/gpu_frequency_intervals.sql. Average, range and
  -- low_freq_pct are of the time the GPU ran: an off GPU is not a slow one.
  -- off_pct and out_of_domain_pct are of all observed window time.
  SELECT
    s.gpu_id,
    ROUND(s.avg_running_mhz, 0) AS avg_freq_mhz,
    ROUND(s.max_running_mhz, 0) AS max_freq_mhz,
    ROUND(s.min_running_mhz, 0) AS min_freq_mhz,
    s.running_change_count AS freq_changes,
    ROUND(100.0 * COALESCE((
      SELECT SUM(w.dur) FROM gpu_frequency_window w
      WHERE w.gpu_id = s.gpu_id
        AND w.running_mhz < s.max_running_mhz * ${low_freq_threshold_pct|40} / 100.0
    ), 0) / NULLIF(s.running_ns, 0), 1) AS low_freq_pct,
    ROUND(100.0 * s.off_ns / NULLIF(s.observed_ns, 0), 1) AS off_pct,
    ROUND(100.0 * s.out_of_domain_ns / NULLIF(s.observed_ns, 0), 1) AS out_of_domain_pct
  FROM gpu_frequency_summary s
  ORDER BY s.gpu_id

output:
  format: structured
