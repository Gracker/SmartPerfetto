# =============================================================================
# GPU 渲染分析 (Atomic Skill)
# =============================================================================
# 分析指定时间范围内 GPU 侧的工作负载
# 检测 GPU 渲染、Fence 等待等是否是性能瓶颈

name: gpu_render_in_range
version: "1.0"
type: atomic
category: gpu
tier: B

meta:
  display_name: "GPU 渲染分析"
  description: "分析 GPU 渲染耗时和 Fence 等待"
  icon: "memory"
  tags: [gpu, render, fence, atomic]
  # ----- Phase F: pipeline-aware 接口标注 -----
  pipeline_aware: true
  pipeline_aware_note: |
    GPU 工作来源不同：标准 RenderThread；Flutter raster；Game (Vulkan vs GLES)；
    Camera ISP；Video decoder。未来按 pipeline_id 切换 GPU 来源识别 SQL。

identity:
  policy: verify_if_present
  scope: process
  aliases: [package]

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns，可选)"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns，可选)"
  - name: package
    type: string
    required: false
    description: "目标进程名（精确匹配，含 name:* 子进程）"

display:
  level: detail
  layer: deep
  title: "GPU 渲染"
  columns:
    - name: operation
      label: "操作类型"
      type: string
    - name: count
      label: "次数"
      type: number
    - name: total_ms
      label: "总耗时"
      type: duration
      format: duration_ms
    - name: max_ms
      label: "最大耗时"
      type: duration
      format: duration_ms
    - name: avg_ms
      label: "平均耗时"
      type: duration
      format: duration_ms
    - {name: censored_slice_count, label: "未闭合切片", type: number}
    - {name: duration_basis, label: "耗时口径", type: string}

process_scope:
  role: global_context
  limitations:
    - Operation aggregates combine application and SurfaceFlinger slices; they are not application-only measurements.
sql_fragments:
  - fragments/effective_target_processes.sql

sql: |
  WITH gpu_slices AS (
    SELECT
      s.name,
      CASE WHEN s.dur >= 0 THEN
        MIN(s.ts + s.dur, COALESCE(${end_ts}, trace_end())) -
        MAX(s.ts, COALESCE(${start_ts}, trace_start()))
      END AS dur,
      CASE WHEN s.dur < 0 THEN 1 ELSE 0 END AS censored,
      CASE
        WHEN s.name GLOB '*DrawFrame*' OR s.name GLOB '*doFrame*' THEN 'Draw Frame'
        WHEN s.name GLOB '*fence*signal*' OR s.name GLOB '*Fence*signal*' THEN 'Fence Signal'
        WHEN s.name GLOB '*fence*wait*' OR s.name GLOB '*waitForFence*' THEN 'Fence Wait'
        WHEN s.name GLOB '*eglSwap*' THEN 'EGL SwapBuffers'
        WHEN s.name GLOB '*flush*' OR s.name GLOB '*Flush*' THEN 'GPU Flush'
        WHEN s.name GLOB '*queueBuffer*' THEN 'Queue Buffer'
        WHEN s.name GLOB '*dequeueBuffer*' THEN 'Dequeue Buffer'
        WHEN s.name GLOB '*GPU*' THEN 'GPU Other'
        WHEN s.name GLOB '*RenderThread*' THEN 'RenderThread'
        ELSE NULL
      END as operation
    FROM slice s
    JOIN thread_track tt ON s.track_id = tt.id
    JOIN thread t ON tt.utid = t.utid
    JOIN process p ON t.upid = p.upid
    WHERE s.ts < COALESCE(${end_ts}, trace_end())
      AND (s.dur < 0 OR s.ts + s.dur > COALESCE(${start_ts}, trace_start()))
      AND COALESCE(${end_ts}, trace_end()) > COALESCE(${start_ts}, trace_start())
      AND (
        (
          p.upid IN (SELECT upid FROM effective_target_processes)
          AND (${__process_scope.upid} IS NOT NULL OR '${package}' = '' OR p.name = '${package}' OR p.name GLOB '${package}:*')
        )
        OR p.name = 'surfaceflinger'
      )
      AND (s.dur > 10000 OR s.dur < 0)  -- Completed > 10us or unknown end.
  )
  SELECT
    operation,
    COUNT(*) as count,
    ROUND(SUM(dur) / 1e6, 2) as total_ms,
    ROUND(MAX(dur) / 1e6, 2) as max_ms,
    ROUND(AVG(dur) / 1e6, 2) as avg_ms,
    SUM(censored) AS censored_slice_count,
    'sum_of_clipped_completed_operation_slices_not_gpu_busy_time;_unknown_ends_excluded' AS duration_basis
  FROM gpu_slices
  WHERE operation IS NOT NULL
  GROUP BY operation
  ORDER BY total_ms DESC

output:
  format: structured
