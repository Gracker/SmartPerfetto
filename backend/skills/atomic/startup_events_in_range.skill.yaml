# =============================================================================
# 启动事件列表（原子 Skill）
# =============================================================================

name: startup_events_in_range
version: "1.0"
type: atomic
category: app_lifecycle
tier: A

meta:
  display_name: "启动事件列表 (区间)"
  description: "查询启动事件及 TTID/TTFD 指标"
  icon: "rocket_launch"
  tags: [startup, lifecycle, atomic]

prerequisites:
  modules:
    - android.startup.startups
    - android.startup.time_to_display
    - android.startup.startup_events

inputs:
  - name: package
    type: string
    required: false
  - name: startup_id
    type: integer
    required: false
  - name: startup_type
    type: string
    required: false
  - name: start_ts
    type: timestamp
    required: false
  - name: end_ts
    type: timestamp
    required: false

display:
  level: key
  layer: overview
  title: "检测到的启动事件"
  columns:
    - name: startup_id
      label: "启动 ID"
      type: number
    - name: upid
      label: "UPID"
      type: number
      hidden: true
    - name: package
      label: "包名"
      type: string
    - name: type_display
      label: "启动类型"
      type: string
    - name: dur_ms
      label: "耗时"
      type: duration
      format: duration_ms
      unit: ms
    - name: start_ts
      label: "开始时间"
      type: timestamp
      unit: ns
      clickAction: navigate_range
      durationColumn: dur_ns
    - name: end_ts
      label: "结束时间"
      type: timestamp
      unit: ns
      clickAction: navigate_timeline
    - name: dur_ns
      label: "耗时(ns)"
      type: duration
      format: duration_ms
      unit: ns
      hidden: true
    - name: dur_without_trampoline_ms
      label: "去 Trampoline 耗时"
      type: duration
      format: duration_ms
      unit: ms
    - name: trampoline_ms
      label: "Trampoline 耗时"
      type: duration
      format: duration_ms
      unit: ms
    - name: ttid_ms
      label: "TTID"
      type: duration
      format: duration_ms
      unit: ms
    - name: ttfd_ms
      label: "TTFD"
      type: duration
      format: duration_ms
      unit: ms
    - name: rating
      label: "评级"
      type: string
    - name: original_type
      label: "Stdlib 类型"
      label_i18n: {en: "Stdlib type"}
      type: string
    - name: stdlib_platform_marker
      label: "匹配的平台启动类型标记"
      label_i18n: {en: "Matched platform startup type marker"}
      type: string
    - name: classification_basis
      label: "Skill 分类依据"
      label_i18n: {en: "Skill classification basis"}
      type: string
    - name: bind_app_start_ts
      label: "bindApplication 开始"
      label_i18n: {en: "bindApplication start"}
      type: timestamp
      unit: ns
      hidden: true
    - name: bind_app_end_ts
      label: "bindApplication 结束"
      label_i18n: {en: "bindApplication end"}
      type: timestamp
      unit: ns
      hidden: true
    - name: process_start_ts
      label: "进程创建时间"
      label_i18n: {en: "Process creation time"}
      type: timestamp
      unit: ns
      hidden: true
    - name: process_first_state_ts
      label: "进程首个线程状态观测"
      label_i18n: {en: "First observed process thread state"}
      type: timestamp
      unit: ns
      hidden: true
    - name: first_state_before_start_ms
      label: "首个状态早于启动"
      label_i18n: {en: "First state before startup"}
      type: number
      unit: ms
    - name: type_reclassified
      label: "类型已修正"
      type: number
      hidden: true
    - name: type_confidence
      label: "分类置信度"
      type: string

sql: |
  -- Multi-signal startup type validation:
  --   bindApplication exists           → cold  (process created from zygote)
  --   performCreate:* without above    → warm  (activity recreated, process alive)
  --   handleRelaunchActivity           → warm  (config change rebuild)
  --   performRestart:* exists           → collected as signal but NOT used for reclassification
  --   none of above                    → keep original platform classification (Rule 5)
  -- Also checks process creation time as fallback cold signal.
  --
  -- Uses android_startup_threads (stdlib, correct process resolution via
  -- android_process_metadata) + direct slice JOIN with OVERLAP time filter.
  -- Key: bindApplication can start BEFORE the launchingActivity event
  -- (process fork precedes framework launch record by ~100ms), so we use
  -- overlap (sl.ts + sl.dur > st.ts AND sl.ts < st.ts + st.dur) instead of
  -- the strict "starts within" filter that android_thread_slices_for_all_startups uses.
  WITH startup_type_signals AS (
    SELECT
      st.startup_id,
      -- Cold signals
      MAX(CASE WHEN sl.name = 'bindApplication' THEN 1 ELSE 0 END) as has_bind_app,
      MAX(CASE WHEN sl.name GLOB 'OpenDexFilesFromOat*' THEN 1 ELSE 0 END) as has_dex_load,
      MAX(CASE WHEN sl.name = 'PostFork' THEN 1 ELSE 0 END) as has_post_fork,
      -- Warm signals
      MAX(CASE WHEN sl.name GLOB 'performCreate:*' THEN 1 ELSE 0 END) as has_perform_create,
      MAX(CASE WHEN sl.name GLOB 'handleRelaunchActivity*'
               OR sl.name GLOB 'relaunchActivity*' THEN 1 ELSE 0 END) as has_relaunch,
      -- Hot signals (positive)
      MAX(CASE WHEN sl.name GLOB 'performRestart*' THEN 1 ELSE 0 END) as has_perform_restart,
      -- Signal count (trace completeness)
      COUNT(DISTINCT sl.name) as signal_count
    FROM android_startup_threads st
    JOIN thread_track tt ON tt.utid = st.utid
    JOIN slice sl ON sl.track_id = tt.id
    WHERE st.is_main_thread = 1
      -- Overlap: slice overlaps with startup window (not just starts within)
      AND sl.ts + sl.dur > st.ts AND sl.ts < st.ts + st.dur
      AND (sl.name IN ('bindApplication', 'PostFork', 'activityStart', 'activityResume')
           OR sl.name GLOB 'performCreate:*'
           OR sl.name GLOB 'performRestart*'
           OR sl.name GLOB 'handleRelaunchActivity*'
           OR sl.name GLOB 'relaunchActivity*'
           OR sl.name GLOB 'OpenDexFilesFromOat*')
    GROUP BY st.startup_id
  ),
  -- Check process creation time (fallback cold signal)
  process_age AS (
    SELECT
      s.startup_id,
      MAX(CASE
        WHEN p.start_ts IS NOT NULL
          AND p.start_ts >= s.ts - 5000000000  -- 5s tolerance before startup
          AND p.start_ts <= s.ts + s.dur
        THEN 1 ELSE 0
      END) as process_created_during_startup
    FROM android_startups s
    LEFT JOIN android_startup_processes asp ON asp.startup_id = s.startup_id
    LEFT JOIN process p ON p.upid = asp.upid
    GROUP BY s.startup_id
  ),
  -- Launch trampoline (SDK 33+): one launchingActivity# span can cover a
  -- trampoline launch plus the launch it redirects to, so android_startups.dur
  -- includes time the target package did not own. Same rule as upstream
  -- android_startups.dur_without_trampoline (ed3848d341): the target package
  -- own last "launching:" slice when an earlier launch precedes it in the span,
  -- else dur. Computed from _startup_events (present in older runtimes too) so
  -- the value does not depend on which trace_processor build is attached.
  startup_trampoline AS (
    SELECT
      s.startup_id,
      MIN(COALESCE((
        SELECT le.dur
        FROM _startup_events le
        WHERE le.package_name = s.package
          AND le.ts < s.ts_end
          AND le.ts > (
            SELECT MIN(e.ts) FROM _startup_events e
            WHERE e.ts >= s.ts AND e.ts < s.ts_end
          )
        ORDER BY le.ts DESC
        LIMIT 1
      ), s.dur), s.dur) AS dur_without_trampoline
    FROM android_startups s
  ),
  startup_process_identity AS (
    SELECT
      startup_id,
      CASE WHEN COUNT(DISTINCT upid) = 1 AND MAX(upid) > 0 THEN MAX(upid) END AS upid
    FROM android_startup_processes
    WHERE upid IS NOT NULL
    GROUP BY startup_id
  ),
  -- Lifecycle observations belong to one resolved process. First observed
  -- thread_state is not proof of process creation; process.start_ts may be NULL.
  startup_process_first_states AS MATERIALIZED (
    SELECT t.upid, MIN(state.ts) AS process_first_state_ts
    FROM (
      SELECT DISTINCT upid FROM startup_process_identity WHERE upid IS NOT NULL
    ) startup_process
    JOIN thread t ON t.upid = startup_process.upid
    JOIN thread_state state ON state.utid = t.utid
    GROUP BY t.upid
  ),
  startup_process_observations AS (
    SELECT
      spi.startup_id,
      p.start_ts AS process_start_ts,
      first_state.process_first_state_ts
    FROM startup_process_identity spi
    LEFT JOIN process p ON p.upid = spi.upid
    LEFT JOIN startup_process_first_states first_state ON first_state.upid = spi.upid
  ),
  -- Keep the endpoints of the same first overlapping bindApplication slice.
  startup_bind_application AS (
    SELECT startup_id, ts AS bind_app_start_ts, ts + dur AS bind_app_end_ts
    FROM (
      SELECT
        st.startup_id, sl.ts, sl.dur,
        ROW_NUMBER() OVER (PARTITION BY st.startup_id ORDER BY sl.ts, sl.dur DESC) AS ordinal
      FROM android_startup_threads st
      JOIN startup_process_identity spi USING (startup_id)
      JOIN thread t ON t.utid = st.utid AND t.upid = spi.upid
      JOIN thread_track tt ON tt.utid = st.utid
      JOIN slice sl ON sl.track_id = tt.id
      WHERE st.is_main_thread = 1 AND sl.name = 'bindApplication'
        AND sl.ts + sl.dur > st.ts AND sl.ts < st.ts + st.dur
    )
    WHERE ordinal = 1
  ),
  -- The API 33+ stdlib parser matches completed markers by startup ID,
  -- package and type, without clipping their instant to the async window.
  -- DISTINCT keeps repeated raw markers from multiplying startup rows.
  startup_platform_markers AS MATERIALIZED (
    SELECT DISTINCT name
    FROM slice
    WHERE dur = 0 AND name GLOB 'launchingActivity#*:completed-*:*'
  ),
  validated AS (
    SELECT
      s.startup_id,
      spi.upid,
      s.package,
      s.startup_type as original_type,
      pm.name AS stdlib_platform_marker,
      CASE
        -- Rule 1: bindApplication → cold (strongest signal)
        WHEN COALESCE(sts.has_bind_app, 0) = 1 THEN 'cold'
        -- Rule 2: performCreate without bindApplication → warm
        WHEN COALESCE(sts.has_perform_create, 0) = 1 AND COALESCE(sts.has_bind_app, 0) = 0 THEN 'warm'
        -- Rule 3: handleRelaunchActivity → warm (config change rebuild)
        WHEN COALESCE(sts.has_relaunch, 0) = 1 THEN 'warm'
        -- Rule 4: process created during startup → cold (fallback)
        WHEN COALESCE(pa.process_created_during_startup, 0) = 1 THEN 'cold'
        -- Rule 5: keep platform classification
        ELSE s.startup_type
      END as startup_type,
      CASE
        WHEN COALESCE(sts.has_bind_app, 0) = 1 THEN 'bindApplication overlap'
        WHEN COALESCE(sts.has_perform_create, 0) = 1 THEN 'performCreate without bindApplication'
        WHEN COALESCE(sts.has_relaunch, 0) = 1 THEN 'activity relaunch'
        WHEN COALESCE(pa.process_created_during_startup, 0) = 1 THEN 'process.start_ts near startup'
        ELSE 'stdlib type retained'
      END AS classification_basis,
      ba.bind_app_start_ts,
      ba.bind_app_end_ts,
      po.process_start_ts,
      po.process_first_state_ts,
      s.ts,
      s.dur,
      tr.dur_without_trampoline,
      ttd.time_to_initial_display,
      ttd.time_to_full_display,
      CASE
        WHEN COALESCE(sts.has_bind_app, 0) = 1 AND s.startup_type != 'cold' THEN 1
        WHEN COALESCE(sts.has_perform_create, 0) = 1 AND COALESCE(sts.has_bind_app, 0) = 0 AND s.startup_type != 'warm' THEN 1
        WHEN COALESCE(sts.has_relaunch, 0) = 1 AND s.startup_type != 'warm' THEN 1
        WHEN COALESCE(pa.process_created_during_startup, 0) = 1 AND s.startup_type != 'cold' THEN 1
        ELSE 0
      END as type_reclassified,
      -- Classification confidence
      CASE
        WHEN COALESCE(sts.has_bind_app, 0) = 1 AND (COALESCE(sts.has_dex_load, 0) = 1 OR COALESCE(sts.has_post_fork, 0) = 1) THEN 'high'
        WHEN COALESCE(sts.has_bind_app, 0) = 1 THEN 'high'
        WHEN COALESCE(sts.has_perform_create, 0) = 1 AND COALESCE(sts.has_bind_app, 0) = 0 THEN 'high'
        WHEN COALESCE(sts.has_relaunch, 0) = 1 THEN 'medium'
        WHEN COALESCE(pa.process_created_during_startup, 0) = 1 THEN 'medium'
        WHEN COALESCE(sts.signal_count, 0) < 2 THEN 'low'
        ELSE 'medium'
      END as type_confidence
    FROM android_startups s
    LEFT JOIN startup_platform_markers pm
      ON pm.name = 'launchingActivity#' || s.startup_id || ':completed-' || s.startup_type || ':' || s.package
    LEFT JOIN android_startup_time_to_display ttd USING (startup_id)
    LEFT JOIN startup_type_signals sts USING (startup_id)
    LEFT JOIN process_age pa USING (startup_id)
    LEFT JOIN startup_process_identity spi USING (startup_id)
    LEFT JOIN startup_process_observations po USING (startup_id)
    LEFT JOIN startup_bind_application ba USING (startup_id)
    LEFT JOIN startup_trampoline tr USING (startup_id)
    WHERE (('${package}' = '' OR s.package = '${package}' OR s.package GLOB '${package}:*') OR '${package}' = '')
      AND (${startup_id} IS NULL OR s.startup_id = ${startup_id})
      AND (${start_ts} IS NULL OR s.ts >= ${start_ts})
      AND (${end_ts} IS NULL OR s.ts + s.dur <= ${end_ts})
  )
  SELECT
    startup_id,
    upid,
    package,
    startup_type,
    original_type,
    stdlib_platform_marker,
    classification_basis,
    CASE WHEN bind_app_start_ts IS NOT NULL THEN printf('%d', bind_app_start_ts) END AS bind_app_start_ts,
    CASE WHEN bind_app_end_ts IS NOT NULL THEN printf('%d', bind_app_end_ts) END AS bind_app_end_ts,
    CASE WHEN process_start_ts IS NOT NULL THEN printf('%d', process_start_ts) END AS process_start_ts,
    CASE WHEN process_first_state_ts IS NOT NULL THEN printf('%d', process_first_state_ts) END AS process_first_state_ts,
    (ts - process_first_state_ts) / 1e6 AS first_state_before_start_ms,
    dur / 1e6 as dur_ms,
    printf('%d', ts) as start_ts,
    printf('%d', ts + dur) as end_ts,
    printf('%d', dur) as dur_ns,
    -- Clamped to dur: a later same-package launch overlapping the span must
    -- not produce a negative trampoline.
    dur_without_trampoline / 1e6 as dur_without_trampoline_ms,
    (dur - dur_without_trampoline) / 1e6 as trampoline_ms,
    time_to_initial_display / 1e6 as ttid_ms,
    time_to_full_display / 1e6 as ttfd_ms,
    CASE startup_type
      WHEN 'cold' THEN '冷启动'
      WHEN 'warm' THEN '温启动'
      WHEN 'hot' THEN '热启动'
      ELSE startup_type
    END as type_display,
    CASE
      WHEN startup_type = 'cold' AND dur / 1e6 < 500 THEN '优秀'
      WHEN startup_type = 'cold' AND dur / 1e6 < 1000 THEN '良好'
      WHEN startup_type = 'cold' AND dur / 1e6 < 2000 THEN '需优化'
      WHEN startup_type = 'cold' THEN '严重'
      WHEN startup_type = 'warm' AND dur / 1e6 < 200 THEN '优秀'
      WHEN startup_type = 'warm' AND dur / 1e6 < 500 THEN '良好'
      WHEN startup_type = 'warm' AND dur / 1e6 < 1000 THEN '需优化'
      WHEN startup_type = 'warm' THEN '严重'
      WHEN startup_type = 'hot' AND dur / 1e6 < 100 THEN '优秀'
      WHEN startup_type = 'hot' AND dur / 1e6 < 200 THEN '良好'
      WHEN startup_type = 'hot' AND dur / 1e6 < 500 THEN '需优化'
      WHEN startup_type = 'hot' THEN '严重'
      ELSE '需优化'
    END as rating,
    type_reclassified,
    type_confidence,
    printf('%d', CAST(ts - dur * 0.1 AS INTEGER)) as perfetto_start,
    printf('%d', CAST(ts + dur * 1.1 AS INTEGER)) as perfetto_end
  FROM validated
  WHERE ('${startup_type}' = '' OR startup_type = '${startup_type}')
  ORDER BY dur DESC, ts ASC

output:
  format: structured
