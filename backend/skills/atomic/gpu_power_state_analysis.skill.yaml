# =============================================================================
# GPU Power State Analysis (Atomic Skill)
# =============================================================================
# Analyze GPU frequency transitions to identify power-state oscillation and
# downshift pressure that may correlate with rendering instability.

name: gpu_power_state_analysis
version: "1.0"
type: atomic
category: gpu
tier: B

meta:
  display_name: "GPU 功耗状态分析"
  description: "分析 GPU 频率状态切换，识别频率下调与抖动"
  icon: "bolt"
  tags: [gpu, power, dvfs, thermal]

triggers:
  keywords:
    zh: [GPU, 功耗, 降频, DVFS, 热控]
    en: [gpu, power, downshift, dvfs, thermal]
  patterns:
    - ".*gpu.*(power|dvfs|freq).*"
    - ".*(降频|功耗|热控).*gpu.*"

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns，可选)"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns，可选)"
  - name: transition_threshold_pct
    type: number
    required: false
    default: 15
    description: "判定频率上调或下调的百分比阈值"

display:
  level: detail
  layer: deep
  title: "GPU 功耗状态"
  columns:
    - name: gpu_id
      label: "GPU"
      type: number
    - name: samples
      label: "采样数"
      type: number
    - name: avg_freq_mhz
      label: "运行时平均频率(MHz)"
      type: number
    - name: min_freq_mhz
      label: "最低频率(MHz)"
      type: number
    - name: max_freq_mhz
      label: "最高频率(MHz)"
      type: number
    - name: downshift_count
      label: "频率下调次数"
      type: number
    - name: upshift_count
      label: "升频次数"
      type: number
    - name: downshift_ratio_pct
      label: "频率下调占比"
      type: percentage
      format: percentage
    - name: off_pct
      label: "GPU 关闭占比"
      type: percentage
      format: percentage

sql_fragments:
  - fragments/gpu_frequency_intervals.sql
  - fragments/gpu_frequency_window.sql
  - fragments/gpu_frequency_summary.sql

sql: |
  -- MHz from fragments/gpu_frequency_intervals.sql. A shift is a change
  -- between two running frequencies that starts in the window; powering the
  -- GPU off or on is neither, and off time is reported apart. Frequencies
  -- are of running time, weighted by time.
  WITH shifts AS (
    SELECT
      gpu_id,
      SUM(is_running_change AND running_mhz < prev_freq_mhz * (1 - ${transition_threshold_pct|15} / 100.0)) AS downshift_count,
      SUM(is_running_change AND running_mhz > prev_freq_mhz * (1 + ${transition_threshold_pct|15} / 100.0)) AS upshift_count,
      COUNT(*) AS samples
    FROM gpu_frequency_window
    GROUP BY gpu_id
  )
  SELECT
    s.gpu_id,
    t.samples,
    ROUND(s.avg_running_mhz, 0) AS avg_freq_mhz,
    ROUND(s.min_running_mhz, 0) AS min_freq_mhz,
    ROUND(s.max_running_mhz, 0) AS max_freq_mhz,
    t.downshift_count,
    t.upshift_count,
    ROUND(100.0 * t.downshift_count / NULLIF(s.running_change_count, 0), 1) AS downshift_ratio_pct,
    ROUND(100.0 * s.off_ns / NULLIF(s.observed_ns, 0), 1) AS off_pct
  FROM gpu_frequency_summary s
  JOIN shifts t USING (gpu_id)
  ORDER BY s.gpu_id

output:
  format: structured