# Memory Pressure Analysis Skill
#
# This atomic skill analyzes memory pressure indicators during a specific
# time range. It's designed for use as part of frame-level deep analysis
# to detect memory-related jank causes.
#
# Metrics analyzed:
# - PSI (Pressure Stall Information) memory metrics
# - kswapd activity (page reclaim)
# - Direct reclaim events
# - Low memory killer activity
# - Memory allocation stalls
#
# Usage: Called by jank_frame_detail or standalone for memory investigation

name: memory_pressure_in_range
type: atomic
version: "1.0.0"
description: |
  Analyze memory pressure indicators during a specific time range.
  Detects PSI metrics, kswapd activity, direct reclaim, and LMK events
  that may contribute to jank or performance issues.

category: memory
tier: A
tags:
  - memory
  - pressure
  - psi
  - kswapd
  - reclaim
  - lmk
  - range_based

process_scope:
  role: global_context
  limitations:
    - Memory pressure events are system context; package does not restrict these aggregates to target-process stalls.

inputs:
  - name: start_ts
    type: number
    required: true
    description: Start timestamp in nanoseconds
  - name: end_ts
    type: number
    required: true
    description: End timestamp in nanoseconds
  - name: package
    type: string
    required: false
    description: Package name to filter (optional)

steps:
  - id: memory_pressure_analysis
    type: atomic
    description: Analyze memory pressure indicators in the given time range
    optional: true
    sql: |
      -- Memory Pressure Analysis
      --
      -- Analyzes multiple sources of memory pressure:
      -- 1. PSI (Pressure Stall Information) - if available
      -- 2. kswapd page scanning/reclaim
      -- 3. Direct reclaim events
      -- 4. Compaction activity
      -- 5. LMK (Low Memory Killer) events

      WITH params AS (
        SELECT
          ${start_ts} AS start_ts,
          ${end_ts} AS end_ts,
          '${package}' AS package_filter
      ),

      -- Closed spans intersect the half-open window. Unknown ends remain NULL;
      -- instantaneous events belong to the window containing their timestamp.
      range_slices AS (
        SELECT s.*, s.dur AS raw_dur,
          CASE WHEN s.dur >= 0 THEN
            MIN(s.ts + s.dur, p.end_ts) - MAX(s.ts, p.start_ts)
          END AS clipped_dur
        FROM slice s CROSS JOIN params p
        WHERE p.end_ts > p.start_ts AND s.ts < p.end_ts
          AND (s.dur < 0 OR s.ts + s.dur > p.start_ts
            OR (s.dur = 0 AND s.ts >= p.start_ts))
      ),

      -- PSI values are source samples, not integrated stall duration.
      psi_memory AS (
        SELECT
          'psi_memory' AS source,
          c.ts,
          c.value,
          c.track_id,
          t.name AS metric_name
        FROM counter c
        JOIN counter_track t ON c.track_id = t.id
        CROSS JOIN params p
        WHERE (t.name LIKE 'mem.%psi%' OR t.name LIKE '%memory_pressure%')
          AND c.ts >= p.start_ts
          AND c.ts < p.end_ts
      ),

      psi_summary AS (
        SELECT
          CASE WHEN COUNT(DISTINCT track_id) = 1 THEN MAX(value) END AS max_psi_value,
          CASE WHEN COUNT(DISTINCT track_id) = 1 THEN AVG(value) END AS avg_psi_value,
          COUNT(*) AS psi_sample_count,
          COUNT(DISTINCT track_id) AS psi_metric_count,
          GROUP_CONCAT(DISTINCT metric_name) AS psi_metric_names
        FROM psi_memory
      ),

      -- kswapd activity (page reclaim daemon)
      kswapd_slices AS (
        SELECT
          s.id AS slice_id,
          s.ts,
          s.clipped_dur AS dur,
          s.raw_dur,
          s.name
        FROM range_slices s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        WHERE t.name LIKE 'kswapd%'
          AND (s.raw_dur > 0 OR s.raw_dur < 0)
      ),

      kswapd_summary AS (
        SELECT
          COUNT(*) AS kswapd_event_count,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE SUM(dur) END AS kswapd_total_dur_ns,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(dur) END AS kswapd_max_dur_ns,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE AVG(dur) END AS kswapd_avg_dur_ns
        FROM kswapd_slices
      ),

      -- Direct reclaim events (synchronous memory allocation stalls)
      direct_reclaim AS (
        SELECT
          s.id AS slice_id,
          s.ts,
          s.clipped_dur AS dur,
          s.raw_dur,
          s.name,
          t.name AS thread_name
        FROM range_slices s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        WHERE (s.name LIKE '%direct_reclaim%' OR s.name LIKE '%reclaim%alloc%')
      ),

      direct_reclaim_summary AS (
        SELECT
          COUNT(*) AS direct_reclaim_count,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE SUM(dur) END AS direct_reclaim_total_ns,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(dur) END AS direct_reclaim_max_ns
        FROM direct_reclaim
      ),

      -- Memory compaction events
      compaction_events AS (
        SELECT
          s.id AS slice_id,
          s.ts,
          s.clipped_dur AS dur,
          s.raw_dur,
          s.name
        FROM range_slices s
        WHERE s.name LIKE '%compact%'
      ),

      compaction_summary AS (
        SELECT
          COUNT(*) AS compaction_count,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE SUM(dur) END AS compaction_total_ns
        FROM compaction_events
      ),

      -- LMK (Low Memory Killer) events
      lmk_events AS (
        SELECT
          s.id AS slice_id,
          s.ts,
          s.clipped_dur AS dur,
          s.raw_dur,
          s.name
        FROM range_slices s
        WHERE (name LIKE '%lowmemory%' OR name LIKE '%lmkd%' OR name LIKE '%oom_adj%')
      ),

      lmk_summary AS (
        SELECT
          COUNT(*) AS lmk_event_count,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE SUM(dur) END AS lmk_total_ns
        FROM lmk_events
      ),

      -- Memory allocation stalls (blocked allocations)
      alloc_stalls AS (
        SELECT
          s.id AS slice_id,
          s.ts,
          s.clipped_dur AS dur,
          s.raw_dur,
          s.name,
          t.name AS thread_name,
          p2.name AS process_name
        FROM range_slices s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        JOIN process p2 ON t.upid = p2.upid
        WHERE (s.name LIKE '%alloc_pages%' OR s.name LIKE '%page_alloc%')
          AND (s.raw_dur > 1000000 OR s.raw_dur < 0)  -- > 1ms original span or unknown end
      ),

      alloc_stall_summary AS (
        SELECT
          COUNT(*) AS alloc_stall_count,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE SUM(dur) END AS alloc_stall_total_ns,
          CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(dur) END AS alloc_stall_max_ns
        FROM alloc_stalls
      ),

      censored_events AS (
        SELECT slice_id FROM kswapd_slices WHERE raw_dur < 0
        UNION SELECT slice_id FROM direct_reclaim WHERE raw_dur < 0
        UNION SELECT slice_id FROM compaction_events WHERE raw_dur < 0
        UNION SELECT slice_id FROM lmk_events WHERE raw_dur < 0
        UNION SELECT slice_id FROM alloc_stalls WHERE raw_dur < 0
      ),

      -- Page cache activity (mm_filemap_add_to_page_cache = cache miss → disk read)
      page_cache_adds AS (
        SELECT COUNT(*) AS add_count
        FROM raw r
        CROSS JOIN params p
        WHERE r.name = 'mm_filemap_add_to_page_cache'
          AND r.ts >= p.start_ts
          AND r.ts < p.end_ts
      ),

      -- Page cache evictions (mm_filemap_delete_from_page_cache = page evicted)
      page_cache_deletes AS (
        SELECT COUNT(*) AS delete_count
        FROM raw r
        CROSS JOIN params p
        WHERE r.name = 'mm_filemap_delete_from_page_cache'
          AND r.ts >= p.start_ts
          AND r.ts < p.end_ts
      ),

      -- Calculate overall pressure score
      pressure_score AS (
        SELECT
          -- Weight factors for different pressure indicators
          CASE
            WHEN (SELECT kswapd_event_count FROM kswapd_summary) > 10 THEN 30
            WHEN (SELECT kswapd_event_count FROM kswapd_summary) > 3 THEN 15
            WHEN (SELECT kswapd_event_count FROM kswapd_summary) > 0 THEN 5
            ELSE 0
          END +
          CASE
            WHEN (SELECT direct_reclaim_count FROM direct_reclaim_summary) > 5 THEN 40
            WHEN (SELECT direct_reclaim_count FROM direct_reclaim_summary) > 1 THEN 20
            WHEN (SELECT direct_reclaim_count FROM direct_reclaim_summary) > 0 THEN 10
            ELSE 0
          END +
          CASE
            WHEN (SELECT lmk_event_count FROM lmk_summary) > 0 THEN 30
            ELSE 0
          END +
          CASE
            WHEN (SELECT alloc_stall_count FROM alloc_stall_summary) > 3 THEN 20
            WHEN (SELECT alloc_stall_count FROM alloc_stall_summary) > 0 THEN 10
            ELSE 0
          END +
          CASE
            WHEN (SELECT delete_count FROM page_cache_deletes) > 100 THEN 15
            WHEN (SELECT delete_count FROM page_cache_deletes) > 10 THEN 5
            ELSE 0
          END AS score
      )

      SELECT
        -- kswapd metrics
        (SELECT kswapd_event_count FROM kswapd_summary) AS kswapd_events,
        ROUND((SELECT kswapd_total_dur_ns FROM kswapd_summary) / 1000000.0, 2) AS kswapd_total_ms,
        ROUND((SELECT kswapd_max_dur_ns FROM kswapd_summary) / 1000000.0, 2) AS kswapd_max_ms,

        -- Direct reclaim metrics
        (SELECT direct_reclaim_count FROM direct_reclaim_summary) AS direct_reclaim_events,
        ROUND((SELECT direct_reclaim_total_ns FROM direct_reclaim_summary) / 1000000.0, 2) AS direct_reclaim_total_ms,
        ROUND((SELECT direct_reclaim_max_ns FROM direct_reclaim_summary) / 1000000.0, 2) AS direct_reclaim_max_ms,

        -- Compaction metrics
        (SELECT compaction_count FROM compaction_summary) AS compaction_events,
        ROUND((SELECT compaction_total_ns FROM compaction_summary) / 1000000.0, 2) AS compaction_total_ms,

        -- LMK metrics
        (SELECT lmk_event_count FROM lmk_summary) AS lmk_events,

        -- Allocation stall metrics
        (SELECT alloc_stall_count FROM alloc_stall_summary) AS alloc_stall_events,
        ROUND((SELECT alloc_stall_max_ns FROM alloc_stall_summary) / 1000000.0, 2) AS alloc_stall_max_ms,

        -- Page cache activity
        (SELECT add_count FROM page_cache_adds) AS page_cache_add_events,
        (SELECT delete_count FROM page_cache_deletes) AS page_cache_delete_events,

        -- PSI metrics (if available)
        (SELECT max_psi_value FROM psi_summary) AS psi_max,
        (SELECT avg_psi_value FROM psi_summary) AS psi_avg,
        (SELECT psi_sample_count FROM psi_summary) AS psi_sample_count,
        (SELECT psi_metric_count FROM psi_summary) AS psi_metric_count,
        (SELECT psi_metric_names FROM psi_summary) AS psi_metric_names,
        'single_track_sample_mean_not_time_weighted;_multiple_tracks_not_combined' AS psi_aggregation_basis,
        (SELECT COUNT(*) FROM censored_events) AS censored_event_count,
        'clipped_completed_slices;_unknown_ends_excluded;_sum_may_overlap' AS duration_basis,
        'heuristic_event_score_not_proof_of_stall_causality_or_absence' AS pressure_basis,

        -- Overall pressure assessment
        (SELECT score FROM pressure_score) AS pressure_score,
        CASE
          WHEN (SELECT score FROM pressure_score) >= 70 THEN 'critical'
          WHEN (SELECT score FROM pressure_score) >= 40 THEN 'high'
          WHEN (SELECT score FROM pressure_score) >= 15 THEN 'moderate'
          WHEN (SELECT score FROM pressure_score) > 0 THEN 'low'
          ELSE 'none'
        END AS pressure_level,

        -- Time range info
        (SELECT end_ts - start_ts FROM params) / 1000000.0 AS range_duration_ms

    display:
      level: detail
      title: "Memory Pressure Analysis"
      columns:
        - {name: psi_max, type: number, description: Maximum sample value from a single PSI track}
        - {name: psi_avg, type: number, description: Arithmetic sample mean from a single PSI track}
        - {name: psi_sample_count, type: number}
        - {name: psi_metric_count, type: number}
        - {name: psi_metric_names, type: string}
        - {name: psi_aggregation_basis, type: string}
        - {name: censored_event_count, type: number}
        - {name: duration_basis, type: string}
        - {name: pressure_basis, type: string}
        - name: pressure_level
          type: string
          description: Overall pressure level (none/low/moderate/high/critical)
        - name: pressure_score
          type: number
          description: Heuristic weighted event score; not a calibrated probability
        - name: kswapd_events
          type: number
          description: Number of kswapd activities
        - name: kswapd_total_ms
          type: duration
          format: duration_ms
          description: Total kswapd activity time
        - name: direct_reclaim_events
          type: number
          description: Number of direct reclaim events
        - name: direct_reclaim_max_ms
          type: duration
          format: duration_ms
          description: Max direct reclaim duration
        - name: lmk_events
          type: number
          description: Number of LMK events
        - name: alloc_stall_events
          type: number
          description: Number of allocation stalls
        - name: page_cache_add_events
          type: number
          description: Page cache adds (mm_filemap_add_to_page_cache = cache miss, disk read)
        - name: page_cache_delete_events
          type: number
          description: Page cache evictions (mm_filemap_delete_from_page_cache = memory pressure)
