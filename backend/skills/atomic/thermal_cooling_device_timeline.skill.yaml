# =============================================================================
# Thermal Cooling Device Timeline
# =============================================================================
# Kernel cooling-device state from ftrace thermal/cdev_update.
#
# A non-zero target state is direct evidence that the KERNEL thermal framework
# asked a cooling device to mitigate. It is the strongest available signal that
# a frequency limit is thermally driven — but only when it overlaps an actual
# limit episode, and only for the policy the device really governs, which the
# event does not state.
#
# The absence of these tracks is NOT the absence of throttling. Many Qualcomm
# builds run a userspace thermal daemon that writes the cpufreq sysfs limits
# directly and never emits cdev_update at all.
# =============================================================================

name: thermal_cooling_device_timeline
version: "1.0"
type: atomic
category: thermal
tier: B

meta:
  display_name: "散热设备状态时间线"
  description: "读取内核 cooling device 目标状态的区段与转换；缺失不等于未发生热控"
  icon: "ac_unit"
  tags: [thermal, cooling, cdev, kernel, evidence]

triggers:
  keywords:
    zh: [散热设备, 冷却设备, cooling device, 热控状态]
    en: [cooling device, cdev, thermal cooling state]
  patterns:
    - ".*(散热|冷却).*设备.*"
    - ".*cooling.*device.*"

prerequisites:
  required_tables:
    - counter_track
    - counter
  modules:
    - linux.cpu.frequency

process_scope:
  role: global_context

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns)；缺省使用观测数据起点"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns)；缺省使用 trace 数据终点"
  - name: max_transitions
    type: number
    required: false
    default: 200
    description: "返回的状态转换行数上限"

steps:
  - id: cooling_data_check
    type: atomic
    name: "散热设备数据检测"
    process_scope:
      role: global_context
    display: false
    sql: |
      SELECT
        CASE WHEN EXISTS (
          SELECT 1 FROM counter_track WHERE type = 'cooling_device_counter'
        ) THEN 1 ELSE 0 END AS has_cdev_data,
        (SELECT COUNT(*) FROM counter_track WHERE type = 'cooling_device_counter') AS cdev_track_count
    save_as: cooling_data_check

  - id: cooling_summary
    type: atomic
    name: "散热设备概览"
    condition: "cooling_data_check.data?.[0]?.has_cdev_data === 1"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/thermal_cooling_spans.sql
    investigation_evidence:
      window: {start: window_start_ts, end: window_end_ts}
      context: {window_id: window_id}
      metrics:
        - domain: thermal
          aggregation: window_time_weighted
          metric_id: system.thermal.cooling_state.time_weighted
          value: mean_state
          unit: state
          status: cooling_evidence
          coverage: covered_ns
          denominator: window_dur_ns
        - domain: thermal
          metric_id: system.thermal.cooling_active.duration
          value: active_ns
          unit: ns
          status: cooling_evidence
          coverage: covered_ns
          denominator: window_dur_ns
    display:
      level: summary
      layer: overview
      title: "散热设备状态概览"
      columns:
        - {name: window_id, label: "window_id", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_dur_ns, label: "窗口时长", type: duration, unit: ns}
        - {name: cdev_name, label: "散热设备", type: string}
        - {name: cdev_kind_hint, label: "疑似作用域", type: string}
        - {name: cdev_kind_basis, label: "判定依据", type: string}
        - {name: max_state, label: "最高档位", type: number}
        - {name: min_state, label: "最低档位", type: number}
        - {name: mean_state, label: "时间加权均值", type: number}
        - {name: transition_count, label: "状态转换数", type: number}
        - {name: active_ns, label: "非零档位时长", type: duration, unit: ns}
        - {name: active_pct, label: "非零档位占比", type: percentage}
        - {name: first_ts, label: "首个样本", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: last_ts, label: "最后样本", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: covered_ns, label: "覆盖时长", type: duration, unit: ns}
        - {name: cooling_evidence, label: "散热证据", type: string}
        - {name: cooling_source, label: "数据来源", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    sql: |
      WITH data_start AS (
        SELECT MIN(x) AS ts FROM (
          SELECT MIN(ts) AS x FROM sched_slice
          UNION ALL
          SELECT MIN(c.ts) FROM counter c JOIN counter_track t ON c.track_id = t.id
            WHERE t.type = 'cooling_device_counter'
        )
      ),
      system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${start_ts}, (SELECT ts FROM data_start), (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      )
      SELECT s.window_id, s.window_start_ts, s.window_end_ts,
        s.window_end_ts - s.window_start_ts AS window_dur_ns,
        s.cdev_name, MAX(s.cdev_kind_hint) AS cdev_kind_hint, MAX(s.cdev_kind_basis) AS cdev_kind_basis,
        MAX(s.state) AS max_state, MIN(s.state) AS min_state,
        ROUND(SUM(s.state * 1.0 * s.dur_ns) / NULLIF(SUM(s.dur_ns), 0), 2) AS mean_state,
        SUM(CASE WHEN s.direction IN ('tightened', 'relaxed') THEN 1 ELSE 0 END) AS transition_count,
        SUM(CASE WHEN s.is_cooling_active THEN s.dur_ns ELSE 0 END) AS active_ns,
        ROUND(100.0 * SUM(CASE WHEN s.is_cooling_active THEN s.dur_ns ELSE 0 END)
          / NULLIF(s.window_end_ts - s.window_start_ts, 0), 2) AS active_pct,
        MIN(s.raw_start_ts) AS first_ts, MAX(s.raw_start_ts) AS last_ts,
        SUM(s.dur_ns) AS covered_ns,
        CASE
          WHEN SUM(s.dur_ns) IS NULL THEN 'unavailable'
          WHEN SUM(s.dur_ns) < s.window_end_ts - s.window_start_ts THEN 'partial'
          ELSE 'observed'
        END AS cooling_evidence,
        MAX(s.cooling_source) AS cooling_source,
        'observation_not_causal' AS evidence_scope
      FROM thermal_cooling_spans s
      WHERE s.dur_ns > 0
      GROUP BY s.window_id, s.window_start_ts, s.window_end_ts, s.cdev_name
      ORDER BY active_ns DESC, max_state DESC
    save_as: cooling_summary

  - id: cooling_transitions
    type: atomic
    name: "散热设备状态转换"
    condition: "cooling_data_check.data?.[0]?.has_cdev_data === 1"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/thermal_cooling_spans.sql
    display:
      level: detail
      layer: list
      title: "散热设备状态转换"
      columns:
        - {name: ts, label: "时间", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: cdev_name, label: "散热设备", type: string}
        - {name: cdev_kind_hint, label: "疑似作用域", type: string}
        - {name: prev_state, label: "变更前", type: number}
        - {name: state, label: "变更后", type: number}
        - {name: direction, label: "方向", type: string}
        - {name: dur_ns, label: "保持时长", type: duration, unit: ns}
        - {name: cooling_source, label: "数据来源", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "窗口内没有散热设备状态转换。"
    sql: |
      WITH data_start AS (
        SELECT MIN(x) AS ts FROM (
          SELECT MIN(ts) AS x FROM sched_slice
          UNION ALL
          SELECT MIN(c.ts) FROM counter c JOIN counter_track t ON c.track_id = t.id
            WHERE t.type = 'cooling_device_counter'
        )
      ),
      system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${start_ts}, (SELECT ts FROM data_start), (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      )
      SELECT s.raw_start_ts AS ts, s.cdev_name, s.cdev_kind_hint,
        s.prev_state, s.state, s.direction, s.dur_ns, s.cooling_source,
        'observation_not_causal' AS evidence_scope
      FROM thermal_cooling_spans s
      WHERE s.raw_start_ts >= s.window_start_ts AND s.raw_start_ts < s.window_end_ts
        AND s.direction IN ('tightened', 'relaxed', 'first_observed_sample')
      ORDER BY s.raw_start_ts
      LIMIT ${max_transitions|200}
    save_as: cooling_transitions

  - id: cooling_unavailable
    type: atomic
    name: "无散热设备数据"
    condition: "cooling_data_check.data?.[0]?.has_cdev_data !== 1"
    process_scope:
      role: global_context
    display:
      level: summary
      layer: overview
      title: "无内核散热设备数据"
      columns:
        - {name: cooling_evidence, label: "散热证据", type: string}
        - {name: required_ftrace_event, label: "需要采集的 ftrace 事件", type: string}
        - {name: message, label: "说明", type: string}
    sql: |
      SELECT
        'unavailable' AS cooling_evidence,
        'thermal/cdev_update' AS required_ftrace_event,
        'Trace 中没有内核 cooling device 轨道，不能据此判断是否发生热控：不少 Qualcomm 平台由用户态 thermal daemon 直接写 cpufreq sysfs 的频率上限，不产生 cdev_update 事件。请改用限频轨道与热控守护进程活动进行判断，或在采集配置中加入 thermal/cdev_update。' AS message
    save_as: cooling_unavailable

output:
  format: layered
  default_expanded: [cooling_summary]
