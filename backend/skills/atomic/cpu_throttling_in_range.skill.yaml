# =============================================================================
# CPU 热控限频分析 (Composite Skill)
# =============================================================================
# 分析指定时间范围内是否发生 CPU 热控限频
# 检测因温度过高导致的 CPU 降频
#
# v2.0: 复用 cpu_topology_view 提供的 _cpu_topology 视图
#   - 移除内联拓扑 CTE，改用 JOIN _cpu_topology
#   - 支持 prime/big/medium/little 四级分类
#   - 修复 FIRST_VALUE/LAST_VALUE + GROUP BY 未定义行为
#   - 改用子查询获取区间首尾频率
#
# v2.1: throttle_detection 每个拓扑类别一行（超大核/大核/中核/小核/未知，与
#   cpu_topology_detection 的 cluster_type_cn 一致），unknown 不再算作小核。
#   类别不是 cpufreq policy。跨度按单条 cpufreq 轨道计算后取类别最大值，无时间方向；
#   NULL / <= 0 的采样不是频率。限频证据列是整窗证据，不说明本行核心受限。

name: cpu_throttling_in_range
version: "2.1"
type: composite
category: thermal
tier: B

meta:
  display_name: "CPU 限频检测"
  description: "观测 CPU 频率变化；频率跨度不能独立证明热控限频"
  icon: "thermostat"
  tags: [cpu, thermal, throttling, composite]

inputs:
  - name: start_ts
    type: timestamp
    required: true
    description: "分析起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "分析结束时间戳(ns)"

steps:
  # Step 0: direct limit evidence. Observed frequency span cannot tell a cap
  # from an idle workload; the cpufreq policy limit track can. When it exists,
  # throttle_detected stops being NULL.
  - id: limit_evidence
    type: atomic
    name: "限频证据"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_freq_limit_spans.sql
      - fragments/system_cpu_freq_limit_episodes.sql
    display:
      level: summary
      layer: overview
      title: "限频证据（cpufreq policy 上限）"
      columns:
        - {name: has_limit_track, label: "有限频轨道", type: boolean}
        - {name: has_max_limit_data, label: "有有效上限样本", type: boolean}
        - {name: episode_count, label: "限频区段数", type: number}
        - {name: policy_count, label: "涉及 policy 数", type: number}
        - {name: deepest_depth_pct, label: "最大限频深度", type: percentage}
        - {name: min_limit_khz, label: "最低上限", type: number}
        - {name: reference_max_limit_khz, label: "参考上限", type: number}
        - {name: reference_basis, label: "参考依据", type: string}
        - {name: evidence_status, label: "证据状态", type: string}
        - {name: limit_evidence_missing_reason, label: "缺失原因", type: string}
        - {name: next_step, label: "下一步", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    sql: |
      WITH system_windows AS (
        SELECT 0 AS window_id, ${start_ts} AS window_start_ts, ${end_ts} AS window_end_ts
      )
      -- Limit evidence needs at least one VALID max-limit sample. An empty or
      -- invalid-only max track, or a min-only capture, is missing evidence and
      -- must never read as "no limit episode in range".
      SELECT
        CASE WHEN ds.max_limit_track_count > 0 THEN 1 ELSE 0 END AS has_limit_track,
        ds.has_max_limit_data,
        e.episode_count, e.policy_count, e.deepest_depth_pct,
        e.min_limit_khz, e.reference_max_limit_khz, e.reference_basis,
        CASE
          WHEN ds.has_max_limit_data = 0 THEN 'limit_track_unavailable'
          WHEN e.episode_count > 0 THEN 'freq_limit_observed'
          ELSE 'no_limit_episode_in_range'
        END AS evidence_status,
        ds.limit_evidence_missing_reason,
        '用 cpu_frequency_limit_attribution 判断触发方与限频前负载' AS next_step,
        'observation_not_causal' AS evidence_scope
      FROM system_cpu_freq_limit_data_status ds
      CROSS JOIN (
        SELECT COUNT(*) AS episode_count,
          COUNT(DISTINCT policy_cpu) AS policy_count,
          ROUND(MAX(depth_pct), 1) AS deepest_depth_pct,
          MIN(min_limit_khz) AS min_limit_khz,
          MAX(reference_max_limit_khz) AS reference_max_limit_khz,
          MAX(reference_basis) AS reference_basis
        FROM system_cpu_freq_limit_episodes
      ) e
    save_as: limit_evidence

  # Step 1: 初始化 CPU 拓扑视图（供后续步骤 JOIN）
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # Step 2: 限频检测（复用 _cpu_topology 视图）
  - id: throttle_detection
    type: atomic
    process_scope:
      role: global_context
    name: "热控限频检测"
    display:
      level: detail
      layer: deep
      title: "热控限频"
      columns:
        - name: core_type
          label: "核心类别"
          type: string
        - name: start_freq_mhz
          label: "窗口内首采样均值"
          type: number
        - name: end_freq_mhz
          label: "窗口内末采样均值"
          type: number
        - name: min_freq_mhz
          label: "类别最低频率"
          type: number
        - name: max_freq_mhz
          label: "类别最高频率"
          type: number
        - name: freq_drop_pct
          label: "单轨最大频率跨度"
          type: percentage
          format: percentage
        - name: frequency_variation_detected
          label: "单轨跨度超 30%"
          type: boolean
        - name: evidence_status
          label: "热原因证据"
          type: string
        - name: interpretation
          label: "解释"
          type: string
        - name: throttle_detected
          label: "已核验热控限频"
          type: boolean
    sql: |
      WITH
      -- 上一步的限频证据读一次，供下面的判定复用
      limit_status AS (
        SELECT '${limit_evidence.data[0].evidence_status}' AS status,
          ${limit_evidence.data[0].deepest_depth_pct|0} AS depth_pct
      ),
      -- 频率采样（带拓扑分类）；NULL 或 <= 0 不是频率，保留为 NULL。拓扑未收录的
      -- CPU（如无 sched 时只有 0 值的核）也保留，归为 unknown
      freq_samples AS (
        SELECT
          COALESCE(ct.core_type, 'unknown') AS core_type,
          t.id AS track_id,
          c.ts,
          CASE WHEN c.value > 0 THEN c.value / 1000.0 END AS freq_mhz
        FROM counter c
        JOIN cpu_counter_track t ON c.track_id = t.id
        LEFT JOIN _cpu_topology ct ON t.cpu = ct.cpu_id
        WHERE t.name = 'cpufreq'
          AND c.ts >= ${start_ts} AND c.ts < ${end_ts}
      ),
      -- 每条 cpufreq 轨道的窗口内统计（子查询取首末有效采样，避免 window + GROUP BY 问题）
      per_track_stats AS (
        SELECT
          core_type,
          track_id,
          MIN(freq_mhz) AS min_freq,
          MAX(freq_mhz) AS max_freq,
          (SELECT fs2.freq_mhz FROM freq_samples fs2
           WHERE fs2.track_id = fs.track_id AND fs2.freq_mhz IS NOT NULL
           ORDER BY fs2.ts ASC LIMIT 1) AS start_freq,
          (SELECT fs2.freq_mhz FROM freq_samples fs2
           WHERE fs2.track_id = fs.track_id AND fs2.freq_mhz IS NOT NULL
           ORDER BY fs2.ts DESC LIMIT 1) AS end_freq
        FROM freq_samples fs
        GROUP BY core_type, track_id
      ),
      -- 按拓扑类别聚合；跨度只在单条轨道内算
      per_tier_stats AS (
        SELECT
          CASE core_type
            WHEN 'prime' THEN '超大核'
            WHEN 'big' THEN '大核'
            WHEN 'medium' THEN '中核'
            WHEN 'little' THEN '小核'
            ELSE '未知'
          END AS tier_label,
          CASE core_type
            WHEN 'prime' THEN 1
            WHEN 'big' THEN 2
            WHEN 'medium' THEN 3
            WHEN 'little' THEN 4
            ELSE 5
          END AS tier_rank,
          AVG(start_freq) AS start_freq,
          AVG(end_freq) AS end_freq,
          MIN(min_freq) AS min_freq,
          MAX(max_freq) AS max_freq,
          MAX(100.0 * (max_freq - min_freq) / max_freq) AS span_pct,
          -- 比较在无有效采样时为 NULL，MAX 忽略 NULL
          MAX(min_freq < max_freq * 0.7) AS span_over_threshold,
          COUNT(*) AS track_count,
          COUNT(max_freq) AS measured_track_count
        FROM per_track_stats
        GROUP BY core_type
      )
      SELECT
        tier_label AS core_type,
        ROUND(start_freq, 0) AS start_freq_mhz,
        ROUND(end_freq, 0) AS end_freq_mhz,
        ROUND(min_freq, 0) AS min_freq_mhz,
        ROUND(max_freq, 0) AS max_freq_mhz,
        ROUND(span_pct, 1) AS freq_drop_pct,
        span_over_threshold AS frequency_variation_detected,
        -- Only the cpufreq policy limit track can turn this from unknown into
        -- a fact; an observed frequency span never can.
        CASE status WHEN 'freq_limit_observed' THEN 1
          WHEN 'no_limit_episode_in_range' THEN 0 END AS throttle_detected,
        CASE WHEN status = 'freq_limit_observed'
          THEN 'freq_limit_observed' ELSE 'thermal_evidence_missing' END AS evidence_status,
        CASE WHEN tier_rank = 5
          THEN '核心类别未知：拓扑信息不足以可靠分级（如缺少完整 CPU capacity 元数据、单一均匀簇或多机器/元数据歧义），此行汇总这些核心的 cpufreq 轨道，不代表小核。'
          ELSE '' END ||
        CASE WHEN measured_track_count = 0 THEN '窗口内无有效频率采样，无法计算频率跨度。'
          WHEN measured_track_count < track_count THEN '部分 cpufreq 轨道窗口内无有效频率采样，跨度只覆盖有采样的轨道。'
          ELSE '' END ||
        CASE WHEN status = 'freq_limit_observed'
          THEN '区间内观测到 cpufreq policy 上限被下调（最大深度 ' || depth_pct || '%）：限频确实发生；这是整窗证据，不说明本行核心受限，触发方仍需用 cpu_frequency_limit_attribution 判定'
          ELSE '频率变化可能来自负载下降或空闲 DVFS；需直接限频证据与同窗口负载才能确定热控原因' END ||
        '（首末为各 cpufreq 轨道窗口内首末采样均值，非窗口边界值；最低/最高为本类别包络，可能来自不同核心）' AS interpretation
      FROM per_tier_stats
      CROSS JOIN limit_status
      ORDER BY tier_rank
    save_as: throttle_data

output:
  format: structured
