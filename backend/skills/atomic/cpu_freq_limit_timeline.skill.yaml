# =============================================================================
# CPU Frequency Limit Timeline
# =============================================================================
# Direct cpufreq policy limit evidence from the typed tracks produced by the
# ftrace event power/cpu_frequency_limits. This is the only signal in a normal
# Android trace that states a limit was APPLIED, as opposed to an observed
# frequency that merely happens to be low.
#
# Three boundaries are kept explicit everywhere:
#   - The first sample of a track is the first CHANGE seen. The state before it
#     is unknown; it is never "unlimited".
#   - The reference used for depth is the maximum max-limit observed IN THIS
#     TRACE, not the hardware or OPP-table maximum.
#   - A limit says nothing about why it was applied. Attribution needs
#     cpu_frequency_limit_attribution.
#
# Two independent gates:
#   1. Max-limit analysis (overview aggregates, capped episodes) needs at least
#      one VALID max-limit sample; otherwise limit_unavailable reports
#      LIMIT_EVIDENCE_MISSING with max_limit_not_captured /
#      max_limit_samples_missing.
#   2. limit_events lists every max and min sample whenever any exists, valid
#      or not. Validity, direction and episode membership come from the shared
#      fragments; min-limit events are non-trigger facts.
# =============================================================================

name: cpu_freq_limit_timeline
version: "1.0"
type: atomic
category: cpu
tier: B

meta:
  display_name: "CPU 限频时间线"
  description: "从 cpufreq policy 限频轨道读取限频概览、去抖动限频区段与逐次限频变更事件"
  icon: "speed"
  tags: [cpu, frequency, limit, cpufreq, thermal, evidence]

triggers:
  keywords:
    zh: [限频时间线, 限频事件, 频率上限, cpufreq 限制]
    en: [frequency limit timeline, cpufreq limit, max freq limit]
  patterns:
    - ".*(限频|频率上限).*(时间线|事件|区段).*"
    - ".*cpufreq.*limit.*"

prerequisites:
  required_tables:
    - cpu_counter_track
    - counter
  modules:
    - linux.cpu.frequency

process_scope:
  role: global_context

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns)；缺省使用观测数据起点"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns)；缺省使用 trace 数据终点"
  - name: episode_drop_pct
    type: number
    required: false
    default: 10
    description: "判定限频区段的降幅阈值（相对本 trace 观测到的最大上限，%）"
  - name: merge_gap_ms
    type: number
    required: false
    default: 500
    description: "限频区段合并间隔（ms）；内核调控器高频改写上限，短间隔属同一次限频"

steps:
  - id: limit_data_check
    type: atomic
    name: "限频数据检测"
    process_scope:
      role: global_context
    display: false
    sql_fragments:
      - fragments/system_cpu_freq_limit_spans.sql
    sql: |
      SELECT
        CASE WHEN ds.max_limit_track_count > 0 THEN 1 ELSE 0 END AS has_max_limit_track,
        CASE WHEN ds.min_limit_track_count > 0 THEN 1 ELSE 0 END AS has_min_limit_track,
        ds.max_limit_track_count + ds.min_limit_track_count AS limit_track_count,
        ds.has_max_limit_data,
        ds.has_any_limit_sample,
        ds.valid_max_sample_count,
        ds.invalid_max_sample_count,
        ds.invalid_min_sample_count,
        ds.limit_evidence_missing_reason
      FROM system_cpu_freq_limit_data_status ds
    save_as: limit_data_check

  - id: limit_summary
    type: atomic
    name: "限频概览"
    condition: "limit_data_check.data?.[0]?.has_max_limit_data === 1"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_freq_limit_spans.sql
    investigation_evidence:
      window: {start: window_start_ts, end: window_end_ts}
      identity: {cpu: policy_cpu, ucpu: ucpu, machine_id: machine_id}
      context: {window_id: window_id}
      metrics:
        - domain: cpu_frequency
          aggregation: window_time_weighted
          metric_id: system.cpu.frequency_limit.time_weighted
          value: avg_limit_khz
          unit: kHz
          status: limit_evidence
          coverage: limit_covered_ns
          denominator: window_dur_ns
    display:
      level: summary
      layer: overview
      title: "CPU 限频概览（按 cpufreq policy）"
      columns:
        - {name: window_id, label: "window_id", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_dur_ns, label: "窗口时长", type: duration, unit: ns}
        - {name: policy_cpu, label: "policy 首核", type: number}
        - {name: ucpu, label: "ucpu", type: number, hidden: true}
        - {name: machine_id, label: "machine_id", type: number, hidden: true}
        - {name: core_type, label: "核心类型", type: string}
        - {name: topology_source, label: "拓扑来源", type: string}
        - {name: kind, label: "限制类型", type: string}
        - {name: avg_limit_khz, label: "时间加权均值", type: number}
        - {name: min_limit_khz, label: "最低上限", type: number}
        - {name: max_limit_khz, label: "最高上限", type: number}
        - {name: reference_max_limit_khz, label: "参考上限", type: number}
        - {name: reference_basis, label: "参考依据", type: string}
        - {name: sample_count, label: "变更次数", type: number}
        - {name: first_sample_ts, label: "首个变更", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: last_sample_ts, label: "最后变更", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: pre_first_sample_ns, label: "首样本前未知时长", type: duration, unit: ns}
        - {name: first_sample_state_unknown, label: "首样本前状态未知", type: string}
        - {name: limit_covered_ns, label: "限频覆盖", type: duration, unit: ns}
        - {name: limit_evidence, label: "限频证据", type: string}
        - {name: invalid_sample_count, label: "无效样本数", type: number}
        - {name: invalid_limit_ns, label: "无效样本时长", type: duration, unit: ns}
        - {name: data_quality_note, label: "数据质量", type: string}
        - {name: limit_source, label: "数据来源", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    sql: |
      WITH data_start AS (
        SELECT MIN(x) AS ts FROM (
          SELECT MIN(ts) AS x FROM sched_slice
          UNION ALL
          SELECT MIN(c.ts) FROM counter c JOIN cpu_counter_track t ON c.track_id = t.id
            WHERE t.type IN ('cpu_max_frequency_limit', 'cpu_min_frequency_limit')
        )
      ),
      system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${start_ts}, (SELECT ts FROM data_start), (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      )
      SELECT a.window_id, a.window_start_ts, a.window_end_ts, a.window_dur_ns,
        a.policy_cpu, a.ucpu, a.machine_id, a.core_type, a.topology_source, a.kind,
        CAST(ROUND(a.valid_weighted_khz_ns / NULLIF(a.valid_dur_ns, 0)) AS INTEGER) AS avg_limit_khz,
        a.min_limit_khz, a.max_limit_khz, a.reference_max_limit_khz, a.reference_basis,
        a.sample_count, a.first_sample_ts, a.last_sample_ts,
        MAX(0, a.first_sample_ts - a.window_start_ts) AS pre_first_sample_ns,
        CASE WHEN a.first_sample_ts > a.window_start_ts
          THEN 'state_before_first_change_is_unknown_not_unlimited'
          ELSE 'window_starts_inside_observed_limit_state' END AS first_sample_state_unknown,
        COALESCE(a.valid_dur_ns, 0) AS limit_covered_ns,
        CASE
          WHEN COALESCE(a.valid_dur_ns, 0) = 0 THEN 'unavailable'
          WHEN a.valid_dur_ns < a.window_dur_ns THEN 'partial'
          ELSE 'observed'
        END AS limit_evidence,
        a.invalid_sample_count, a.invalid_limit_ns,
        CASE WHEN a.invalid_sample_count > 0
          THEN 'invalid_limit_samples_excluded_from_aggregates'
          ELSE 'all_samples_valid' END AS data_quality_note,
        a.limit_source,
        'observation_not_causal' AS evidence_scope
      FROM (
        -- Invalid samples (limit_value_valid = 0) are not limits: they are
        -- excluded from every aggregate and reported separately.
        SELECT
          s.window_id, s.window_start_ts, s.window_end_ts,
          s.window_end_ts - s.window_start_ts AS window_dur_ns,
          s.policy_cpu, MAX(s.ucpu) AS ucpu, MAX(s.machine_id) AS machine_id,
          MAX(s.core_type) AS core_type, MAX(s.topology_source) AS topology_source,
          s.kind,
          SUM(CASE WHEN s.limit_value_valid = 1 THEN s.limit_khz * 1.0 * s.dur_ns END) AS valid_weighted_khz_ns,
          SUM(CASE WHEN s.limit_value_valid = 1 THEN s.dur_ns END) AS valid_dur_ns,
          MIN(CASE WHEN s.limit_value_valid = 1 THEN s.limit_khz END) AS min_limit_khz,
          MAX(CASE WHEN s.limit_value_valid = 1 THEN s.limit_khz END) AS max_limit_khz,
          MAX(s.reference_max_limit_khz) AS reference_max_limit_khz,
          MAX(s.reference_basis) AS reference_basis,
          SUM(CASE WHEN s.limit_value_valid = 1 THEN 1 ELSE 0 END) AS sample_count,
          MIN(s.raw_start_ts) AS first_sample_ts,
          MAX(s.raw_start_ts) AS last_sample_ts,
          SUM(CASE WHEN s.limit_value_valid = 0 THEN 1 ELSE 0 END) AS invalid_sample_count,
          SUM(CASE WHEN s.limit_value_valid = 0 THEN s.dur_ns ELSE 0 END) AS invalid_limit_ns,
          MAX(s.limit_source) AS limit_source
        FROM system_cpu_freq_limit_spans s
        WHERE s.dur_ns > 0
        GROUP BY s.window_id, s.window_start_ts, s.window_end_ts, s.policy_cpu, s.kind
      ) a
      ORDER BY a.policy_cpu, a.kind DESC
    save_as: limit_summary

  - id: limit_episodes
    type: atomic
    name: "限频区段"
    condition: "limit_data_check.data?.[0]?.has_max_limit_data === 1"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_freq_limit_spans.sql
      - fragments/system_cpu_freq_limit_episodes.sql
    display:
      level: summary
      layer: list
      title: "限频区段（去抖动合并）"
      columns:
        - {name: episode_id, label: "区段", type: string}
        - {name: trace_episode_id, label: "全 trace 区段", type: string}
        - {name: policy_cpu, label: "policy 首核", type: number}
        - {name: core_type, label: "核心类型", type: string}
        - {name: topology_source, label: "拓扑来源", type: string}
        - {name: episode_start_ts, label: "开始", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: episode_end_ts, label: "结束", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: episode_dur_ns, label: "持续", type: duration, unit: ns}
        - {name: onset_ts, label: "限频起点", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: onset_observed, label: "起点可观测", type: boolean}
        - {name: min_limit_khz, label: "最低上限", type: number}
        - {name: reference_max_limit_khz, label: "参考上限", type: number}
        - {name: depth_pct, label: "限频深度", type: percentage}
        - {name: change_count, label: "合并变更数", type: number}
        - {name: starts_at_data_start, label: "区段含轨道首样本", type: boolean}
        - {name: ends_at_data_end, label: "终点未知", type: boolean}
        - {name: evidence_status, label: "证据状态", type: string}
        - {name: reference_basis, label: "参考依据", type: string}
        - {name: thresholds, label: "阈值", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "窗口内没有超过阈值的限频区段；可调低 episode_drop_pct 复查更浅的限频。"
    sql: |
      WITH data_start AS (
        SELECT MIN(x) AS ts FROM (
          SELECT MIN(ts) AS x FROM sched_slice
          UNION ALL
          SELECT MIN(c.ts) FROM counter c JOIN cpu_counter_track t ON c.track_id = t.id
            WHERE t.type IN ('cpu_max_frequency_limit', 'cpu_min_frequency_limit')
        )
      ),
      system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${start_ts}, (SELECT ts FROM data_start), (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      )
      SELECT e.episode_id, e.trace_episode_id, e.policy_cpu, e.core_type, e.topology_source,
        e.episode_start_ts, e.episode_end_ts, e.episode_dur_ns,
        e.onset_ts, e.onset_observed,
        e.min_limit_khz, e.reference_max_limit_khz, e.depth_pct, e.change_count,
        e.starts_at_data_start, e.ends_at_data_end, e.evidence_status, e.reference_basis,
        printf('episode_drop_pct=%s;merge_gap_ms=%s', ${episode_drop_pct|10}, ${merge_gap_ms|500}) AS thresholds,
        e.evidence_scope
      FROM system_cpu_freq_limit_episodes e
      ORDER BY e.depth_pct * e.episode_dur_ns * COALESCE(e.capacity, 1) DESC, e.episode_start_ts
    save_as: limit_episodes

  - id: limit_events
    type: atomic
    name: "限频变更事件"
    condition: "limit_data_check.data?.[0]?.has_any_limit_sample === 1"
    optional: true
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_freq_limit_spans.sql
      - fragments/system_cpu_freq_limit_episodes.sql
    display:
      level: detail
      layer: list
      title: "限频变更事件"
      columns:
        - {name: ts, label: "时间", type: timestamp, unit: ns, clickAction: navigate_timeline}
        - {name: policy_cpu, label: "policy 首核", type: number}
        - {name: core_type, label: "核心类型", type: string}
        - {name: kind, label: "限制类型", type: string}
        - {name: prev_limit_khz, label: "变更前", type: number}
        - {name: limit_khz, label: "变更后", type: number}
        - {name: delta_khz, label: "变化量", type: number}
        - {name: direction, label: "方向", type: string}
        - {name: direction_basis, label: "方向依据", type: string}
        - {name: limit_value_valid, label: "有效样本", type: boolean}
        - {name: event_role, label: "事件角色", type: string}
        - {name: trace_episode_id, label: "所属全 trace 区段", type: string}
        - {name: dur_ns, label: "保持时长", type: duration, unit: ns}
        - {name: reference_max_limit_khz, label: "参考上限", type: number}
        - {name: limit_source, label: "数据来源", type: string}
        - {name: evidence_scope, label: "证据范围", type: string}
    on_empty: "窗口内没有限频变更事件。"
    sql: |
      WITH data_start AS (
        SELECT MIN(x) AS ts FROM (
          SELECT MIN(ts) AS x FROM sched_slice
          UNION ALL
          SELECT MIN(c.ts) FROM counter c JOIN cpu_counter_track t ON c.track_id = t.id
            WHERE t.type IN ('cpu_max_frequency_limit', 'cpu_min_frequency_limit')
        )
      ),
      system_windows AS (
        SELECT 0 AS window_id,
          COALESCE(${start_ts}, (SELECT ts FROM data_start), (SELECT start_ts FROM trace_bounds)) AS window_start_ts,
          COALESCE(${end_ts}, (SELECT end_ts FROM trace_bounds)) AS window_end_ts
      )
      -- Validity, direction and episode membership come from the shared
      -- event CTE; an invalid sample is a data-quality event, and the first
      -- valid value after it has direction `unknown`, never `relaxed`.
      SELECT s.raw_start_ts AS ts, s.policy_cpu, s.core_type, s.kind,
        ev.prev_sample_limit_khz AS prev_limit_khz, s.limit_khz, ev.delta_khz,
        ev.direction, ev.direction_basis, ev.limit_value_valid, ev.event_role,
        ev.trace_episode_id,
        s.dur_ns, s.reference_max_limit_khz, s.limit_source,
        'observation_not_causal' AS evidence_scope
      FROM system_cpu_freq_limit_spans s
      JOIN system_cpu_freq_limit_events ev ON ev.counter_id = s.counter_id
      WHERE s.raw_start_ts >= s.window_start_ts AND s.raw_start_ts < s.window_end_ts
      ORDER BY s.raw_start_ts, s.policy_cpu, s.kind DESC
    save_as: limit_events

  - id: limit_unavailable
    type: atomic
    name: "限频数据不可用"
    condition: "limit_data_check.data?.[0]?.has_max_limit_data !== 1"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_cpu_freq_limit_spans.sql
    display:
      level: summary
      layer: overview
      title: "限频数据不可用"
      columns:
        - {name: limit_evidence, label: "限频证据", type: string}
        - {name: limit_classification, label: "分类", type: string}
        - {name: limit_evidence_missing_reason, label: "缺失原因", type: string}
        - {name: required_ftrace_event, label: "需要采集的 ftrace 事件", type: string}
        - {name: message, label: "说明", type: string}
    sql: |
      SELECT
        'unavailable' AS limit_evidence,
        ds.limit_evidence_classification AS limit_classification,
        ds.limit_evidence_missing_reason,
        'power/cpu_frequency_limits' AS required_ftrace_event,
        ds.limit_evidence_missing_note AS message
      FROM system_cpu_freq_limit_data_status ds
    save_as: limit_unavailable

output:
  format: layered
  default_expanded: [limit_summary, limit_episodes]
