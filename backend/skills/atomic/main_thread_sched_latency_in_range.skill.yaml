# =============================================================================
# 主线程调度延迟（原子 Skill）
# =============================================================================
# 分析指定时间区间内主线程 Runnable 等待时延。

name: main_thread_sched_latency_in_range
version: "1.0"
type: atomic
category: kernel
tier: B

meta:
  display_name: "主线程调度延迟 (区间)"
  description: "统计主线程 Runnable 等待时间分布"
  icon: "schedule"
  tags: [sched, latency, main_thread, atomic]

identity:
  policy: verify_if_present
  scope: process
  aliases: [package]

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "分析起始时间戳(ns，可选)"
  - name: end_ts
    type: timestamp
    required: false
    description: "分析结束时间戳(ns，可选)"
  - name: package
    type: string
    required: false
    description: "目标应用包名（精确匹配，含 name:* 子进程）"

display:
  level: detail
  layer: deep
  title: "主线程调度延迟"
  columns:
    - {name: upid, label: "upid", type: number, hidden: true}
    - {name: utid, label: "utid", type: number, hidden: true}
    - {name: tid, label: "tid", type: number, hidden: true}
    - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
    - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
    - {name: runnable_preempted_ms, label: "runnable_preempted_ms", type: number, hidden: true}
    - {name: right_censored_count, label: "right_censored_count", type: number, hidden: true}
    - {name: latency_evidence, label: "latency_evidence", type: string, hidden: true}
    - name: thread_name
      label: "线程"
      type: string
    - name: runnable_count
      label: "等待次数"
      type: number
    - name: total_runnable_ms
      label: "总等待"
      type: duration
      format: duration_ms
    - name: max_latency_ms
      label: "最大延迟"
      type: duration
      format: duration_ms
    - name: avg_latency_ms
      label: "平均延迟"
      type: duration
      format: duration_ms
    - name: long_wait_count
      label: ">2ms 次数"
      type: number
    - name: severe_count
      label: ">8ms 次数"
      type: number


process_scope:
  role: target
  binding: effective_target_processes
sql_fragments:
  - fragments/effective_target_processes.sql
  - fragments/system_thread_state_spans.sql
sql: |
  WITH system_windows AS (SELECT 0 AS window_id,
    COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
    COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
  system_target_threads AS (
    SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
    FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
    WHERE (${__process_scope.upid} IS NOT NULL OR '${package}'='' OR p.name='${package}' OR p.name GLOB '${package}:*') AND t.tid=p.pid
  )
  SELECT s.upid,s.utid,t.tid,t.name AS thread_name,s.window_start_ts,s.window_end_ts,
    COUNT(*) AS runnable_count,SUM(s.dur_ns)/1e6 AS total_runnable_ms,
    MAX(s.dur_ns)/1e6 AS max_latency_ms,AVG(s.dur_ns)/1e6 AS avg_latency_ms,
    SUM(CASE WHEN s.dur_ns>2000000 THEN 1 ELSE 0 END) AS long_wait_count,
    SUM(CASE WHEN s.dur_ns>8000000 THEN 1 ELSE 0 END) AS severe_count,
    SUM(CASE WHEN s.state='R+' THEN s.dur_ns ELSE 0 END)/1e6 AS runnable_preempted_ms,
    SUM(CASE WHEN s.right_censored THEN 1 ELSE 0 END) AS right_censored_count,
    'window_clipped_runnable_intervals' AS latency_evidence
  FROM system_thread_state_spans s JOIN thread t ON t.utid=s.utid
  WHERE s.state IN ('R','R+')
  GROUP BY s.window_id,s.utid ORDER BY total_runnable_ms DESC
output:
  format: structured
