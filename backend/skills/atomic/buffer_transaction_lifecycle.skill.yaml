# BufferTX is SF server-side pending buffer updates: reception increases it;
# latch OR drop decreases it. Queue, BLAST acquire, GPU readiness and present
# are separate observations. Time proximity cannot establish buffer identity.
name: buffer_transaction_lifecycle
version: "1.1"
type: composite
category: diagnostics
tier: B

meta:
  display_name: "Buffer Transaction 生命周期"
  description: "观察 SF 全局事务事件、目标进程提交事件与逐轨 BufferTX pending；缺少 buffer/layer/transaction 身份时不计算跨阶段延迟"
  icon: "swap_horiz"
  tags: [surfaceflinger, transaction, blast, buffer, lifecycle, s01]
  s_article_ref: "S01"

prerequisites:
  required_tables:
    - slice
    - thread_track
    - thread
    - process
    - counter
    - counter_track
    - actual_frame_timeline_slice

inputs:
  - name: start_ts
    type: timestamp
    required: true
    description: "分析起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "分析结束时间戳(ns)"
  - name: package
    type: string
    required: false
    description: "精确包名及冒号子进程；BufferTX 按 layer 名边界匹配，空值观察全部进程"

steps:
  - id: apply_transaction_summary
    type: atomic
    name: "事务与提交事件概览"
    display:
      level: summary
      layer: overview
      title: "SF 全局事件与目标进程提交事件（未关联单个 buffer）"
      columns:
        - name: total_apply_transactions
          label: "SF 全局 applyTransaction 事件数"
          type: number
        - name: total_set_transaction_state
          label: "SF 全局 setTransactionState 事件数"
          type: number
        - name: total_blast_bq
          label: "所选进程 BLASTBufferQueue 事件数"
          type: number
        - name: total_queue_buffer
          label: "所选进程 queueBuffer 事件数（非显示帧数）"
          type: number
        - name: avg_apply_to_latch_ms
          label: "Transaction→Latch 延迟（缺身份关联，不可用）"
          type: duration
          format: duration_ms
        - name: pairing_status
          label: "跨阶段关联状态"
          type: string
        - name: sf_event_scope
          label: "SF 事件范围"
          type: string
        - name: app_event_scope
          label: "应用事件范围"
          type: string
    sql: |
      WITH event_inventory AS (
        SELECT s.name, p.name AS process_name
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t ON tt.utid = t.utid
        JOIN process p ON t.upid = p.upid
        WHERE s.ts >= ${start_ts} AND s.ts < ${end_ts}
      ),
      sf_events AS (
        SELECT name FROM event_inventory
        WHERE process_name = 'surfaceflinger'
          OR process_name GLOB '*/surfaceflinger'
      ),
      app_events AS (
        SELECT name FROM event_inventory
        WHERE '${package|}' = ''
          OR process_name = '${package|}'
          OR SUBSTR(process_name, 1, LENGTH('${package|}') + 1) = '${package|}:'
      )
      SELECT
        (SELECT COUNT(*) FROM sf_events WHERE name GLOB '*applyTransaction*') AS total_apply_transactions,
        (SELECT COUNT(*) FROM sf_events WHERE name GLOB '*setTransactionState*') AS total_set_transaction_state,
        (SELECT COUNT(*) FROM app_events WHERE name GLOB '*BLASTBufferQueue*') AS total_blast_bq,
        (SELECT COUNT(*) FROM app_events WHERE name GLOB 'queueBuffer*' OR name GLOB '*::queueBuffer*') AS total_queue_buffer,
        CAST(NULL AS REAL) AS avg_apply_to_latch_ms,
        'unsupported_missing_identity' AS pairing_status,
        'global_surfaceflinger' AS sf_event_scope,
        CASE WHEN '${package|}' = '' THEN 'all_processes'
          ELSE 'package_and_colon_subprocesses' END AS app_event_scope
    save_as: apply_transaction_summary

  # Preserve the legacy step/columns, but do not invent latency buckets from
  # unrelated queueBuffer and the next global SF applyTransaction event.
  - id: queue_to_transaction_delay
    type: atomic
    name: "queueBuffer→Transaction 关联能力"
    display:
      level: detail
      layer: list
      title: "缺少 buffer/layer/transaction 身份，跨阶段延迟不可用"
      columns:
        - name: bucket
          label: "延迟统计可用性"
          type: string
        - name: count
          label: "已关联样本数（不可用）"
          type: number
        - name: pairing_status
          label: "跨阶段关联状态"
          type: string
    sql: |
      SELECT
        'unavailable_missing_identity' AS bucket,
        CAST(NULL AS INTEGER) AS count,
        'unsupported_missing_identity' AS pairing_status
    save_as: queue_to_transaction_delay

  # This legacy step reads FrameTimeline, not transactions or BQ submissions.
  - id: per_layer_transactions
    type: atomic
    name: "按进程与 Layer 分组的 FrameTimeline 记录"
    display:
      level: detail
      layer: list
      title: "完整 FrameTimeline 记录（非 Transaction 或新 buffer 计数）"
      columns:
        - name: upid
          label: "进程实例 UPID"
          type: number
        - name: process_name
          label: "进程名"
          type: string
        - name: layer_name
          label: "Layer 名"
          type: string
        - name: frame_count
          label: "完整 FrameTimeline 记录数（非去重 App 帧）"
          type: number
        - name: jank_count
          label: "带 Jank 标记的记录数"
          type: number
        - name: avg_dur_ms
          label: "记录平均时长"
          type: duration
          format: duration_ms
        - name: evidence_scope
          label: "证据口径"
          type: string
    sql: |
      SELECT
        f.upid,
        p.name AS process_name,
        f.layer_name,
        COUNT(*) AS frame_count,
        SUM(CASE WHEN f.jank_type IS NOT NULL AND f.jank_type != 'None' THEN 1 ELSE 0 END) AS jank_count,
        ROUND(AVG(f.dur) / 1e6, 2) AS avg_dur_ms,
        'frame_timeline_layer_records_not_transactions' AS evidence_scope
      FROM actual_frame_timeline_slice f
      LEFT JOIN process p ON f.upid = p.upid
      WHERE f.ts >= ${start_ts} AND f.ts < ${end_ts}
        AND f.dur >= 0
        AND f.layer_name IS NOT NULL
        AND ('${package|}' = '' OR p.name = '${package|}'
          OR SUBSTR(p.name, 1, LENGTH('${package|}') + 1) = '${package|}:')
      GROUP BY f.upid, p.name, f.layer_name
      ORDER BY frame_count DESC, f.upid, f.layer_name
      LIMIT 20
    save_as: per_layer_transactions

  - id: buffer_tx_pending_observations
    type: atomic
    name: "逐轨 BufferTX pending 观测"
    display:
      level: detail
      layer: list
      title: "SF server pending 增减与水位（不等于 GPU ready 或显示帧）"
      columns:
        - name: track_id
          label: "Counter 轨道 ID"
          type: number
        - name: track_name
          label: "BufferTX 轨道名"
          type: string
        - name: sample_count
          label: "窗口内样本数"
          type: number
        - name: received_updates
          label: "Pending 上升量（收到 buffer update）"
          type: number
        - name: removed_updates
          label: "Pending 下降量（latch 或 drop）"
          type: number
        - name: min_pending_updates
          label: "采样最低 pending 水位"
          type: number
        - name: max_pending_updates
          label: "采样最高 pending 水位"
          type: number
        - name: last_pending_updates
          label: "窗口末次采样 pending 水位"
          type: number
        - name: coverage_status
          label: "增量观测覆盖"
          type: string
        - name: evidence_scope
          label: "归属口径"
          type: string
        - name: claim_boundary
          label: "结论边界"
          type: string
    sql: |
      WITH samples_with_previous AS (
        SELECT c.id, c.track_id, ct.name AS track_name, c.ts, c.value,
          LAG(c.value) OVER (PARTITION BY c.track_id ORDER BY c.ts, c.id) AS previous_value
        FROM counter c
        JOIN counter_track ct ON c.track_id = ct.id
        WHERE ct.name GLOB 'BufferTX - *'
          AND c.ts < ${end_ts}
          AND ('${package|}' = '' OR (
            INSTR(ct.name, '${package|}') > 0
            AND (INSTR(ct.name, '${package|}') = 1
              OR SUBSTR(ct.name, INSTR(ct.name, '${package|}') - 1, 1) IN (' ', '[', '(', ':', '/', '-'))
            AND (INSTR(ct.name, '${package|}') + LENGTH('${package|}') > LENGTH(ct.name)
              OR SUBSTR(ct.name, INSTR(ct.name, '${package|}') + LENGTH('${package|}'), 1)
                IN ('/', ':', '#', ']', ')', ' '))
          ))
      ),
      window_samples AS (
        SELECT *, ROW_NUMBER() OVER (PARTITION BY track_id ORDER BY ts DESC, id DESC) AS reverse_index
        FROM samples_with_previous
        WHERE ts >= ${start_ts}
      )
      SELECT
        track_id, track_name, COUNT(*) AS sample_count,
        SUM(CASE WHEN value > previous_value THEN CAST(value - previous_value AS INTEGER) ELSE 0 END) AS received_updates,
        SUM(CASE WHEN value < previous_value THEN CAST(previous_value - value AS INTEGER) ELSE 0 END) AS removed_updates,
        MIN(value) AS min_pending_updates,
        MAX(value) AS max_pending_updates,
        MAX(CASE WHEN reverse_index = 1 THEN value END) AS last_pending_updates,
        CASE WHEN COUNT(previous_value) < COUNT(*) THEN 'partial_missing_previous_sample'
          ELSE 'observed' END AS coverage_status,
        CASE WHEN '${package|}' = '' THEN 'all_matching_counter_tracks'
          ELSE 'package_layer_name_match_not_exact_upid' END AS evidence_scope,
        'server_pending_not_gpu_ready_or_presented_frames' AS claim_boundary
      FROM window_samples
      GROUP BY track_id, track_name
      UNION ALL
      SELECT NULL, NULL, 0, NULL, NULL, NULL, NULL, NULL,
        'unavailable_no_counter_samples',
        CASE WHEN '${package|}' = '' THEN 'all_matching_counter_tracks'
          ELSE 'package_layer_name_match_not_exact_upid' END,
        'server_pending_not_gpu_ready_or_presented_frames'
      WHERE NOT EXISTS (SELECT 1 FROM window_samples)
      ORDER BY track_id
    save_as: buffer_tx_pending_observations

output:
  fields:
    - name: apply_transaction_summary
      label: "SF 全局事件与所选进程提交事件"
    - name: queue_to_transaction_delay
      label: "queueBuffer→Transaction 关联能力（缺身份时不可用）"
    - name: per_layer_transactions
      label: "Per-layer FrameTimeline 记录（空结果不证明流畅）"
    - name: buffer_tx_pending_observations
      label: "逐轨 BufferTX pending 增减与水位"
