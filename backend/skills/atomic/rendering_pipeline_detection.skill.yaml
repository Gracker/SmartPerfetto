            ),
            signal_name_matches AS (
              SELECT
                sd.signal_id,
                sd.pipeline_id,
                sd.signal_type,
                sd.signal_name,
                sd.weight,
                sd.min_count,
                COALESCE(tc.thread_name, sc.slice_name) as source_name,
                -- Each source count is already grouped by the actual recorded name.
                -- Multiple alias patterns matching that name must contribute it once.
                MAX(
                  CASE
                    WHEN sd.source = 't' THEN CASE WHEN sd.scope = 'g' THEN COALESCE(tc.global_cnt, 0) ELSE COALESCE(tc.app_cnt, 0) END
                    WHEN sd.source = 's' THEN CASE WHEN sd.scope = 'g' THEN COALESCE(sc.global_cnt, 0) ELSE COALESCE(sc.app_cnt, 0) END
                    ELSE 0
                  END
                ) as source_count
              FROM signal_defs sd
              LEFT JOIN thread_counts tc
                ON sd.source = 't'
               AND (
                 (sd.op = 'eq' AND tc.thread_name = sd.pattern)
                 OR (sd.op = 'glob' AND tc.thread_name GLOB sd.pattern)
               )
              LEFT JOIN slice_counts sc
                ON sd.source = 's'
               AND (
                 (sd.op = 'eq' AND sc.slice_name = sd.pattern)
                 OR (sd.op = 'glob' AND sc.slice_name GLOB sd.pattern)
               )
              GROUP BY sd.signal_id, sd.pipeline_id, sd.signal_type, sd.signal_name, sd.weight, sd.min_count, source_name
            ),
            signal_counts AS (
              SELECT signal_id, pipeline_id, signal_type, signal_name, weight, min_count,
                SUM(source_count) as cnt
              FROM signal_name_matches
              GROUP BY signal_id, pipeline_id, signal_type, signal_name, weight, min_count
            ),
            signal_agg AS (
              SELECT
                pipeline_id,
                MIN(
                  CASE
                    WHEN signal_type = 'r' THEN CASE WHEN cnt >= min_count THEN 1 ELSE 0 END
                    ELSE 1
                  END
                ) as required_ok,
                MAX(
                  CASE
                    WHEN signal_type = 'e' THEN CASE WHEN cnt > 0 THEN 1 ELSE 0 END
                    ELSE 0
                  END
                ) as excluded,
                SUM(CASE WHEN signal_type = 's' THEN weight ELSE 0 END) as total_weight,
                SUM(CASE WHEN signal_type = 's' AND cnt >= min_count THEN weight ELSE 0 END) as matched_weight
              FROM signal_counts
              GROUP BY pipeline_id
            ),
            pipeline_scores AS (
              SELECT
                pl.pipeline_id,
                COALESCE(sa.required_ok, 1) as required_ok,
                COALESCE(sa.excluded, 0) as excluded,
                COALESCE(sa.total_weight, 0) as total_weight,
                COALESCE(sa.matched_weight, 0) as matched_weight
              FROM pipeline_list pl
              LEFT JOIN signal_agg sa ON sa.pipeline_id = pl.pipeline_id
            ),
            scores AS (
              SELECT
                pipeline_id,
                required_ok,
                excluded,
                total_weight,
                matched_weight,
                CASE
                  WHEN required_ok = 1 AND excluded = 0 AND total_weight > 0
                  THEN matched_weight * 1.0 / total_weight
                  ELSE 0
                END as score
              FROM pipeline_scores
            )
            SELECT * FROM scores

    save_as: pipeline_scores
  - id: layer_signals
    type: atomic
    name: 核对目标应用出图与 SurfaceFlinger 消费
    display:
      level: detail
      title: 目标图层与缓冲区
    sql: |2-

            WITH RECURSIVE
            producing_packages AS (
              SELECT CASE WHEN instr(p.name, ':') > 0 THEN substr(p.name, 1, instr(p.name, ':') - 1)
                ELSE p.name END AS pkg
              FROM slice s JOIN thread_track tt ON tt.id = s.track_id
              JOIN thread t USING (utid) JOIN process p USING (upid)
              WHERE '${package}' = '' AND p.name GLOB '*.*' AND p.name NOT GLOB '/*'
                AND p.name NOT IN ('com.android.systemui', 'system_server')
                AND (s.name IN ('queueBuffer', 'eglSwapBuffers', 'vkQueuePresentKHR', 'unlockCanvasAndPost')
                  OR (t.name = 'RenderThread' AND s.name GLOB 'DrawFrame*'))
              GROUP BY pkg HAVING COUNT(DISTINCT s.ts) >= 2
            ),
            target AS (
              SELECT CASE WHEN '${package}' != '' THEN '${package}'
                WHEN COUNT(*) = 1 THEN MIN(pkg) END AS pkg FROM producing_packages
            ),
            app_filter_upids AS (
              SELECT p.upid FROM process p, target
              WHERE p.name = target.pkg OR instr(p.name, target.pkg || ':') = 1
            ),
            app_events AS MATERIALIZED (
              SELECT s.id, s.parent_id, s.ts, s.name, t.upid, t.utid, t.name AS thread_name
              FROM thread t JOIN thread_track tt USING (utid) JOIN slice s ON s.track_id = tt.id
              WHERE t.upid IN (SELECT upid FROM app_filter_upids) AND s.dur >= 0
            ),
            display_tokens AS (
              SELECT f.display_frame_token
              FROM actual_frame_timeline_slice f JOIN process p USING (upid)
              WHERE p.name IN ('surfaceflinger', '/system/bin/surfaceflinger')
                AND f.surface_frame_token IS NULL AND f.display_frame_token > 0
              GROUP BY f.display_frame_token
              HAVING COUNT(*) = 1 AND MIN(f.dur) >= 0 AND MIN(f.present_type) IN
                ('On-time Present', 'Late Present', 'Early Present')
            ),
            presented_layers AS (
              SELECT DISTINCT f.upid, f.surface_frame_token, f.layer_name
              FROM actual_frame_timeline_slice f JOIN display_tokens USING (display_frame_token)
              JOIN process p ON p.upid = f.upid
              WHERE f.upid IN (SELECT upid FROM app_filter_upids)
                AND f.surface_frame_token > 0 AND f.dur >= 0 AND f.layer_name IS NOT NULL
                AND (instr(f.layer_name, 'SurfaceView[') = 0 OR instr(f.layer_name, 'SurfaceView[' ||
                  CASE WHEN instr(p.name, ':') > 0 THEN substr(p.name, 1, instr(p.name, ':') - 1)
                    ELSE p.name END || '/') > 0)
                AND f.present_type IN ('On-time Present', 'Late Present', 'Early Present')
            ),
            sf_layers AS (
              SELECT upid, layer_name, COUNT(*) AS frames,
                instr(layer_name, 'SurfaceView[') > 0 AS child_surface
              FROM presented_layers GROUP BY upid, layer_name
            ),
            -- Producers and consumers record the queue instance before the slot
            -- suffix. A generic onFrameAvailable callback is also emitted by BLAST
            -- host windows and cannot establish a texture path.
            texture_ops AS (
              SELECT e.upid, e.utid, e.thread_name, parent.id AS operation_id, parent.name AS operation,
                substr(e.name, 1, instr(e.name, ': ') - 1) AS queue_name
              FROM app_events e JOIN slice parent ON parent.id = e.parent_id
              WHERE e.name GLOB 'SurfaceTexture-*: *' AND parent.name IN ('queueBuffer', 'acquireBuffer')
            ),
            texture_producers AS (
              SELECT upid, queue_name, MIN(utid) AS utid, COUNT(DISTINCT operation_id) AS submissions
              FROM texture_ops WHERE operation = 'queueBuffer'
              GROUP BY upid, queue_name HAVING COUNT(DISTINCT utid) = 1
            ),
            texture_links AS (
              SELECT prod.upid, prod.utid, prod.queue_name, prod.submissions, cons.operation_id AS acquisition
              FROM texture_producers prod JOIN texture_ops cons USING (upid, queue_name)
              WHERE cons.operation = 'acquireBuffer' AND cons.thread_name = 'RenderThread' AND prod.utid != cons.utid
            ),
            -- Attribute each operation to its enclosing host DrawFrame. Multiple
            -- wrappers, texture slots or acquisitions in one frame count only once.
            host_ancestors(upid, id, parent_id, name, operation, producer_utid) AS (
              SELECT upid, id, parent_id, name, 'functor', NULL FROM app_events WHERE thread_name = 'RenderThread'
                AND (name GLOB 'DrawGL*' OR name GLOB '*DrawFn_DrawGL*' OR name GLOB '*DrawFn_DrawVk*' OR name GLOB '*DrawFunctor*' OR name GLOB 'AwDrawFnImpl::Draw[GV][Llk]*' OR name GLOB 'WebViewFunctor::draw[GgVv][LlKk]*')
              UNION
              SELECT upid, id, parent_id, name, 'submit', NULL FROM app_events
                WHERE thread_name = 'RenderThread' AND name = 'queueBuffer'
              UNION
              SELECT e.upid, e.id, e.parent_id, e.name, 'surface', NULL FROM app_events e
              JOIN slice parent ON parent.id = e.parent_id
              WHERE e.name GLOB 'onFrameAvailable - *SurfaceView[[]*' AND e.thread_name = 'RenderThread'
                AND parent.name = 'queueBuffer'
              UNION
              SELECT l.upid, s.id, s.parent_id, s.name, 'texture', l.utid FROM texture_links l
              JOIN slice s ON s.id = l.acquisition
              UNION
              SELECT a.upid, s.id, s.parent_id, s.name, a.operation, a.producer_utid FROM host_ancestors a
              JOIN slice s ON s.id = a.parent_id WHERE a.name NOT GLOB 'DrawFrame*'
            ),
            producer_tracks AS (
              SELECT e.upid, e.utid, e.thread_name,
                COUNT(DISTINCT CASE WHEN name GLOB 'DrawFrame*' AND thread_name = 'RenderThread' THEN ts END) AS draws,
                COUNT(DISTINCT CASE WHEN name = 'queueBuffer' THEN ts END) AS queues,
                COUNT(DISTINCT CASE WHEN (name GLOB 'onFrameAvailable - VRI*' OR name GLOB 'onFrameAvailable - BLASTBufferQueue*') AND parent_id IN (SELECT id FROM app_events WHERE name = 'queueBuffer') THEN parent_id END) AS host_callbacks,
                COUNT(DISTINCT CASE WHEN name GLOB 'dequeueBuffer - VRI*(BLAST Consumer)*' THEN ts END) AS host_blast,
                COUNT(DISTINCT CASE WHEN id IN (SELECT id FROM surface_callbacks) AND parent_id IN (SELECT id FROM app_events WHERE name = 'queueBuffer') THEN parent_id END) AS surface_callbacks,
                COUNT(DISTINCT CASE WHEN name GLOB 'dequeueBuffer - *SurfaceView[[]*(BLAST Consumer)*' THEN ts END) AS surface_blast,
                COUNT(DISTINCT CASE WHEN name GLOB '*Rasterizer::Draw*' THEN ts END) AS raster_draws,
                COUNT(DISTINCT CASE WHEN name GLOB '*Impeller*' OR name GLOB '*EntityPass*' THEN ts END) AS impeller_draws,
                COUNT(DISTINCT CASE WHEN name GLOB '*SkiaGpu*' OR name GLOB '*SkGpu*' THEN ts END) AS skia_draws,
                COUNT(DISTINCT CASE WHEN name GLOB '*eglSwapBuffers*' THEN ts END) AS swaps,
                COUNT(DISTINCT CASE WHEN name IN ('vkQueuePresentKHR', 'QueuePresentKHR') THEN ts END) AS vk_presents,
                COUNT(DISTINCT CASE WHEN name GLOB '*unlockCanvasAndPost*' THEN ts END) AS canvas_posts
              FROM app_events e GROUP BY upid, utid
            ),
            host_frames AS (
              SELECT a.upid,
                -- HWUI can draw directly into a SurfaceView. Those frames have
                -- one destination and must not also count as anonymous host output.
                COUNT(DISTINCT CASE WHEN operation = 'submit' THEN id END) -
                  COUNT(DISTINCT CASE WHEN operation = 'surface' THEN id END) AS submitted,
                COUNT(DISTINCT CASE WHEN operation = 'functor' THEN id END) AS functor,
                COUNT(DISTINCT CASE WHEN operation = 'texture' THEN id END) AS textured,
                COUNT(DISTINCT CASE WHEN operation = 'texture' AND (r.thread_name GLOB '[0-9]*.raster' OR r.raster_draws >= 2) THEN id END) AS flutter_textured
              FROM host_ancestors a LEFT JOIN producer_tracks r ON r.utid = a.producer_utid
              WHERE a.name GLOB 'DrawFrame*' GROUP BY a.upid
            ),

            surface_callbacks AS (
              SELECT e.id, e.upid, e.parent_id, e.name,
                substr(e.name, length('onFrameAvailable - ') + 1) AS marker
              FROM app_events e JOIN process p USING (upid)
              WHERE e.name GLOB 'onFrameAvailable - *SurfaceView*'
                AND instr(e.name, 'SurfaceView[' || CASE WHEN instr(p.name, ':') > 0
                  THEN substr(p.name, 1, instr(p.name, ':') - 1) ELSE p.name END || '/') > 0
            ),
            app_buffer_ids AS (
              SELECT cb.id, cb.upid, acquire_event.ts,
                substr(cb.marker, 1, instr(cb.marker, ']')) AS endpoint,
                substr(acquire_event.name, instr(acquire_event.name, ')frame=') + length(')frame=')) AS frame_no
              FROM surface_callbacks cb JOIN slice acquire_event ON acquire_event.parent_id = cb.id
              WHERE acquire_event.name GLOB 'acquireNextBufferLocked - *' AND instr(acquire_event.name, ')frame=') > 0
                AND instr(acquire_event.name, 'acquireNextBufferLocked - ' || cb.marker || 'frame=') = 1
                AND instr(cb.marker, ']') > instr(cb.marker, 'SurfaceView[')
            ),
            app_buffers AS (
              SELECT MIN(id) AS callback_id, MIN(upid) AS upid, MIN(ts) AS acquire_ts, endpoint, frame_no
              FROM app_buffer_ids
              WHERE frame_no != '' AND frame_no NOT GLOB '*[^0-9]*'
              GROUP BY endpoint, frame_no HAVING COUNT(*) = 1
            ),
            sf_buffers_raw AS (
              SELECT s.ts, substr(s.name, length('latchBuffer ') + 1) AS marker
              FROM slice s JOIN thread_track tt ON tt.id = s.track_id
              JOIN thread t USING (utid) JOIN process p USING (upid)
              WHERE p.name IN ('surfaceflinger','/system/bin/surfaceflinger')
                AND s.name GLOB 'latchBuffer *SurfaceView* - *' AND s.dur >= 0
            ),
            sf_buffers AS (
              SELECT substr(marker, 1, instr(marker, ']')) AS endpoint,
                substr(marker, instr(marker, ' - ') + length(' - ')) AS frame_no, MIN(ts) AS latch_ts
              FROM sf_buffers_raw
              WHERE instr(marker, ']') > instr(marker, 'SurfaceView[')
              GROUP BY endpoint, frame_no HAVING COUNT(*) = 1
            ),
            consumed_buffers AS (
              SELECT b.* FROM app_buffers b JOIN sf_buffers sf USING (endpoint, frame_no)
              WHERE sf.latch_ts >= b.acquire_ts
            ),
            callback_ancestors(callback_id, parent_id, name, id) AS (
              SELECT cb.id, cb.parent_id, cb.name, cb.id FROM surface_callbacks cb
              JOIN consumed_buffers b ON b.callback_id = cb.id
              UNION ALL
              SELECT a.callback_id, s.parent_id, s.name, s.id
              FROM callback_ancestors a JOIN slice s ON s.id = a.parent_id
              WHERE a.name != 'binder reply'
            ),
            buffer_senders AS (
              SELECT a.callback_id, p.name AS process_name, t.name AS thread_name,
                parent.name AS sender_operation, outer_op.name AS outer_operation
              FROM callback_ancestors a JOIN flow f ON f.slice_in = a.id
              JOIN slice sender ON sender.id = f.slice_out AND sender.name = 'binder transaction'
              JOIN thread_track tt ON tt.id = sender.track_id JOIN thread t USING (utid)
              JOIN process p USING (upid)
              LEFT JOIN slice parent ON parent.id = sender.parent_id
              LEFT JOIN slice outer_op ON outer_op.id = parent.parent_id
              WHERE a.name = 'binder reply'
                AND EXISTS (SELECT 1 FROM callback_ancestors q WHERE q.callback_id = a.callback_id AND q.name = 'queueBuffer')
            ),
            media_senders AS (
              SELECT callback_id, CASE
                WHEN process_name IN ('cameraserver','/system/bin/cameraserver') AND sender_operation = 'queueBuffer' THEN 'camera'
                WHEN (outer_operation GLOB '*Codec*::renderOutputBuffer*' OR sender_operation GLOB '*Codec*::renderOutputBuffer*')
                  OR (process_name IN ('mediaserver','/system/bin/mediaserver') AND thread_name = 'NPDecoder-CL') THEN 'video'
              END AS source
              FROM buffer_senders GROUP BY callback_id HAVING COUNT(*) = 1
            ),
            media_output AS (
              SELECT b.upid, COUNT(*) AS surface_latches,
                SUM(CASE WHEN s.source = 'camera' THEN 1 ELSE 0 END) AS camera_latches,
                SUM(CASE WHEN s.source = 'video' THEN 1 ELSE 0 END) AS video_latches
              FROM consumed_buffers b LEFT JOIN media_senders s USING (callback_id) GROUP BY b.upid
            ),
            observations AS (
              SELECT p.upid, p.name AS target_process,
                COALESCE(SUM(draws),0) AS hwui_draw_frames,
                MAX(COALESCE(h.submitted,0), SUM(CASE WHEN thread_name = 'RenderThread' THEN host_callbacks ELSE 0 END)) AS host_submissions,
                SUM(CASE WHEN thread_name = 'RenderThread' THEN host_blast ELSE 0 END) AS host_blast,
                COALESCE(SUM(surface_callbacks),0) AS surfaceview_submissions, SUM(surface_blast) AS surface_blast,
                SUM(CASE WHEN thread_name GLOB '[0-9]*.raster' OR raster_draws >= 2 THEN surface_callbacks ELSE 0 END) AS flutter_surface,
                SUM(CASE WHEN surface_callbacks >= 2 AND (thread_name GLOB '[0-9]*.raster' OR raster_draws >= 2) THEN impeller_draws ELSE 0 END) AS impeller,
                SUM(CASE WHEN surface_callbacks >= 2 AND (thread_name GLOB '[0-9]*.raster' OR raster_draws >= 2) THEN skia_draws ELSE 0 END) AS skia,
                SUM(CASE WHEN thread_name GLOB 'GLThread*' THEN MIN(surface_callbacks, swaps) ELSE 0 END) AS gl_surface,
                SUM(CASE WHEN thread_name != 'RenderThread' THEN MIN(surface_callbacks, vk_presents) ELSE 0 END) AS vulkan_surface,
                SUM(CASE WHEN thread_name GLOB 'UnityGfx*' OR thread_name IN ('GameThread','RHIThread','GodotMain') THEN MIN(surface_callbacks, MAX(swaps, vk_presents)) ELSE 0 END) AS game_surface,
                SUM(MIN(canvas_posts, queues)) AS software_posts,
                COALESCE(m.surface_latches,0) AS sf_surface_latches, COALESCE(m.camera_latches,0) AS camera_latches,
                COALESCE(m.video_latches,0) AS video_latches,
                COALESCE((SELECT SUM(submissions) FROM texture_producers producer WHERE producer.upid=p.upid
                  AND EXISTS (SELECT 1 FROM texture_links l WHERE l.upid=producer.upid AND l.queue_name=producer.queue_name)),0) AS texture_submissions,
                COALESCE(h.textured,0) AS texture_frames, COALESCE(h.flutter_textured,0) AS flutter_texture,
                COALESCE(h.functor,0) AS functor_frames, COALESCE(h.submitted,0) AS submitted_draw_frames,
                COALESCE((SELECT SUM(frames) FROM sf_layers l WHERE l.upid=p.upid AND NOT child_surface),0) AS sf_host_frames,
                COALESCE((SELECT SUM(frames) FROM sf_layers l WHERE l.upid=p.upid AND child_surface),0) AS sf_surfaceview_frames,
                COALESCE((SELECT SUM(frames) FROM sf_layers l WHERE l.upid=p.upid AND
                  (l.layer_name GLOB 'CameraPreview*' OR l.layer_name GLOB 'Camera Preview*')),0) AS camera_frames,
                COALESCE((SELECT SUM(frames) FROM sf_layers l WHERE l.upid=p.upid AND
                  (l.layer_name GLOB 'VideoSurface*' OR l.layer_name GLOB 'Video Surface*' OR l.layer_name GLOB 'MediaCodec*')),0) AS video_frames
              FROM process p LEFT JOIN producer_tracks r USING (upid) LEFT JOIN media_output m USING (upid) LEFT JOIN host_frames h USING (upid)
              WHERE p.upid IN (SELECT upid FROM app_filter_upids)
              GROUP BY p.upid
            ),
            output_totals AS (
              SELECT o.*, MAX(host_submissions,sf_host_frames) + MAX(surfaceview_submissions,sf_surfaceview_frames,sf_surface_latches) AS observed_buffers
              FROM observations o
            ),
            paths AS (
              SELECT o.*, CASE
                WHEN camera_latches >= 2 AND camera_latches * 2 > observed_buffers THEN 'camera_preview'
                WHEN video_latches >= 2 AND video_latches * 2 > observed_buffers THEN 'video_playback'
                WHEN surfaceview_submissions >= 2 AND surfaceview_submissions > host_submissions AND MAX(sf_surfaceview_frames,sf_surface_latches) >= sf_host_frames THEN
                  CASE WHEN flutter_surface * 2 > surfaceview_submissions THEN
                    CASE WHEN impeller >= 2 AND skia = 0 THEN 'flutter_surface_impeller'
                         WHEN skia >= 2 AND impeller = 0 THEN 'flutter_surface_skia' ELSE 'flutter_surface' END
                    WHEN game_surface * 2 > surfaceview_submissions THEN 'game_surface'
                    WHEN gl_surface * 2 > surfaceview_submissions THEN 'gl_surface'
                    WHEN vulkan_surface * 2 > surfaceview_submissions THEN 'vulkan_surface'
                    WHEN surface_blast * 2 > surfaceview_submissions THEN 'surfaceview_blast' ELSE 'surfaceview' END
                WHEN sf_surfaceview_frames >= 2 AND sf_surfaceview_frames > sf_host_frames
                  AND surfaceview_submissions = 0 AND host_submissions = 0 THEN 'surfaceview'
                WHEN hwui_draw_frames >= 2 AND host_submissions >= 2 AND host_submissions > surfaceview_submissions
                  AND (submitted_draw_frames >= 2 OR sf_host_frames >= 2)
                  AND (MAX(sf_surfaceview_frames,sf_surface_latches) = 0 OR sf_host_frames > MAX(sf_surfaceview_frames,sf_surface_latches)) THEN
                  CASE WHEN functor_frames * 2 > hwui_draw_frames THEN 'webview_functor'
                       WHEN texture_submissions >= 2 AND flutter_texture >= 2 AND flutter_texture * 2 > hwui_draw_frames THEN 'flutter_texture'
                       WHEN texture_submissions >= 2 AND texture_frames * 2 > hwui_draw_frames THEN 'texture'
                       WHEN host_blast >= 2 AND host_blast * 2 > hwui_draw_frames THEN 'hwui_blast' ELSE 'hwui' END
                WHEN software_posts >= 2 AND hwui_draw_frames = 0 AND sf_host_frames >= 2 THEN 'software'
                ELSE 'unknown' END AS observed_path
              FROM output_totals o
              WHERE sf_host_frames > 0 OR sf_surfaceview_frames > 0 OR hwui_draw_frames > 0 OR host_submissions > 0 OR surfaceview_submissions > 0
                OR texture_submissions > 0 OR software_posts > 0 OR sf_surface_latches > 0
            ),
            selected AS (
              SELECT * FROM paths
              WHERE (SELECT COUNT(DISTINCT observed_path) FROM paths) = 1
              ORDER BY MAX(host_submissions, surfaceview_submissions, sf_host_frames, sf_surfaceview_frames) DESC, upid LIMIT 1
            )
            SELECT COALESCE(chosen.observed_path, 'unknown') AS observed_path, chosen.target_process,
              -- Compatibility metric: share of the observed output population on this path.
              CASE chosen.observed_path
                WHEN 'unknown' THEN 0.0
                WHEN 'webview_functor' THEN 1.0 * functor_frames / hwui_draw_frames
                WHEN 'texture' THEN MIN(1.0, 1.0 * texture_frames / hwui_draw_frames)
                WHEN 'flutter_texture' THEN MIN(1.0, 1.0 * flutter_texture / hwui_draw_frames)
                WHEN 'camera_preview' THEN 1.0 * camera_latches / observed_buffers
                WHEN 'video_playback' THEN 1.0 * video_latches / observed_buffers
                WHEN 'surfaceview' THEN CASE WHEN surfaceview_submissions = 0 THEN
                  1.0 * sf_surfaceview_frames / (sf_surfaceview_frames + sf_host_frames)
                  ELSE 1.0 * surfaceview_submissions / (surfaceview_submissions + host_submissions) END
                WHEN 'hwui_blast' THEN MIN(1.0, 1.0 * host_blast / MAX(hwui_draw_frames,observed_buffers))
                WHEN 'surfaceview_blast' THEN MIN(1.0, 1.0 * surface_blast / observed_buffers)
                WHEN 'gl_surface' THEN MIN(1.0, 1.0 * gl_surface / observed_buffers)
                WHEN 'vulkan_surface' THEN MIN(1.0, 1.0 * vulkan_surface / observed_buffers)
                WHEN 'game_surface' THEN MIN(1.0, 1.0 * game_surface / observed_buffers)
                WHEN 'software' THEN MIN(1.0, 1.0 * software_posts / observed_buffers)
                ELSE 1.0 * MAX(host_submissions,surfaceview_submissions) / NULLIF(host_submissions + surfaceview_submissions,0)
              END AS output_share,
              COALESCE(chosen.hwui_draw_frames,0) AS hwui_draw_frames, COALESCE(chosen.host_submissions,0) AS host_submissions,
              COALESCE(chosen.surfaceview_submissions,0) AS surfaceview_submissions, COALESCE(chosen.texture_submissions,0) AS texture_submissions,
              COALESCE(chosen.sf_host_frames,0) AS sf_host_frames, COALESCE(chosen.sf_surfaceview_frames,0) AS sf_surfaceview_frames,
              COALESCE(chosen.sf_surface_latches,0) AS sf_surface_latches, COALESCE(chosen.camera_latches,0) AS camera_latches,
              COALESCE(chosen.video_latches,0) AS video_latches, COALESCE(chosen.functor_frames,0) AS webview_draw_frames,
              (SELECT COUNT(*) FROM sf_layers WHERE upid=chosen.upid) AS app_layer_count,
              COALESCE((SELECT GROUP_CONCAT(layer_name,'; ') FROM sf_layers WHERE upid=chosen.upid),'') AS app_layer_names,
              COALESCE(chosen.sf_surfaceview_frames > 0,0) AS has_surfaceview_layer,
              COALESCE(chosen.video_frames > 0,0) AS has_video_layer, COALESCE(chosen.camera_frames > 0,0) AS has_camera_layer,
              EXISTS (SELECT 1 FROM sf_layers WHERE upid=chosen.upid AND layer_name GLOB '*FlutterSurfaceView*') AS has_flutter_layer
            FROM (SELECT 1) LEFT JOIN selected chosen ON 1

    save_as: layer_signals
  - id: determine_pipeline
    type: atomic
    name: 确定主管线 (YAML 驱动)
    display:
      level: summary
      title: 渲染管线识别结果
    sql: |2-

            WITH
            pipeline_scores AS (
              SELECT * FROM ${pipeline_scores}
            ),
            pipeline_metadata(
              pipeline_id,
              rendering_type_id,
              output_path,
              feature_visible,
              doc_path
            ) AS (
              VALUES
              ('ANDROID_PIP_FREEFORM', NULL, NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S06_MULTI_WINDOW'),
              ('ANDROID_VIEW_MIXED', 'S05_MIXED_RENDERING', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S05_MIXED_RENDERING'),
              ('ANDROID_VIEW_MULTI_WINDOW', NULL, NULL, 1, 'skills/pipelines/index.yaml#rendering_types.S06_MULTI_WINDOW'),
              ('ANDROID_VIEW_SOFTWARE', 'S07_SOFTWARE_OFFSCREEN', 'software', 0, 'skills/pipelines/index.yaml#rendering_types.S07_SOFTWARE_OFFSCREEN'),
              ('ANDROID_VIEW_STANDARD_BLAST', 'S02_AOSP_STANDARD', 'hwui_blast', 0, 'skills/pipelines/index.yaml#rendering_types.S02_AOSP_STANDARD'),
              ('ANDROID_VIEW_STANDARD_LEGACY', 'S02_AOSP_STANDARD', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S02_AOSP_STANDARD'),
              ('ANGLE_GLES_VULKAN', NULL, NULL, 1, 'skills/pipelines/index.yaml#rendering_types.S08_NATIVE_GRAPHICS'),
              ('AOSP_STANDARD', 'S02_AOSP_STANDARD', 'hwui', 0, 'skills/pipelines/index.yaml#rendering_types.S02_AOSP_STANDARD'),
              ('CAMERA_PIPELINE', 'S11_CAMERA', 'camera_preview', 0, 'skills/pipelines/index.yaml#rendering_types.S11_CAMERA'),
              ('CHROME_BROWSER_VIZ', 'S16_CHROMIUM_BROWSER', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S16_CHROMIUM_BROWSER'),
              ('COMPOSE_STANDARD', 'S02_AOSP_STANDARD', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S02_AOSP_STANDARD'),
              ('FLUTTER_SURFACEVIEW', 'S10_FLUTTER', 'flutter_surface', 0, 'skills/pipelines/index.yaml#rendering_types.S10_FLUTTER'),
              ('FLUTTER_SURFACEVIEW_IMPELLER', 'S10_FLUTTER', 'flutter_surface_impeller', 0, 'skills/pipelines/index.yaml#rendering_types.S10_FLUTTER'),
              ('FLUTTER_SURFACEVIEW_SKIA', 'S10_FLUTTER', 'flutter_surface_skia', 0, 'skills/pipelines/index.yaml#rendering_types.S10_FLUTTER'),
              ('FLUTTER_TEXTUREVIEW', 'S10_FLUTTER', 'flutter_texture', 0, 'skills/pipelines/index.yaml#rendering_types.S10_FLUTTER'),
              ('GAME_ENGINE', 'S13_GAME', 'game_surface', 0, 'skills/pipelines/index.yaml#rendering_types.S13_GAME'),
              ('HARDWARE_BUFFER_RENDERER', NULL, NULL, 1, 'skills/pipelines/index.yaml#rendering_types.S07_SOFTWARE_OFFSCREEN'),
              ('IMAGEREADER_PIPELINE', NULL, NULL, 1, 'skills/pipelines/index.yaml#rendering_types.S07_SOFTWARE_OFFSCREEN'),
              ('OPENGL_ES', 'S08_NATIVE_GRAPHICS', 'gl_surface', 0, 'skills/pipelines/index.yaml#rendering_types.S08_NATIVE_GRAPHICS'),
              ('RN_NEW_ARCH_HWUI', 'S14_REACT_NATIVE', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S14_REACT_NATIVE'),
              ('RN_OLD_ARCH_HWUI', 'S14_REACT_NATIVE', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S14_REACT_NATIVE'),
              ('RN_SKIA_RENDERER', 'S14_REACT_NATIVE', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S14_REACT_NATIVE'),
              ('SOFTWARE_COMPOSITING', NULL, NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S01_OVERVIEW'),
              ('SURFACE_CONTROL_API', NULL, NULL, 1, 'skills/pipelines/index.yaml#rendering_types.S07_SOFTWARE_OFFSCREEN'),
              ('SURFACEVIEW', 'S03_SURFACEVIEW', 'surfaceview', 0, 'skills/pipelines/index.yaml#rendering_types.S03_SURFACEVIEW'),
              ('SURFACEVIEW_BLAST', 'S03_SURFACEVIEW', 'surfaceview_blast', 0, 'skills/pipelines/index.yaml#rendering_types.S03_SURFACEVIEW'),
              ('TEXTUREVIEW_STANDARD', 'S04_TEXTUREVIEW', 'texture', 0, 'skills/pipelines/index.yaml#rendering_types.S04_TEXTUREVIEW'),
              ('VARIABLE_REFRESH_RATE', NULL, NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S01_OVERVIEW'),
              ('VIDEO_OVERLAY_HWC', NULL, NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S12_VIDEO_OVERLAY_HWC'),
              ('VIDEO_PLAYBACK', 'S12_VIDEO_OVERLAY_HWC', 'video_playback', 0, 'skills/pipelines/index.yaml#rendering_types.S12_VIDEO_OVERLAY_HWC'),
              ('VULKAN_NATIVE', 'S08_NATIVE_GRAPHICS', 'vulkan_surface', 0, 'skills/pipelines/index.yaml#rendering_types.S08_NATIVE_GRAPHICS'),
              ('WEBVIEW_GL_FUNCTOR', 'S09_WEBVIEW', 'webview_functor', 0, 'skills/pipelines/index.yaml#rendering_types.S09_WEBVIEW'),
              ('WEBVIEW_SURFACE_CONTROL', 'S09_WEBVIEW', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S09_WEBVIEW'),
              ('WEBVIEW_SURFACEVIEW_WRAPPER', 'S09_WEBVIEW', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S09_WEBVIEW'),
              ('WEBVIEW_TEXTUREVIEW_CUSTOM', 'S09_WEBVIEW', NULL, 0, 'skills/pipelines/index.yaml#rendering_types.S09_WEBVIEW')
            ),
            pipeline_related_rendering_types(
              pipeline_id,
              rendering_type_id
            ) AS (
              VALUES
              ('ANDROID_PIP_FREEFORM', 'S06_MULTI_WINDOW'),
              ('ANDROID_VIEW_MULTI_WINDOW', 'S06_MULTI_WINDOW'),
              ('ANGLE_GLES_VULKAN', 'S08_NATIVE_GRAPHICS'),
              ('HARDWARE_BUFFER_RENDERER', 'S07_SOFTWARE_OFFSCREEN'),
              ('IMAGEREADER_PIPELINE', 'S07_SOFTWARE_OFFSCREEN'),
              ('SURFACE_CONTROL_API', 'S07_SOFTWARE_OFFSCREEN'),
              ('VIDEO_OVERLAY_HWC', 'S12_VIDEO_OVERLAY_HWC')
            ),
            features AS (
              SELECT
                ps.pipeline_id,
                ps.score,
                ROW_NUMBER() OVER (ORDER BY ps.score DESC, ps.pipeline_id ASC) as rank
              FROM pipeline_scores ps
              JOIN pipeline_metadata pm USING (pipeline_id)
              WHERE pm.feature_visible = 1
                AND ps.score >= 0.3
            ),
            related_rendering_type_scores AS (
              SELECT
                prt.rendering_type_id,
                MAX(f.score) as score
              FROM features f
              JOIN pipeline_related_rendering_types prt USING (pipeline_id)
              GROUP BY prt.rendering_type_id
            ),
            ranked_related_rendering_types AS (
              SELECT
                rendering_type_id,
                score,
                ROW_NUMBER() OVER (ORDER BY score DESC, rendering_type_id ASC) as rank
              FROM related_rendering_type_scores
            ),
            related_rendering_type_candidate_list AS (
              SELECT GROUP_CONCAT(rendering_type_id || ':' || ROUND(score, 2), ',') as related_rendering_type_candidates_list
              FROM (
                SELECT rendering_type_id, score
                FROM ranked_related_rendering_types
                WHERE rank <= 5
                ORDER BY rank ASC
              )
              GROUP BY 'all_related_rendering_type_candidates'
            ),
            feature_list AS (
              SELECT GROUP_CONCAT(pipeline_id || ':' || ROUND(score, 2), ',') as features_list
              FROM (
                SELECT pipeline_id, score
                FROM features
                ORDER BY rank ASC
              )
              GROUP BY 'all_features'
            )
            SELECT
              COALESCE(primary_pipeline.pipeline_id, 'UNKNOWN') AS primary_pipeline_id,
              COALESCE(primary_pipeline.rendering_type_id, 'UNKNOWN') AS primary_rendering_type_id,
              CASE WHEN primary_pipeline.pipeline_id IS NULL THEN 0 ELSE obs.output_share END AS primary_confidence,
              obs.observed_path AS primary_basis, obs.target_process, obs.hwui_draw_frames,
              obs.host_submissions, obs.surfaceview_submissions, obs.texture_submissions,
              obs.sf_host_frames, obs.sf_surfaceview_frames, obs.sf_surface_latches, obs.camera_latches, obs.video_latches, obs.webview_draw_frames,
              COALESCE(primary_pipeline.pipeline_id || ':' || ROUND(obs.output_share, 2), '') as candidates_list,
              COALESCE(primary_pipeline.rendering_type_id || ':' || ROUND(obs.output_share, 2), '') as rendering_type_candidates_list,
              COALESCE((SELECT related_rendering_type_candidates_list FROM related_rendering_type_candidate_list), '') as related_rendering_type_candidates_list,
              COALESCE((SELECT features_list FROM feature_list), '') as features_list,
              COALESCE(primary_pipeline.doc_path, '') AS doc_path
            FROM ${layer_signals} obs LEFT JOIN pipeline_metadata primary_pipeline ON primary_pipeline.output_path = obs.observed_path

    save_as: pipeline_result
  - id: subvariants
    type: atomic
    name: 确定子变体
    display:
      level: detail
      title: 子变体检测
    sql: |2-

            SELECT
              CASE WHEN primary_basis IN ('hwui_blast','surfaceview_blast') THEN 'BLAST' ELSE 'UNKNOWN' END AS buffer_mode,
              CASE primary_basis WHEN 'flutter_surface_impeller' THEN 'IMPELLER' WHEN 'flutter_surface_skia' THEN 'SKIA'
                ELSE 'UNKNOWN' END AS flutter_engine,
              CASE WHEN primary_basis = 'webview_functor' THEN 'GL_FUNCTOR' ELSE 'UNKNOWN' END AS webview_mode,
              'UNKNOWN' AS game_engine
            FROM ${pipeline_result}

    save_as: subvariants
  - id: trace_requirements
    type: atomic
    name: 检查采集完整性
    display:
      level: detail
      title: 采集建议
    sql: |2-

            WITH

            producing_packages AS (
              SELECT CASE WHEN instr(p.name, ':') > 0 THEN substr(p.name, 1, instr(p.name, ':') - 1)
                ELSE p.name END AS pkg
              FROM slice s JOIN thread_track tt ON tt.id = s.track_id
              JOIN thread t USING (utid) JOIN process p USING (upid)
              WHERE '${package}' = '' AND p.name GLOB '*.*' AND p.name NOT GLOB '/*'
                AND p.name NOT IN ('com.android.systemui', 'system_server')
                AND (s.name IN ('queueBuffer', 'eglSwapBuffers', 'vkQueuePresentKHR', 'unlockCanvasAndPost')
                  OR (t.name = 'RenderThread' AND s.name GLOB 'DrawFrame*'))
              GROUP BY pkg HAVING COUNT(DISTINCT s.ts) >= 2
            ),
            target AS (
              SELECT CASE WHEN '${package}' != '' THEN '${package}'
                WHEN COUNT(*) = 1 THEN MIN(pkg) END AS pkg FROM producing_packages
            ),
            app_filter_upids AS (
              SELECT p.upid FROM process p, target
              WHERE p.name = target.pkg OR instr(p.name, target.pkg || ':') = 1
            )
            SELECT
              CASE
                WHEN NOT EXISTS (
                  SELECT 1
                  FROM slice s
                  JOIN thread_track tt ON s.track_id = tt.id
                  JOIN thread t ON tt.utid = t.utid
                  JOIN process p ON t.upid = p.upid
                  WHERE p.upid IN (SELECT upid FROM app_filter_upids)
                    AND t.name = 'RenderThread'
                    AND s.name GLOB 'DrawFrame*'
                  LIMIT 1
                )
                THEN 'gfx: RenderThread/DrawFrame slices missing (enable atrace: gfx)'
                ELSE NULL
              END as hint_gfx,
              CASE
                WHEN NOT EXISTS (
                  SELECT 1
                  FROM slice s
                  JOIN thread_track tt ON s.track_id = tt.id
                  JOIN thread t ON tt.utid = t.utid
                  JOIN process p ON t.upid = p.upid
                  WHERE p.upid IN (SELECT upid FROM app_filter_upids)
                    AND s.name GLOB '*Choreographer#doFrame*'
                  LIMIT 1
                )
                THEN 'input: Choreographer#doFrame missing (enable atrace: input/view)'
                ELSE NULL
              END as hint_input,
              CASE
                WHEN NOT EXISTS (
                  SELECT 1
                  FROM slice s
                  JOIN thread_track tt ON s.track_id = tt.id
                  JOIN thread t ON tt.utid = t.utid
                  JOIN process p ON t.upid = p.upid
                  WHERE p.upid IN (SELECT upid FROM app_filter_upids)
                    AND (
                      s.name GLOB '*BLASTBufferQueue*'
                      OR s.name GLOB '*applyTransaction*'
                      OR s.name GLOB '*queueBuffer*'
                      OR s.name GLOB '*dequeueBuffer*'
                    )
                  LIMIT 1
                )
                THEN 'BufferQueue/Transaction slices missing (enable atrace: gfx/sf)'
                ELSE NULL
              END as hint_buffer,
              CASE
                WHEN NOT EXISTS (SELECT 1 FROM process p WHERE p.name IN ('surfaceflinger','/system/bin/surfaceflinger') LIMIT 1)
                THEN 'SurfaceFlinger process missing (need system tracing / root on some devices)'
                ELSE NULL
              END as hint_sf,
              CASE
                WHEN NOT EXISTS (SELECT 1 FROM actual_frame_timeline_slice LIMIT 1)
                THEN 'FrameTimeline missing (enable SurfaceFlinger FrameTimeline / Android 12+)'
                ELSE NULL
              END as hint_timeline

    save_as: trace_requirements
  - id: active_rendering_processes
    type: atomic
    name: 识别活跃渲染进程
    display:
      level: detail
      title: 活跃渲染进程
    sql: |2-

            WITH

            producing_packages AS (
              SELECT CASE WHEN instr(p.name, ':') > 0 THEN substr(p.name, 1, instr(p.name, ':') - 1)
                ELSE p.name END AS pkg
              FROM slice s JOIN thread_track tt ON tt.id = s.track_id
              JOIN thread t USING (utid) JOIN process p USING (upid)
              WHERE '${package}' = '' AND p.name GLOB '*.*' AND p.name NOT GLOB '/*'
                AND p.name NOT IN ('com.android.systemui', 'system_server')
                AND (s.name IN ('queueBuffer', 'eglSwapBuffers', 'vkQueuePresentKHR', 'unlockCanvasAndPost')
                  OR (t.name = 'RenderThread' AND s.name GLOB 'DrawFrame*'))
              GROUP BY pkg HAVING COUNT(DISTINCT s.ts) >= 2
            ),
            target AS (
              SELECT CASE WHEN '${package}' != '' THEN '${package}'
                WHEN COUNT(*) = 1 THEN MIN(pkg) END AS pkg FROM producing_packages
            ),
            app_filter_upids AS (
              SELECT p.upid FROM process p, target
              WHERE p.name = target.pkg OR instr(p.name, target.pkg || ':') = 1
            ),
            marker_slices AS (
              SELECT
                p.upid,
                p.name as process_name,
                t.tid,
                t.name as thread_name
              FROM slice s
              JOIN thread_track tt ON s.track_id = tt.id
              JOIN thread t ON tt.utid = t.utid
              JOIN process p ON t.upid = p.upid
              WHERE p.upid IN (SELECT upid FROM app_filter_upids)
                AND p.name IS NOT NULL
                AND s.name IS NOT NULL
                AND (
                  (t.name = 'RenderThread' AND s.name GLOB 'DrawFrame*')
                  OR (s.name GLOB '*eglSwapBuffers*')
                  OR (s.name GLOB '*vkQueuePresentKHR*')
                  OR (s.name GLOB '*Swappy*')
                  OR (s.name GLOB '*FramePacing*')
                  OR (s.name GLOB '*updateTexImage*')
                  OR (s.name GLOB '*Rasterizer::DrawToSurfaces*')
                  OR (s.name GLOB '*Engine::BeginFrame*')
                  OR (s.name GLOB '*EntityPass*')
                  OR (s.name GLOB '*lockCanvas*')
                  OR (s.name GLOB '*unlockCanvasAndPost*')
                )
            )
            SELECT
              upid,
              process_name,
              COUNT(*) as frame_count,
              MAX(CASE WHEN thread_name = 'RenderThread' THEN tid ELSE NULL END) as render_thread_tid
            FROM marker_slices
            GROUP BY upid
            HAVING frame_count > 5
            ORDER BY frame_count DESC
            LIMIT 10

    save_as: active_rendering_processes
  - id: extra_rhythm_signals
    type: atomic
    name: 额外节奏源 (辅助证据)
    display:
      level: detail
      title: 额外节奏源
    sql: |2-

            WITH

            producing_packages AS (
              SELECT CASE WHEN instr(p.name, ':') > 0 THEN substr(p.name, 1, instr(p.name, ':') - 1)
                ELSE p.name END AS pkg
              FROM slice s JOIN thread_track tt ON tt.id = s.track_id
              JOIN thread t USING (utid) JOIN process p USING (upid)
              WHERE '${package}' = '' AND p.name GLOB '*.*' AND p.name NOT GLOB '/*'
                AND p.name NOT IN ('com.android.systemui', 'system_server')
                AND (s.name IN ('queueBuffer', 'eglSwapBuffers', 'vkQueuePresentKHR', 'unlockCanvasAndPost')
                  OR (t.name = 'RenderThread' AND s.name GLOB 'DrawFrame*'))
              GROUP BY pkg HAVING COUNT(DISTINCT s.ts) >= 2
            ),
            target AS (
              SELECT CASE WHEN '${package}' != '' THEN '${package}'
                WHEN COUNT(*) = 1 THEN MIN(pkg) END AS pkg FROM producing_packages
            ),
            app_filter_upids AS (
              SELECT p.upid FROM process p, target
              WHERE p.name = target.pkg OR instr(p.name, target.pkg || ':') = 1
            ),
            app_slices AS (
              SELECT s.name as slice_name, COUNT(*) as cnt
              FROM slice s
              JOIN thread_track tt ON s.track_id = tt.id
              JOIN thread t ON tt.utid = t.utid
              JOIN process p ON t.upid = p.upid
              WHERE s.name IS NOT NULL
                AND p.upid IN (SELECT upid FROM app_filter_upids)
              GROUP BY s.name
            )
            SELECT
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*Swappy*'), 0) as swappy_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*SwappyVk_*'), 0) as swappy_vk_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*AChoreographer*'), 0) as achoreographer_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*setFrameRate*'), 0) as set_frame_rate_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*setFrameRateCategory*'), 0) as set_frame_rate_category_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*PlayerLoop*' OR slice_name GLOB '*FEngineLoop*' OR slice_name GLOB '*MainLoop*'), 0) as engine_main_loop_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*processCaptureRequest*' OR slice_name GLOB '*processCaptureResult*'), 0) as camera_capture_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*releaseOutputBuffer*' OR slice_name GLOB '*MediaCodec*'), 0) as mediacodec_pacing_count,
              CASE
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*Swappy*' OR slice_name GLOB '*SwappyVk_*'), 0) > 0 THEN 'swappy_pacing'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*AChoreographer*'), 0) > 0 THEN 'achoreographer'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*PlayerLoop*' OR slice_name GLOB '*FEngineLoop*' OR slice_name GLOB '*MainLoop*'), 0) > 0 THEN 'engine_main_loop'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*processCaptureRequest*'), 0) > 0 THEN 'camera_request_activity'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*releaseOutputBuffer*'), 0) > 0 THEN 'video_codec_pacing'
                ELSE 'unknown'
              END as primary_rhythm_source

    save_as: extra_rhythm_signals
  - id: bufferqueue_path_signals
    type: atomic
    name: BufferQueue 路径证据
    display:
      level: detail
      title: BufferQueue 路径
    sql: |2-

            WITH

            producing_packages AS (
              SELECT CASE WHEN instr(p.name, ':') > 0 THEN substr(p.name, 1, instr(p.name, ':') - 1)
                ELSE p.name END AS pkg
              FROM slice s JOIN thread_track tt ON tt.id = s.track_id
              JOIN thread t USING (utid) JOIN process p USING (upid)
              WHERE '${package}' = '' AND p.name GLOB '*.*' AND p.name NOT GLOB '/*'
                AND p.name NOT IN ('com.android.systemui', 'system_server')
                AND (s.name IN ('queueBuffer', 'eglSwapBuffers', 'vkQueuePresentKHR', 'unlockCanvasAndPost')
                  OR (t.name = 'RenderThread' AND s.name GLOB 'DrawFrame*'))
              GROUP BY pkg HAVING COUNT(DISTINCT s.ts) >= 2
            ),
            target AS (
              SELECT CASE WHEN '${package}' != '' THEN '${package}'
                WHEN COUNT(*) = 1 THEN MIN(pkg) END AS pkg FROM producing_packages
            ),
            app_filter_upids AS (
              SELECT p.upid FROM process p, target
              WHERE p.name = target.pkg OR instr(p.name, target.pkg || ':') = 1
            ),
            app_slices AS (
              SELECT s.name as slice_name, COUNT(*) as cnt
              FROM slice s
              JOIN thread_track tt ON s.track_id = tt.id
              JOIN thread t ON tt.utid = t.utid
              JOIN process p ON t.upid = p.upid
              WHERE s.name IS NOT NULL
                AND p.upid IN (SELECT upid FROM app_filter_upids)
              GROUP BY s.name
            )
            SELECT
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*BLASTBufferQueue*'), 0) as blast_bq_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*applyTransaction*'), 0) as apply_transaction_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE (slice_name = 'queueBuffer' OR slice_name GLOB 'queueBuffer - *')), 0) as queue_buffer_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*updateTexImage*'), 0) as update_tex_image_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*lockCanvas*'), 0) as lock_canvas_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*unlockCanvasAndPost*'), 0) as unlock_canvas_post_count,
              COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*ASurfaceTransaction*'), 0) as asurface_transaction_count,
              CASE
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*BLASTBufferQueue*'), 0) > 0
                     AND COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*applyTransaction*'), 0) > 0
                  THEN 'BBQ_TRANSACTION_INPROC'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*ASurfaceTransaction*'), 0) > 0
                     AND COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*BLASTBufferQueue*'), 0) = 0
                  THEN 'SURFACECONTROL_TRANSACTION_DIRECT'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*updateTexImage*'), 0) > 0
                  THEN 'TEXTURE_UPDATE_OBSERVED'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*lockCanvas*' OR slice_name GLOB '*unlockCanvasAndPost*'), 0) > 0
                     AND COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*BLASTBufferQueue*'), 0) = 0
                  THEN 'CANVAS_ACTIVITY_OBSERVED'
                WHEN COALESCE((SELECT SUM(cnt) FROM app_slices WHERE (slice_name = 'queueBuffer' OR slice_name GLOB 'queueBuffer - *')), 0) > 0
                     AND COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*BLASTBufferQueue*'), 0) = 0
                     AND COALESCE((SELECT SUM(cnt) FROM app_slices WHERE slice_name GLOB '*applyTransaction*'), 0) = 0
                  THEN 'QUEUE_OBSERVED'
                ELSE 'UNKNOWN'
              END as bufferqueue_path

    save_as: bufferqueue_path_signals
