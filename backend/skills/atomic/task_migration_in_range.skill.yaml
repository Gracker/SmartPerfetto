# =============================================================================
# 任务迁移分析 (Composite Skill)
# =============================================================================
# 分析指定时间范围内线程在大小核之间的迁移情况
# 迁移是观测；Cache miss 与性能损失需独立计数器/关键路径证据
#
# v2.0: 使用共享 _cpu_topology 视图替代内联 CTE，动态检测大小核拓扑

name: task_migration_in_range
version: "2.0"
type: composite
category: kernel
tier: B

meta:
  display_name: "任务迁移分析"
  description: "分析线程在大小核之间的迁移频率（动态拓扑检测）"
  icon: "swap_horiz"
  tags: [sched, migration, kernel, composite]

identity:
  policy: verify_if_present
  scope: process
  aliases: [package]

inputs:
  - name: start_ts
    type: timestamp
    required: true
    description: "分析起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: true
    description: "分析结束时间戳(ns)"
  - name: package
    type: string
    required: false
    description: "目标进程名（精确匹配，含 name:* 子进程）"

steps:
  # ========== 初始化 CPU 拓扑视图（供后续步骤 JOIN）==========
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # ========== 任务迁移分析 ==========
  - id: migration_analysis
    type: atomic
    name: "大小核迁移分析"
    optional: true
    display:
      level: detail
      layer: deep
      title: "大小核迁移"
      columns:
        - {name: window_id, label: "window_id", type: number, hidden: true}
        - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
        - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
        - {name: upid, label: "upid", type: number, hidden: true}
        - {name: utid, label: "utid", type: number, hidden: true}
        - {name: tid, label: "tid", type: number, hidden: true}
        - {name: migration_evidence, label: "migration_evidence", type: string, hidden: true}
        - name: thread_name
          label: "线程"
          type: string
        - name: migration_count
          label: "迁移次数"
          type: number
        - name: big_to_little
          label: "大→小"
          type: number
        - name: little_to_big
          label: "小→大"
          type: number
        - name: big_core_pct
          label: "大核占比"
          type: percentage
          format: percentage
        - name: unique_cpus
          label: "使用核心数"
          type: number
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_sched_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}'='' OR p.name='${package}' OR p.name GLOB '${package}:*')
      ),
      runs AS (
       SELECT s.*,t.name AS thread_name,t.tid,
         LAG(s.ucpu) OVER (PARTITION BY s.window_id,s.utid ORDER BY s.raw_start_ts,s.sched_id) AS prev_ucpu,
         LAG(s.core_type) OVER (PARTITION BY s.window_id,s.utid ORDER BY s.raw_start_ts,s.sched_id) AS prev_core_type
       FROM system_sched_spans s JOIN system_target_threads tt ON tt.window_id=s.window_id AND tt.utid=s.utid AND tt.upid=s.upid
       JOIN thread t ON t.utid=s.utid
      )
      SELECT window_id,window_start_ts,window_end_ts,upid,utid,tid,thread_name,
       SUM(CASE WHEN prev_ucpu IS NOT NULL AND prev_ucpu!=ucpu THEN 1 ELSE 0 END) AS migration_count,
       SUM(CASE WHEN prev_core_type IN ('prime','big','medium') AND core_type='little' THEN 1 ELSE 0 END) AS big_to_little,
       SUM(CASE WHEN prev_core_type='little' AND core_type IN ('prime','big','medium') THEN 1 ELSE 0 END) AS little_to_big,
       SUM(CASE WHEN core_type IN ('prime','big','medium') THEN dur_ns ELSE 0 END)*100.0/SUM(dur_ns) AS big_core_pct,
       COUNT(DISTINCT ucpu) AS unique_cpus,
       'migration_observation_not_cache_miss_or_affinity_proof' AS migration_evidence
      FROM runs GROUP BY window_id,utid ORDER BY migration_count DESC
    save_as: migration_data

output:
  format: structured
