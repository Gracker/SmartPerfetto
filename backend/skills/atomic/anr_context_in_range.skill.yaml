# =============================================================================
# ANR Context in Range (Atomic Skill)
# =============================================================================
# Extracts the first ANR event data for use as a time-window anchor
# in subsequent analysis steps. Replaces the `first_anr` CTE that was
# duplicated 5× in anr_analysis.skill.yaml.
#
# Output fields used as parameters by consumers:
#   - anr_ts: ANR timestamp (for window end)
#   - timeout_ns: ANR timeout in nanoseconds
#   - window_start_ts: anr_ts - timeout_ns, computed here so a caller can pass
#     it as a parameter without template arithmetic on these decimal strings
#   - timeout_source: whether timeout_ns came from actual duration, stdlib default, or heuristic fallback
#   - process_name, pid, upid, anr_type, error_id: ANR metadata
#
# Usage:
#   - id: get_anr_context
#     type: skill
#     skill: anr_context_in_range
#     params:
#       process_name: "${process_name}"
#       package: "${package}"
#     save_as: anr_ctx
#   Then use: ${anr_ctx.data[0].anr_ts}, ${anr_ctx.data[0].timeout_ns}
# =============================================================================

name: anr_context_in_range
version: "1.0"
type: atomic
category: app_lifecycle
tier: B

meta:
  display_name: "ANR 上下文提取"
  description: "提取首个 ANR 事件的时间窗口参数，供后续分析步骤复用"
  icon: "error"
  tags: [anr, context, atomic]

prerequisites:
  modules:
    - android.anrs

inputs:
  - name: process_name
    type: string
    required: false
    description: "目标进程名"
  - name: package
    type: string
    required: false
    description: "应用包名（process_name 的别名）"
  - name: anr_type
    type: string
    required: false
    description: "ANR 类型过滤"

display:
  level: summary
  layer: overview
  title: "ANR 上下文"
  columns:
    - name: anr_ts
      label: "ANR 时间"
      type: timestamp
      clickAction: navigate_timeline
    - name: window_start_ts
      label: "窗口起点"
      type: timestamp
      clickAction: navigate_timeline
    - name: timeout_ns
      label: "超时时长(ns)"
      type: duration
      unit: ns
    - name: timeout_ms
      label: "超时时长(ms)"
      type: duration
      format: duration_ms
      unit: ms
    - name: timeout_source
      label: "超时来源"
      type: string
    - name: process_name
      label: "进程名"
      type: string
    - name: upid
      label: "UPID"
      type: number
    - name: anr_type
      label: "ANR 类型"
      type: string

sql_fragments:
  - fragments/anr_matched.sql

sql: |
  -- The first matching ANR and the window before it (fragments/anr_matched.sql).
  SELECT
    printf('%d', ts) as anr_ts,
    printf('%d', CAST(analysis_timeout_ms * 1e6 AS INTEGER)) as timeout_ns,
    printf('%d', ts - CAST(analysis_timeout_ms * 1e6 AS INTEGER)) as window_start_ts,
    ROUND(analysis_timeout_ms, 2) as timeout_ms,
    timeout_source,
    process_name,
    pid,
    upid,
    anr_type,
    error_id
  FROM anr_matched
  ORDER BY ts ASC
  LIMIT 1

output:
  format: structured
