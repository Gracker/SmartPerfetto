name: thread_preemption_handoffs_in_range
version: "1.0"
type: atomic
category: kernel
tier: B
meta:
  display_name: "实际抢占交接与目标等待"
  description: "范围内可定位的系统观测，保留覆盖与缺失；不单凭相关性判断根因"
  icon: "analytics"
  tags: [system, scheduling, evidence, range]
prerequisites:
  modules: [linux.cpu.frequency]
identity:
  policy: verify_if_present
  scope: process
  aliases: [package]
process_scope:
  role: target
  binding: effective_target_processes
sql_fragments:
  - fragments/effective_target_processes.sql
  - fragments/system_target_threads.sql
inputs:
  - {name: start_ts, type: timestamp, required: true}
  - {name: end_ts, type: timestamp, required: true}
  - {name: package, type: string, required: false}
  - {name: utid, type: number, required: false}
investigation_evidence:
  window: {start: window_start_ts, end: window_end_ts}
  identity: {upid: upid, utid: utid, cpu: cpu, ucpu: ucpu}
  context: {window_id: window_id, role: role}
  metrics:
    - domain: preemption
      metric_id: system.thread.preemption.handoff
      value: peer_sched_id
      status: handoff_evidence
display:
  level: detail
  layer: deep
  title: "实际抢占交接与目标等待"
  columns:
    - {name: window_id, label: "window_id", type: number, hidden: true}
    - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
    - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
    - {name: window_dur_ns, label: "window_dur_ns", type: duration, unit: ns, hidden: true}
    - {name: upid, label: "upid", type: number}
    - {name: pid, label: "pid", type: number}
    - {name: process_name, label: "process_name", type: string}
    - {name: utid, label: "utid", type: number}
    - {name: tid, label: "tid", type: number}
    - {name: thread_name, label: "thread_name", type: string}
    - {name: role, label: "role", type: string}
    - {name: sched_id, label: "sched_id", type: number, hidden: true}
    - {name: ucpu, label: "ucpu", type: number}
    - {name: cpu, label: "cpu", type: number}
    - {name: raw_start_ts, label: "raw_start_ts", type: timestamp, unit: ns, hidden: true}
    - {name: raw_dur, label: "raw_dur", type: duration, unit: ns, hidden: true}
    - {name: raw_end_ts, label: "raw_end_ts", type: timestamp, unit: ns, hidden: true}
    - {name: switch_ts, label: "switch_ts", type: timestamp, unit: ns}
    - {name: priority, label: "priority", type: number}
    - {name: end_state, label: "end_state", type: string}
    - {name: peer_sched_id, label: "peer_sched_id", type: number, hidden: true}
    - {name: peer_utid, label: "peer_utid", type: number}
    - {name: peer_is_idle, label: "peer_is_idle", type: number}
    - {name: peer_role, label: "peer_role", type: string}
    - {name: peer_upid, label: "peer_upid", type: number}
    - {name: peer_tid, label: "peer_tid", type: number}
    - {name: peer_thread_name, label: "peer_thread_name", type: string}
    - {name: peer_process_name, label: "peer_process_name", type: string}
    - {name: peer_start_ts, label: "peer_start_ts", type: timestamp, unit: ns}
    - {name: peer_raw_dur, label: "peer_raw_dur", type: number}
    - {name: peer_priority, label: "peer_priority", type: number}
    - {name: peer_end_state, label: "peer_end_state", type: string}
    - {name: runnable_state_id, label: "runnable_state_id", type: number, hidden: true}
    - {name: runnable_start_ts, label: "runnable_start_ts", type: timestamp, unit: ns}
    - {name: runnable_raw_dur, label: "runnable_raw_dur", type: number}
    - {name: runnable_end_ts, label: "runnable_end_ts", type: timestamp, unit: ns}
    - {name: runnable_overlap_ns, label: "runnable_overlap_ns", type: duration, unit: ns}
    - {name: runnable_right_censored, label: "runnable_right_censored", type: number}
    - {name: handoff_evidence, label: "handoff_evidence", type: string}
    - {name: scheduling_policy_evidence, label: "scheduling_policy_evidence", type: string}
    - {name: evidence_scope, label: "evidence_scope", type: string}
sql: |
  WITH system_windows AS (
    SELECT 0 AS window_id, ${start_ts} AS window_start_ts, ${end_ts} AS window_end_ts
  )
  SELECT w.window_id,w.window_start_ts,w.window_end_ts,w.window_end_ts-w.window_start_ts AS window_dur_ns,
    tt.upid,p.pid,p.name AS process_name,tt.utid,t.tid,t.name AS thread_name,tt.role,
    s.id AS sched_id,s.ucpu,s.cpu,s.ts AS raw_start_ts,s.dur AS raw_dur,s.ts+s.dur AS raw_end_ts,
    s.ts+s.dur AS switch_ts,s.priority,s.end_state,
    n.id AS peer_sched_id,n.utid AS peer_utid,pt.upid AS peer_upid,pt.tid AS peer_tid,
    pt.is_idle AS peer_is_idle,
    CASE WHEN n.id IS NULL THEN 'successor_unavailable'
      WHEN pt.is_idle=1 THEN 'idle_not_competing_task'
      WHEN pt.is_idle=0 THEN 'scheduled_task_not_proven_wait_cause'
      ELSE 'idle_identity_unknown' END AS peer_role,
    pt.name AS peer_thread_name,pp.name AS peer_process_name,n.ts AS peer_start_ts,
    n.dur AS peer_raw_dur,n.priority AS peer_priority,n.end_state AS peer_end_state,
    r.id AS runnable_state_id,r.ts AS runnable_start_ts,r.dur AS runnable_raw_dur,
    CASE WHEN r.dur=-1 THEN NULL ELSE r.ts+r.dur END AS runnable_end_ts,
    CASE WHEN r.id IS NOT NULL THEN MIN(CASE WHEN r.dur=-1 THEN (SELECT end_ts FROM trace_bounds)
      ELSE r.ts+r.dur END,w.window_end_ts)-r.ts END AS runnable_overlap_ns,
    CASE WHEN r.id IS NULL THEN NULL ELSE r.dur=-1 OR r.ts+r.dur>w.window_end_ts END AS runnable_right_censored,
    CASE WHEN n.id IS NULL THEN 'partial' ELSE 'observed' END AS handoff_evidence,
    'not_recorded_in_sched_slice' AS scheduling_policy_evidence,
    'direct_handoff_not_entire_wait_cause' AS evidence_scope
  FROM system_windows w JOIN system_target_threads tt ON tt.window_id=w.window_id
  JOIN thread t ON t.utid=tt.utid JOIN process p ON p.upid=tt.upid
  JOIN sched_slice s ON s.utid=tt.utid AND s.dur>0 AND s.end_state='R+'
    AND s.ts+s.dur>=w.window_start_ts AND s.ts+s.dur<w.window_end_ts
  LEFT JOIN sched_slice n ON n.ucpu=s.ucpu AND n.ts=s.ts+s.dur AND n.id!=s.id
  LEFT JOIN thread pt ON pt.utid=n.utid LEFT JOIN process pp ON pp.upid=pt.upid
  LEFT JOIN thread_state r ON r.utid=s.utid AND r.ts=s.ts+s.dur AND r.state='R+'
  WHERE w.window_end_ts>w.window_start_ts
  ORDER BY w.window_id,s.ts+s.dur,s.id
output:
  format: structured
