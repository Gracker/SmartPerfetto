# =============================================================================
# Bitmap 内存占用（B 级 atomic）
# =============================================================================
# 使用 android.bitmaps counter 模块统计每进程 Bitmap 内存占用；当 trace
# 包含 ART heap graph 时，再使用 upstream android.memory.heap_graph.bitmap
# 补充 Bitmap width/height/density/storage/source attribution。
#
# v1.2: 进程范围改用 fragments/heap_target_process.sql（与其它堆 Skill 同一规则：
#   upid 优先；进程名精确或 name:* 子进程，不做前缀匹配；无匹配时退回无进程名的
#   dump 并标 process_name_unavailable_upid_fallback）。旧过滤在 package 为空时恒真，
#   process_name 不生效。counter 表是时间序列，bitmap_memory 改为每进程一行（峰值采样）。
# v1.3: 新增 bitmap_live_shape。Bitmap Memory / Bitmap Count 是存活集 counter（Bitmap
#   释放时回落），按进程给出时间窗内的涨落步数和同期 ART GC 次数：期间发生过 GC 仍从不
#   回落 = 存活集只增不减，与"分配后被回收"的锯齿形态可以直接区分。RSS 只计已触碰的
#   驻留页，像素未写入的页不进 RSS，所以 RSS 不涨不能否定 Bitmap 存活集增长。
#   GC 次数按 fragments/art_gc_names.sql 的 collection 名称数 slice，不加载
#   android.garbage_collection（该模块在大 trace 上要数秒）。

name: android_bitmap_memory_per_process
version: "1.3"
type: atomic
category: memory
tier: B

meta:
  display_name: "Bitmap 内存（按进程）"
  description: "每进程 Bitmap counter 峰值与存活集增长形状、heap graph metadata 和跨进程来源归因"
  icon: "image"
  tags: [memory, bitmap, image, heap_graph, leak, atomic]

triggers:
  keywords:
    zh: [Bitmap, 位图, 图片内存, Bitmap 泄漏]
    en: [bitmap, bitmap memory, bitmap leak]

prerequisites:
  modules:
    - android.bitmaps
    - android.memory.heap_graph.bitmap

inputs:
  - name: process_name
    type: string
    required: false
    description: "目标进程名（精确或 name:* 子进程，见 fragments/heap_target_process.sql）；为空则统计全部进程；无匹配时回退到没有进程名的 dump（如 .hprof）"
  - name: package
    type: string
    required: false
    description: "目标包名（精确或 name:* 子进程）；process_name 为空时使用"
  - name: upid
    type: integer
    required: false
    description: "可选的稳定进程身份；进程名不可用时（.hprof）用它限定进程"
  - name: start_ts
    type: timestamp
    required: false
    description: "bitmap_live_shape 的分析起始时间戳(ns)"
  - name: end_ts
    type: timestamp
    required: false
    description: "bitmap_live_shape 的分析结束时间戳(ns)"
  - name: bitmap_growth_min_mb
    type: number
    required: false
    default: 32
    description: "Bitmap 存活集净增长低于该值(MB)时只报 below_growth_threshold，不做形状判别，默认 32"

steps:
  - id: bitmap_memory
    type: atomic
    name: "Bitmap 内存按进程"
    display:
      level: detail
      layer: list
      title: "Bitmap 内存占用"
      columns:
        - name: process_name
          label: "进程"
          type: string
        - name: bitmap_count
          label: "峰值时 Bitmap 数量"
          type: number
          format: compact
        - name: total_bytes
          label: "Bitmap 内存峰值"
          type: bytes
          format: compact
        - name: peak_ts
          label: "峰值时刻"
          type: timestamp
        - name: process_identity
          label: "进程身份"
          type: string
    sql_fragments:
      - fragments/heap_target_process.sql
    # android_bitmap_counters_per_process 是按 ts 的时间序列，每进程取内存峰值那一个采样
    sql: |
      WITH ranked AS (
        SELECT
          t.process_name,
          t.process_identity,
          c.ts,
          c.bitmap_count,
          c.bitmap_memory,
          ROW_NUMBER() OVER (PARTITION BY c.upid ORDER BY c.bitmap_memory DESC, c.ts) AS rn
        FROM android_bitmap_counters_per_process c
        JOIN heap_target_process t USING (upid)
        WHERE c.bitmap_memory IS NOT NULL
      )
      SELECT
        process_name,
        bitmap_count,
        bitmap_memory AS total_bytes,
        ts AS peak_ts,
        process_identity
      FROM ranked
      WHERE rn = 1
      ORDER BY total_bytes DESC
      LIMIT 30

  - id: bitmap_live_shape
    type: atomic
    name: "Bitmap 存活集形状"
    display:
      level: summary
      layer: overview
      title: "Bitmap 存活集增长形状"
      title_i18n: {en: "Bitmap Live-Set Growth Shape"}
      row_semantics: per_entity
      columns:
        - name: process_name
          label: "进程"
          type: string
        - name: upid
          label: "UPID"
          type: number
        - name: samples
          label: "样本数"
          type: number
          format: compact
        - name: span_s
          label: "覆盖时长(s)"
          type: number
        - name: first_mb
          label: "初始 Bitmap 内存(MB)"
          type: number
        - name: last_mb
          label: "结束 Bitmap 内存(MB)"
          type: number
        - name: net_growth_mb
          label: "净增长(MB)"
          type: number
        - name: rise_steps
          label: "上升步数"
          type: number
          format: compact
        - name: drop_steps
          label: "回落步数"
          type: number
          format: compact
          semantics: >-
            Count of samples where Bitmap Memory decreased. Bitmap Memory is a live-set counter that drops when a
            bitmap is freed, so zero drops across GCs means nothing was released in the span.
        - name: max_single_drop_mb
          label: "最大单次回落(MB)"
          type: number
        - name: first_count
          label: "初始 Bitmap 数"
          type: number
          format: compact
        - name: last_count
          label: "结束 Bitmap 数"
          type: number
          format: compact
        - name: gcs_in_span
          label: "期间 GC 次数"
          type: number
          format: compact
          semantics: >-
            ART collector runs (slices named like "* concurrent copying GC") of this process between the first and
            last Bitmap sample.
        - name: shape
          label: "形状"
          label_i18n: {en: "Shape"}
          type: string
          semantics: >-
            retained_growth_across_gc: grew past threshold, never dropped, GC ran in span, so the live set only grew.
            RSS omits untouched pixel pages; flat RSS does not contradict it.
        - name: process_identity
          label: "进程身份"
          type: string
    sql_fragments:
      - fragments/heap_target_process.sql
      - fragments/art_gc_names.sql
    sql: |
      WITH
      input AS (
        SELECT
          COALESCE(${bitmap_growth_min_mb|32}, 32) AS bitmap_growth_min_mb,
          COALESCE(${start_ts}, 0) AS start_ts,
          COALESCE(${end_ts}, (SELECT end_ts FROM trace_bounds)) AS end_ts
      ),
      mem AS (
        SELECT
          m.upid,
          m.ts,
          m.value,
          ROW_NUMBER() OVER (PARTITION BY m.upid ORDER BY m.ts ASC) AS rn_first,
          ROW_NUMBER() OVER (PARTITION BY m.upid ORDER BY m.ts DESC) AS rn_last,
          m.value - LAG(m.value) OVER (PARTITION BY m.upid ORDER BY m.ts ASC) AS delta
        FROM android_bitmap_memory m
        JOIN heap_target_process USING (upid)
        CROSS JOIN input
        WHERE m.ts >= input.start_ts
          AND m.ts < input.end_ts
      ),
      counts AS (
        SELECT
          upid,
          MAX(CASE WHEN rn_first = 1 THEN value END) AS first_count,
          MAX(CASE WHEN rn_last = 1 THEN value END) AS last_count
        FROM (
          SELECT
            c.upid,
            c.value,
            ROW_NUMBER() OVER (PARTITION BY c.upid ORDER BY c.ts ASC) AS rn_first,
            ROW_NUMBER() OVER (PARTITION BY c.upid ORDER BY c.ts DESC) AS rn_last
          FROM android_bitmap_count c
          JOIN heap_target_process USING (upid)
          CROSS JOIN input
          WHERE c.ts >= input.start_ts
            AND c.ts < input.end_ts
        )
        GROUP BY upid
      ),
      shapes AS (
        SELECT
          upid,
          COUNT(*) AS samples,
          MIN(ts) AS first_ts,
          MAX(ts) AS last_ts,
          (MAX(CASE WHEN rn_last = 1 THEN value END) - MAX(CASE WHEN rn_first = 1 THEN value END)) / 1048576.0
            AS net_growth_mb,
          MAX(CASE WHEN rn_first = 1 THEN value END) AS first_bytes,
          MAX(CASE WHEN rn_last = 1 THEN value END) AS last_bytes,
          SUM(CASE WHEN delta > 0 THEN 1 ELSE 0 END) AS rise_steps,
          SUM(CASE WHEN delta < 0 THEN 1 ELSE 0 END) AS drop_steps,
          COALESCE(-MIN(CASE WHEN delta < 0 THEN delta END), 0) AS max_single_drop_bytes
        FROM mem
        GROUP BY upid
      ),
      gc_runs AS (
        SELECT t.upid, s.ts
        FROM slice s
        JOIN thread_track tt ON s.track_id = tt.id
        JOIN thread t USING (utid)
        WHERE s.name GLOB '*GC*'
          AND t.upid IN (SELECT upid FROM shapes)
          AND EXISTS (
            SELECT 1 FROM art_gc_slice_name_patterns n
            WHERE n.gc_kind = 'collection' AND s.name GLOB n.pattern
          )
      ),
      gcs AS (
        SELECT sh.upid, COUNT(g.ts) AS gcs_in_span
        FROM shapes sh
        LEFT JOIN gc_runs g
          ON g.upid = sh.upid
          AND g.ts >= sh.first_ts
          AND g.ts <= sh.last_ts
        GROUP BY sh.upid
      )
      SELECT
        t.process_name,
        s.upid,
        s.samples,
        ROUND((s.last_ts - s.first_ts) / 1e9, 2) AS span_s,
        ROUND(s.first_bytes / 1048576.0, 2) AS first_mb,
        ROUND(s.last_bytes / 1048576.0, 2) AS last_mb,
        ROUND(s.net_growth_mb, 2) AS net_growth_mb,
        s.rise_steps,
        s.drop_steps,
        ROUND(s.max_single_drop_bytes / 1048576.0, 2) AS max_single_drop_mb,
        c.first_count,
        c.last_count,
        g.gcs_in_span,
        CASE
          WHEN s.net_growth_mb < input.bitmap_growth_min_mb THEN 'below_growth_threshold'
          WHEN s.drop_steps = 0 AND g.gcs_in_span > 0 THEN 'retained_growth_across_gc'
          WHEN s.drop_steps = 0 THEN 'retained_growth_no_gc_in_span'
          ELSE 'growth_with_release'
        END AS shape,
        t.process_identity
      FROM shapes s
      JOIN heap_target_process t USING (upid)
      CROSS JOIN input
      LEFT JOIN counts c USING (upid)
      LEFT JOIN gcs g USING (upid)
      WHERE s.samples >= 2
      ORDER BY s.net_growth_mb DESC
      LIMIT 50
    save_as: bitmap_live_shape

  - id: heap_bitmap_availability
    type: atomic
    name: "Heap Graph Bitmap 数据可用性"
    display: false
    sql: |
      SELECT
        CASE
          WHEN EXISTS (
            SELECT 1 FROM sqlite_master
            WHERE type IN ('table', 'view') AND name = 'heap_graph_bitmaps'
          ) THEN 1
          ELSE 0
        END AS has_heap_graph_bitmaps
    save_as: heap_bitmap_availability

  - id: heap_bitmap_metadata
    type: atomic
    name: "Heap Graph Bitmap 元数据"
    optional: true
    condition: "heap_bitmap_availability.data[0]?.has_heap_graph_bitmaps == 1"
    display:
      level: detail
      layer: list
      title: "Heap Graph Bitmap 元数据"
      columns:
        - name: process_name
          label: "进程"
          type: string
        - name: bitmap_object_count
          label: "Bitmap 对象"
          type: number
          format: compact
        - name: reachable_count
          label: "可达对象"
          type: number
          format: compact
        - name: total_bytes
          label: "总字节"
          type: bytes
          format: bytes_human
        - name: native_bytes
          label: "Native 字节"
          type: bytes
          format: bytes_human
        - name: java_self_bytes
          label: "Java 对象字节"
          type: bytes
          format: bytes_human
        - name: known_dimension_count
          label: "有尺寸对象"
          type: number
          format: compact
        - name: max_width
          label: "最大宽度"
          type: number
          format: compact
        - name: max_height
          label: "最大高度"
          type: number
          format: compact
        - name: storage_types
          label: "存储类型"
          type: string
        - name: process_identity
          label: "进程身份"
          type: string
    sql_fragments:
      - fragments/heap_target_process.sql
    sql: |
      WITH bitmap_rows AS (
        SELECT
          t.process_name,
          t.process_identity,
          b.*
        FROM heap_graph_bitmaps b
        JOIN heap_target_process t USING (upid)
        -- self_size = -1 marks a placeholder of an incomplete dump, not a Bitmap.
        WHERE COALESCE(b.self_size, 0) >= 0
      )
      SELECT
        process_name,
        COUNT(*) AS bitmap_object_count,
        SUM(CASE WHEN reachable THEN 1 ELSE 0 END) AS reachable_count,
        SUM(COALESCE(native_size, 0) + COALESCE(self_size, 0)) AS total_bytes,
        SUM(COALESCE(native_size, 0)) AS native_bytes,
        SUM(COALESCE(self_size, 0)) AS java_self_bytes,
        SUM(CASE WHEN width IS NOT NULL AND height IS NOT NULL THEN 1 ELSE 0 END) AS known_dimension_count,
        MAX(width) AS max_width,
        MAX(height) AS max_height,
        GROUP_CONCAT(DISTINCT COALESCE(bitmap_storage_type, 'unknown')) AS storage_types,
        process_identity
      FROM bitmap_rows
      GROUP BY upid, process_name, process_identity
      ORDER BY total_bytes DESC
      LIMIT 30

  - id: heap_bitmap_sender_attribution
    type: atomic
    name: "跨进程 Bitmap 来源归因"
    optional: true
    condition: "heap_bitmap_availability.data[0]?.has_heap_graph_bitmaps == 1"
    display:
      level: detail
      layer: list
      title: "跨进程 Bitmap 来源"
      columns:
        - name: receiver_process
          label: "接收进程"
          type: string
        - name: source_process
          label: "来源进程"
          type: string
        - name: bitmap_count
          label: "Bitmap 数量"
          type: number
          format: compact
        - name: total_bytes
          label: "总字节"
          type: bytes
          format: bytes_human
        - name: receiver_storage_types
          label: "接收端存储"
          type: string
        - name: source_storage_types
          label: "来源端存储"
          type: string
        - name: process_identity
          label: "接收进程身份"
          type: string
    sql_fragments:
      - fragments/heap_target_process.sql
    sql: |
      WITH bitmap_rows AS (
        SELECT
          t.process_name AS receiver_process,
          t.process_identity,
          COALESCE(b.source_process_name, printf('pid:%d', b.source_pid), 'unknown') AS source_process,
          b.*
        FROM heap_graph_bitmaps b
        JOIN heap_target_process t USING (upid)
        WHERE b.source_id IS NOT NULL
          AND COALESCE(b.self_size, 0) >= 0
      )
      SELECT
        receiver_process,
        source_process,
        COUNT(*) AS bitmap_count,
        SUM(COALESCE(native_size, 0) + COALESCE(self_size, 0)) AS total_bytes,
        GROUP_CONCAT(DISTINCT COALESCE(bitmap_storage_type, 'unknown')) AS receiver_storage_types,
        GROUP_CONCAT(DISTINCT COALESCE(source_storage_type, 'unknown')) AS source_storage_types,
        process_identity
      FROM bitmap_rows
      GROUP BY upid, receiver_process, source_process, process_identity
      ORDER BY total_bytes DESC, bitmap_count DESC
      LIMIT 50
