# Kernel Scheduler Module Expert
#
# Provides CPU scheduling analysis capabilities.
# Covers thread scheduling delays, CPU utilization, and core affinity.

name: scheduler_module
version: "1.0"
type: composite
category: kernel

meta:
  display_name: "内核调度分析"
  description: "分析线程调度延迟、CPU 利用率和大小核分配"
  tags: ["kernel", "scheduler", "cpu", "runnable"]

# Module metadata - architecture layer and component
module:
  layer: kernel
  component: Scheduler
  subsystems:
    - runqueue
    - cfs
    - core_affinity

prerequisites:
  modules:
    - linux.cpu.frequency

inputs:
  - name: package
    type: string
    required: false
    description: "Target package name"
  - name: tid
    type: number
    required: false
    description: "Target thread ID"
  - name: start_ts
    type: timestamp
    required: false
    description: "Analysis start timestamp"
  - name: end_ts
    type: timestamp
    required: false
    description: "Analysis end timestamp"

steps:
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # Step 1: Get thread runnable time distribution
  - id: runnable_analysis
    type: atomic
    name: "Runnable 状态分析"
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_thread_state_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}'='' OR p.name='${package}' OR p.name GLOB '${package}:*') AND (${tid} IS NULL OR t.tid=${tid})
      )
      SELECT s.upid,s.utid,t.tid,t.name AS thread_name,s.window_start_ts,s.window_end_ts,
        SUM(s.dur_ns)/1e6 AS runnable_ms,COUNT(*) AS runnable_count,
        AVG(s.dur_ns)/1e6 AS avg_runnable_ms,MAX(s.dur_ns)/1e6 AS max_runnable_ms,
        SUM(CASE WHEN s.state='R+' THEN s.dur_ns ELSE 0 END)/1e6 AS preempted_runnable_ms
      FROM system_thread_state_spans s JOIN thread t ON t.utid=s.utid
      WHERE s.state IN ('R','R+') GROUP BY s.window_id,s.utid ORDER BY runnable_ms DESC
    display:
      level: detail
      layer: overview
      title: "线程 Runnable 分析"
    save_as: runnable_data
    synthesize: true

  # Step 2: Analyze CPU frequency during analysis period
  - id: cpu_frequency
    type: atomic
    name: "CPU 频率分析"
    process_scope:
      role: global_context
    sql_fragments:
      - fragments/system_sched_spans.sql
      - fragments/system_cpu_frequency_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts)
      SELECT f.window_id,f.window_start_ts,f.window_end_ts,f.ucpu,f.cpu,ct.core_type,ct.topology_source,
        SUM(f.freq_khz*1.0*f.dur_ns)/SUM(f.dur_ns)/1000 AS avg_freq_mhz,
        MAX(f.freq_khz)/1000.0 AS max_freq_mhz,MIN(f.freq_khz)/1000.0 AS min_freq_mhz,
        SUM(f.dur_ns) AS frequency_covered_ns,
        'observed_peak_not_hardware_limit' AS frequency_evidence
      FROM system_cpu_frequency_spans f LEFT JOIN system_cpu_topology ct ON ct.ucpu=f.ucpu
      GROUP BY f.window_id,f.ucpu ORDER BY f.ucpu
    display:
      level: detail
      layer: overview
      title: "CPU 频率统计"
    save_as: freq_data
    synthesize: true

  # Step 3: Big/small core distribution for main threads
  - id: core_distribution
    type: atomic
    name: "大小核分布"
    process_scope:
      role: target
      binding: effective_target_processes
    sql_fragments:
      - fragments/effective_target_processes.sql
      - fragments/system_sched_spans.sql
    sql: |
      WITH system_windows AS (SELECT 0 AS window_id,
        COALESCE(${start_ts},(SELECT start_ts FROM trace_bounds)) AS window_start_ts,
        COALESCE(${end_ts},(SELECT end_ts FROM trace_bounds)) AS window_end_ts),
      system_target_threads AS (
        SELECT w.window_id,p.upid,t.utid,CASE WHEN t.tid=p.pid THEN 'main' ELSE 'target' END AS role
        FROM system_windows w CROSS JOIN effective_target_processes p JOIN thread t ON t.upid=p.upid
        WHERE (${__process_scope.upid} IS NOT NULL OR '${package}'='' OR p.name='${package}' OR p.name GLOB '${package}:*') AND (${tid} IS NULL OR t.tid=${tid})
      )
      SELECT s.upid,s.utid,t.tid,t.name AS thread_name,s.window_start_ts,s.window_end_ts,
        SUM(CASE WHEN s.core_type IN ('prime','big','medium') THEN s.dur_ns ELSE 0 END)*100.0/SUM(s.dur_ns) AS big_core_pct,
        SUM(CASE WHEN s.core_type='little' THEN s.dur_ns ELSE 0 END)*100.0/SUM(s.dur_ns) AS small_core_pct,
        SUM(CASE WHEN s.core_type='unknown' THEN s.dur_ns ELSE 0 END)*100.0/SUM(s.dur_ns) AS unknown_core_pct,
        SUM(s.dur_ns)/1e6 AS total_ms,MIN(s.priority) AS priority_min,MAX(s.priority) AS priority_max,
        'not_recorded_in_sched_slice' AS scheduling_policy_evidence
      FROM system_sched_spans s JOIN system_target_threads tt ON tt.window_id=s.window_id AND tt.utid=s.utid AND tt.upid=s.upid
      JOIN thread t ON t.utid=s.utid GROUP BY s.window_id,s.utid ORDER BY total_ms DESC
    display:
      level: detail
      layer: list
      title: "关键线程大小核分布"
    save_as: core_data
    synthesize: true

  # Step 4: Diagnose scheduling issues
  - id: scheduling_diagnosis
    type: diagnostic
    name: "调度诊断"
    inputs: [runnable_data, freq_data, core_data]
    rules:
      - condition: "runnable_data.data[0]?.runnable_ms > 50"
        diagnosis: "线程 ${runnable_data.data[0]?.thread_name} Runnable 等待时间过长 (${runnable_data.data[0]?.runnable_ms}ms)；需结合交接任务与唤醒证据确定原因"
        confidence: high
        suggestions:
          - "检查是否有后台线程占用 CPU"
          - "核对已采集的调度策略、优先级与对端任务"
        evidence_fields:
          - runnable_data.data[0].thread_name
          - runnable_data.data[0].runnable_ms

      - condition: "freq_data.data.find(f => f.core_type === 'big')?.avg_freq_mhz < 1500"
        diagnosis: "观测大核窗口均频 ${freq_data.data.find(f => f.core_type === 'big')?.avg_freq_mhz}MHz；需结合覆盖、容量和直接限频/策略证据解释"
        confidence: medium
        suggestions:
          - "是否限频以同窗口的 CPU 限频证据（cpu_throttling_in_range）为准"
          - "检查电池状态和功耗策略"
        evidence_fields:
          - freq_data.data[0].avg_freq_mhz
          - freq_data.data[0].max_freq_mhz

      - condition: "core_data.data[0]?.small_core_pct > 50"
        diagnosis: "目标线程大部分时间运行在小核 (${core_data.data[0]?.small_core_pct}%)；单凭驻留比例不能确定性能损失"
        confidence: medium
        suggestions:
          - "检查 CPU 亲和性设置"
          - "若采集缺少 affinity/cgroup/uclamp，明确证据缺口，不据此修改调度策略"
        evidence_fields:
          - core_data.data[0].thread_name
          - core_data.data[0].small_core_pct
    display:
      level: key
      layer: overview
      title: "调度诊断结果"
