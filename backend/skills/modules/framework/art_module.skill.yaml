# Framework ART Module Expert
#
# Provides Android Runtime analysis capabilities.
# Covers GC, JIT, and memory allocation.

name: art_module
version: "1.0"
type: composite
category: framework

meta:
  display_name: "ART 运行时分析"
  description: "分析 GC、JIT 编译和内存分配"
  tags: ["framework", "art", "gc", "jit", "memory"]

# Module metadata
module:
  layer: framework
  component: ART
  subsystems:
    - gc
    - jit
    - allocation

prerequisites: {}

inputs:
  - name: package
    type: string
    required: true
    description: "Target package name"
  - name: start_ts
    type: timestamp
    required: false
    description: "Analysis start timestamp"
  - name: end_ts
    type: timestamp
    required: false
    description: "Analysis end timestamp"

steps:
  # Step 1: GC by kind and name for the package in the window. Runs and the
  # waits on them are fragments/memory_gc_events.sql rows told apart by
  # gc_kind; a wait overlaps what it waits on, so totals take runs only.
  - id: gc_overview
    type: atomic
    name: "GC 概览"
    sql_fragments:
      - fragments/art_gc_names.sql
      - fragments/memory_gc_events.sql
    sql: |
      SELECT
        gc_name AS gc_type,
        gc_kind,
        COUNT(*) AS gc_count,
        CAST(SUM(dur) / 1e6 AS INTEGER) AS total_gc_ms,
        CAST(AVG(dur) / 1e6 AS REAL) AS avg_gc_ms,
        CAST(MAX(dur) / 1e6 AS REAL) AS max_gc_ms
      FROM memory_gc_events
      GROUP BY gc_kind, gc_name
      ORDER BY gc_kind, total_gc_ms DESC
    display:
      level: key
      layer: overview
      title: "GC 概览"
    save_as: gc_overview
    synthesize:
      role: overview
      fields:
        - key: gc_type
          label: GC 类型
        - key: gc_count
          label: 次数
        - key: total_gc_ms
          label: 总耗时
          format: "{{value}}ms"

  # Step 2: One row of totals: collector runs, and time threads waited on
  # the collector, overall and on the main thread.
  - id: gc_totals
    type: atomic
    name: "GC 合计"
    sql_fragments:
      - fragments/art_gc_names.sql
      - fragments/memory_gc_events.sql
    sql: |
      SELECT
        COALESCE(SUM(gc_kind = 'collection'), 0) AS collection_count,
        CAST(COALESCE(SUM(CASE WHEN gc_kind = 'collection' THEN dur END), 0) / 1e6 AS INTEGER) AS collection_ms,
        COALESCE(SUM(gc_kind = 'wait'), 0) AS wait_count,
        CAST(COALESCE(SUM(CASE WHEN gc_kind = 'wait' THEN dur END), 0) / 1e6 AS INTEGER) AS wait_ms,
        COALESCE(SUM(gc_kind = 'collection' AND is_main_thread = 1), 0) AS main_thread_collection_count,
        COALESCE(SUM(gc_kind = 'wait' AND is_main_thread = 1), 0) AS main_thread_wait_count,
        CAST(COALESCE(SUM(CASE WHEN is_main_thread = 1 THEN dur END), 0) / 1e6 AS INTEGER) AS main_thread_gc_ms
      FROM memory_gc_events
    display:
      level: key
      layer: overview
      title: "GC 合计"
    save_as: gc_totals

  # Step 3: Individual GC events, collector runs first.
  - id: gc_events
    type: atomic
    name: "GC 事件列表"
    sql_fragments:
      - fragments/art_gc_names.sql
      - fragments/memory_gc_events.sql
    sql: |
      SELECT
        ts,
        gc_name AS gc_type,
        gc_kind,
        CAST(dur / 1e6 AS REAL) AS dur_ms,
        thread_name
      FROM memory_gc_events
      ORDER BY gc_kind = 'collection' DESC, dur DESC
      LIMIT 30
    display:
      level: detail
      layer: list
      title: "GC 事件列表"
    save_as: gc_events

  # Step 4: GC runs and waits on the main thread (tid = pid: the main thread
  # is named after its process, not "main").
  - id: gc_during_main_thread
    type: atomic
    name: "主线程 GC"
    sql_fragments:
      - fragments/art_gc_names.sql
      - fragments/memory_gc_events.sql
    sql: |
      SELECT
        ts,
        gc_name AS gc_type,
        gc_kind,
        CAST(dur / 1e6 AS REAL) AS dur_ms
      FROM memory_gc_events
      WHERE is_main_thread = 1
      ORDER BY dur DESC
      LIMIT 20
    display:
      level: detail
      layer: list
      title: "主线程 GC"
    save_as: main_thread_gc

  # Step 5: JIT compilation events
  - id: jit_events
    type: atomic
    name: "JIT 编译事件"
    sql: |
      SELECT
        slice.name AS jit_event,
        COUNT(*) AS event_count,
        CAST(SUM(slice.dur) / 1e6 AS INTEGER) AS total_ms,
        CAST(AVG(slice.dur) / 1e6 AS REAL) AS avg_ms
      FROM slice
      WHERE slice.name LIKE '%JIT%'
        OR slice.name LIKE '%compile%'
      GROUP BY slice.name
      ORDER BY total_ms DESC
    display:
      level: detail
      layer: overview
      title: "JIT 编译事件"
    save_as: jit_events

  # Step 6: Diagnose ART issues
  - id: art_diagnosis
    type: diagnostic
    name: "ART 诊断"
    inputs: [gc_overview, gc_totals, gc_events, main_thread_gc, jit_events]
    rules:
      - condition: "(gc_totals.data[0]?.main_thread_collection_count || 0) + (gc_totals.data[0]?.main_thread_wait_count || 0) > 0"
        diagnosis: "主线程执行 GC 回收 ${gc_totals.data[0].main_thread_collection_count} 次、等待 GC 完成 ${gc_totals.data[0].main_thread_wait_count} 次，共 ${gc_totals.data[0].main_thread_gc_ms}ms，可能导致卡顿"
        confidence: high
        suggestions:
          - "减少临时对象分配"
          - "使用对象池复用对象"
        evidence_fields:
          - gc_totals.data[0].main_thread_collection_count
          - gc_totals.data[0].main_thread_wait_count
          - gc_totals.data[0].main_thread_gc_ms

      - condition: "(gc_totals.data[0]?.collection_ms || 0) > 100"
        diagnosis: "GC 回收总耗时过长 (${gc_totals.data[0].collection_ms}ms，${gc_totals.data[0].collection_count} 次)，内存压力大"
        confidence: high
        suggestions:
          - "检查是否有内存泄漏"
          - "优化数据结构减少内存使用"
        evidence_fields:
          - gc_totals.data[0].collection_ms
          - gc_totals.data[0].collection_count

      - condition: "gc_events.data[0]?.gc_kind === 'collection' && gc_events.data[0]?.dur_ms > 10"
        diagnosis: "存在长 GC 回收 (${gc_events.data[0]?.dur_ms}ms)"
        confidence: medium
        suggestions:
          - "增加堆大小"
          - "避免在关键路径分配大对象"
        evidence_fields:
          - gc_events.data[0].dur_ms
          - gc_events.data[0].gc_type

      - condition: "jit_events.data[0]?.total_ms > 50"
        diagnosis: "JIT 编译耗时较长 (${jit_events.data[0]?.total_ms}ms)"
        confidence: low
        suggestions:
          - "考虑 AOT 编译优化"
          - "检查是否有热点方法未被编译"
        evidence_fields:
          - jit_events.data[0].total_ms
    display:
      level: key
      layer: overview
      title: "ART 诊断结果"