# =============================================================================
# Hardware Thermal Module Expert
# =============================================================================
# Provides thermal analysis capabilities.
# Covers temperature, thermal throttling, and cooling behavior.
#
# Key Analysis Areas:
# - Temperature sensor data across thermal zones
# - Thermal throttling detection and impact
# - Cooling policy analysis
# - Temperature vs performance correlation
# =============================================================================

name: thermal_module
version: "1.0"
type: composite
category: hardware

meta:
  display_name: "热管理分析"
  description: "分析温度传感器、热节流和散热策略"
  tags: ["hardware", "thermal", "temperature", "throttling", "cooling"]

# Module metadata
module:
  layer: hardware
  component: Thermal
  subsystems:
    - temperature_sensors
    - thermal_throttling
    - cooling_device
    - thermal_zone

prerequisites:
  required_tables:
    - counter
    - counter_track

inputs:
  - name: start_ts
    type: timestamp
    required: false
    description: "Analysis start timestamp"
  - name: end_ts
    type: timestamp
    required: false
    description: "Analysis end timestamp"

steps:
  # Step 1: Temperature overview by thermal zone
  - id: temperature_overview
    type: atomic
    name: "温度概览"
    sql: |
      SELECT
        ct.id AS sensor_track_id,
        ct.name AS sensor_name,
        ct.unit AS source_unit,
        COUNT(*) AS sample_count,
        CAST(MIN(c.value) AS INTEGER) AS min_temp,
        CAST(MAX(c.value) AS INTEGER) AS max_temp,
        CAST(AVG(c.value) AS INTEGER) AS avg_temp,
        'arithmetic_sample_mean_not_time_weighted' AS aggregation_basis,
        CAST(MAX(c.value) - MIN(c.value) AS INTEGER) AS temp_range,
        CASE
          WHEN ct.unit IS NULL OR ct.unit != 'C' THEN 'unit_unknown_or_unsupported'
          WHEN MAX(c.value) > 80 THEN 'critical'
          WHEN MAX(c.value) > 70 THEN 'warning'
          WHEN MAX(c.value) > 60 THEN 'elevated'
          ELSE 'normal'
        END AS status
      FROM counter c
      JOIN counter_track ct ON c.track_id = ct.id
      WHERE (ct.name GLOB '*thermal*'
        OR ct.name GLOB '*temp*'
        OR ct.name GLOB '*temperature*'
        OR ct.name GLOB '*tsens*'
        OR ct.name GLOB '*Temp*')
        AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
        AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      GROUP BY ct.id, ct.name, ct.unit
      ORDER BY max_temp DESC
    display:
      level: key
      layer: overview
      title: "温度传感器概览"
    save_as: temp_overview
    synthesize:
      role: overview
      fields:
        - key: sensor_name
          label: 传感器
        - key: avg_temp
          label: 样本平均温度
          format: "{{value}}"
        - key: max_temp
          label: 最高温度
          format: "{{value}}"
        - key: source_unit
          label: 原始单位
        - key: status
          label: 状态
    on_empty: "窗口内未找到温度样本；检查 trace 是否包含 thermal/temperature 计数器。缺少单位时不进行摄氏温度阈值判断。"

  # Step 2: Temperature timeline
  - id: temperature_timeline
    type: atomic
    name: "温度时间线"
    sql: |
      WITH
      time_range AS (
        SELECT MIN(ts) as start_ts FROM counter
      ),
      thermal_samples AS (
        SELECT
          (c.ts - (SELECT start_ts FROM time_range)) / 1e9 as time_sec,
          ct.id as sensor_track_id,
          ct.unit as source_unit,
          ct.name as sensor_name,
          c.value as temperature
        FROM counter c
        JOIN counter_track ct ON c.track_id = ct.id
        WHERE (ct.name GLOB '*thermal*'
          OR ct.name GLOB '*temp*'
          OR ct.name GLOB '*temperature*')
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      )
      SELECT
        CAST(time_sec AS INTEGER) as second,
        sensor_track_id,
        sensor_name,
        source_unit,
        CAST(AVG(temperature) AS INTEGER) as avg_temp,
        'arithmetic_sample_mean_not_time_weighted' AS aggregation_basis,
        CAST(MAX(temperature) AS INTEGER) as max_temp
      FROM thermal_samples
      GROUP BY CAST(time_sec AS INTEGER), sensor_track_id, sensor_name, source_unit
      ORDER BY second, sensor_name
      LIMIT 300
    display:
      level: detail
      layer: list
      title: "温度时间线"
    save_as: temp_timeline

  # Step 3: High temperature periods
  - id: high_temp_periods
    type: atomic
    name: "高温时段"
    sql: |
      WITH
      time_range AS (
        SELECT MIN(ts) as start_ts FROM counter
      ),
      high_temps AS (
        SELECT
          (c.ts - (SELECT start_ts FROM time_range)) / 1e9 as time_sec,
          ct.id as sensor_track_id,
          ct.unit as source_unit,
          ct.name as sensor_name,
          c.value as temperature
        FROM counter c
        JOIN counter_track ct ON c.track_id = ct.id
        WHERE (ct.name GLOB '*thermal*' OR ct.name GLOB '*temp*')
          AND ct.unit = 'C'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
          AND c.value > 60
      )
      SELECT
        sensor_track_id,
        sensor_name,
        source_unit,
        ROUND(MIN(time_sec), 2) as start_sec,
        ROUND(MAX(time_sec), 2) as end_sec,
        ROUND(MAX(time_sec) - MIN(time_sec), 2) as duration_sec,
        'first_to_last_high_sample_span_not_continuous_hot_duration' AS duration_basis,
        CAST(MAX(temperature) AS INTEGER) as peak_temp,
        CAST(AVG(temperature) AS INTEGER) as avg_temp,
        'arithmetic_sample_mean_not_time_weighted' AS aggregation_basis,
        COUNT(*) as sample_count
      FROM high_temps
      GROUP BY sensor_track_id, sensor_name, source_unit
      HAVING COUNT(*) > 1
      ORDER BY peak_temp DESC
    display:
      level: detail
      layer: list
      title: "高温样本跨度"
    save_as: high_temp_periods

  # Step 4: Observed frequency drops; cause requires independent thermal evidence
  - id: throttling_events
    type: atomic
    name: "频率骤降事件"
    sql: |
      WITH
      time_range AS (
        SELECT MIN(ts) as start_ts FROM counter
      ),
      freq_changes AS (
        SELECT
          cct.cpu as cpu_id,
          cct.id as frequency_track_id,
          c.ts as ts,
          (c.ts - (SELECT start_ts FROM time_range)) / 1e9 as time_sec,
          c.value / 1000 as freq_mhz,
          LAG(c.value / 1000) OVER (PARTITION BY cct.id ORDER BY c.ts, c.id) as prev_freq_mhz
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        WHERE cct.name = 'cpufreq'
      )
      SELECT
        cpu_id,
        frequency_track_id,
        ts,
        ROUND(time_sec, 2) as time_sec,
        CAST(prev_freq_mhz AS INTEGER) as prev_freq_mhz,
        CAST(freq_mhz AS INTEGER) as new_freq_mhz,
        CAST((prev_freq_mhz - freq_mhz) AS INTEGER) as drop_mhz,
        ROUND((prev_freq_mhz - freq_mhz) * 100.0 / prev_freq_mhz, 1) as drop_pct
      FROM freq_changes
      WHERE (${start_ts} IS NULL OR ts >= ${start_ts})
        AND (${end_ts} IS NULL OR ts < ${end_ts})
        AND prev_freq_mhz IS NOT NULL
        AND freq_mhz < prev_freq_mhz * 0.7
      ORDER BY drop_mhz DESC
      LIMIT 30
    display:
      level: detail
      layer: list
      title: "频率骤降事件（原因待查）"
    save_as: throttling_events

  # Step 5: Cooling device activity
  - id: cooling_activity
    type: atomic
    name: "散热设备活动"
    sql: |
      -- Match the typed cooling_device_counter track first. The previous
      -- GLOB '*cooling*' filter is case sensitive and never matched the actual
      -- Perfetto track name, which is '<cdev> Cooling Device'. Name globs are
      -- kept as a lowercase fallback for traces without the typed track.
      SELECT
        ct.name AS cooling_device,
        ct.type AS track_type,
        CASE WHEN ct.type = 'cooling_device_counter'
          THEN 'perfetto_cooling_device_counter_track'
          ELSE 'name_glob_fallback' END AS match_basis,
        CAST(MIN(c.value) AS INTEGER) AS min_level,
        CAST(MAX(c.value) AS INTEGER) AS max_level,
        CAST(AVG(c.value) AS INTEGER) AS avg_level,
        'arithmetic_sample_mean_not_time_weighted' AS aggregation_basis,
        COUNT(*) AS sample_count
      FROM counter c
      JOIN counter_track ct ON c.track_id = ct.id
      WHERE (ct.type = 'cooling_device_counter'
        OR LOWER(ct.name) GLOB '*cooling*'
        OR LOWER(ct.name) GLOB '*fan*'
        OR LOWER(ct.name) GLOB '*cdev*')
        AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
        AND (${end_ts} IS NULL OR c.ts < ${end_ts})
      GROUP BY ct.id, ct.name, ct.type
      ORDER BY avg_level DESC
    display:
      level: detail
      layer: overview
      title: "散热设备"
    save_as: cooling_activity
    optional: true

  # Step 6: Temperature vs CPU frequency correlation
  - id: thermal_cpu_correlation
    type: atomic
    name: "温度-频率相关性"
    sql: |
      WITH
      time_range AS (
        SELECT MIN(ts) as start_ts FROM counter
      ),
      thermal_by_sec AS (
        SELECT
          CAST((c.ts - (SELECT start_ts FROM time_range)) / 1e9 AS INTEGER) as second,
          MAX(c.value) as max_temp
        FROM counter c
        JOIN counter_track ct ON c.track_id = ct.id
        WHERE (ct.name GLOB '*thermal*' OR ct.name GLOB '*temp*')
          AND ct.unit = 'C'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
        GROUP BY CAST((c.ts - (SELECT start_ts FROM time_range)) / 1e9 AS INTEGER)
      ),
      freq_by_sec AS (
        SELECT
          CAST((c.ts - (SELECT start_ts FROM time_range)) / 1e9 AS INTEGER) as second,
          CAST(AVG(c.value / 1000) AS INTEGER) as avg_freq_mhz
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        WHERE cct.name = 'cpufreq'
          AND (${start_ts} IS NULL OR c.ts >= ${start_ts})
          AND (${end_ts} IS NULL OR c.ts < ${end_ts})
        GROUP BY CAST((c.ts - (SELECT start_ts FROM time_range)) / 1e9 AS INTEGER)
      )
      SELECT
        t.second,
        CAST(t.max_temp AS INTEGER) as max_temp,
        'C' AS source_unit,
        f.avg_freq_mhz,
        'same_second_sample_aggregation_not_causal_or_time_weighted' AS correlation_basis,
        CASE
          WHEN t.max_temp > 70 AND f.avg_freq_mhz < 1500 THEN 'high_temperature_with_low_sampled_frequency'
          WHEN t.max_temp > 60 AND f.avg_freq_mhz < 2000 THEN 'elevated_temperature_with_low_sampled_frequency'
          ELSE 'no_threshold_coincidence'
        END as status
      FROM thermal_by_sec t
      JOIN freq_by_sec f ON t.second = f.second
      ORDER BY t.second
      LIMIT 120
    display:
      level: detail
      layer: list
      title: "温度-频率相关性"
    save_as: thermal_cpu_correlation

  # Step 7: Diagnose thermal issues
  - id: thermal_diagnosis
    type: diagnostic
    name: "热管理诊断"
    inputs: [temp_overview, high_temp_periods, throttling_events, thermal_cpu_correlation]
    rules:
      - condition: "temp_overview.data.filter(t => t.status === 'critical').length > 0"
        diagnosis: "检测到严重高温: ${temp_overview.data.filter(t => t.status === 'critical')[0]?.sensor_name} 最高 ${temp_overview.data.filter(t => t.status === 'critical')[0]?.max_temp}°C"
        severity: critical
        confidence: high
        suggestions:
          - "检查设备散热条件"
          - "减少 CPU/GPU 密集型操作"
          - "考虑添加冷却间隔"
        evidence_fields:
          - temp_overview.data[0]?.sensor_name
          - temp_overview.data[0]?.max_temp

      - condition: "throttling_events.data.length > 10"
        diagnosis: "检测到 ${throttling_events.data.length} 次频率骤降；尚不能据此确定热节流或性能影响"
        confidence: high
        suggestions:
          - "结合直接 thermal throttling/cooling 事件和同窗口工作负载判断降频原因"
          - "考虑分散计算任务"
          - "优化算法减少 CPU 使用"
        evidence_fields:
          - throttling_events.data.length
          - throttling_events.data[0]?.drop_pct

      - condition: "high_temp_periods.data[0]?.duration_sec > 30"
        diagnosis: "高温样本首尾跨度 ${high_temp_periods.data[0]?.duration_sec} 秒；不代表连续高温或散热不足"
        confidence: high
        suggestions:
          - "持续高温会加速热节流"
          - "检查设备是否被遮挡"
          - "考虑降低持续性能需求"
        evidence_fields:
          - high_temp_periods.data[0]?.sensor_name
          - high_temp_periods.data[0]?.duration_sec
          - high_temp_periods.data[0]?.peak_temp

      - condition: "thermal_cpu_correlation.data.filter(t => t.status === 'high_temperature_with_low_sampled_frequency').length > 5"
        diagnosis: "同一秒内观测到高温和较低的频率样本；这种并存不能证明热节流或负相关"
        confidence: high
        suggestions:
          - "查找温控限制、冷却状态或限频事件的直接证据"
          - "结合目标任务窗口和负载变化检验性能影响"
        evidence_fields:
          - thermal_cpu_correlation.data.filter(t => t.status === 'high_temperature_with_low_sampled_frequency').length

      - condition: "temp_overview.data[0]?.temp_range > 20"
        diagnosis: "温度计数器样本变化范围 ${temp_overview.data[0]?.temp_range}，原始单位 ${temp_overview.data[0]?.source_unit}"
        confidence: medium
        suggestions:
          - "工作负载不均匀"
          - "检查是否有突发计算任务"
        evidence_fields:
          - temp_overview.data[0]?.sensor_name
          - temp_overview.data[0]?.temp_range
    display:
      level: key
      layer: overview
      title: "热管理诊断结果"