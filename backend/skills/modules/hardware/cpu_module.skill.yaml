# Hardware CPU Module Expert
#
# Provides CPU hardware analysis capabilities.
# Covers CPU frequency, frequency changes, and power state; it reads no
# cpufreq max-limit evidence, so it never names a frequency cap or a thermal cause.

name: cpu_module
version: "1.0"
type: composite
category: hardware

meta:
  display_name: "CPU 硬件分析"
  description: "分析 CPU 频率、频率变化和电源状态"
  tags: ["hardware", "cpu", "frequency", "thermal", "power"]

# Module metadata
module:
  layer: hardware
  component: CPU
  subsystems:
    - frequency
    - thermal
    - power
    - cluster

prerequisites:
  modules:
    - linux.cpu.frequency
    - linux.cpu.idle

inputs:
  - name: cpu_id
    type: number
    required: false
    description: "Specific CPU core ID"
  - name: start_ts
    type: timestamp
    required: false
    description: "Analysis start timestamp"
  - name: end_ts
    type: timestamp
    required: false
    description: "Analysis end timestamp"

steps:
  - id: init_cpu_topology
    type: skill
    name: "初始化 CPU 拓扑"
    skill: cpu_topology_view
    display:
      level: hidden
    optional: true

  # Step 1: Get CPU frequency overview by cluster
  - id: frequency_overview
    type: atomic
    name: "CPU 频率概览"
    sql: |
      WITH
      cpu_info AS (
        SELECT cpu_id as cpu, core_type as cluster
        FROM _cpu_topology
      )
      SELECT
        cct.cpu as cpu,
        COALESCE(ci.cluster, 'unknown') AS cluster,
        CAST(AVG(c.value) / 1000 AS INTEGER) AS avg_freq_mhz,
        CAST(MAX(c.value) / 1000 AS INTEGER) AS max_freq_mhz,
        CAST(MIN(c.value) / 1000 AS INTEGER) AS min_freq_mhz
      FROM counter c
      JOIN cpu_counter_track cct ON c.track_id = cct.id
      LEFT JOIN cpu_info ci ON cct.cpu = ci.cpu
      WHERE cct.name = 'cpufreq'
      GROUP BY cct.cpu, ci.cluster
      ORDER BY cct.cpu
    display:
      level: key
      layer: overview
      title: "CPU 频率概览"
    save_as: freq_overview
    synthesize:
      role: overview
      groupBy:
        - field: cluster
          title: 核心集群

  # Step 2: Detect frequency throttling events
  - id: throttling_events
    type: atomic
    name: "频率变化事件"
    sql: |
      WITH freq_changes AS (
        SELECT
          cct.cpu as cpu,
          c.ts as ts,
          c.value as freq,
          LAG(c.value) OVER (PARTITION BY cct.cpu ORDER BY c.ts) AS prev_freq
        FROM cpu_counter_track cct
        JOIN counter c ON cct.id = c.track_id
        WHERE cct.name = 'cpufreq'
      )
      SELECT
        cpu,
        ts,
        CAST(freq / 1000 AS INTEGER) AS freq_mhz,
        CAST(prev_freq / 1000 AS INTEGER) AS prev_freq_mhz,
        CASE WHEN freq < prev_freq THEN 'throttle_down' ELSE 'throttle_up' END AS direction
      FROM freq_changes
      WHERE prev_freq IS NOT NULL
        AND ABS(freq - prev_freq) > 200000
      ORDER BY ts DESC
      LIMIT 50
    display:
      level: detail
      layer: list
      title: "频率变化事件"
    save_as: throttle_events

  # Step 3: CPU utilization by cluster
  - id: cluster_utilization
    type: atomic
    name: "集群利用率"
    sql: |
      WITH
      cpu_info AS (
        SELECT cpu_id as cpu, core_type as cluster
        FROM _cpu_topology
      )
      SELECT
        COALESCE(ci.cluster, 'unknown') AS cluster,
        COUNT(DISTINCT ss.cpu) AS core_count,
        CAST(SUM(ss.dur) / 1e9 AS REAL) AS total_time_sec,
        CAST(AVG(ss.dur) / 1e6 AS REAL) AS avg_slice_ms
      FROM sched_slice ss
      LEFT JOIN cpu_info ci ON ss.cpu = ci.cpu
      GROUP BY cluster
    display:
      level: detail
      layer: overview
      title: "集群利用率"
    save_as: cluster_util
    synthesize: true

  # Step 4: Frequency distribution histogram
  - id: frequency_distribution
    type: atomic
    name: "频率分布"
    sql: |
      WITH
      cpu_info AS (
        SELECT cpu_id as cpu, core_type as cluster
        FROM _cpu_topology
      ),
      freq_samples AS (
        SELECT
          cct.cpu as cpu,
          COALESCE(ci.cluster, 'unknown') AS cluster,
          c.ts as ts,
          c.value as freq_khz,
          LEAD(c.ts) OVER (PARTITION BY cct.cpu ORDER BY c.ts) as next_ts
        FROM counter c
        JOIN cpu_counter_track cct ON c.track_id = cct.id
        LEFT JOIN cpu_info ci ON cct.cpu = ci.cpu
        WHERE cct.name = 'cpufreq'
      ),
      freq_intervals AS (
        SELECT
          cluster,
          CAST(freq_khz / 100000 AS INTEGER) * 100 AS freq_bucket_mhz,
          CASE
            WHEN next_ts IS NULL THEN 0
            WHEN next_ts > ts THEN next_ts - ts
            ELSE 0
          END as dur_ns
        FROM freq_samples
      )
      SELECT
        cluster,
        freq_bucket_mhz,
        COUNT(*) AS sample_count,
        CAST(SUM(dur_ns) / 1e9 AS REAL) AS time_sec
      FROM freq_intervals
      GROUP BY cluster, freq_bucket_mhz
      ORDER BY cluster, freq_bucket_mhz
    display:
      level: detail
      layer: list
      title: "频率分布"
    save_as: freq_dist

  # Step 5: Diagnose CPU issues
  - id: cpu_diagnosis
    type: diagnostic
    name: "CPU 诊断"
    inputs: [freq_overview, throttle_events, cluster_util]
    rules:
      - condition: "freq_overview.data.find(f => f.cluster === 'big')?.avg_freq_mhz < 1500"
        diagnosis: "大核 CPU 平均频率较低 (${freq_overview.data.find(f => f.cluster === 'big')?.avg_freq_mhz}MHz)；仅为频率观测，低频可能来自负载、调速器或频率上限"
        confidence: high
        suggestions:
          - "是否限频以同窗口的 CPU 限频证据（cpu_throttling_in_range）为准"
          - "检查是否开启省电模式"
        evidence_fields:
          - freq_overview.data[0].avg_freq_mhz
          - freq_overview.data[0].max_freq_mhz

      - condition: "throttle_events.data.length > 20"
        diagnosis: "CPU 频率频繁变化 (${throttle_events.data.length} 次)，调度器可能不稳定"
        confidence: medium
        suggestions:
          - "检查 governor 设置"
          - "检查是否有功耗抖动"
        evidence_fields:
          - throttle_events.data.length

      - condition: "freq_overview.data.find(f => f.cluster === 'little')?.avg_freq_mhz > freq_overview.data.find(f => f.cluster === 'big')?.avg_freq_mhz"
        diagnosis: "小核平均频率高于大核；仅为频率观测，可能来自两簇负载不同或大核频率上限"
        confidence: medium
        suggestions:
          - "是否限频以同窗口的 CPU 限频证据（cpu_throttling_in_range）为准"
          - "检查 CPU affinity 设置"
        evidence_fields:
          - freq_overview.data[0].avg_freq_mhz
    display:
      level: key
      layer: overview
      title: "CPU 诊断结果"
